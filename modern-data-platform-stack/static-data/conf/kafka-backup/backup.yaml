mode: backup
backup_id: "${KAFKA_BACKUP_ID}"

source:
  bootstrap_servers: [${KAFKA_BROKERS}]
  topics:
    include: ${KAFKA_BACKUP_TOPICS_INCLUDE}
    exclude: ${KAFKA_BACKUP_TOPICS_EXCLUDE}

storage:
  backend: s3
  bucket: ${S3_BUCKET}
  region: ${AWS_REGION}
  endpoint: ${S3_ENDPOINT}
  path_style_access: ${S3_PATH_STYLE_ACCESS}
  prefix: ${S3_PREFIX}

backup:
  compression: zstd
  segment_max_bytes: 134217728  # 128MB
  include_offset_headers: true   # default — adds x-original-offset / x-original-timestamp to every archived record