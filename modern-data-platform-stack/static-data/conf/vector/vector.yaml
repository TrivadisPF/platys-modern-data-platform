# Vector configuration
# See https://vector.dev/docs/reference/configuration/ for all options

# Data directory for internal state (used when VECTOR_volume_map_data: true)
data_dir: /var/lib/vector

# API (used for the health check endpoint on port 9598)
api:
  enabled: true
  address: "0.0.0.0:9598"

# Sources — add your input sources here
# Example: read from a file
# sources:
#   app_logs:
#     type: file
#     include:
#       - /var/log/app/*.log

# Example: receive logs over HTTP
# sources:
#   http_in:
#     type: http_server
#     address: "0.0.0.0:8080"
#     encoding: json

sources:
  in:
    type: "docker_logs"

  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 10

# Transforms — optional processing steps
# transforms:
#   parse_json:
#     type: remap
#     inputs: ["app_logs"]
#     source: |
#       . = parse_json!(.message)

# Sinks — add your output destinations here
# Example: send to Loki
# sinks:
#   loki_out:
#     type: loki
#     inputs: ["app_logs"]
#     endpoint: "http://loki:3100"
#     labels:
#       source: vector

sinks:
  out:
    inputs:
      - "in"
    type: "console"
    encoding:
      codec: "text"

  prometheus:
    type: prometheus_exporter
    inputs:
      - internal_metrics
    address: 0.0.0.0:9598      