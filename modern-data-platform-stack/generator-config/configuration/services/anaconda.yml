name: Anaconda
id: anaconda
category:
  id: 13_science
  name: science
  color: violet
arch: [x86-64]

links:
  website: https://www.anaconda.com/
  documentation: https://docs.anaconda.com/#
  github: https://github.com/jupyter/notebook

description: >
  Anaconda Distribution is a Python/R data science distribution and a
  collection of over 7,500+ open-source packages, which includes a package and
  environment manager. Anaconda Distribution is platform-agnostic, so you can
  use it whether you are on Windows, macOS, or Linux. It’s also is free to
  install and offers free community support.

enable:
  platys_init: ANACONDA
  example: |
    platys init --enable-services ANACONDA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28889>. The token for the login has either be specified in the `config.yml` (`ANACONDA_JUPYTER_token`) or if not set, the generated token can be retrieved from the log (`docker logs -f anaconda`).

parameters:
  - name: ANACONDA_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Anaconda service

  - name: ANACONDA_volume_map_notebooks
    default: "false"
    since: "1.16.0"
    description: >
      Volume map `notebooks` folder into the Anaconda service.
