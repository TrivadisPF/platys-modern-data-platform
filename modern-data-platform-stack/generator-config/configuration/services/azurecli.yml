name: Azure CLI
id: azurecli
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://docs.microsoft.com/en-us/cli/azure/
  documentation: https://docs.microsoft.com/en-us/cli/azure/
  github: https://github.com/Azure/azure-cli

description: >
  Azure Command-Line Interface

enable:
  platys_init: AZURECLI
  example: |
    platys init --enable-services AZURECLI
    platys gen

usage:
  - title: Usage
    content: |
      Within the container, you can either use the `az` command line interface.

parameters:
  - name: AZURECLI_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Azure CLI service
