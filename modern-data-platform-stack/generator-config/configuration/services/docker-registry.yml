name: Docker Registry
id: docker-registry
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://distribution.github.io/distribution/
  documentation: https://distribution.github.io/distribution/about/
  github: https://github.com/distribution/distribution

description: >
  Docker Registry is a stateless, highly scalable server side application
  that stores and lets you distribute Docker images. Comes bundled with a
  web UI for browsing the registry.

enable:
  platys_init: DOCKER_REGISTRY
  example: |
    platys init --enable-services DOCKER_REGISTRY
    platys gen

usage:
  - title: Usage
    content: |
      The registry REST API is exposed on <http://dataplatform:5020/v2>,
      and the web UI on <http://dataplatform:28307>.

parameters:
  - name: DOCKER_REGISTRY_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Docker Registry service.

  - name: DOCKER_REGISTRY_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the data folder into the Docker Registry service.

  - name: DOCKER_REGISTRY_volume_map_custom_config
    default: "false"
    since: "1.17.0"
    description: >
      Volume map a custom `config.yml` into the Docker Registry service.
