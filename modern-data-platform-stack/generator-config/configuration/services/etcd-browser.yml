name: Etcd Browser
id: etcd-browser
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  documentation: https://github.com/rustyx/etcdv3-browser
  github: https://github.com/rustyx/etcdv3-browser

description: >
  Web UI client for browsing (and optionally, editing) etcd3 contents.

enable:
  platys_init: ETCD,ETCD_BROWSER
  example: |
    platys init --enable-services ETCD,ETCD_BROWSER
    platys gen

usage:
  - title: Usage
    content: |
      In a Web-Browser navigate to <http://dataplatform:28310>.

parameters:
  - name: ETCD_BROWSER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Etcd Browser.
