name: Apache Ignite
id: ignite
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://ignite.apache.org/
  documentation: https://ignite.apache.org/docs/latest/
  github: https://github.com/apache/ignite

description: >
  Distributed Database For High-Performance Computing With In-Memory Speed.

enable:
  platys_init: IGNITE
  example: |
    platys init --enable-services IGNITE
    platys gen

parameters:
  - name: IGNITE_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Ignite service

  - name: IGNITE_servers
    default: "1"
    since: "1.13.0"
    description: >
      How many Ignite servers should be generated

  - name: IGNITE_option_libs
    default: ""
    since: "1.13.0"
    description: >
      A list of modules that will be enabled for the node.
