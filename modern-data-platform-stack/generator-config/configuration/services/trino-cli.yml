name: Trino CLI
id: trino-cli
arch: [x86-64]

tags: [cli]
dependencies: [trino]
links:
  website: https://trino.io/
  documentation: https://trino.io/docs/current/client/cli.html
  github: https://github.com/trinodb/trino

description: >
  Distributed SQL Query Engine for Big Data. This container runs the Trino CLI.

enable:
  platys_init: TRINO_CLI
  example: |
    platys init --enable-services TRINO_CLI
    platys gen

usage:
  - title: Running the CLI
    content: |
      ```bash
      docker exec -it trino-cli trino --server trino-1:8080
      ```

parameters:
  - name: TRINO_CLI_enable
    default: "true"
    since: "1.11.0"
    description: >
      Enable Trino CLI service. Enabled by default, if `TRINO_enable` is set to
      `true`.
