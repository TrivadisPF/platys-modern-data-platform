name: Amundsen
id: amundsen
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.amundsen.io/
  documentation: https://www.amundsen.io/amundsen/
  github: https://github.com/amundsen-io/amundsen

description: >
  Amundsen is a metadata driven application for improving the productivity of
  data analysts, data scientists and engineers when interacting with data.

enable:
  platys_init: AMUNDSEN
  example: |
    platys init --enable-services AMUNDSEN
    platys gen

parameters:
  - name: AMUNDSEN_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Amundsen service

  - name: AMUNDSEN_metastore
    default: "amundsen"
    since: "1.2.0"
    description: >
      the Amundsen backend to use, either `amundsen` or `atlas`.
