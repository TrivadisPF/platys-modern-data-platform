name: Redash
id: redash
category:
  id: 10_ui
  name: ui
  color: green
arch: [x86-64]

links:
  website: https://redash.io/
  documentation: https://redash.io/
  github: https://github.com/getredash/redash

description: >
  Make Your Company Data Driven. Connect to any data source, easily visualize,
  dashboard and share your data.

enable:
  platys_init: REDASH
  example: |
    platys init --enable-services REDASH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28161>

parameters:
  - name: REDASH_enable
    default: "false"
    since: "1.7.0"
    description: >
      Generate Redash visualization service
