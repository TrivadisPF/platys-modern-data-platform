name: AsyncAPI Studio
id: asyncapi-studio
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://www.asyncapi.com/
  documentation: https://www.asyncapi.com/docs/guides/validate
  github: https://github.com/asyncapi/studio

description: >
  Visually design your AsyncAPI files and event-driven architecture.

enable:
  platys_init: ASYNCAPI_STUDIO
  example: |
    platys init --enable-services ASYNCAPI_STUDIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28322>.

parameters:
  - name: ASYNCAPI_STUDIO_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate AsyncAPI Studio service
