name: Open Policy Agent (OPA)
id: opa
category:
  id: 16_security
  name: security
  color: red
arch: [x86-64]

links:
  website: https://www.openpolicyagent.org/
  documentation: https://www.openpolicyagent.org/docs/latest/
  github: https://github.com/open-policy-agent/opa

description: >
  Open Policy Agent (OPA) is an open source, general-purpose policy engine.

enable:
  platys_init: OPA
  example: |
    platys init --enable-services OPA
    platys gen

parameters:
  - name: OPA_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Open Policy Agent (OPA).
