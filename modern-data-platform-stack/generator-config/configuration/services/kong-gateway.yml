name: Kong API Gateway
id: kong-gateway
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://konghq.com/products/api-gateway-platform
  documentation: https://docs.konghq.com/gateway/latest/
  github: https://github.com/Kong/kong

description: >
  Kong Gateway is a lightweight, fast, and flexible cloud-native API gateway.
  An API gateway is a reverse proxy that lets you manage, configure, and route
  requests to your APIs.

enable:
  platys_init: KONG
  example: |
    platys init --enable-services KONG
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8002>

parameters:
  - name: KONG_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Kong API Gateway service

  - name: KONG_nodes
    default: "1"
    since: "1.16.0"
    description: >
      Number of Kong nodes to enable.

  - name: KONG_use_declarative_config
    default: "false"
    since: "1.16.0"
    description: >
      Map declarative configuration into the `/kong` folder. If enabled, place
      config file(s) into `custom-conf/kong/`.

  - name: KONG_use_db
    default: "false"
    since: "1.16.0"
    description: >
      Should a database be used as a backend or should it run db-less?

  - name: KONG_db_type
    default: "postgres"
    since: "1.16.0"
    description: >
      The database backend to use for Kong, either ``postgres` for Postgresql
      database or `cassandra` for Apache Cassandra (deprecated by Kong and will
      no longer be available in Kong 4.x).

  - name: KONG_log_level
    default: "info"
    since: "1.16.0"
    description: >
      The log level to use for Kong service.

  - name: KONG_volume_map_working
    default: "false"
    since: "1.16.0"
    description: >
      Volume map working directory folder into the Kong service.

  - name: KONG_volume_map_data
    default: "false"
    since: "1.16.0"
    description: >
      Volume map data folder into the Kong service.

  - name: KONG_plugins
    default: ""
    since: "1.16.0"
    description: >
      A list of custom plugins to enable.
