name: PostgREST
id: postgrest
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://postgrest.org/en/stable/
  documentation: https://postgrest.org/en/stable/
  github: https://github.com/PostgREST/postgrest

description: >
  PostgREST is a standalone web server that turns your PostgreSQL database
  directly into a RESTful API. The structural constraints and permissions in
  the database determine the API endpoints and operations.

enable:
  platys_init: POSTGREST
  example: |
    platys init --enable-services POSTGREST
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28206>

parameters:
  - name: POSTGREST_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate PostgREST service
