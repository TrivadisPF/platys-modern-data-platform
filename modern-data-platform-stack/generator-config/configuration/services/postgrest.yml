name: PostgREST
id: postgrest
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://postgrest.org/en/stable/
  documentation: https://postgrest.org/en/stable/
  github: https://github.com/PostgREST/postgrest

description: >
  PostgREST is a standalone web server that turns your PostgreSQL database
  directly into a RESTful API. The structural constraints and permissions in
  the database determine the API endpoints and operations.

enable:
  platys_init: POSTGREST
  example: |
    platys init --enable-services POSTGREST
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28206>

parameters:
  - name: POSTGREST_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate PostgREST service

  - name: POSTGREST_user
    default: "postgres"
    since: "1.21.0"
    description: >
      Database user PostgREST connects with

  - name: POSTGREST_password
    default: "abc123!"
    since: "1.21.0"
    description: >
      Password of the database user

  - name: POSTGREST_database
    default: "postgres"
    since: "1.21.0"
    description: >
      Database PostgREST connects to

  - name: POSTGREST_schema
    default: "demo"
    since: "1.21.0"
    description: >
      Database schema exposed to REST clients

  - name: POSTGREST_anon_role
    default: ""
    since: "1.21.0"
    description: >
      Database role used when no client authentication is provided (optional)
