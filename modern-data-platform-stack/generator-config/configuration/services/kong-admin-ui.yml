name: Kong Admin UI
id: kong-admin-ui
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  documentation: https://github.com/pocketdigi/kong-admin-ui
  github: https://github.com/pocketdigi/kong-admin-ui

description: >
  A Web UI for the Kong(The Cloud-Native API Gateway & Service Mesh) admin api.

enable:
  platys_init: KONG,
  example: |
    platys init --enable-services KONG,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28286>

parameters:
  - name: KONG_ADMIN_UI_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Kong Admin UI service
