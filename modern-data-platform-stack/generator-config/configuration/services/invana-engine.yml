name: Invana Engine
id: invana-engine
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://invana.io/
  documentation: https://docs.invana.io/products/invana-engine
  github: https://github.com/invana/invana-engine

description: >
  High-performance query engine for graph databases with GraphQL abilities

enable:
  platys_init: INVANA_ENGINE
  example: |
    platys init --enable-services INVANA_ENGINE
    platys gen

usage:
  - title: Usage
    content: |
      The GraphQL Endpoint can be reached here:
      
      ```
      http://dataplatform:28291/graphql
      ```

parameters:
  - name: INVANA_ENGINE_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Invana Engine service
