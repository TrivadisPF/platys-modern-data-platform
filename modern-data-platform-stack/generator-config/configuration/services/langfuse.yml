name: Langfuse
id: langfuse
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://langfuse.com/
  documentation: https://langfuse.com/docs
  github: https://github.com/langfuse/langfuse

description: >
  Langfuse is an open-source LLM engineering platform that helps teams
  collaboratively debug, analyze, and iterate on their LLM applications.

enable:
  platys_init: LANGFUSE,POSTGRESQL
  example: |
    platys init --enable-services LANGFUSE,POSTGRESQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28366>.

parameters:
  - name: LANGFUSE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Langfuse service

  - name: LANGFUSE_database_type
    default: "postgres"
    since: "1.18.0"
    description: >
      The database to store the Langfuse data, currently only `postgres` is
      supported.

  - name: LANGFUSE_database_username
    default: "postgres"
    since: "1.18.0"
    description: >
      The username for the PostgreSQL database.

  - name: LANGFUSE_database_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password for the PostgreSQL database.

  - name: LANGFUSE_database_name
    default: "postgres"
    since: "1.18.0"
    description: >
      The PostgreSQL database name.

  - name: LANGFUSE_enable_telemetry
    default: "false"
    since: "1.18.0"
    description: >
      Enable telemetry for Langfuse.

  - name: LANGFUSE_enable_experimental_features
    default: "false"
    since: "1.18.0"
    description: >
      Enable experimental features.
