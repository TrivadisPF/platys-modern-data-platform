name: Python
id: python
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  documentation: https://www.python.org/doc/
  github: https://github.com/python/cpython

description: >
  Python is a programming language that lets you work quickly and integrate
  systems more effectively.

enable:
  platys_init: PYTHON
  example: |
    platys init --enable-services PYTHON
    platys gen

parameters:
  - name: PYTHON_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Python 3 container

  - name: PYTHON_image
    default: "python"
    since: "1.14.0"
    description: >
      The docker image to use

  - name: PYTHON_artefacts_folder
    default: ""
    since: "1.14.0"
    description: >
      path to the folder on host machine that will mapped to /tmp on container
      and from where the python script file and requirements file will be
      searched

  - name: PYTHON_script_to_run
    default: ""
    since: "1.18.0"
    description: >
      the filename of the python script to be executed (please note that the
      script should be in the folder mounted using `PYTHON_artefacts_folder`)

  - name: PYTHON_requirements_file
    default: ""
    since: "1.14.0"
    description: >
      the filename of the requirements file to be used (please note that the
      script should be in the folder mounted using `PYTHON_artefacts_folder`)

  - name: PYTHON_python_packages
    default: ""
    since: "1.16.0"
    description: >
      Python packages to install, as a space separated list of packages: ` `
