name: Sonatype Nexus Repository Manager
id: nexus
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.sonatype.com/products/sonatype-nexus-repository
  documentation: https://help.sonatype.com/en/sonatype-nexus-repository.html
  github: https://github.com/sonatype/nexus-public
  docker: https://hub.docker.com/r/sonatype/nexus3

description: >
  Sonatype Nexus Repository Manager is a universal artifact repository that
  supports a wide range of package formats including Maven, npm, Docker, PyPI,
  NuGet, and more. It acts as a proxy, hosting, and group repository for
  build artifacts.

enable:
  platys_init: NEXUS
  example: |
    platys init --enable-services NEXUS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28426>.

      The default admin password is printed to the container log on first startup
      and stored in `/nexus-data/admin.password` inside the container.
      Retrieve it with:

      ```bash
      docker exec nexus cat /nexus-data/admin.password
      ```

parameters:
  - name: NEXUS_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Sonatype Nexus Repository Manager service.

  - name: NEXUS_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Persist Nexus data to `./container-volume/nexus/data` on the Docker host.
      Enable this to retain repositories and configuration across container restarts.

  - name: NEXUS_jvm_min_heap
    default: "512m"
    since: "1.20.0"
    description: >
      Minimum JVM heap size passed to Nexus via INSTALL4J_ADD_JVM_PARAMS (-Xms).

  - name: NEXUS_jvm_max_heap
    default: "2g"
    since: "1.20.0"
    description: >
      Maximum JVM heap size passed to Nexus via INSTALL4J_ADD_JVM_PARAMS (-Xmx and -XX:MaxDirectMemorySize).

  - name: NEXUS_admin_password
    default: "abc123!abc123!"
    since: "1.20.0"
    description: >
      Password to set for the Nexus `admin` user during first-time initialisation.
