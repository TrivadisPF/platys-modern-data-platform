name: Swagger Editor
id: swagger-editor
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://swagger.io/tools/swagger-editor/
  documentation: https://swagger.io/docs/open-source-tools/swagger-editor/
  github: https://github.com/swagger-api/swagger-editor

description: >
  Design, describe, and document your API on the first open source editor fully
  dedicated to OpenAPI-based APIs. The Swagger Editor is an easy way to get
  started with the OpenAPI Specification (formerly known as Swagger), with
  support for Swagger 2.0 and OpenAPI 3.0.

enable:
  platys_init: SWAGGER_EDITOR
  example: |
    platys init --enable-services SWAGGER_EDITOR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28156>

parameters:
  - name: SWAGGER_EDITOR_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Swagger Editor service
