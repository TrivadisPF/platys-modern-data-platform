name: OpenLIT
id: openlit
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://openlit.io/
  documentation: https://docs.openlit.io/
  github: https://github.com/openlit/openlit

description: >
  Open source platform for AI Engineering: OpenTelemetry-native LLM
  Observability, GPU Monitoring, Guardrails, Evaluations, Prompt Management,
  Vault, Playground. 🚀💻

enable:
  platys_init: OPENLIT
  example: |
    platys init --enable-services OPENLIT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28242>.

parameters:
  - name: OPENLIT_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate OpenLIT service

  - name: OPENLIT_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data of the OpenLIT service
