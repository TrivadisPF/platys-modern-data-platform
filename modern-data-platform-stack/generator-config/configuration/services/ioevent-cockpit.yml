name: IOEvent Cockpit
id: ioevent-cockpit
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.ioevent.io/
  documentation: https://doc.ioevent.io/
  github: https://github.com/ioevent-io/ioevent-spring-starter

description: >
  Provides a flexible programming model to power your Event Driven Architecture
  (EDA). It offers BPMN 2.0 Support and Observability platform to monitor and
  secure your entire production.

enable:
  platys_init: IOEVENT,
  example: |
    platys init --enable-services IOEVENT,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28327>.

parameters:
  - name: IOEVENT_COCKPIT_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable IOEvent Cockpit.
