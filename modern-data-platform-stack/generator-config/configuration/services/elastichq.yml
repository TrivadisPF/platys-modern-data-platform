name: ElasticHQ
id: elastichq
arch: [x86-64]

tags: []
dependencies: []
links:
  website: http://www.elastichq.org/
  documentation: http://www.elastichq.org/gettingstarted.html
  github: https://github.com/ElasticHQ/elasticsearch-HQ

description: >
  Monitoring and Management Web Application for ElasticSearch instances and
  clusters.

enable:
  platys_init: ELASTICHQ
  example: |
    platys init --enable-services ELASTICHQ
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28127>

parameters:
  - name: ELASTICHQ_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable ElasticHQ.
