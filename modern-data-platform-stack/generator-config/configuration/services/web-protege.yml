name: Web Protégé
id: web-protege
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://protege.stanford.edu/software.php#web-protege
  documentation: https://protegewiki.stanford.edu/wiki/WebProtegeUsersGuide
  github: https://github.com/protegeproject/webprotege

description: >
  WebProtégé is a free, open source collaborative ontology development
  environment.

enable:
  platys_init: WEB_PROTEGE
  example: |
    platys init --enable-services WEB_PROTEGE
    platys gen

usage:
  - title: Usage
    content: |
      Before you use the UI for the first time, you need to create the admin user, using the following command:
      
      ```bash
      docker exec -it web-protege java -jar /webprotege-cli.jar create-admin-account
      ```
      
      Navigate to <http://dataplatform:28368>.

parameters:
  - name: WEB_PROTEGE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Web Protege server service

  - name: WEB_PROTEGE_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into container.

  - name: PROVISIONING_DATA_enable
    default: "false"
    since: "1.18.0"
    description: >
      Provision test data into the `data-transfer` folder.

  - name: PROVISIONING_DATA_additional_data_folder
    default: ""
    since: "1.19.0"
    description: >
      Additional folder local to the root of the platys stack (i.e. where
      `docker-compose.yml` is) with data to be copied into the `/data-transfer`
      folder.
