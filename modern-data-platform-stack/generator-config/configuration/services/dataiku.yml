name: Dataiku
id: dataiku
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.dataiku.com/
  documentation: https://doc.dataiku.com/dss/latest/
  github: https://github.com/dataiku

description: >
  Shiny is an R package that makes it easy to build interactive web apps
  straight from R. You can host standalone apps on a webpage or embed them in R
  Markdown documents or build dashboards. You can also extend your Shiny apps
  with CSS themes, htmlwidgets, and JavaScript actions.

enable:
  platys_init: DATAIKU
  example: |
    platys init --enable-services DATAIKU
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28315>

parameters:
  - name: DATAIKU_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Dataiku service

  - name: DATAIKU_volume_map_data
    default: "false"
    since: "1.11.0"
    description: >
      Volume map data folder into the Dataiku service.
