name: Redis Commander
id: redis-commander
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: http://joeferner.github.io/redis-commander/
  documentation: http://joeferner.github.io/redis-commander/
  github: https://github.com/joeferner/redis-commander

description: >
  Redis-Commander is a node.js web application used to view, edit, and manage a
  Redis Database

enable:
  platys_init: REDIS_COMMANDER
  example: |
    platys init --enable-services REDIS_COMMANDER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28119>

parameters:
  - name: REDIS_COMMANDER_enable
    default: "false"
    since: "1.9.0"
    description: >
      Generate Redis Commander service
