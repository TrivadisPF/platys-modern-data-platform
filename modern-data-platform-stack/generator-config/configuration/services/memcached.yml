name: Memcached
id: memcached
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://memcached.org/
  documentation: https://memcached.org/
  github: https://github.com/memcached/memcached

description: >
  Free & open source, high-performance, distributed memory object caching
  system, generic in nature, but intended for use in speeding up dynamic web
  applications by alleviating database load.

enable:
  platys_init: MEMCACHED
  example: |
    platys init --enable-services MEMCACHED
    platys gen

parameters:
  - name: MEMCACHED_enable
    default: "false"
    since: "1.7.0"
    description: >
      Generate Memcached service
