name: yugabyteDB
id: yugabyte
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://www.yugabyte.com
  documentation: https://docs.yugabyte.com
  github: https://github.com/yugabyte/yugabyte-db

description: >
  YugabyteDB - the cloud native distributed SQL database for mission-critical
  applications.

enable:
  platys_init: YUGABYTE
  example: |
    platys init --enable-services YUGABYTE
    platys gen

parameters:
  - name: YUGABYTE_enable
    default: "false"
    since: "1.5.0"
    description: >
      Generate yugabyteDB service
