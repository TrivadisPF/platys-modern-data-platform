name: Directus
id: directus
category:
  id: 11_query
  name: query
  color: teal
arch: [x86-64]

links:
  website: https://directus.io/
  documentation: https://docs.directus.io/getting-started/introduction.html
  github: https://github.com/directus/directus

description: >
  The Modern Data Stack 🐰 — Directus is an instant REST+GraphQL API and
  intuitive no-code data collaboration app for any SQL database.

enable:
  platys_init: DIRECTUS,
  example: |
    platys init --enable-services DIRECTUS,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8055>.

parameters:
  - name: DIRECTUS_enable
    default: "false"
    since: "1.16.0"
    description: >
      Enable Directus service.
