name: Kadeck
id: kadeck
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://www.kadeck.com
  documentation: https://help.xeotek.com/portal/en/kb/xeotek

description: >
  Kadeck is a collaboration platform for Apache Kafka that provides everything
  Kafka experts need through an intuitive UI that domain experts love.

enable:
  platys_init: KADECK
  example: |
    platys init --enable-services KADECK
    platys gen

usage:
  - title: Connect to Kadeck
    content: |
      Navigate to <http://dataplatform:28313>

parameters:
  - name: KADECK_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Kadeck service

  - name: KADECK_edition
    default: "free"
    since: "1.17.0"
    description: >
      The Kadeck version to use, either `free` or `enterprise`.

  - name: KADECK_free_email_address
    default: "free"
    since: "1.17.0"
    description: >
      The email address to use for the free edtion.

  - name: KADECK_ee_team_id
    default: "free"
    since: "1.17.0"
    description: >
      The team id to use for the enterprise edition.

  - name: KADECK_ee_secret
    default: "free"
    since: "1.17.0"
    sensitive: true
    description: >
      The secret to use for the enterprise ediiton.
