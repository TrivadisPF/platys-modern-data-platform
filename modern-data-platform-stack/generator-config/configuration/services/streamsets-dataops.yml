name: StreamSets DataOps Platform
id: streamsets-dataops
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://streamsets.com/products/dataops-platform/
  documentation: https://docs.streamsets.com/portal/platform-controlhub/controlhub/UserGuide/GettingStarted/GettingStarted_title.html

description: >
  StreamSets DataOps Platform is a cloud-native platform for building, running,
  and monitoring data pipelines.

enable:
  platys_init: STREAMSETS_DATAOPS
  example: |
    platys init --enable-services STREAMSETS_DATAOPS
    platys gen

parameters:
  - name: STREAMSETS_DATAOPS_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable StreamSets DataOps Platform.
