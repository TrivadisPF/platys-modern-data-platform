name: ArcadeDB
id: arcadedb
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://arcadedb.com/
  documentation: https://docs.arcadedb.com/
  github: https://github.com/ArcadeData/arcadedb

description: >
  ```bash platys init --enable-services ARCADEDB platys gen ```

enable:
  platys_init: ARCADEDB
  example: |
    platys init --enable-services ARCADEDB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:2480> and log in as user `root` with default password `abc123abc123` (if not changed using `ARCADEDB_root_password` setting).

parameters:
  - name: ARCADEDB_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate ArcadeDB service

  - name: ARCADEDB_volume_map_data
    default: "false"
    since: "1.16.0"
    description: >
      Volume map `log` folder into the ArcadeDB service?

  - name: ARCADEDB_root_password
    default: "abc123abc123"
    since: "1.16.0"
    sensitive: true
    description: >
      The password of the `root` user (must be at least 8 characters long)

  - name: ARCADEDB_provision_sample_data
    default: "false"
    since: "1.16.0"
    description: >
      Should sample data be provisioned with ArcadeDB?
