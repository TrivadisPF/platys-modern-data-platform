name: Ollama
id: ollama
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  website: https://ollama.com/
  documentation: https://github.com/ollama/ollama
  github: https://github.com/ollama/ollama

description: >
  Get up and running with Llama 2, Mistral, Gemma, and other large language
  models.

enable:
  platys_init: OLLAMA
  example: |
    platys init --enable-services OLLAMA
    platys gen

usage:
  - title: Usage
    content: |
      Generate a completion
      
      ```bash
      curl http://dataplatform:11434/api/generate -d '{
        "model": "llama2",
        "prompt":"Why is the sky blue?"
      }'
      ```
      
      Generate embeddings from a model
      
      ```
      curl http://dataplatform:11434/api/embeddings -d '{
        "model": "llama2",
        "prompt": "Here is an article about llamas..."
      }'
      ```

parameters:
  - name: OLLAMA_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Ollama service

  - name: OLLAMA_gpu_enabled
    default: "true"
    since: "1.17.0"
    description: >
      Enable GPU for Ollama?

  - name: OLLAMA_gpu_driver
    default: "nvidia"
    since: "1.18.0"
    description: >
      The GPU driver to use

  - name: OLLAMA_gpu_count
    default: "1"
    since: "1.18.0"
    description: >
      The number of GPUs to reserver

  - name: OLLAMA_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the data folder into the Ollama service.

  - name: OLLAMA_llms
    default: "llama2"
    since: "1.17.0"
    description: >
      A comma separated list of models to load, any ollama model tag with or
      without tag (such as `llama2`, `mistral`, `phi`, ..), or `gpt-4`, `gpt-3.5`
      or `claudev2`.

  - name: OLLAMA_debug
    default: "false"
    since: "1.17.0"
    description: >
      Enable debugging mode?
