name: "Apache NiFi - MiNiFi - (C++)"
id: minifi
category:
  id: 99_other
  name: other
  color: gray
arch: [x86-64]

links:
  website: https://nifi.apache.org/projects/minifi/
  documentation: https://github.com/apache/nifi-minifi-cpp/tree/main
  github: https://github.com/apache/nifi-minifi-cpp

description: >
  MiNiFi - a subproject of Apache NiFi - is a lightweight edge agent derived
  from Apache NiFi, designed to collect and route data at the source (sensors,
  IoT devices, edge nodes) with a minimal footprint. It runs the same dataflow
  model as NiFi but stripped down for resource-constrained environments,
  feeding data upstream into a full NiFi instance or directly into Kafka.

enable:
  platys_init: MINIFI
  example: |
    platys init --enable-services MINIFI
    platys gen

parameters:
  - name: MINIFI_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Apache MiNiFi C++ agent service

  - name: MINIFI_volume_map_custom_config
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the flow configuration file (`./conf/minifi/config.yml`) into
      the MiNiFi container at `/opt/minifi/minifi-current/conf/config.yml`

  - name: MINIFI_volume_map_custom_minifi_properties
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the agent properties file (`./conf/minifi/minifi.properties`)
      into the MiNiFi container at
      `/opt/minifi/minifi-current/conf/minifi.properties`

  - name: MINIFI_compose_profile
    default: ""
    since: "1.20.0"
    description: >
      The docker compose profile the service should run in.
