name: Apache NiFi
id: nifi2
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://nifi.apache.org/
  documentation: https://nifi.apache.org/components/
  github: https://github.com/apache/nifi

description: >
  Apache NiFi supports powerful and scalable directed graphs of data routing,
  transformation, and system mediation logic.

enable:
  platys_init: NIFI
  example: |
    platys init --enable-services NIFI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:18080/nifi>
      
      Login with User `nifi` and password `1234567890ACD`.
  - title: Using NiFi Rest API?
    content: |
      Retrieve the access token into variable `TOKEN`
      
      ```bash
      TOKEN=$(curl -k 'https://localhost:18080/nifi-api/access/token' \
                    --data 'username=nifi&password=1234567890ACD')
      ```
      
      and then use it in any call to the [NIFi Rest API](https://nifi.apache.org/docs/nifi-docs/rest-api/index.html):
      
      ```bash
      curl -k -H "Authorization: Bearer $TOKEN" 'https://localhost:18080/nifi-api/flow/current-user'  
      ```
      
      as it returns JSON, we can pipe into `jq`
      
      ```bash
      curl -k -H "Authorization: Bearer $TOKEN" 'https://localhost:18080/nifi-api/flow/current-user' | jq
      ```
  - title: Export Metrics to Prometheus
    content: |
      ```bash
      printf '%s' "$(curl -sk -X POST https://localhost:18083/nifi-api/access/token \
        -d 'username=nifi&password=<yourpassword>')" > ./security/nifi2/nifi_token
      ```

parameters:
  - name: NIFI2_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Apache NiFi v2 service

  - name: NIFI2_custom_image_name
    default: ""
    since: "1.18.0"
    description: >
      Use a custom image name for the NiFi v2 service. If you want to specify the
      version, overwrite the `NIFI2_version` property.

  - name: NIFI2_run_secure
    default: "false"
    since: "1.18.0"
    description: >
      Enable HTTPs with single user authentication

  - name: NIFI2_use_custom_certs
    default: "false"
    since: "1.18.0"
    description: >
      Use custom certificates (keystore and truststore)? if yes, place them in
      `./custom-conf/nifi2/security`.

  - name: NIFI2_keystore_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The password for the keystore, if `NIFI2_use_custom_certs` is set to
      `true`.

  - name: NIFI2_key_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The password for the certificate in the keystore, if
      `NIFI2_use_custom_certs` is set to `true`. If left empty then the password
      for the keystore is used.

  - name: NIFI2_truststore_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The password for the truststore, if `NIFI2_use_custom_certs` is set to
      `true`.

  - name: NIFI2_inital_admin_identitiy
    default: ""
    since: "1.18.0"
    description: >
      The initial admin user is granted access to the UI and given the ability to
      create additional users, groups, and policies. The value of this property
      could be a certificate DN , LDAP identity (DN or username), or a Kerberos
      principal.

  - name: NIFI2_username
    default: "nifi"
    since: "1.18.0"
    sensitive: true
    description: >
      The username to be used when Nifi runs in secure mode (`NIFI2_run_secure`
      is set to true). If `NIFI2_username` is set to empty, then a random
      username and password will be generated on startup and shown in the log.

  - name: NIFI2_password
    default: "1234567890AB"
    since: "1.18.0"
    sensitive: true
    description: >
      The password to be used when Nifi runs in secure mode (`NIFI_run_secure` is
      set to true). Must be 12 characters minimum, otherwise NiFi will generate a
      random username and password.

  - name: NIFI2_nodes
    default: "1"
    since: "1.18.0"
    description: >
      The number of NiFi v2 nodes to generate. Can be connected to a cluster by
      setting `NIFI_create_cluster` to `true`.

  - name: NIFI2_election_max_wait
    default: "1 min"
    since: "1.18.0"
    description: >
      Specifies the amount of time to wait before electing a Flow as the
      'correct' Flow, when starting a cluster.

  - name: NIFI2_volume_map_custom_config
    default: "false"
    since: "1.18.0"
    description: >
      Volume map custom config (`./custom-conf/nifi2/nifi.properties`) into the
      Apache NiFi service

  - name: NIFI2_volume_map_addl_jars
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the additional jars folder (`./plugins/nifi2/addl-jars`) into
      the Apache NiFi v2 service to add extra JARs (e.g. jdbc driver).

  - name: NIFI2_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map various data folder into the Apache NiFi v2 service

  - name: NIFI2_volume_map_logs
    default: "false"
    since: "1.18.0"
    description: >
      Volume map logs folder into the Apache NiFi v2 service

  - name: NIFI2_jvm_heap_init
    default: ""
    since: "1.18.0"
    description: >
      the JVM Memory initial heap size (use values acceptable to the JVM Xmx and
      Xms parameters such as 1g or 512m)

  - name: NIFI2_jvm_heap_max
    default: ""
    since: "1.18.0"
    description: >
      the JVM Memory maximum heap size (use values acceptable to the JVM Xmx and
      Xms parameters such as 1g or 512m)

  - name: NIFI2_python_provide_requirements_file
    default: "false"
    since: "1.18.0"
    description: >
      Copy the file `./custom-conf/nifi2/requirements.txt` file with additional
      python dependencies into the container?

  - name: NIFI2_additional_port_mappings
    default: "0"
    since: "1.18.0"
    description: >
      Number of additional port mappings to add to the NiFi-1 service. This is
      helpful when working with a component exposing an HTTP endpoint, so that it
      can be reached from outside without having to manually change the
      docker-compose.yml.

  - name: NIFI2_flow_configuration_file
    default: "./conf/flow.json.gz"
    since: "1.18.0"
    description: >
      The location of the JSON-based flow configuration file. Overwrites
      `nifi.flow.configuration.file` setting in `nifi.properties`.

  - name: NIFI2_flow_configuration_archive_dir
    default: "./conf/archive"
    since: "1.18.0"
    description: >
      The location of the archive directory where backup copies of the flow.json
      are saved. Overwrites `nifi.flow.configuration.archive.dir` setting in
      `nifi.properties`.
