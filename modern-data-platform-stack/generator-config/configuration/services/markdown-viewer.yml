name: Markdown Viewer
id: markdown-viewer
arch: [x86-64]


tags: []
dependencies: []
description: >
  Easy website using markdown files.

enable:
  platys_init: MARKDOWN_VIEWER
  example: |
    platys init --enable-services MARKDOWN_VIEWER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:80>

parameters:
  - name: MARKDOWN_VIEWER_enable
    default: "true"
    since: "1.9.0"
    description: >
      Generate a web page with the details on the data platform.

  - name: MARKDOWN_VIEWER_use_port_80
    default: "true"
    since: "1.10.0"
    description: >
      Use Port `80` for the markdown viewer? If set to `false`, port `8008` is
      used.

  - name: MARKDOWN_VIEWER_use_public_ip
    default: "true"
    since: "1.10.0"
    description: >
      When rendering markdown pages, use the public IP address for links to
      services. If set to `false`, the docker host IP is used instead.

  - name: MARKDOWN_VIEWER_edition
    default: "markdown-madness"
    since: "1.17.0"
    description: >
      The markdown 'engine' to use, either `markdown-web` or `markdown-madness`.

  - name: MARKDOWN_VIEWER_services_list_version
    default: "2"
    since: "1.17.0"
    description: >
      The version of the Services list to render. Either `1` (original) or `2`
      (with ports).
