name: Tyk Dashboard
id: tyk-dashboard
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://tyk.io
  documentation: https://tyk.io/docs/tyk-dashboard/

description: >
  The Tyk Dashboard is the visual GUI and analytics platform for Tyk. It
  provides an easy-to-use management interface for managing a Tyk installation
  as well as clear and granular analytics.

enable:
  platys_init: TYK,TYK_DASHBOARD
  example: |
    platys init --enable-services TYK,TYK_DASHBOARD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28281>

parameters:
  - name: TYK_DASHBOARD_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Tyk Dashboard.
