name: Watchtower
id: watchtower
category:
  id: 20_infrastructure
  name: infrastructure
  color: steel
arch: [x86-64]

links:
  website: https://containrrr.dev/watchtower/
  documentation: https://containrrr.dev/watchtower/
  github: https://github.com/containrrr/watchtower

description: >
  A container-based solution for automating Docker container base image
  updates.

enable:
  platys_init: WATCHTOWER
  example: |
    platys init --enable-services WATCHTOWER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28137>

parameters:
  - name: WATCHTOWER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Watchtower.
