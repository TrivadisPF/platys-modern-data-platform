name: Retool
id: retool
category:
  id: 10_ui
  name: ui
  color: green
arch: [x86-64]

links:
  website: https://retool.com/
  documentation: https://docs.retool.com/docs
  github: https://github.com/tryretool/retool-onpremise

description: >
  Retool enables you to quickly build and deploy internal apps for your team.
  Connect to your databases and APIs, assemble UIs with drag-and-drop building
  blocks like tables and forms, and write queries to interact with data using
  SQL and JavaScript.

enable:
  platys_init: RETOOL
  example: |
    platys init --enable-services RETOOL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3006>.

parameters:
  - name: RETOOL_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Retool low-code platform service
