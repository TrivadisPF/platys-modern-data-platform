name: LinuxForHealth (IBM) FHIR Server
id: lfh-fhir
category:
  id: 21_healthcare
  name: healthcare
  color: white
arch: [x86-64]

links:
  website: https://linuxforhealth.github.io/FHIR/
  documentation: https://linuxforhealth.github.io/FHIR/
  github: https://github.com/LinuxForHealth/FHIR

description: >
  The LinuxForHealth FHIR® Server and related projects.

enable:
  platys_init: LFH_FHIR
  example: |
    platys init --enable-services LFH_FHIR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9443/fhir-server/api/v4/$healthcheck>.

parameters:
  - name: LFH_FHIR_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate LinxuForHealth FHIR server service

  - name: LFH_FHIR_user_password
    default: "change-password"
    since: "1.17.0"
    sensitive: true
    description: >
      The password for the `fhiruser` user.

  - name: LFH_FHIR_admin_password
    default: "change-password"
    since: "1.17.0"
    sensitive: true
    description: >
      The password for the `fhiradmin` user.
