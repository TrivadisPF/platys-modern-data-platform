name: Kafka Lag Exporter
id: kafka-lag-exporter
arch: [x86-64]

tags: []
dependencies: [kafka]
links:
  website: https://github.com/seglo/kafka-lag-exporter
  documentation: https://github.com/seglo/kafka-lag-exporter
  github: https://github.com/seglo/kafka-lag-exporter/tree/master

description: >
  Monitor Kafka Consumer Group Latency with Kafka Lag Exporter.

enable:
  platys_init: KAFKA,KAFKA_LAG_EXPORTER
  example: |
    platys init --enable-services KAFKA,KAFKA_LAG_EXPORTER
    platys gen

parameters:
  - name: KAFKA_LAG_EXPORTER_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate Kafka Lag Exporter service
