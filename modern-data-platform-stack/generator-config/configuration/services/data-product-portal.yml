name: Data Product Portal
id: data-product-portal
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/conveyordata/data-product-portal
  github: https://github.com/conveyordata/data-product-portal

description: >
  The Data Product Portal enables to scale building data products across all
  departments in an organisation in a self-service manner. It does so by
  providing a guided setup for creating data products, with proper approval
  processes that will enable governance by design for data initiatives. The
  portal is a process tool that helps data professionals do their work more
  efficiently while providing governance and insights into how data is being
  used throughout the organisation.

enable:
  platys_init: DATA_PRODUCT_PORTAL
  example: |
    platys init --enable-services DATA_PRODUCT_PORTAL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28419>.

parameters:
  - name: DATA_PRODUCT_PORTAL_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Data Product Portal service

  - name: DATA_PRODUCT_PORTAL_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data folder of the Data Product Portal Postgresql instance?

  - name: DATA_PRODUCT_PORTAL_provision_sample_data
    default: "false"
    since: "1.18.0"
    description: >
      Provision sample data?
