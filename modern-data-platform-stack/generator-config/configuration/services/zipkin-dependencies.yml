name: Zipkin Dependencies
id: zipkin-dependencies
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  website: https://zipkin.io/
  documentation: https://zipkin.io/
  github: https://github.com/openzipkin/zipkin

description: >
  Zipkin Dependencies collects spans from storage, analyzes links between
  services, and stores them for later presentation in the web UI.

enable:
  platys_init: ZIPKIN
  example: |
    platys init --enable-services ZIPKIN
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9411/dependency>

parameters:
  - name: ZIPKIN_DEPENDENCIES_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Zipkin Dependencies.
