name: Better Chatbot
id: better-chatbot
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  documentation: https://github.com/cgoinglove/better-chatbot/tree/main
  github: https://github.com/cgoinglove/better-chatbot/tree/main

description: >
  Just a Better Chatbot. Powered by Agent & MCP & Workflows.

enable:
  platys_init: BETTER_CHATBOT
  example: |
    platys init --enable-services BETTER_CHATBOT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28405>.

parameters:
  - name: BETTER_CHATBOT_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Better Chatbot service

  - name: BETTER_CHATBOT_auth_secret
    default: "sijaUrJQ1yq96vy+mzWxXajR..."
    since: "1.20.0"
    sensitive: true
    description: >
      Secret key for authentication; generate with `openssl rand -hex 32`

  - name: BETTER_CHATBOT_postgres_url
    default: ""
    since: "1.20.0"
    description: >
      PostgreSQL connection URL; if empty and `POSTGRESQL_enable` is `true`,
      auto-built from `POSTGRESQL_*` settings
