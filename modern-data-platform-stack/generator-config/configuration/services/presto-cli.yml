name: Presto CLI
id: presto-cli
arch: [x86-64]

tags: [cli]
dependencies: [presto]
links:
  website: https://prestodb.io/
  documentation: https://prestodb.io/docs/current/installation/cli.html
  github: https://github.com/prestodb/presto

description: >
  Distributed SQL Query Engine for Big Data. This container runs the Presto CLI.

enable:
  platys_init: PRESTO_CLI
  example: |
    platys init --enable-services PRESTO_CLI
    platys gen

usage:
  - title: Running the CLI
    content: |
      ```bash
      docker exec -it presto-cli presto-cli --server presto-1:8080
      ```

parameters:
  - name: PRESTO_CLI_enable
    default: "true"
    since: "1.6.0"
    description: >
      Enable Presto CLI service. Enabled by default, if `PRESTO_enable` is set
      to `true`.
