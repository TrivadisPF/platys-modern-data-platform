name: Memgraph
id: memgraph
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://memgraph.com/
  documentation: https://memgraph.com/docs
  github: https://github.com/memgraph/memgraph

description: >
  ``` platys init --enable-services MEMGRAPH ``` Use the `MEMGRAPH_edition`
  setting to choose if you want to use the Memgraph database (with or without
  Mage) or the Memgraph-Platform including the Memgraph Labe environment. ```
  platys gen ```

enable:
  platys_init: MEMGRAPH
  example: |
    platys init --enable-services MEMGRAPH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28288> if you have the Memgraph-Platform enabled.
      
      You can also download and install [Memgraph Lab](https://memgraph.com/lab) and [mgconsole](https://memgraph.com/docs/memgraph/connect-to-memgraph/mgconsole) ([download here](https://memgraph.com/download#memgraph-lab)) to your local machine and connect to the Memgraph instance running on the Platys stack.

parameters:
  - name: MEMGRAPH_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Memgraph service

  - name: MEMGRAPH_edition
    default: "platform"
    since: "1.16.0"
    description: >
      The 'edition' to use, either `platform` for the Memgraph-Platform or `db`
      for just the Memgraph database (use `MEMGRAPH_with_mage` to specify if you
      want support for the mage graph library). - `platform` is deprecated by
      Memgraph and this configuration will be removed in release `1.20.0`.

  - name: MEMGRAPH_with_mage
    default: "false"
    since: "1.16.0"
    description: >
      Use the docker image with the mage graph algorithms included?

  - name: MEMGRAPH_volume_map_data
    default: "false"
    since: "1.16.0"
    description: >
      Volume map `data` folder into the Memgraph service

  - name: MEMGRAPH_volume_map_log
    default: "false"
    since: "1.16.0"
    description: >
      Volume map `log` folder into the Memgraph service

  - name: MEMGRAPH_volume_map_custom_conf
    default: "false"
    since: "1.16.0"
    description: >
      Volume map `custom-conf` folder into the Memgraph service. Place a
      `memgraph.conf` file into `custom-conf/memgraph` to configure the Memgraph
      instance.
