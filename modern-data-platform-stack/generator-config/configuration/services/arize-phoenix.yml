name: Arize Phoenix
id: arize-phoenix
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://arize.com/
  documentation: https://docs.arize.com/phoenix
  github: https://github.com/Arize-ai/phoenix

description: >
  Phoenix is an open-source AI observability platform designed for
  experimentation, evaluation, and troubleshooting.

enable:
  platys_init: ARIZE_PHOENIX
  example: |
    platys init --enable-services ARIZE_PHOENIX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:6006>.

parameters:
  - name: ARIZE_PHOENIX_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Arize Phoenix service
