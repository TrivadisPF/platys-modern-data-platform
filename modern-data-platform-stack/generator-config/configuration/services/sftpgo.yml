name: SFTPgo
id: sftpgo
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://sftpgo.com/
  documentation: https://docs.sftpgo.com/latest/
  github: https://github.com/drakkan/sftpgo

description: >
  Full-featured and highly configurable SFTP, HTTP/S, FTP/S and WebDAV server -
  S3, Google Cloud Storage, Azure Blob.

enable:
  platys_init: SFTPGO
  example: |
    platys init --enable-services SFTPGO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28382> for the SFTPgo UI.

parameters:
  - name: SFTPGO_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate SFTPgo service

  - name: SFTPGO_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the local `data` folder into the SFTPgo service

  - name: SFTPGO_volume_map_data_transfer
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the local `data-transfer` folder into the SFTPgo service

  - name: SFTPGO_admin_username
    default: "admin"
    since: "1.18.0"
    description: >
      The username of the user on the SFTPgo Server

  - name: SFTPGO_admin_username
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the user on the SFTPgo Server

  - name: SFTPGO_home
    default: "ftp-data"
    since: "1.18.0"
    description: >
      The home directory on the SFTPgo Server
