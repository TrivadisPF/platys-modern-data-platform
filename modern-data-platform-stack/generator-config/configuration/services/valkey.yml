name: Valkey
id: valkey
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://valkey.io/
  documentation: https://valkey.io/docs/
  github: https://github.com/valkey-io/valkey

description: >
  A flexible distributed key-value datastore that is optimized for caching and
  other realtime workloads.

enable:
  platys_init: VALKEY
  example: |
    platys init --enable-services VALKEY
    platys gen

usage:
  - title: Usage
    content: |
      To connect to Keyval over the Valkey-CLI, use
      
      ```
      docker exec -ti valkey-1 valkey-cli
      ```

parameters:
  - name: VALKEY_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Valkey service

  - name: VALKEY_replicasets
    default: "0"
    since: "1.18.0"
    description: >
      The number of replica instances to generate.

  - name: VALKEY_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into the Valkey service

  - name: VALKEY_allow_empty_password
    default: "true"
    since: "1.18.0"
    sensitive: true
    description: >
      Allow access the database without a password?.

  - name: VALKEY_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      Set the Valkey server password, only used if `VALKEY_allow_empty_password`
      is set to `false`. Alternative to setting it via `VALKEY_password_file`.

  - name: VALKEY_password_file
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The name of a password file in `./security/valkey/` which holds the Valkey
      server password. Only used if `VALKEY_allow_empty_password` is set to
      `false`. Alternative to setting it via `VALKEY_password`.

  - name: VALKEY_aclfile
    default: ""
    since: "1.18.0"
    description: >
      The name of an ACL file available in `./security/valkey/` where the Valkey
      access control lists, to control which commands can be executed and what
      keys can be accessed.

  - name: VALKEY_disable_commands
    default: ""
    since: "1.18.0"
    description: >
      Comma-separated list of Valkey commands to disable. Defaults to empty.

  - name: VALKEY_aof_enabled
    default: "true"
    since: "1.18.0"
    description: >
      Use the Append Only File persistence. If set to `false` will disable it.

  - name: VALKEY_rdb_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Use the RDB persistence? If set to `false`, it is disabled, and
      `VALKEY_rdb_save_policy` will have no effect.

  - name: VALKEY_rdb_save_policy
    default: ""
    since: "1.18.0"
    description: >
      The data synchronization strategy, a space delimited list of key-value
      pairs in the form of `nof-seconds#nof-changes`. So for example `60#1000
      30#2000` will dump the data to disk every 60 seconds if at least 1000 keys
      have changed and ever 30 seconds if at least 2000 keys have changed.

  - name: VALKEY_io_threads
    default: ""
    since: "1.18.0"
    description: >
      The number of I/O threads to use in Valkey, to divert from the normally
      single-threaded operation mode of Valkey. By default multi-threading is
      disabled, set this parameter to anything > 1 to enable it.

  - name: VALKEY_io_threads_do_reads_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Usually threading reads does not help much. Set this to `true` to enable
      threading reads.

  - name: VALKEY_overrides_config_file
    default: ""
    since: "1.18.0"
    description: >
      The name of an overrides file available in `./custom-conf/valkey/`
      containing only the settings you wish to override. Can be combined with the
      other specific settings available above but be careful to not override a
      value set through the specific configs.

  - name: VALKEY_log_level
    default: "notice"
    since: "1.18.0"
    description: >
      Specify the server verbosity level, one of `nothing` (no logging),
      `warning` (only very important, critical messages are logged), `notice`
      (moderately verbose, what you want for production), `verbose` (many rarely
      useful info, less verbose than debug) and `debug`.
