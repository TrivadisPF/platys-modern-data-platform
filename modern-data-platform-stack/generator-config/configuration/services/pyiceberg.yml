name: Pyiceberg
id: pyiceberg
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://py.iceberg.apache.org/
  documentation: https://py.iceberg.apache.org/

description: >
  PyIceberg is a Python implementation for accessing Iceberg tables, without
  the need of a JVM. It also comes with a CLI which is exposed by this service.

enable:
  platys_init: PYICEBERG
  example: |
    platys init --enable-services PYICEBERG
    platys gen

usage:
  - title: Usage
    content: |
      Execute the cli 
      
      ```bash
      docker  exec pyiceberg pyiceberg
      ```

parameters:
  - name: PYICEBERG_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Iceberg CLI service
