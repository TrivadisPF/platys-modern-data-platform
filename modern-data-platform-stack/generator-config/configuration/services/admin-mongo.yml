name: adminMongo
id: admin-mongo
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/adicom-systems/adminMongo
  github: https://github.com/adicom-systems/adminMongo

description: >
  adminMongo is a Web based user interface (GUI) to handle all your MongoDB
  connections/databases needs.

enable:
  platys_init: MONGO
  example: |
    platys init --enable-services MONGO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28124>

parameters:
  - name: MONGO_ADMIN_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Mongo Admin service
