name: Mongo Express
id: mongo-express
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/mongo-express/mongo-express
  github: https://github.com/mongo-express/mongo-express

description: >
  Web-based MongoDB admin interface, written with Node.js and express.

enable:
  platys_init: MONGO
  example: |
    platys init --enable-services MONGO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28123>

parameters:
  - name: MONGO_EXPRESS_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Mongo Express service

  - name: MONGO_EXPRESS_username
    default: ""
    since: "1.18.0"
    description: >
      The username of the MongoExpress user, if undefined or empty, then
      authentication is disabled.

  - name: MONGO_EXPRESS_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the MongoExpress user, if undefined or empty, then
      authentication is disabled.

  - name: MONGO_EXPRESS_editor_theme
    default: "default"
    since: "1.16.0"
    description: >
      editor color theme, one of `default`, `ambient`, `dracula`, ... see here
      for more:
