name: Minio Web
id: minio-web
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  documentation: https://github.com/e2fyi/minio-web
  github: https://github.com/e2fyi/minio-web

description: >
  Web server for S3 compatible storage.

enable:
  platys_init: MINIO,
  example: |
    platys init --enable-services MINIO,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28306>.

parameters:
  - name: MINIO_WEB_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Minio Web service

  - name: MINIO_WEB_s3_bucket_name
    default: ""
    since: "1.17.0"
    description: >
      The Minio bucket name to serve the artefacts.

  - name: MINIO_WEB_s3_prefix
    default: ""
    since: "1.17.0"
    description: >
      S3 prefix to add when querying for a file in the minio bucket, e.g.
      `myapp/` (make sure you add the `/` at the end).

  - name: MINIO_WEB_default_html
    default: "index.html"
    since: "1.17.0"
    description: >
      Default file to serve initially, e.g. homepage of the web app.

  - name: MINIO_WEB_favicon
    default: ""
    since: "1.17.0"
    description: >
      Name of a favicon file to use instead of the default one provided. The file
      has to be available in the `./custom-conf/minio-web/` folder of the
      platform.

  - name: MINIO_WEB_md_template
    default: ""
    since: "1.17.0"
    description: >
      Name of a markdown template file to use instead of the default one
      provided. Renders any markdown resources as HTML with the template.
      Template MUST have a placeholder {{ .Content }}. The file has to be
      available in the `./custom-conf/minio-web/` folder of the platform.
