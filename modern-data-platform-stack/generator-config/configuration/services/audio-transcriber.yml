name: Audio Transcriber API
id: audio-transcriber
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/didevlab/audio-transcriber-whisper-api
  github: https://github.com/didevlab/audio-transcriber-whisper-api

description: >
  Bridge for audio transcription between Open-WebUI and Whisper, returns text
  in JSON format.

enable:
  platys_init: OPEN_WEBUI
  example: |
    platys init --enable-services OPEN_WEBUI
    platys gen

usage:
  - title: Usage
    content: |
      ```bash
      curl -X POST http://dataplatform:28223/audio/transcriptions  -F "file=@path/to/your_audio_file.wav"      -F "model=base"
      ```

parameters:
  - name: AUDIO_TRANSCRIBER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Audio Transcriber API.
