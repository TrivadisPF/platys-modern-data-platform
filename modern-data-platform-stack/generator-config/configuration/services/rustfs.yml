name: RustFS
id: rustfs
type: engine
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://rustfs.com
  documentation: https://docs.rustfs.com
  github: https://github.com/rustfs/rustfs

description: >
  RustFS is an open-source, S3-compatible high-performance object storage system
  written in Rust, supporting migration and coexistence with other S3-compatible
  platforms such as MinIO and Ceph.

enable:
  platys_init: RUSTFS
  example: |
    platys init --enable-services RUSTFS
    platys gen

usage:
  - title: Open the RustFS console
    content: |
      Navigate to <http://dataplatform:9014>.
      Log in with the configured `RUSTFS_access_key` and `RUSTFS_secret_key`.

parameters:
  - name: RUSTFS_enable
    default: "false"
    since: "1.20.0"
    description: >
      Enable RustFS object storage service.

  - name: RUSTFS_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the data folder into the container.

  - name: RUSTFS_volume_map_logs
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the logs folder into the container.

  - name: RUSTFS_access_key
    default: "admin"
    since: "1.20.0"
    description: >
      S3 access key used to authenticate with RustFS.

  - name: RUSTFS_secret_key
    default: "abc123abc123!"
    since: "1.20.0"
    sensitive: true
    description: >
      S3 secret key used to authenticate with RustFS.

  - name: RUSTFS_admin_bucket_name
    default: "admin-bucket"
    since: "1.20.0"
    description: >
      Name of the admin bucket created and used on startup.

  - name: RUSTFS_buckets
    default: ""
    since: "1.20.0"
    applicable_when: "RUSTFS_mc_enabled == true"
    description: >
      Comma-separated list of additional buckets to create on startup.

  - name: RUSTFS_console_enabled
    default: "true"
    since: "1.20.0"
    description: >
      Enable the RustFS web console UI.

  - name: RUSTFS_mc_enabled
    default: "true"
    since: "1.21.0"
    description: >
      Enable the `rustfs-mc` sidecar container (MinIO Client CLI) that pre-creates
      buckets and optionally uploads data-transfer content on startup.
      When `false`, no `rustfs-mc` container is started.

  - name: RUSTFS_upload_data_transfer_to_bucket_enabled
    default: "false"
    since: "1.20.0"
    applicable_when: "RUSTFS_mc_enabled == true"
    description: >
      Upload the contents of the /data-transfer folder into RustFS on container startup.
      The target bucket is specified in RUSTFS_upload_data_transfer_bucket_name.

  - name: RUSTFS_upload_data_transfer_bucket_name
    default: "data-transfer-bucket"
    since: "1.20.0"
    applicable_when: "RUSTFS_upload_data_transfer_to_bucket_enabled == true"
    description: >
      Name of the bucket to upload /data-transfer contents into.

  - name: RUSTFS_upload_data_transfer_subfolders
    default: ""
    since: "1.20.0"
    applicable_when: "RUSTFS_upload_data_transfer_to_bucket_enabled == true"
    description: >
      Comma-separated list of subfolders within /data-transfer to upload selectively.
      If empty, everything is uploaded recursively.

  - name: RUSTFS_notify_webhook_enabled
    default: "false"
    since: "1.21.0"
    description: >
      Send bucket event notifications to a webhook (target name `primary`, ARN `arn:rustfs:sqs:us-east-1:primary:webhook`).

  - name: RUSTFS_notify_webhook_endpoint
    default: ""
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_webhook_enabled == true"
    description: >
      HTTP or HTTPS endpoint the events are delivered to.

  - name: RUSTFS_notify_webhook_auth_token
    default: ""
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_webhook_enabled == true"
    description: >
      Optional bearer token sent in the `Authorization` header of the webhook calls.

  - name: RUSTFS_notify_mqtt_enabled
    default: "false"
    since: "1.21.0"
    description: >
      Send bucket event notifications to an MQTT broker (target name `primary`).

  - name: RUSTFS_notify_mqtt_broker_endpoint
    default: "tcp://mosquitto-1:1883"
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_mqtt_enabled == true"
    description: >
      The MQTT broker endpoint.

  - name: RUSTFS_notify_mqtt_topic
    default: "rustfs-notify-log"
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_mqtt_enabled == true"
    description: >
      The MQTT topic the events are published to.

  - name: RUSTFS_notify_mqtt_qos
    default: "0"
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_mqtt_enabled == true"
    description: >
      The MQTT quality of service level (0, 1 or 2).

  - name: RUSTFS_notify_mqtt_username
    default: ""
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_mqtt_enabled == true"
    description: >
      Optional username for the MQTT broker.

  - name: RUSTFS_notify_mqtt_password
    default: ""
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_mqtt_enabled == true"
    description: >
      Optional password for the MQTT broker.

  - name: RUSTFS_notify_kafka_enabled
    default: "false"
    since: "1.21.0"
    description: >
      Send bucket event notifications to the Kafka cluster of the platform or
      the external Kafka (target name `primary`, ARN
      `arn:rustfs:sqs:us-east-1:primary:kafka`). Security settings (SASL or
      SSL) are taken over from the Kafka configuration.

  - name: RUSTFS_notify_kafka_topic
    default: "rustfs-notify-log"
    since: "1.21.0"
    applicable_when: "RUSTFS_notify_kafka_enabled == true"
    description: >
      The name of the Kafka topic where the bucket notification events are
      published to.
