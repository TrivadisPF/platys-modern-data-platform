name: Mongo MCP Server
id: mongo-mcp
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  documentation: https://github.com/mongodb-js/mongodb-mcp-server
  github: https://github.com/mongodb-js/mongodb-mcp-server

description: >
  A Model Context Protocol server to connect to MongoDB databases and MongoDB
  Atlas Clusters.

enable:
  platys_init: MONGO,
  example: |
    platys init --enable-services MONGO,
    platys gen

usage:
  - title: Usage
    content: |
      Configure  to <http://dataplatform:28403/sse> if transport configuration setting is left to default.

parameters:
  - name: MONGO_MCP_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate MongoDB MCP Server service

  - name: MONGO_MCP_output_transport
    default: "sse"
    since: "1.20.0"
    description: >
      The output transport protocol for the MongoDB MCP Server; one of `stdio`,
      `sse`, `ws`, or `streamableHttp`
