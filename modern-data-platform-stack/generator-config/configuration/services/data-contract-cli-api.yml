name: Data Contract CLI API
id: data-contract-cli-api
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://cli.datacontract.com/API
  github: https://github.com/datacontract/datacontract-cli

description: >
  A REST API for data contract testing, linting, and exports.

enable:
  platys_init: DATA_CONTRACT_CLI_API
  example: |
    platys init --enable-services DATA_CONTRACT_CLI_API
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:4242>

parameters:
  - name: DATA_CONTRACT_CLI_API_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Data Contract CLI API service
