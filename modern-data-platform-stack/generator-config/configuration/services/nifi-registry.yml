name: Apache NiFi Registry
id: nifi-registry
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://nifi.apache.org/registry.html
  documentation: https://nifi.apache.org/registry.html
  github: https://github.com/apache/nifi

description: >
  A subproject of Apache NiFi to store and manage shared resources.

enable:
  platys_init: NIFI,NIFI_REGISTRY
  example: |
    platys init --enable-services NIFI,NIFI_REGISTRY
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://${PUBLIC_IP}:19090/nifi-registry>

parameters:
  - name: NIFI_REGISTRY_enable
    default: "false"
    since: "1.9.0"
    description: >
      Generate Apache NiFi Registry service

  - name: NIFI_REGISTRY_major_version
    default: "false"
    since: "1.17.0"
    description: >
      Which major version of NiFI Registry to use, one of `1` or `2`. The exact
      version can then be specified using either the `NIFI_REGISTRY_1_version` or
      `NIFI_REGISTRY_2_version` setting.

  - name: NIFI_REGISTRY_log_level
    default: "INFO"
    since: "1.17.0"
    description: >
      The NiFi Registry Log level, one of `TRACE`, `DEBUG`, `INFO`, `WARN`,
      `ERROR`.

  - name: NIFI_REGISTRY_run_secure
    default: "false"
    since: "1.16.0"
    description: >
      Run NiFi Registry secure with two-ways TLS?

  - name: NIFI_REGISTRY_volume_map_data
    default: "false"
    since: "1.9.0"
    description: >
      Volume map database folder into the Apache NiFi Registry service

  - name: NIFI_REGISTRY_volume_map_logs
    default: "false"
    since: "1.17.0"
    description: >
      Volume map logs folder into the Apache NiFi Registry service

  - name: NIFI_REGISTRY_volume_map_flow_storage
    default: "false"
    since: "1.16.0"
    description: >
      Volume map the flow storage folder (for `file` or `git` storage)?

  - name: NIFI_REGISTRY_flow_storage_folder_on_dockerhost
    default: "./container-volume/nifi-registry/flow-storage"
    since: "1.16.0"
    description: >
      The folder on the docker host which is used as the local (on docker host)
      folder for the flow storage.

  - name: NIFI_REGISTRY_flow_provider
    default: "file"
    since: "1.16.0"
    description: >
      The flow persistence provider, either `file` or `git`.

  - name: NIFI_REGISTRY_git_remote
    default: ""
    since: "1.16.0"
    description: >
      Automatically push to the specified remote, i.g. `origin`. This property is
      optional and if not specified, commits will remain in the local repository
      unless a push is performed manually.

  - name: NIFI_REGISTRY_git_user
    default: ""
    since: "1.16.0"
    description: >
      The user used to push to the Git repository.

  - name: NIFI_REGISTRY_git_password
    default: ""
    since: "1.16.0"
    sensitive: true
    description: >
      The password of the user used to push to the Git repository. Only effective
      if `NIFI_REGISTRY_git_user` is used as well.

  - name: NIFI_REGISTRY_git_use_ssh_auth
    default: "false"
    since: "1.17.0"
    description: >
      Use SSH keys to authenticate against the Git repository.

  - name: NIFI_REGISTRY_git_repo
    default: ""
    since: "1.16.0"
    description: >
      The Git remote repository URI.

  - name: NIFI_REGISTRY_bundle_provider
    default: "file"
    since: "1.16.0"
    description: >
      The bundle persistence provider, either `file` or `s3`.

  - name: NIFI_REGISTRY_s3_bucket_name
    default: ""
    since: "1.16.0"
    description: >
      The bucket name if the `s3` bundle persistence provider is selected.

  - name: NIFI_REGISTRY_s3_key_prefix
    default: ""
    since: "1.16.0"
    description: >
      The key prefix that will be added to all S3 keys, if the `s3` bundle
      persistence provider is selected.

  - name: NIFI_TOOLKIT_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Apache NiFi Toolkit service

  - name: NIFI_TOOLKIT_major_version
    default: "false"
    since: "1.17.0"
    description: >
      Which major version of NiFI Toolkit to use, one of `1` or `2`. The exact
      version can then be specified using either the `NIFI_TOOLKIT_1_version` or
      `NIFI_TOOLKIT_2_version` setting.
