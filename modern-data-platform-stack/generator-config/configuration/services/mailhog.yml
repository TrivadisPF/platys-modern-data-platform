name: MailHog
id: mailhog
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/blueimp/mailhog
  github: https://github.com/blueimp/mailhog

description: >
  Web and API based SMTP testing.

enable:
  platys_init: MAILHOG
  example: |
    platys init --enable-services MAILHOG
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28325>.

parameters:
  - name: MAILHOG_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate MailHog service

  - name: MAILHOG_smtp_port
    default: "25"
    since: "1.17.0"
    description: >
      Internal SMTP port to use.

  - name: MAILHOG_storage_type
    default: "memory"
    since: "1.17.0"
    description: >
      Set the message storage type to use, either `memory` or `maildir` or
      `mongodb`.

  - name: MAILHOG_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Map the `data` folder into the container. You also have to set the
      `MAILHOG_storage_type` to `maildir` for it to be effective.

  - name: MAILHOG_mongo_uri
    default: "mongo-1:27017"
    since: "1.17.0"
    description: >
      The host and port for the MongoDB message storage, if
      `MAILHOG_storage_type` is set to `mongodb`

  - name: MAILHOG_mongo_db
    default: "mailhog"
    since: "1.17.0"
    description: >
      The database name for the MongoDB message storage, if
      `MAILHOG_storage_type` is set to `mongodb`

  - name: MAILHOG_mongo_collection
    default: "messages"
    since: "1.17.0"
    description: >
      The collection name for the MongoDB message storage, if
      `MAILHOG_storage_type` is set to `mongodb`
