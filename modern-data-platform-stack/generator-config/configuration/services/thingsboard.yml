name: Thingsboard
id: thingsboard
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://thingsboard.io/
  documentation: https://thingsboard.io/docs/
  github: https://github.com/thingsboard/thingsboard

description: >
  ThingsBoard is an open-source IoT platform that enables rapid development,
  management, and scaling of IoT projects. Our goal is to provide the
  out-of-the-box IoT cloud or on-premises solution that will enable server-side
  infrastructure for your IoT applications.

enable:
  platys_init: THINGSBOARD
  example: |
    platys init --enable-services THINGSBOARD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28200>

parameters:
  - name: THINGSBOARD_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Thingsboard service

  - name: THINGSBOARD_volume_map_data
    default: "false"
    since: "1.11.0"
    description: >
      Volume map data folder into the Thingsboard service

  - name: THINGSBOARD_volume_map_log
    default: "false"
    since: "1.11.0"
    description: >
      Volume map log folder into the Thingsboard service
