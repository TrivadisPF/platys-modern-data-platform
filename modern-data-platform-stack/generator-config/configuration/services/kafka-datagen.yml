name: Kafka Datagen
id: kafka-datagen
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://hub.docker.com/r/spoud/kafka-datagen

description: >
  Kafka Datagen generates and produces Avro-encoded messages to Kafka topics
  using user-provided Avro schema files.

enable:
  platys_init: KAFKA
  example: |
    platys init --enable-services KAFKA
    platys gen

usage:
  - title: Usage
    content: |
      Place your Avro schema file under `conf/kafka-datagen/` and reference
      it by filename in `KAFKA_DATAGEN_schema_file`.

parameters:
  - name: KAFKA_DATAGEN_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Kafka Datagen service

  - name: KAFKA_DATAGEN_topic
    default: ""
    since: "1.20.0"
    description: >
      Kafka topic to produce generated messages to

  - name: KAFKA_DATAGEN_format
    default: "json"
    since: "1.20.0"
    description: >
      Message format to produce; either json or avro (avro requires Schema Registry)

  - name: KAFKA_DATAGEN_schema_file
    default: ""
    since: "1.20.0"
    description: >
      Avro schema file name (placed under conf/kafka-datagen/)

  - name: KAFKA_DATAGEN_schema_keyfield
    default: ""
    since: "1.20.0"
    description: >
      Field in the schema to use as the Kafka message key

  - name: KAFKA_DATAGEN_quarkus_otel_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Enable OpenTelemetry tracing via Quarkus
