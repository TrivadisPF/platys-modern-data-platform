name: Kyuubi
id: kyuubi
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://kyuubi.apache.org/
  documentation: https://kyuubi.readthedocs.io
  github: https://github.com/apache/kyuubi

description: >
  Apache Kyuubi is a distributed and multi-tenant gateway to provide serverless
  SQL on data warehouses and lakehouses.

enable:
  platys_init: KYUUBI
  example: |
    platys init --enable-services KYUUBI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:10099>.

parameters:
  - name: KYUUBI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Apache Kyuubi service

  - name: KYUUBI_frontend_protocols
    default: "'THRIFT_BINARY,THRIFT_HTTP,REST'"
    since: "1.18.0"
    description: >
      A comma-separated list of frontend protocols to enable, choose from
      `THRIFT_BINARY`, `THRIFT_HTTP`, `REST`, `MYSQL` and `TRINO`.

  - name: KYUUBI_engine_type
    default: "spark_sql"
    since: "1.18.0"
    description: >
      Which backend engine to use, either `spark_sql`, `trino`.

  - name: KYUUBI_use_local_spark
    default: "false"
    since: "1.18.0"
    description: >
      Enable local spark environment within the Kyuubi Server.

  - name: KYUUBI_local_spark_catalog
    default: ""
    since: "1.18.0"
    description: >
      the catalog to use for Spark, either `in-memory` or `hive`.

  - name: KYUUBI_local_spark_jars_repositories
    default: ""
    since: "1.18.0"
    description: >
      Comma-separated list of additional remote repositories to search for the
      maven coordinates given with `--packages` or `spark.jars.packages`
      (`spark.jars.repositories` runtime environment setting)

  - name: KYUUBI_local_spark_jars
    default: ""
    since: "1.18.0"
    description: >
      Comma-separated list of jars to include on the driver and executor
      classpath. Globs are allowed.

  - name: KYUUBI_local_spark_jars_packages
    default: ""
    since: "1.18.0"
    description: >
      Comma-separated list of Maven coordinates of jars to include on the driver
      and executor classpath (will be added to the `spark.jars.packages` runtime
      environment setting). The transitive dependencies are downloaded
      automatically.

  - name: KYUUBI_local_spark_install_jars_packages
    default: ""
    since: "1.18.0"
    description: >
      Comma-separated list of Maven coordinates of jars to install into
      `/spark/jars` when starting Spark. The Maven dependencies are downloaded
      without transitive dependencies. You have to manually assure, that
      transitive dependencies are included.

  - name: KYUUBI_local_spark_jars_excludes
    default: ""
    since: "1.18.0"
    description: >
      Comma-separated list of `groupId:artifactId`, to exclude while resolving
      the dependencies provided in `spark.jars.packages` to avoid dependency
      conflicts.

  - name: KYUUBI_local_spark_jars_ivySettings
    default: ""
    since: "1.18.0"
    description: >
      Path to an Ivy settings file to customize resolution of jars specified
      using spark.jars.packages instead of the built-in defaults, such as maven
      central (`spark.jars.ivysettings` runtime environment setting)

  - name: KYUUBI_local_spark_sql_warehouse_dir
    default: "''"
    since: "1.18.0"
    description: >
      A string specifying the default Spark SQL Hive Warehouse location
      (`spark.sql.warehouse.dir` runtime environment setting). If left empty,
      then if defaults to `hdfs://namenode:9000/user/hive/warehouse` if using
      HDFS, `s3a://admin-bucket/hive/warehouse` if using S3 and
      `file:///hive/warehouse` if none of the two.
