name: MySQL
id: mysql
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.mysql.com/
  documentation: https://dev.mysql.com/doc/
  github: https://github.com/mysql

description: >
  MySQL Server, the world's most popular open source database, and MySQL
  Cluster, a real-time, open source transactional database.

enable:
  platys_init: MYSQL
  example: |
    platys init --enable-services MYSQL
    platys gen

usage:
  - title: Connect to MySQL
    content: |
      docker exec mysql /usr/bin/mysqldump -u root --password=root DATABASE > backup.sql
      cat backup.sql | docker exec -i mysql /usr/bin/mysql -u root --password=root DATABASE

parameters:
  - name: MYSQL_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate MySQL service

  - name: MYSQL_database
    default: "sample"
    since: "1.16.0"
    description: >
      the name of the MYSQL database

  - name: MYSQL_user
    default: "sample"
    since: "1.16.0"
    description: >
      the name of the MYSQL user

  - name: MYSQL_password
    default: "sample"
    since: "1.16.0"
    sensitive: true
    description: >
      the MYSQL user password
