name: Zammad
id: zammad
category:
  id: 99_other
  name: other
  color: gray
arch: [x86-64, arm]

links:
  website: https://zammad.org/
  documentation: https://docs.zammad.org/
  github: https://github.com/zammad/zammad

description: >
  Open source customer support and helpdesk ticketing system. Zammad provides a
  unified interface for managing customer communications across email, chat,
  phone, and social media, with a full-featured REST API and extensive
  reporting.

enable:
  platys_init: ZAMMAD
  example: |
    platys init --enable-services ZAMMAD
    platys gen

usage:
  - title: Connect to Zammad
    content: |
      Navigate to <http://dataplatform:28460>

parameters:
  - name: ZAMMAD_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Zammad services (nginx, railsserver, scheduler, websocket, backup,
      init, elasticsearch, memcached, postgresql, redis)

  - name: ZAMMAD_backup_enabled
    default: "false"
    since: "1.21.0"
    description: >
      Enable the `zammad-backup` container that runs scheduled database and
      storage backups. Set to `false` to skip the backup service.

  - name: ZAMMAD_db_name
    default: "zammad_production"
    since: "1.21.0"
    description: >
      Name of the PostgreSQL database for Zammad.

  - name: ZAMMAD_db_user
    default: "zammad"
    since: "1.21.0"
    description: >
      PostgreSQL user for Zammad.

  - name: ZAMMAD_db_password
    default: "zammad"
    since: "1.21.0"
    sensitive: true
    description: >
      PostgreSQL password for Zammad.
