name: Apache Tika (Server)
id: tika
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://tika.apache.org/
  documentation: https://tika.apache.org/2.2.1/index.html
  github: https://github.com/apache/tika

description: >
  The Apache Tika toolkit detects and extracts metadata and text from over a
  thousand different file types (such as PPT, XLS, and PDF).

enable:
  platys_init: TIKA
  example: |
    platys init --enable-services TIKA
    platys gen

parameters:
  - name: TIKA_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Apache Tika Server

  - name: TIKA_edition
    default: "minimal"
    since: "1.13.0"
    description: >
      either `minimal` which contains only Apache Tika and it's core dependencies
      or `full`, which also includes dependencies for the GDAL and Tesseract OCR
      parsers
