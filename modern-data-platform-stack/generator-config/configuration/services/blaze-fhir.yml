name: Blaze FHIR Server
id: blaze-fhir
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://samply.github.io/blaze/
  documentation: https://samply.github.io/blaze/README.html
  github: https://github.com/samply/blaze

description: >
  A FHIR® Server with internal, fast CQL Evaluation Engine.

enable:
  platys_init: BLAZE_FHIR
  example: |
    platys init --enable-services BLAZE_FHIR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28331>.

parameters:
  - name: BLAZE_FHIR_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Blaze FHIR server service
