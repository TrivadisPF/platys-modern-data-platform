name: Firefox
id: firefox
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.mozilla.org/en-US/firefox/new/
  documentation: https://www.mozilla.org/en-US/firefox/new/

description: >
  Firefox running as a Docker container.

enable:
  platys_init: FIREFOX
  example: |
    platys init --enable-services FIREFOX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5801>

parameters:
  - name: FIREFOX_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Firefox Browser service

  - name: FIREFOX_use_port_80
    default: "false"
    since: "1.13.0"
    description: >
      Run Firefox on Port 80 if `true` (in that case `markdown-viewer` will run
      on port `8000`).
