name: QuestDB
id: questdb
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://questdb.io/
  documentation: https://questdb.io/docs/introduction/
  github: https://github.com/questdb/questdb

description: >
  QuestDB is a relational column-oriented database designed for time series and
  event data. It uses SQL with extensions for time series to assist with
  real-time analytics. These pages cover core concepts of QuestDB, including
  setup steps, usage guides, and reference documentation for syntax, APIs and
  configuration.

enable:
  platys_init: QUESTDB
  example: |
    platys init --enable-services QUESTDB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28226>

parameters:
  - name: QUESTDB_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate QuestDB service

  - name: QUESTDB_volume_map_data
    default: "false"
    since: "1.12.0"
    description: >
      Volume map data folder into the QuestDB service
