name: "Oracle Database Free (OCI - gvenzl edition)"
id: oracle-oci-free
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.oracle.com/database/free/
  documentation: https://www.oracle.com/database/free/get-started/

description: >
  Oracle Database 23c Free—Developer Release is the same, powerful Oracle
  Database that businesses throughout the world rely on. It offers a
  full-featured experience and is packaged for ease of use and simple
  download—for free.

enable:
  platys_init: ORACLE_OCI_FREE
  example: |
    platys init --enable-services ORACLE_OCI_FREE
    platys gen

usage:
  - title: Connect through SQL Plus
    content: |
      ```
      docker exec -ti oracledb-oci-free sqlplus "user1/abc123!"@//localhost/FREEPDB1
      ```
  - title: Connect through JDBC
    content: |
      * **JDBC Url:**  	`jdbc:oracle:thin:@dataplatform:1523/FREEPDB1`
      * **JDBC Driver Class Name:** 	`oracle.jdbc.driver.OracleDriver`

parameters:
  - name: ORACLE_OCI_FREE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Oracle Database Free service.

  - name: ORACLE_OCI_FREE_flavour
    default: "regular"
    since: "1.18.0"
    description: >
      The image flavour to use, one of `regular`, `slim` or `full`

  - name: ORACLE_OCI_FREE_use_faststart
    default: "false"
    since: "1.18.0"
    description: >
      Use Expanded and ready to go database inside the image? Trades image size
      on disk for faster startup time

  - name: ORACLE_OCI_FREE_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into the Oracle service

  - name: ORACLE_OCI_FREE_database
    default: ""
    since: "1.18.0"
    description: >
      Set this variable to a non-empty string to create a new pluggable database
      with the name specified in this variable.

  - name: ORACLE_OCI_FREE_password
    default: "EAo4KsTfRR"
    since: "1.18.0"
    sensitive: true
    description: >
      The password to use for the `SYS` and `SYSTEM` user.

  - name: ORACLE_OCI_FREE_random_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      Set this variable to a non-empty value, like yes, to generate a random
      initial password for the `SYS` and `SYSTEM` users. The generated password
      will be printed to stdout (`ORACLE PASSWORD FOR SYS AND SYSTEM: ...`).

  - name: ORACLE_OCI_FREE_characterset
    default: "AL32UTF8"
    since: "1.18.0"
    description: >
      The character set to use when creating the database.

  - name: ORACLE_OCI_FREE_app_user
    default: ""
    since: "1.18.0"
    description: >
      Set this parameter to a non-empty string to create a new database schema
      user with the name specified in this variable. The user will be created in
      the default FREEPDB1 pluggable database. If `ORACLE_OCI_FREE_database` has
      been specified, the user will also be created in that pluggable database.

  - name: ORACLE_OCI_FREE_app_user_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      Set this variable to a non-empty string to define a password for the
      database schema user specified by `ORACLE_OCI_FREE_app_user`.
