name: FHIR Gateway
id: fhir-gateway
category:
  id: 21_healthcare
  name: healthcare
  color: white
arch: [x86-64]

links:
  documentation: https://github.com/miracum/fhir-gateway
  github: https://github.com/miracum/fhir-gateway

description: >
  A thin layer between FHIR REST clients and resource processing pipelines.

enable:
  platys_init: FHIR_GATEWAY
  example: |
    platys init --enable-services FHIR_GATEWAY
    platys gen

parameters:
  - name: FHIR_GATEWAY_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Miracum FHIR Gateway service

  - name: FHIR_GATEWAY_fhir_server_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Whether to send received resources to a downstream FHIR server.

  - name: FHIR_GATEWAY_fhir_server_url
    default: "http://hapi-server:8080/fhir"
    since: "1.17.0"
    description: >
      URL of the FHIR server to send data to.

  - name: FHIR_GATEWAY_fhir_server_username
    default: ""
    since: "1.17.0"
    description: >
      HTTP basic auth username of the FHIR server to send data to.

  - name: FHIR_GATEWAY_fhir_server_password
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      HTTP basic auth password of the FHIR server to send data to.

  - name: FHIR_GATEWAY_postgresql_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Persists any received FHIR resource in a PostgreSQL database?

  - name: FHIR_GATEWAY_kafka_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enable reading FHIR resources from, and writing them back to a Kafka
      clusters.

  - name: FHIR_GATEWAY_pseudonymizer_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Whether pseudonymization should be enabled.
