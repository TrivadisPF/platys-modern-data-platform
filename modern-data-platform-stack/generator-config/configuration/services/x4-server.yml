name: Softproject S4 Server
id: x4-server
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.softproject.de
  documentation: https://www.softproject.de/de/x4-community/dokumentation/

description: >
  X4 BPMS as a central digitization platform allows you to digitize your
  business processes on a business and technical level. Connect people, systems
  and devices and thus eliminate manual processes and media breaks! Due to the
  low-code principle, users can use the X4 BPMS to independently digitize
  processes without deeper programming knowledge.

enable:
  platys_init: S4_SERVER
  example: |
    platys init --enable-services S4_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28361>.

parameters:
  - name: X4_SERVER_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate X4 Server service

  - name: X4_SERVER_db_type
    default: "h2"
    since: "1.17.0"
    description: >
      database type to use, either 'h2' or 'postgres' or 'mssql'

  - name: IOEVENT_COCKPIT_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate IOEvent Cockpit service
