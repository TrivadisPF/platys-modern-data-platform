name: HStreamDB
id: hstreamdb
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://hstream.io/
  documentation: https://docs.hstream.io/
  github: https://github.com/hstreamdb/hstream

description: >
  HStreamDB is an open-source, cloud-native streaming database for IoT and
  beyond. Modernize your data stack for real-time applications.

enable:
  platys_init: ZOOKEEPER,
  example: |
    platys init --enable-services ZOOKEEPER,
    platys gen

usage:
  - title: Usage
    content: |
      Connect to the CLI
      
      ```
      docker run -it --rm --name some-hstream-cli --network host hstreamdb/hstream:latest hstream --port 6570 sql
      ```

parameters:
  - name: HSTREAMDB_enable
    default: "false"
    since: "1.17.0"
    description: >
      Enable HStreamDB streaming database for real-time applications.
