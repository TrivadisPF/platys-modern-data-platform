name: Apache Superset
id: superset
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://superset.apache.org/
  documentation: https://superset.apache.org/docs/intro
  github: https://github.com/apache/superset

description: >
  Apache Superset is a modern data exploration and visualization platform.

enable:
  platys_init: SUPERSET
  example: |
    platys init --enable-services SUPERSET
    platys gen

usage:
  - title: Connect to Apache Superset
    content: |
      Navigate to <http://${PUBLIC_IP}:28151>

parameters:
  - name: SUPERSET_enable
    default: "false"
    since: "1.4.0"
    description: >
      Generate Superset service

  - name: SUPERSET_provision_example
    default: "false"
    since: "1.11.0"
    description: >
      Provision Superset examples?

  - name: SUPERSET_volume_map_superset_home
    default: "false"
    since: "1.21.0"
    description: >
      Map the Superset home directory (`/app/superset_home`) to
      `./container-volume/superset` on the host for persistent storage.

  - name: SUPERSET_admin_password
    default: "abc123!"
    since: "1.21.0"
    sensitive: true
    description: >
      Password for the default Superset admin user created on first start.
