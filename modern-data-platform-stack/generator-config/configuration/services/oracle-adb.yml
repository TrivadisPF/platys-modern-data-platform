name: Oracle Autonomous Database Free
id: oracle-adb
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.oracle.com/autonomous-database/
  documentation: https://www.oracle.com/autonomous-database/get-started/
  github: https://github.com/oracle/adb-free

description: >
  Oracle Autonomous Database is a cloud-based database service that uses
  machine learning to automate database management tasks like patching, tuning,
  backups, and scaling, eliminating the need for manual intervention. It comes
  in two main flavors: Autonomous Data Warehouse (ADW) for analytics and
  Autonomous Transaction Processing (ATP) for transactional and mixed
  workloads.

enable:
  platys_init: ORACLE_ADB_FREE
  example: |
    platys init --enable-services ORACLE_ADB_FREE
    platys gen

usage:
  - title: Connect through SQL Plus
    content: |
      ```
      alias adb-cli="docker exec oarcle-adb adb-cli"
      ```
  - title: Connect through JDBC
    content: |
      * **JDBC Url:**  	`jdbc:oracle:thin:@dataplatform:1525/ATP`
      * **JDBC Driver Class Name:** 	`oracle.jdbc.driver.OracleDriver`

parameters:
  - name: ORACLE_ADB_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Oracle Autonomous Database Free.
