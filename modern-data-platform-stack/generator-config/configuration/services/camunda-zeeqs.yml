name: "ZeeQS - Zeebe Query Service"
id: camunda-zeeqs
category:
  id: 18_orchestration
  name: orchestration
  color: indigo
arch: [x86-64]

links:
  documentation: https://github.com/camunda-community-hub/zeeqs
  github: https://github.com/camunda-community-hub/zeeqs

description: >
  A Zeebe community extension that provides a GraphQL query API over Zeebe's
  data. The data is imported from the broker using an exporter (e.g. Hazelcast,
  Elasticsearch) and aggregated in the service.

enable:
  platys_init: CAMUNDA_ZEEQS
  example: |
    platys init --enable-services CAMUNDA_ZEEQS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28208/graphiql>.

parameters:
  - name: CAMUNDA_ZEEQS_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate Camunda ZeeQS service
