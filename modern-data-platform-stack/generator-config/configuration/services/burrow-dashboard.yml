name: Burrow Dashboard
id: burrow-dashboard
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/joway/burrow-dashboard
  documentation: https://github.com/joway/burrow-dashboard
  github: https://github.com/joway/burrow-dashboard

description: >
  Kafka Dashboard for Burrow 1.0 API, monitor the topic info and consumer group
  offsets.

enable:
  platys_init: KAFKA,BURROW,BURROW_DASHBOARD
  example: |
    platys init --enable-services KAFKA,BURROW,BURROW_DASHBOARD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28259>

parameters:
  - name: BURROW_DASHBOARD_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Burrow Dashboard.
