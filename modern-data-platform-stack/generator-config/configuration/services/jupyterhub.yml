name: JupyterHub
id: jupyterhub
category:
  id: 13_science
  name: science
  color: violet
arch: [x86-64]

links:
  website: https://jupyterhub.readthedocs.io/en/stable/
  documentation: https://jupyterhub.readthedocs.io/en/stable/
  github: https://github.com/jupyterhub/jupyterhub

description: >
  ```bash platys init --enable-services JUPYTERHUB platys gen ```

enable:
  platys_init: JUPYTERHUB
  example: |
    platys init --enable-services JUPYTERHUB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28284>. 
      
      By default the user `jupyterhub` with password `abc123!` (if not changed in `JUPYTERHUB_global_password`) can be used to log into JupyterHub.

parameters:
  - name: JUPYTERHUB_enable
    default: "false"
    since: "1.16.0"
    description: >
      Enable JupyterHub service.

  - name: JUPYTERHUB_python_packages
    default: ""
    since: "1.16.0"
    description: >
      Python packages to install, as a space separated list of packages: ` `

  - name: JUPYTERHUB_authenticator_class
    default: "jupyterhub.auth.DummyAuthenticator"
    since: "1.16.0"
    description: >
      The Authenticator class to use for JupyterHub.

  - name: JUPYTERHUB_use_custom_userlist
    default: "false"
    since: "1.16.0"
    description: >
      Use a custom `userlist` file from `custom-conf/jupyterhub` for configuring
      users for JupyterHub. If set to `false` a `userlist` file with just the
      user `jupyterhub` is used.

  - name: JUPYTERHUB_global_password
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      The global password to use for all the users added through the `userlist`
      file.

  - name: JUPYTERHUB_global_password
    default: "false"
    since: "1.16.0"
    sensitive: true
    description: >
      Use Postgresql database to store the data of JupyterHub.

  - name: JUPYTERHUB_postgres_host
    default: "postgresql"
    since: "1.16.0"
    description: >
      Hostname of the Postgresql database.

  - name: JUPYTERHUB_postgres_db
    default: "postgres"
    since: "1.16.0"
    description: >
      Database name of the Postgresql database.

  - name: JUPYTERHUB_postgres_username
    default: "postgres"
    since: "1.16.0"
    description: >
      Username of the Postgresql database.

  - name: JUPYTERHUB_postgres_password
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      Password of the Postgresql database.
