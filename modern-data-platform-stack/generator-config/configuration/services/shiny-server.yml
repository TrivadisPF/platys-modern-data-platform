name: Shiny
id: shiny
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://shiny.rstudio.com/
  documentation: https://shiny.rstudio.com/
  github: https://github.com/rstudio/shiny

description: >
  Shiny is an R package that makes it easy to build interactive web apps
  straight from R. You can host standalone apps on a webpage or embed them in R
  Markdown documents or build dashboards. You can also extend your Shiny apps
  with CSS themes, htmlwidgets, and JavaScript actions.

enable:
  platys_init: SHINY_SERVER
  example: |
    platys init --enable-services SHINY_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3838>

parameters:
  - name: SHINY_SERVER_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Shiny Server service

  - name: SHINY_SERVER_edition
    default: "base"
    since: "1.13.0"
    description: >
      Select the Shiny Server edition: `base` or `verser`

  - name: SHINY_SERVER_volume_map_apps
    default: "false"
    since: "1.13.0"
    description: >
      Volume map `apps` folder into the Shiny Server service.
