name: Cruise Control
id: cruise-control
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  documentation: https://github.com/linkedin/cruise-control/wiki
  github: https://github.com/linkedin/cruise-control

description: >
  Cruise-control is the first of its kind to fully automate the dynamic
  workload rebalance and self-healing of a Kafka cluster. It provides great
  value to Kafka users by simplifying the operation of Kafka clusters.

enable:
  platys_init: KAFKA
  example: |
    platys init --enable-services KAFKA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28292>

parameters:
  - name: CRUISE_CONTROL_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Cruise Control.
