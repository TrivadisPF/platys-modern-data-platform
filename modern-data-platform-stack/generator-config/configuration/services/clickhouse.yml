name: ClickHouse
id: clickhouse
category:
  id: 11_query
  name: query
  color: teal
arch: [x86-64]

links:
  website: https://clickhouse.com/
  documentation: https://clickhouse.com/docs
  github: https://github.com/ClickHouse/ClickHouse

description: >
  ClickHouse® is a real-time analytics database management system

enable:
  platys_init: CLICKHOUSE
  example: |
    platys init --enable-services CLICKHOUSE
    platys gen

parameters:
  - name: CLICKHOUSE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate ClickHouse service

  - name: CLICKHOUSE_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into the Clickhouse service.

  - name: CLICKHOUSE_db_name
    default: "clickhouse"
    since: "1.18.0"
    description: >
      Clickhouse database name.

  - name: CLICKHOUSE_username
    default: "clickhouse"
    since: "1.18.0"
    description: >
      Clickhouse user name.

  - name: CLICKHOUSE_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      Password of the Clickhouse user.SQLFLOW
