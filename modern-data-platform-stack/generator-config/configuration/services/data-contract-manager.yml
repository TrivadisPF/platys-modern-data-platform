name: Data Contract Manager
id: data-contract-manager
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.datacontract-manager.com/
  documentation: https://docs.datacontract-manager.com/
  github: https://github.com/datacontract-manager

description: >
  Data Contract Manager (Community Edition).

enable:
  platys_init: DATA_CONTRACT_MANAGER
  example: |
    platys init --enable-services DATA_CONTRACT_MANAGER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28382>.

parameters:
  - name: DATA_CONTRACT_MANAGER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Data Contract Manager service

  - name: DATA_CONTRACT_MANAGER_postgres_username
    default: "postgres"
    since: "1.18.0"
    description: >
      Username of the Postgresql instance.

  - name: DATA_CONTRACT_MANAGER_postgres_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      Password of the Postgresql instance.

  - name: DATA_CONTRACT_MANAGER_mail_host
    default: "mailhog"
    since: "1.18.0"
    description: >
      A hostname (w/o port!) where to reach a Mail Server.

  - name: DATA_CONTRACT_MANAGER_mail_port
    default: "25"
    since: "1.18.0"
    description: >
      The port number where to reach the Mail Server.
