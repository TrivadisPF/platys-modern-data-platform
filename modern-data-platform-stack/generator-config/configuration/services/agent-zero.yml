name: Agent Zero
id: agent-zero
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/frdel/agent-zero
  documentation: https://github.com/frdel/agent-zero/blob/main/docs/README.md
  github: https://github.com/frdel/agent-zero

description: >
  A personal, organic agentic framework that grows and learns with you.

enable:
  platys_init: AGENT_ZERO
  example: |
    platys init --enable-services AGENT_ZERO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28418>.

parameters:
  - name: AGENT_ZERO_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Agent Zero service

  - name: AGENT_ZERO_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data folder into Agent Zero.
