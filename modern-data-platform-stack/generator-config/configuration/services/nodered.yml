name: "Node-RED"
id: nodered
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64, arm]

links:
  website: https://nodered.org/
  documentation: https://nodered.org/docs/
  github: https://github.com/node-red

description: >
  Node-RED is a programming tool for wiring together hardware devices, APIs and
  online services in new and interesting ways.

enable:
  platys_init: NODERED
  example: |
    platys init --enable-services NODERED
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:1880>

parameters:
  - name: NODERED_enable
    default: "false"
    since: "1.1.0"
    description: >
      Generate Node-RED service

  - name: NODERED_volume_map_data
    default: "false"
    since: "1.1.0"
    description: >
      Volume map data folder into the Node-RED service
