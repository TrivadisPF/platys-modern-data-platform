name: Conduktor Platform
id: conduktor-platform
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.conduktor.io/get-started
  documentation: https://github.com/conduktor/conduktor-platform/tree/main/doc
  github: https://github.com/conduktor/conduktor-platform

description: >
  The Apache Kafka Operations Platform.

enable:
  platys_init: KAFKA,CONDUKTOR_PLATFORM
  example: |
    platys init --enable-services KAFKA,CONDUKTOR_PLATFORM
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28285>.
      
      Login with the credentials configured in `config.yml` (defaults to `admin`/`abc123!`).

parameters:
  - name: CONDUKTOR_PLATFORM_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Conduktor Platform service

  - name: CONDUKTOR_PLATFORM_license_key
    default: ""
    since: "1.16.0"
    description: >
      the Conduktor license key for the Enterprise plan. Leave empty for the free
      plan.

  - name: CONDUKTOR_PLATFORM_organisation_name
    default: "default"
    since: "1.16.0"
    description: >
      The name of the organisation.

  - name: CONDUKTOR_PLATFORM_admin_email
    default: "admin@platys.io"
    since: "1.16.0"
    description: >
      Admin user name (either a username or an email address).

  - name: CONDUKTOR_PLATFORM_admin_psw
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      Admin user password.

  - name: CONDUKTOR_PLATFORM_use_external_postgres
    default: "false"
    since: "1.16.0"
    description: >
      Use external Postgresql database instance for the Conduktor metadata.

  - name: CONDUKTOR_PLATFORM_postgres_host
    default: "postgresql"
    since: "1.16.0"
    description: >
      Hostname of the Postgresql instance, applicable if
      `CONDUKTOR_PLATFORM_use_external_postgres` is set to `true`.

  - name: CONDUKTOR_PLATFORM_postgres_port
    default: "5432"
    since: "1.16.0"
    description: >
      Port of the Postgresql instance, applicable if
      `CONDUKTOR_PLATFORM_use_external_postgres` is set to `true`.

  - name: CONDUKTOR_PLATFORM_postgres_db
    default: "postgres"
    since: "1.16.0"
    description: >
      Database name of the Postgresql instance, applicable if
      `CONDUKTOR_PLATFORM_use_external_postgres` is set to `true`.

  - name: CONDUKTOR_PLATFORM_postgres_username
    default: "postgres"
    since: "1.16.0"
    description: >
      Username of the Postgresql instance, applicable if
      `CONDUKTOR_PLATFORM_use_external_postgres` is set to `true`.

  - name: CONDUKTOR_PLATFORM_postgres_password
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      Password of the Postgresql instance, applicable if
      `CONDUKTOR_PLATFORM_use_external_postgres` is set to `true`.
