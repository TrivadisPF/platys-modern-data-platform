name: Apache Airflow
id: airflow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://airflow.apache.org/
  documentation: https://airflow.apache.org/docs/
  github: https://github.com/apache/airflow

description: >
  Airflow is a platform created by the community to programmatically author,
  schedule and monitor workflows.

enable:
  platys_init: AIRFLOW
  example: |
    platys init --enable-services AIRFLOW
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28139>.
      Login with user `airflow` and password `abc123!`.
      
      Place the dag files into the folder `./scripts/airflow/dags`.

parameters:
  - name: AIRFLOW_enable
    default: "false"
    since: "1.3.0"
    description: >
      Generate Airflow services (Web, Scheduler & Postgresql DB)

  - name: AIRFLOW_major_version
    default: "2"
    since: "1.19.0"
    description: >
      Which major version of Airflow to use, `2` or `3`.

  - name: AIRFLOW_custom_image_name
    default: ""
    since: "1.18.0"
    description: >
      Use a custom image name for the airflow service. If you want to specify the
      version, overwrite the `AIRFLOW_version` property.

  - name: AIRFLOW_executor
    default: "local"
    since: "1.12.0"
    description: >
      The Airflow executor to use, either `local`, `sequential` or `celery`

  - name: AIRFLOW_workers
    default: "1"
    since: "1.16.0"
    description: >
      number of Airflow Worker nodes, if `AIRFLOW_executor` is set to `celery`.

  - name: AIRFLOW_admin_username
    default: "airflow"
    since: "1.16.0"
    description: >
      Username of the user with admin role

  - name: AIRFLOW_admin_password
    default: "airflow"
    since: "1.16.0"
    sensitive: true
    description: >
      Password of the user with admin role

  - name: AIRFLOW_fernet_key
    default: "E4H9MUpUWhztG-eO3UTz1YdZt9fRSq5R10eUTPSt8AE="
    since: "1.19.0"
    sensitive: true
    description: >
      The fernet key to use to encrypt passwords in the connection configuration
      and the variable configuration. It guarantees that a password encrypted
      using it cannot be manipulated or read without the key. Fernet is an
      implementation of symmetric (also known as “secret key”) authenticated
      cryptography. To generate a value, use the following command: `python -c
      'from cryptography.fernet import Fernet;
      print(Fernet.generate_key().decode())'`

  - name: AIRFLOW_secret_key
    default: "037223d1eda59bb91822f6ea04e892f0"
    since: "1.19.0"
    sensitive: true
    description: >
      The secret key to use for the webserver. You can generate a key using the
      following command: `openssl rand -base64 32`

  - name: AIRFLOW_jwt_secret
    default: "jUnJ/Vt17d04x0UqHRMRGg=="
    since: "1.19.0"
    sensitive: true
    description: >
      Secret key used to encode and decode JWTs to authenticate to public and
      private APIs. You can generate a key using the following command: `openssl
      rand -base64 16`

  - name: AIRFLOW_volume_map_logs
    default: "false"
    since: "1.16.0"
    description: >
      Volume map logs folder into the Airflow service

  - name: AIRFLOW_volume_map_docker_daemon
    default: "false"
    since: "1.17.0"
    description: >
      Volume map docker daemon folder into the Airflow service. If enabled, the
      `DOCKER_GROUP` environment variable, referenced from the `group_add`
      section, has to be set: `DOCKER_GROUP=$(getent group docker | cut -d: -f3)`
      (you can use the `.env` file for that).

  - name: AIRFLOW_provision_examples
    default: "false"
    since: "1.3.0"
    description: >
      Provision Airflow examples?

  - name: AIRFLOW_additional_requirements
    default: ""
    since: "1.16.0"
    description: >
      Additional PIP requirements to add when starting the Airflow container.

  - name: AIRFLOW_auth_backends
    default: "airflow.api.auth.backend.session"
    since: "1.17.0"
    description: >
      Comma separated list of auth backends to authenticate users against airflow
      and the REST API. Only valid for Airflow `2.x`.

  - name: AIRFLOW_auth_manager
    default: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    since: "1.19.0"
    description: >
      The auth manager class that airflow should use. Full import path to the
      auth manager class. Only valid for Airflow >= `3.x`.

  - name: AIRFLOW_dag_dir_list_interval
    default: "300"
    since: "1.16.0"
    description: >
      How often (in seconds) to scan the DAGs directory for new files. Default to
      5 minutes.

  - name: AIRFLOW_dags_paused_at_creation
    default: "true"
    since: "1.16.0"
    description: >
      Are DAGs paused by default at creation?

  - name: AIRFLOW_expose_config
    default: "false"
    since: "1.19.0"
    description: >
      Expose the configuration file in the web server. Set to
      `non-sensitive-only` to show all values except those that have security
      implications. `True` shows all values. `False` hides the configuration
      completely.

  - name: AIRFLOW_show_test_connection
    default: "Disabled"
    since: "1.19.0"
    description: >
      The ability to allow testing connections across Airflow UI, API and CLI.
      Supported options: `Disabled`, `Enabled` or `Hidden`.

  - name: AIRFLOW_logging_level
    default: "INFO"
    since: "1.19.0"
    description: >
      The logging level for Airflow, either `CRITICAL`, `ERROR`, `WARNING`,
      `INFO` or `DEBUG`

  - name: AIRFLOW_python_version
    default: "3.8"
    since: "1.16.0"
    description: >
      The python version to use inside the Airflow containers.

  - name: AIRFLOW_use_slim
    default: "false"
    since: "1.16.0"
    description: >
      Use the slim docker image.

  - name: AIRFLOW_variables
    default: ""
    since: "1.17.0"
    description: >
      A comma-separated list of `VARIABLE_NAME=variable-value`, which will be
      added as `AIRFLOW_VAR_{VARIABLE_NAME}: variable-value` environment
      variables to `docker-compose.yml`.

  - name: AIRFLOW_connections
    default: ""
    since: "1.18.0"
    description: >
      A comma-separated list of connections in the form of
      `CONNECTION_NAME=connection-in-uri-format` (see URI-format), which will be
      added as `AIRFLOW_VAR_{CONNECTION_NAME}: value` environment variables to
      `docker-compose.yml`.

  - name: AIRFLOW_openlineage_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable OpenLineage support? Only applicable if `MARQUEZ_enable` is set to
      true.
