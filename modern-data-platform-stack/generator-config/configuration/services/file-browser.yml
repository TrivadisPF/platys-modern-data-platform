name: File Browser
id: filebrowser
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://filebrowser.org/
  github: https://github.com/filebrowser/filebrowser

description: >
  A Web-based File Browser.

enable:
  platys_init: FILE_BROWSER
  example: |
    platys init --enable-services FILE_BROWSER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28178> and login with the default user `admin` and password `abc123!`.
  - title: Changing password
    content: |
      Add to `config.yml`
      
      ```
      FB_PASSWORD=<bcrypt-password>
      ```
      
      To encrypt the password, you can run `docker run -ti hurlenko/filebrowser hash <password>`.

parameters:
  - name: FILEBROWSER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable File Browser.
