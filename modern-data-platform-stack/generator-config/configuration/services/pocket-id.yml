name: Pocket ID
id: pocket-id
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://pocket-id.org/
  documentation: https://pocket-id.org/docs/
  github: https://github.com/pocket-id/pocket-id

description: >
  A simple and easy-to-use OIDC provider that allows users to authenticate with their passkeys.

enable:
  platys_init: POCKET_ID
  example: |
    platys init --enable-services POCKET_ID
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:1411> for the Pocket ID UI. Set `POCKET_ID_encryption_key` (`openssl rand -base64 32`) before starting.

parameters:
  - name: POCKET_ID_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Pocket ID service
  - name: POCKET_ID_app_url
    default: ""
    since: "1.21.0"
    description: >
      Public URL of Pocket ID as seen by the browser. If empty, `http://${PUBLIC_IP}:1411` is used
  - name: POCKET_ID_encryption_key
    default: "21TkfvLfjs7oZAr9ZMcAWh/kTrJkkoJ8B10hXADH9DM="
    since: "1.21.0"
    description: >
      Base64 encryption key (generate with `openssl rand -base64 32`)
  - name: POCKET_ID_trust_proxy
    default: "false"
    since: "1.21.0"
    description: >
      Set to `true` if running behind a reverse proxy
  - name: POCKET_ID_maxmind_license_key
    default: ""
    since: "1.21.0"
    description: >
      Optional MaxMind license key for GeoIP lookups
  - name: POCKET_ID_puid
    default: "1000"
    since: "1.21.0"
    description: >
      User ID the container runs as
  - name: POCKET_ID_pgid
    default: "1000"
    since: "1.21.0"
    description: >
      Group ID the container runs as
  - name: POCKET_ID_volume_map_data
    default: "false"
    since: "1.21.0"
    description: >
      Map the data folder (`/app/data`) to `./container-volume/pocket-id/data`
