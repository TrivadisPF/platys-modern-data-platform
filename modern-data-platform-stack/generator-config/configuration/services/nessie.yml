name: Project Nessie
id: nessie
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://projectnessie.org/
  documentation: https://projectnessie.org/features/
  github: https://github.com/projectnessie/nessie

description: >
  Transactional Catalog for Data Lakes with Git-like semantics.

enable:
  platys_init: NESSIE
  example: |
    platys init --enable-services NESSIE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:19120>.

parameters:
  - name: NESSIE_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Nessie service

  - name: NESSIE_store_type
    default: "in-memory"
    since: "1.16.0"
    description: >
      Storage adapter to use for Nessie, one of [`in-memory` or `postgresql` or
      `mysql` or `mongodb` or `cassandra` or `rocksdb`]. This controls where the
      underlying data will be stored.

  - name: NESSIE_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data of rocksdb? Only applicable if `NESSIE_store_type` is
      set to `rocksdb`.

  - name: NESSIE_warehouse_location
    default: "s3a://admin-bucket"
    since: "1.18.0"
    description: >
      Location of the warehouse. Used to determine the base location of a table.

  - name: NESSIE_cli_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Also generate the `nessie-cli` service.
