name: Postman
id: postman
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://www.postman.com/
  documentation: https://learning.postman.com/docs/getting-started/introduction/
  github: https://github.com/postmanlabs/postman-runtime

description: >
  Postman is an API platform for building and using APIs. Postman simplifies
  each step of the API lifecycle and streamlines collaboration so you can
  create better APIs—faster.

enable:
  platys_init: POSTMAN
  example: |
    platys init --enable-services POSTMAN
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3010>

parameters:
  - name: POSTMAN_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Postman service
