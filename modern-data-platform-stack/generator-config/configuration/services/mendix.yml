name: Mendix
id: mendix
category:
  id: 19_tools
  name: tools
  color: silver
arch: [x86-64]

links:
  website: https://www.mendix.com/
  documentation: https://docs.mendix.com/
  github: https://github.com/mendix/docker-mendix-buildpack

description: >
  Mendix is a low-code platform used by businesses to develop mobile & web apps
  at scale

enable:
  platys_init: MENDIX
  example: |
    platys init --enable-services MENDIX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28256>

parameters:
  - name: MENDIX_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Mendix.
