name: NocoDB
id: nocodb
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://nocodb.com/
  documentation: https://docs.nocodb.com/
  github: https://github.com/nocodb/nocodb

description: >
  Open Source Airtable Alternative - turns any MySQL, Postgres, SQLite into a
  Spreadsheet with REST APIs.

enable:
  platys_init: NOCODB
  example: |
    platys init --enable-services NOCODB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28276>

parameters:
  - name: NOCODB_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate NocoDB UI service

  - name: NOCODB_volume_map_data
    default: "false"
    since: "1.15.0"
    description: >
      Volume map data folder into the NocoDB service
