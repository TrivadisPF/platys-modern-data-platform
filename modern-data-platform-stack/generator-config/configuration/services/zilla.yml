name: Zilla
id: zilla
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://www.aklivity.io/
  documentation: https://docs.aklivity.io/zilla
  github: https://github.com/aklivity/zilla

description: >
  Zilla is open source software connecting web and mobile applications to
  event-driven microservices using standard protocols, such as HTTP,
  Server-Sent Events and Kafka.

enable:
  platys_init: ZILLA
  example: |
    platys init --enable-services ZILLA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28277>

parameters:
  - name: ZILLA_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Zilla service
