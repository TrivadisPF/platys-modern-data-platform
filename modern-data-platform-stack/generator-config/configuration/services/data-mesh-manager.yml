name: Data Mesh Manager
id: data-mesh-manager
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.datamesh-manager.com/
  documentation: https://docs.datamesh-manager.com/
  github: https://github.com/datamesh-manager/datamesh-manager-ce

description: >
  Data Mesh Manager (Community Edition).

enable:
  platys_init: DATA_MESH_MANAGER
  example: |
    platys init --enable-services DATA_MESH_MANAGER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28381>.

parameters:
  - name: DATA_MESH_MANAGER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Data Contract Manager service

  - name: DATA_MESH_MANAGER_postgres_username
    default: "postgres"
    since: "1.18.0"
    description: >
      Username of the Postgresql instance.

  - name: DATA_MESH_MANAGER_postgres_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      Password of the Postgresql instance.

  - name: DATA_MESH_MANAGER_mail_host
    default: "mailhog"
    since: "1.18.0"
    description: >
      A hostname (w/o port!) where to reach a Mail Server.

  - name: DATA_MESH_MANAGER_mail_port
    default: "25"
    since: "1.18.0"
    description: >
      The port number where to reach the Mail Server.
