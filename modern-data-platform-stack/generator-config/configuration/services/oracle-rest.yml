name: Oracle REST Data Services (ORDS)
id: oracle-rest
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.oracle.com/database/technologies/appdev/rest.html
  documentation: https://docs.oracle.com/en/database/oracle/oracle-rest-data-services/

description: >
  Oracle REST Data Services (ORDS) bridges HTTPS and your Oracle Database. A
  mid-tier Java application, ORDS provides a Database Management REST API, SQL
  Developer Web, a PL/SQL Gateway, SODA for REST, and the ability to publish
  RESTful Web Services for interacting with the data and stored procedures in
  your Oracle Database.

enable:
  platys_init: ORACLE_REST_DATA_SERVICE
  example: |
    platys init --enable-services ORACLE_REST_DATA_SERVICE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28252>

parameters:
  - name: ORACLE_REST_DATA_SERVICE_enable
    default: "false"
    since: "1.5.0"
    description: >
      Generate Oracle REST Data Service (ORDS)
