name: EHRBase
id: ehrbase
category:
  id: 21_healthcare
  name: healthcare
  color: white
arch: [x86-64]

links:
  website: http://ehrbase.org/
  documentation: https://docs.ehrbase.org/
  github: https://github.com/ehrbase/ehrbase/tree/develop

description: >
  An open source openEHR server.

enable:
  platys_init: EHRBASE
  example: |
    platys init --enable-services EHRBASE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28282>.

parameters:
  - name: EHRBASE_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate EHRBase service

  - name: EHBASE_volume_map_data
    default: "false"
    since: "1.19.0"
    description: >
      Volume map data folder into container.
