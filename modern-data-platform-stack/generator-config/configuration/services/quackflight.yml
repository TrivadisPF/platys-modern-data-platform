name: QuackFlight
id: quackflight
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/quackscience/quackflight
  github: https://github.com/quackscience/quackflight

description: >
  DuckDB API Server with Arrow Flight SQL Airport support and concurrent
  writes/reads (quackpipe).

enable:
  platys_init: QUACKFLIGHT
  example: |
    platys init --enable-services QUACKFLIGHT
    platys gen

usage:
  - title: Usage
    content: |
      Execute DuckDB queries using the HTTP POST/GET API (compatible with the ClickHouse HTTP API)
      
      ```bash
      curl -X POST "http://dataplatform:28445" \
         -H "Content-Type: application/json" \
         -d 'SELECT version()'  
      ```

parameters:
  - name: QUACKFLIGHT_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate QuackFlight service
