name: Chartboard
id: chartboard
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/the-maux/Chartboard
  documentation: https://github.com/the-maux/tipboard/wiki
  github: https://github.com/the-maux/Chartboard

description: >
  ``` platys init --enable-services CHARTBOARD platys gen ```

enable:
  platys_init: CHARTBOARD
  example: |
    platys init --enable-services CHARTBOARD
    platys gen

usage:
  - title: Connect to Chartboard
    content: |
      Navigate to <http://dataplatform:28173> to see the sample dashboard.
      docker exec -ti chartboard python src/manage.py sensors

parameters:
  - name: CHARTBOARD_enable
    default: "false"
    since: "1.8.0"
    description: >
      Generate Chartboard dashboard service

  - name: CHARTBOARD_volume_map_dashboards
    default: "false"
    since: "1.8.0"
    description: >
      Map `dashboards` folder into the container to add your own dashboards.
      Place the xxxx.yaml layout files in the `./scripts/chartboard` folder and
      it will be mapped to the right place.
