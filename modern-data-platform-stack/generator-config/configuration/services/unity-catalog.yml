name: Unity Catalog
id: unity-catalog
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.unitycatalog.io/
  documentation: https://docs.unitycatalog.io/
  github: https://github.com/unitycatalog/unitycatalog

description: >
  Open, Multi-modal Catalog for Data & AI.

enable:
  platys_init: UNITY_CATALOG
  example: |
    platys init --enable-services UNITY_CATALOG
    platys gen

usage:
  - title: Web UI
    content: |
      Navigate to <http://dataplatform:28393>.
  - title: Unity Catalog CLI
    content: |
      ```bash
      docker exec -ti unity-catalog bin/uc table list --catalog unity --schema default
      ```

parameters:
  - name: UNITY_CATALOG_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Unity Catalog service

  - name: UNITY_CATALOG_UI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Unity Catalog UI service
