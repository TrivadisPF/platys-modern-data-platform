name: Grafana
id: grafana
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://grafana.com/oss/grafana/
  documentation: https://grafana.com/grafana/
  github: https://github.com/grafana/grafana

description: >
  The open and composable observability and data visualization platform.
  Visualize metrics, logs, and traces from multiple sources like Prometheus,
  Loki, Elasticsearch, InfluxDB, Postgres and many more.

enable:
  platys_init: GRAFANA
  example: |
    platys init --enable-services GRAFANA
    platys gen

usage:
  - title: Connect to Grafana
    content: |
      Navigate to <http://dataplatform:3000>

parameters:
  - name: GRAFANA_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Grafana service

  - name: GRAFANA_feature_toggles
    default: ""
    since: "1.14.0"
    description: >
      Comma-separated list of preview features to enable, such as `tempoSearch`.
      Find avaialble features here.

  - name: GRAFANA_install_plugins
    default: "false"
    since: "1.0.0"
    description: >
      Comma-separated list of the plugins to have installed upon first start.

  - name: GRAFANA_auth_anonymous_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Allow Anonymus autthorization.

  - name: GRAFANA_provision_custom_dashboard_folder_names
    default: ""
    since: "1.20.0"
    description: >
      Comma-separated list of custom dashboard folders with dashboard json
      definitions to provision into Grafana.
