name: Apache Fluss
id: fluss
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://fluss.apache.org/
  documentation: https://fluss.apache.org/docs/
  github: https://github.com/apache/fluss

description: >
  Apache Fluss is a streaming storage built for real-time analytics.

enable:
  platys_init: FLUSS
  example: |
    platys init --enable-services FLUSS
    platys gen

parameters:
  - name: FLUSS_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Fluss service

  - name: FLUSS_tablet_servers
    default: "1"
    since: "1.19.0"
    description: >
      Number of tablet services to generate, must be at least `1`.
