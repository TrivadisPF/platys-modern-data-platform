name: Axon Server
id: axon-server
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://axoniq.io/product-overview/axon-server
  documentation: https://docs.axoniq.io/reference-guide/axon-server/introduction
  github: https://github.com/AxonIQ/axon-server-se

description: >
  Axon Server makes it significantly easier for the user to setup and maintain
  the environment. The Axon Server Standard edition is part of our Quick Start
  Package, Go to the Download section of our website to try it out for free.
  Axon Server Enterprise edition is our paid option for organizations ready to
  scale-up their projects offering more nodes and regions.

enable:
  platys_init: AXON
  example: |
    platys init --enable-services AXON
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8024>

parameters:
  - name: AXON_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Axon Server service
