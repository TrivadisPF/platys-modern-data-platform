name: Kafka WebView
id: kafka-webview
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  documentation: https://github.com/SourceLabOrg/kafka-webview
  github: https://github.com/SourceLabOrg/kafka-webview

description: >
  Full-featured web-based Apache Kafka consumer UI.

enable:
  platys_init: KAFKA_WEBVIEW
  example: |
    platys init --enable-services KAFKA_WEBVIEW
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28274>.

parameters:
  - name: KAFKA_WEBVIEW_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Kafka WebView.
