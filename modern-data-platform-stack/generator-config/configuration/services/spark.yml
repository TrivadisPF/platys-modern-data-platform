name: Apache Spark
id: spark
arch: [x86-64]

tags: []
dependencies: []
links:
  website: http://https://spark.apache.org/
  documentation: https://spark.apache.org/docs/latest/
  github: https://github.com/apache/spark

description: >
  Apache Spark - A unified analytics engine for large-scale data processing.

enable:
  platys_init: SPARK
  example: |
    platys init --enable-services SPARK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28304> to see the Spark Master UI.

parameters:
  - name: SPARK_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Spark services

  - name: SPARK_base_version
    default: "4.1"
    since: "1.21.0"
    allowed_values: ["4.1", "4.2", "4.0", "3.5", "3.4", "3.3"]
    description: >
      Which base version of Spark to use, one of `3.3` or `3.4` or `3.5` or `4.0` or `4.1` or `4.0`.
      Replaces `SPARK_major_version` from `1.15.0`.

  - name: SPARK_catalog
    default: "in-memory"
    since: "1.2.0"
    description: >
      the catalog to use for Spark, either use `in-memory` or `hive`.

  - name: SPARK_workers
    default: "2"
    since: "1.0.0"
    description: >
      number of Spark Worker nodes

  - name: SPARK_master_opts
    default: ""
    since: "1.10.0"
    description: >
      Configuration properties that apply only to the master in the form '-Dx=y'
      (default: none). See here list of possible options.

  - name: SPARK_worker_cores
    default: ""
    since: "1.10.0"
    description: >
      Total number of cores to allow Spark applications to use on the machine
      (default: all available cores).

  - name: SPARK_worker_memory
    default: ""
    since: "1.10.0"
    description: >
      Total amount of memory to allow Spark applications to use on the machine,
      e.g. 1000m, 2g (default: total memory minus 1 GiB); note that each
      application's individual memory is configured using its
      spark.executor.memory property.

  - name: SPARK_worker_opts
    default: "-Dspark.worker.cleanup.enabled=true"
    since: "1.10.0"
    description: >
      Configuration properties that apply only to the worker in the form '-Dx=y'
      (default: none). See here list of possible options.

  - name: SPARK_jars_repositories
    default: ""
    since: "1.6.0"
    description: >
      Comma-separated list of additional remote repositories to search for the
      maven coordinates given with `--packages` or `spark.jars.packages`
      (`spark.jars.repositories` runtime environment setting)

  - name: SPARK_jars
    default: ""
    since: "1.8.0"
    description: >
      Comma-separated list of jars to include on the driver and executor
      classpath. Globs are allowed.

  - name: SPARK_jars_packages
    default: ""
    since: "1.5.2"
    description: >
      Comma-separated list of Maven coordinates of jars to include on the driver
      and executor classpath (will be added to the `spark.jars.packages` runtime
      environment setting). The transitive dependencies are downloaded
      automatically.

  - name: SPARK_install_java_packages
    default: ""
    since: "1.20.0"
    description: >
      Comma-separated list of Maven coordinates of jars to install into
      `/spark/jars` when starting Spark. The Maven dependencies are downloaded
      without transitive dependencies. You have to manually assure, that
      transitive dependencies are included.

  - name: SPARK_install_python_packages
    default: ""
    since: "1.20.0"
    description: >
      Space-separated list of Python packages to install via `pip` when starting
      Spark (e.g. `numpy pandas scikit-learn`).

  - name: SPARK_jars_excludes
    default: ""
    since: "1.8.0"
    description: >
      Comma-separated list of `groupId:artifactId`, to exclude while resolving
      the dependencies provided in `spark.jars.packages` to avoid dependency
      conflicts.

  - name: SPARK_jars_ivySettings
    default: ""
    since: "1.5.2"
    description: >
      Path to an Ivy settings file to customize resolution of jars specified
      using spark.jars.packages instead of the built-in defaults, such as maven
      central (`spark.jars.ivysettings` runtime environment setting)

  - name: SPARK_driver_extraJavaOptions
    default: ""
    since: "1.5.2"
    description: >
      A string of extra JVM options to pass to the driver
      `spark.driver.extraJavaOptions` runtime environment setting

  - name: SPARK_executor_extraJavaOptions
    default: ""
    since: "1.5.2"
    description: >
      A string of extra JVM options to pass to the executor
      `spark.executor.extraJavaOptions` runtime environment setting

  - name: SPARK_sql_warehouse_dir
    default: "''"
    since: "1.16.0"
    description: >
      A string specifying the default Spark SQL Hive Warehouse location
      (`spark.sql.warehouse.dir` runtime environment setting). If left empty,
      then if defaults to `hdfs://namenode:9000/user/hive/warehouse` if using
      HDFS, `s3a://admin-bucket/hive/warehouse` if using S3 and
      `file:///hive/warehouse` if none of the two.

  - name: SPARK_cores_max
    default: ""
    since: "1.10.0"
    description: >
      the maximum amount of CPU cores to request for the application from across
      the cluster (not from each machine). If not set, the default will be
      `spark.deploy.defaultCores` to be set through `SPARK_MASTER_OPTS`.

  - name: SPARK_executor_memory
    default: ""
    since: "1.10.0"
    description: >
      Amount of memory to use per executor process, in the same format as JVM
      memory strings with a size unit suffix ('k', 'm', 'g' or 't') (e.g. 512m,
      2g). If not set, the default will be `1g`.

  - name: SPARK_sql_default_catalog
    default: "''"
    since: "1.19.0"
    description: >
      Name of the default catalog. This will be the current catalog if users have
      not explicitly set the current catalog yet.

  - name: SPARK_table_format_type
    default: "''"
    since: "1.16.0"
    description: >
      The table format to enable in Spark, either 'delta', 'iceberg' or 'hudi'

  - name: SPARK_datahub_agent_enabled
    default: "'false'"
    since: "1.17.0"
    description: >
      Enable the DataHub agent to integrate Spark with DataHub. For it to take
      effect, either `DATAHUB_enable` or `external.DATAHUB_enable` has to be set
      to `true`.
