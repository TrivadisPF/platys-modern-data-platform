name: "CKAN - The Open Source Data Portal Software"
id: ckan
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://ckan.org/
  documentation: https://docs.ckan.org/en/2.9/
  github: https://github.com/ckan/ckan

description: >
  ```bash platys init --enable-services CKAN platys gen ```

enable:
  platys_init: CKAN
  example: |
    platys init --enable-services CKAN
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28294>.
  - title: Using CLI
    content: |
      ```bash
      docker exec -ti ckan ckan -c /srv/app/production.ini 
      ```

parameters:
  - name: CKAN_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate CKAN service

  - name: CKAN_use_dev_edition
    default: "false"
    since: "1.17.0"
    description: >
      Enable the developer edition?

  - name: CKAN_volume_map_storage
    default: "false"
    since: "1.17.0"
    description: >
      Map the `storage` folder into the container.

  - name: CKAN_sysadmin_password
    default: "abc123abc123"
    since: "1.17.0"
    sensitive: true
    description: >
      the sysadmin password.

  - name: CKAN_postgres_db
    default: "ckan"
    since: "1.17.0"
    description: >
      The PostgreSQL database to use.

  - name: CKAN_postgres_user
    default: "ckan"
    since: "1.17.0"
    description: >
      The user to connect to PostgreSQL.

  - name: CKAN_postgres_password
    default: "abc123!"
    since: "1.17.0"
    sensitive: true
    description: >
      The password of the user to connect to PostgreSQL.

  - name: CKAN_datastore_readonly_user
    default: "ckanro"
    since: "1.17.0"
    description: >
      The readonly user to connect to PostgreSQL.

  - name: CKAN_datastore_readonly_password
    default: "ckan"
    since: "1.17.0"
    sensitive: true
    description: >
      The password of the readonly user to connect to PostgreSQL.

  - name: CKAN_use_s3_store
    default: "false"
    since: "1.17.0"
    description: >
      Enable the use of S3 storage, either enable local Minio or external S3
      support for it to be active.

  - name: CKAN_s3_store_bucket_name
    default: "ckan"
    since: "1.17.0"
    description: >
      The name of the S3 bucket to use when S3 storage is enabled.
