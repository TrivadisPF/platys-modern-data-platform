name: HiveMQ 4
id: hivemq4
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.hivemq.com/
  documentation: https://www.hivemq.com/docs/hivemq/4.7/user-guide/introduction.html
  github: https://github.com/vrana/adminer/

description: >
  HiveMQ CE is a Java-based open source MQTT broker that fully supports MQTT
  3.x and MQTT 5. It is the foundation of the HiveMQ Enterprise Connectivity
  and Messaging Platform

enable:
  platys_init: HIVEMQ4
  example: |
    platys init --enable-services HIVEMQ4
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28134>

parameters:
  - name: HIVEMQ4_enable
    default: "false"
    since: "1.1.0"
    description: >
      Generate HiveMQ 4.x service
