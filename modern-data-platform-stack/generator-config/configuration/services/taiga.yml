name: Taiga
id: taiga
category:
  id: 19_tools
  name: tools
  color: silver
arch: [x86-64]

links:
  website: https://taiga.io/
  documentation: https://community.taiga.io/c/learn-taiga-basic
  github: https://github.com/taigaio/taiga

description: >
  Taiga is a free and open-source project management for cross-functional agile
  teams.

enable:
  platys_init: TAIGA
  example: |
    platys init --enable-services TAIGA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28323>.
  - title: Creating an admin user
    content: |
      To create an admin user, perform 
      
      ```bash
      docker exec -ti taiga-back python manage.py createsuperuser
      ```
      
      and you are prompted for username, email address and password.

parameters:
  - name: TAIGA_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Taiga project managment service

  - name: TAIGA_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map `db-data`, `async-rabbitmq-data` and `events-rabbitmq-data`
      folder into the Taiga service.

  - name: TAIGA_db_database
    default: "taiga_db"
    since: "1.18.0"
    description: >
      The name of the Taiga database.

  - name: TAIGA_db_username
    default: "taiga"
    since: "1.18.0"
    description: >
      The username of the Taiga database.

  - name: TAIGA_db_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the Taiga database.

  - name: TAIGA_rabbitmq_user
    default: "taiga"
    since: "1.18.0"
    description: >
      The username of the RabbitMQ message broker.

  - name: TAIGA_rabbitmq_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the RabbitMQ message broker.

  - name: TAIGA_secret_key
    default: "taiga-secret-key"
    since: "1.18.0"
    sensitive: true
    description: >
      The secret key to be used for Taiga.

  - name: TAIGA_email_backend
    default: "console"
    since: "1.18.0"
    description: >
      Either `console` or `smtp`.

  - name: TAIGA_email_host
    default: "maildev"
    since: "1.18.0"
    description: >
      The email host, only applicable it `TAIGA_email_backend ` is set to `smtp`.

  - name: TAIGA_email_port
    default: "22"
    since: "1.18.0"
    description: >
      The port on which to reach the email host, only applicable it
      `TAIGA_email_backend ` is set to `smtp`.

  - name: TAIGA_email_host_user
    default: "taiga"
    since: "1.18.0"
    description: >
      The username on which to reach the email host, only applicable it
      `TAIGA_email_backend ` is set to `smtp`.

  - name: TAIGA_email_host_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password on which to reach the email host, only applicable it
      `TAIGA_email_backend ` is set to `smtp`.

  - name: TAIGA_email_from
    default: "changeme@example.com"
    since: "1.18.0"
    description: >
      The from email address, only applicable it `TAIGA_email_backend ` is set to
      `smtp`.

  - name: TAIGA_enable_telemetry
    default: "false"
    since: "1.18.0"
    description: >
      Enable telemetry?
