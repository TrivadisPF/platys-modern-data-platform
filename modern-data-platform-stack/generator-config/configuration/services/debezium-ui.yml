name: Debezium UI
id: debezium-ui
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://debezium.io/documentation/reference/operations/debezium-ui.html
  documentation: https://debezium.io/documentation/reference/operations/debezium-ui.html
  github: https://github.com/debezium/debezium-ui

description: >
  A web UI for Debezium, which allows users to set up and operate connectors
  more easily. For instance, a list of all connectors can be viewed along with
  their status, etc. The Create Connector wizard allows the user to configure
  connectors, guiding and validating the property entries along the way.

enable:
  platys_init: DEBEZIUM_UI
  example: |
    platys init --enable-services DEBEZIUM_UI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28227>

parameters:
  - name: DEBEZIUM_UI_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate Debezium UI service
