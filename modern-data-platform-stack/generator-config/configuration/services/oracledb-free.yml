name: Oracle Database Free (official)
id: oracledb-free
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.oracle.com/database/free/
  documentation: https://www.oracle.com/database/free/get-started/

description: >
  Oracle Database 23c Free—Developer Release is the same, powerful Oracle
  Database that businesses throughout the world rely on. It offers a
  full-featured experience and is packaged for ease of use and simple
  download—for free.

enable:
  platys_init: ORACLE_FREE
  example: |
    platys init --enable-services ORACLE_FREE
    platys gen

usage:
  - title: Connect through SQL Plus
    content: |
      ```
      docker exec -ti oracledb-free sqlplus "user1/abc123!"@//localhost/FREEPDB1
      ```
  - title: Connect through JDBC
    content: |
      * **JDBC Url:**  	`jdbc:oracle:thin:@dataplatform:1524/FREEPDB1`
      * **JDBC Driver Class Name:** 	`oracle.jdbc.driver.OracleDriver`

parameters:
  - name: ORACLE_FREE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Oracle Database Free service.

  - name: ORACLE_FREE_flavour
    default: "regular"
    since: "1.18.0"
    description: >
      The image flavour to use, one of `regular` or `lite`

  - name: ORACLE_FREE_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map `data` folder into the Oracle service

  - name: ORACLE_FREE_volume_map_custom_conf
    default: "false"
    since: "1.18.0"
    description: >
      Volume map `custom-conf` folder into the Oracle service

  - name: ORACLE_FREE_password
    default: "EAo4KsTfRR"
    since: "1.18.0"
    sensitive: true
    description: >
      The password to use for the `SYS` and `SYSTEM` user.

  - name: ORACLE_FREE_characterset
    default: "AL32UTF8"
    since: "1.18.0"
    description: >
      The character set to use when creating the database.

  - name: ORACLE_FREE_enable_archivelog
    default: "true"
    since: "1.18.0"
    description: >
      Enable archive log mode when creating the database?

  - name: ORACLE_FREE_enable_force_logging
    default: "true"
    since: "1.18.0"
    description: >
      Enable force logging mode when creating the database?
