name: Neo4J Knowledge Graph Builder
id: neo4j-kg-builder
arch: [x86-64]

tags: []
dependencies: [neo4j]
links:
  website: https://neo4j.com/labs/genai-ecosystem/llm-graph-builder/
  documentation: https://neo4j.com/docs/llm-graph-builder/
  github: https://github.com/neo4j-labs/llm-graph-builder

description: >
  Neo4j LLM Knowledge Graph Builder transforms unstructured data into a
  structured Neo4j knowledge graph using large language models. It provides
  a backend REST API and a React frontend for uploading documents (PDF, text,
  YouTube, Wikipedia, S3, web pages) and extracting entities and relationships
  into Neo4j automatically.

enable:
  platys_init: NEO4J,NEO4J_KG_BUILDER
  example: |
    platys init --enable-services NEO4J,NEO4J_KG_BUILDER
    platys gen

usage:
  - title: Open the Knowledge Graph Builder UI
    content: |
      Navigate to <http://dataplatform:28415>.

  - title: Access the backend REST API
    content: |
      The REST API is available at <http://dataplatform:28414>.

parameters:
  - name: NEO4J_KG_BUILDER_enable
    default: "false"
    since: "1.17.0"
    description: >
      Enable the Neo4j Knowledge Graph Builder service (backend + frontend).

  - name: NEO4J_KG_BUILDER_openai_api_key
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      OpenAI API key used by the Knowledge Graph Builder backend for LLM-based
      entity extraction.

  - name: NEO4J_KG_BUILDER_diffbot_api_key
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      Diffbot API key for the Diffbot LLM extraction model. Leave empty if not
      using Diffbot.

  - name: NEO4J_KG_BUILDER_embedding_model
    default: ""
    since: "1.17.0"
    description: >
      Embedding model to use for vector embeddings. Leave empty to use the
      default model configured in the backend.

  - name: NEO4J_KG_BUILDER_knn_min_score
    default: "0.94"
    since: "1.17.0"
    description: >
      Minimum similarity score threshold for k-nearest-neighbour graph
      relationships created between similar document chunks.

  - name: NEO4J_KG_BUILDER_is_embedding
    default: "true"
    since: "1.17.0"
    description: >
      Whether to generate and store vector embeddings for extracted graph
      chunks.

  - name: NEO4J_KG_BUILDER_ollama_model
    default: "llama3.2"
    since: "1.17.0"
    description: >
      Ollama model name to use for local LLM inference. The backend connects
      to Ollama via host.docker.internal:11434.

