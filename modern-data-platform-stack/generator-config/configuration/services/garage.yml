name: Garage
id: garage
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://garagehq.deuxfleurs.fr/
  documentation: https://garagehq.deuxfleurs.fr/documentation/quick-start/
  github: https://git.deuxfleurs.fr/Deuxfleurs/garage

description: >
  S3-compatible object store for small self-hosted geo-distributed deployments.

enable:
  platys_init: GARAGE
  example: |
    platys init --enable-services GARAGE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3909> for the Garage WebUI.

parameters:
  - name: GARAGE_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Garage service

  - name: GARAGE_volume_map_data
    default: "false"
    since: "1.19.0"
    description: >
      Volume map data folders into the service

  - name: GARAGE_rpc_secret
    default: "52db4fe3..."
    since: "1.19.0"
    sensitive: true
    description: >
      Secret key that is shared between all nodes of the cluster in order to
      identify these nodes and allow them to communicate together.

  - name: GARAGE_metrics_token_enabled
    default: "true"
    since: "1.19.0"
    sensitive: true
    description: >
      Enable the Metcis endpoint token? If this token is not enabled, the Metrics
      endpoint can be accessed without access control. Specify the token in
      `GARAGE_metrics_token`.

  - name: GARAGE_metrics_token
    default: "6/qasXj1RVpf/..."
    since: "1.19.0"
    sensitive: true
    description: >
      The token for accessing the Metrics endpoint.

  - name: GARAGE_admin_token_enabled
    default: "true"
    since: "1.19.0"
    sensitive: true
    description: >
      Enable the administration endpoint token? If this token is not set, access
      to these endpoints is disabled entirely. Specify the token in
      `GARAGE_admin_token`.

  - name: GARAGE_admin_token
    default: "6/qasXj1RVpf/..."
    since: "1.19.0"
    sensitive: true
    description: >
      The token for accessing all of the other administration endpoints. If this
      token is not set, access to these endpoints is disabled entirely.
