name: Stardog
id: stardog
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.stardog.com/
  documentation: https://docs.stardog.com/

description: >
  Dgraph is the simplest way to implement a GraphQL backend for your
  applications. Everything you need to build apps, unite your data, and scale
  your operations is included, out-of-the-box.

enable:
  platys_init: STARDOG
  example: |
    platys init --enable-services STARDOG
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5820>

parameters:
  - name: STARDOG_enable
    default: "false"
    since: "1.7.0"
    description: >
      Generate Stardog service

  - name: STARDOG_volume_map_data
    default: "false"
    since: "1.7.0"
    description: >
      Volume map data folder into the Stardog service

  - name: STARDOG_STUDIO_enable
    default: "false"
    since: "1.7.0"
    description: >
      Generate Stardog Studio UI service
