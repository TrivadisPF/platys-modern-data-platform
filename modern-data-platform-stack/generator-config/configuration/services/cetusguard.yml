name: Cetusguard
id: cetusguard
category:
  id: 20_infrastructure
  name: infrastructure
  color: steel
arch: [x86-64, arm]

links:
  documentation: https://github.com/hectorm/cetusguard
  github: https://github.com/hectorm/cetusguard

description: >
  CetusGuard is a tool that protects the Docker daemon socket by filtering
  calls to its API endpoints.

enable:
  platys_init: CETUSGUARD
  example: |
    platys init --enable-services CETUSGUARD
    platys gen

usage:
  - title: Usage
    content: |
      Use `cetusguard:2375` instead of `unix://var/run/docker.sock` to connect to the docker server (e.g. set the `DOCKER_HOST` environment variable).

parameters:
  - name: CETUSGUARD_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate CetusGuard Docker-Socket-Proxy service

  - name: CETUSGUARD_docker_daemon_socket
    default: "unix:///var/run/docker.sock"
    since: "1.17.0"
    description: >
      Docker daemon socket to connect to. Defaults to the local unix socket which
      is mapped into the `centusguard` container.

  - name: CETUSGUARD_port
    default: "2375"
    since: "1.17.0"
    description: >
      The port the `centus` service binds to.

  - name: CETUSGUARD_no_builtin_rules
    default: "false"
    since: "1.17.0"
    description: >
      Do not load the built-in rules (which allow a few common harmless
      endpoints, `/_ping`, `/version` and `/info`).

  - name: CETUSGUARD_rules
    default: "false"
    since: "1.17.0"
    description: >
      A comma-delimited list of rules. Can either be one line or using the
      `CENUSGUARD_rules: >` syntax be stretched over multiple lines.

  - name: CETUSGUARD_rules_file
    default: ""
    since: "1.17.0"
    description: >
      The name of the rules file.

  - name: CETUSGUARD_log_level
    default: "6"
    since: "1.17.0"
    description: >
      The minimum entry level to log, a value from `0` to `7`.
