name: Unstructured API
id: unstructured-api
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://unstructured-io.github.io/unstructured/apis/usage_methods.html
  github: https://github.com/Unstructured-IO/unstructured-api

description: >
  The Unstructured API services offer a high-quality and scalable solution
  capable of ingesting and digesting files of various types and sizes.

enable:
  platys_init: UNSTRUCTURED_API
  example: |
    platys init --enable-services UNSTRUCTURED_API
    platys gen

usage:
  - title: Usage
    content: |
      ```bash
      curl -X 'POST' \  
              'http://192.168.1.102:28374/general/v0/general' \
               -H 'accept: application/json' \
               -H 'Content-Type: multipart/form-data' \
               -F 'files=@sample-docs/layout-parser-paper.pdf' \
               -F 'strategy=hi_res'
      ```

parameters:
  - name: UNSTRUCTURED_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Unstructured API service

  - name: UNSTRUCTURED_memory_free_minimum_mb
    default: "2048"
    since: "1.18.0"
    description: >
      The amount of memory the Unstructured API server will use. You can lower
      this value to reduce these messages, that is, allow the server to use more
      memory. Otherwise, you can set to `0` to fully remove this check.

  - name: UNSTRUCTURED_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      If set, only requests including an `unstructured-api-key` header with this
      value will be fulfilled.

  - name: UNSTRUCTURED_max_lifetime_seconds
    default: ""
    since: "1.18.0"
    description: >
      By default server will run for indefinitely. Change it with this
      configuration and it will enter a graceful shutdown period after the value
      set.
