name: LakeFS CLI
id: lakectl
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://lakefs.io/
  documentation: https://docs.lakefs.io/reference/commands.html#installing-the-lakectl-command-locally
  github: https://github.com/treeverse/lakeFS

description: >
  Git-like capabilities for your object storage.

enable:
  platys_init: LAKEFS,
  example: |
    platys init --enable-services LAKEFS,
    platys gen

usage:
  - title: Usage
    content: |
      ```bash
      docker exec -ti lakectl lakectl
      ```
      
      ```bash
      docker exec -ti lakectl lakectl branch list lakefs://example
      ```

parameters:
  - name: LAKECTL_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable LakeFS CLI.
