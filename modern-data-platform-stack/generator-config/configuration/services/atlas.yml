name: Apache Atlas
id: atlas
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://atlas.apache.org/#/
  documentation: https://atlas.apache.org/#/
  github: https://github.com/apache/atlas

description: >
  Atlas is a scalable and extensible set of core foundational governance
  services – enabling enterprises to effectively and efficiently meet their
  compliance requirements within Hadoop and allows integration with the whole
  enterprise data ecosystem.

enable:
  platys_init: ATLAS
  example: |
    platys init --enable-services ATLAS
    platys gen

parameters:
  - name: ATLAS_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Atlas service

  - name: ATLAS_provision_atlas_sample_data
    default: "false"
    since: "1.2.0"
    description: >
      Provision Apache Atlas sample data?

  - name: ATLAS_provision_amundsen_sample_data
    default: "false"
    since: "1.2.0"
    description: >
      Provision Amundsen sample types?

  - name: ATLAS_hive_hook_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enable the Hive Hook in `hive-server`? Only relevant if `HIVE_enable` is
      set to `true`. The JARs are no longer provided and need to be downloaded
      manually and provided in
      `./plugins/hive-server/apache-atlas-hive-hook/hook`.
