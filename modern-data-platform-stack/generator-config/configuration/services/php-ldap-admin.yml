name: phpLDAPadmin
id: php-ldap-admin
category:
  id: 16_security
  name: security
  color: red
arch: [x86-64]

links:
  website: https://phpldapadmin.sourceforge.net/wiki/index.php/Main_Page
  documentation: https://phpldapadmin.sourceforge.net/wiki/index.php/Main_Page
  github: https://github.com/leenooks/phpLDAPadmin

description: >
  ```bash platys init --enable-services OPENLDAP, PHP_LDAP_ADMIN platys gen ```

enable:
  platys_init: OPENLDAP,
  example: |
    platys init --enable-services OPENLDAP,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <https://dataplatform:28296>.

parameters:
  - name: PHP_LDAP_ADMIN_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate phpLDAPadmin service

  - name: PHP_LDAP_ADMIN_ldap_hosts
    default: "openldap"
    since: "1.16.0"
    description: >
      the LDAP host to connect to
