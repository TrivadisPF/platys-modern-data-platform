name: LiteLLM
id: litellm
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://docs.litellm.ai/docs/
  github: https://github.com/BerriAI/litellm

description: >
  Call all LLM APIs using the OpenAI format. Use Bedrock, Azure, OpenAI,
  Cohere, Anthropic, Ollama, Sagemaker, HuggingFace, Replicate (100+ LLMs)

enable:
  platys_init: LITELLM
  example: |
    platys init --enable-services LITELLM
    platys gen

usage:
  - title: Usage
    content: |
      ```bash
      curl --location 'http://localhost:4002/chat/completions' --header 'Content-Type: application/json' \
                   --data ' {
                              "model": "gpt-3.5-turbo",
                              "messages": [
                                  {
                                  "role": "user",
                                  "content": "what llm are you"
                                  }
                              ]
                            }'
      ```

parameters:
  - name: LITELLM_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate LiteLLM service
