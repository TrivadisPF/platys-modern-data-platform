name: Apache Livy
id: livy
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://livy.incubator.apache.org/
  documentation: https://livy.incubator.apache.org/
  github: https://github.com/apache/incubator-livy

description: >
  Apache Livy is a service that enables easy interaction with a Spark cluster
  over a REST interface. It enables easy submission of Spark jobs or snippets
  of Spark code, synchronous or asynchronous result retrieval, as well as Spark
  Context management, all via a simple REST interface or an RPC client library.
  Apache Livy also simplifies the interaction between Spark and application
  servers, thus enabling the use of Spark for interactive web/mobile
  applications.

enable:
  platys_init: SPARK,LIVY
  example: |
    platys init --enable-services SPARK,LIVY
    platys gen

parameters:
  - name: LIVY_enable
    default: "false"
    since: "1.1.0"
    description: >
      Generate Spark Livy Server
