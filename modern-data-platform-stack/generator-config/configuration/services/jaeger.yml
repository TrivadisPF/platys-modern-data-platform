name: Jaeger
id: jaeger
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  website: https://www.jaegertracing.io/
  documentation: https://www.jaegertracing.io/docs/1.29/
  github: https://github.com/jaegertracing/jaeger

description: >
  Jaeger, inspired by Dapper and OpenZipkin, is a distributed tracing system
  released as open source by Uber Technologies. It is used for monitoring and
  troubleshooting microservices-based distributed systems.

enable:
  platys_init: JAEGER
  example: |
    platys init --enable-services JAEGER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:16686>

parameters:
  - name: JAEGER_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Jaeger service

  - name: JAEGER_zipkin_port
    default: "false"
    since: "1.14.0"
    description: >
      Exposes Zipkin compatible REST API on this port.
