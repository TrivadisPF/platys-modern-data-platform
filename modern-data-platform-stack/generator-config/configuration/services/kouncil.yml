name: Kouncil
id: kouncil
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://kouncil.io/
  documentation: https://github.com/Consdata/kouncil
  github: https://github.com/Consdata/kouncil

description: >
  Simple dashboard for your Kafka. Monitor status, manage groups, topics, send
  messages and diagnose problems. All in one user friendly web dashboard.

enable:
  platys_init: KOUNCIL
  example: |
    platys init --enable-services KOUNCIL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28253>

parameters:
  - name: KOUNCIL_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Kouncil service
