name: Apache Sqoop
id: sqoop
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://sqoop.apache.org/
  documentation: https://sqoop.apache.org/docs/1.4.7/index.html
  github: https://git-wip-us.apache.org/repos/asf?p=sqoop.gits

description: >
  Apache Sqoop(TM) is a tool designed for efficiently transferring bulk data
  between Apache Hadoop and structured datastores such as relational databases.

enable:
  platys_init: SQOOP
  example: |
    platys init --enable-services SQOOP
    platys gen

parameters:
  - name: SQOOP_enable
    default: "false"
    since: "1.3.0"
    description: >
      Generate Apache Sqoop service
