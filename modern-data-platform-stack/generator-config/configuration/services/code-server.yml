name: Code Server
id: code-server
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://code.visualstudio.com/
  documentation: https://code.visualstudio.com/docs
  github: https://github.com/coder/code-server

description: >
  VS Code in the browser.

enable:
  platys_init: CODE_SERVER
  example: |
    platys init --enable-services CODE_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28140>

parameters:
  - name: CODE_SERVER_enable
    default: "false"
    since: "1.3.0"
    description: >
      Generate Code Server (VS Code IDE) service

  - name: CODE_SERVER_volume_map_platform_root
    default: "false"
    since: "1.3.0"
    description: >
      Map the platform root into the editor, so files can be edited which are
      part of the platform.

  - name: CODE_SERVER_volume_map_modcache
    default: "false"
    since: "1.21.0"
    description: >
      Map the local plugins/code-server/ folder into the container at /modcache. Use this to
      cache or pre-provide Docker Mod content so it persists across container restarts.

  - name: CODE_SERVER_docker_mods
    default: ""
    since: "1.21.0"
    description: >
      Pass one or more linuxserver.io Docker Mods to the container via the DOCKER_MODS
      environment variable. Mods install additional packages or apply modifications at
      container startup. Use a single mod image (e.g. linuxserver/mods:code-server-python3)
      or a pipe-separated list for multiple mods. Leave empty to not apply any mods.
