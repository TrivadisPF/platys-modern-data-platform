name: Code Server
id: code-server
category:
  id: 19_tools
  name: tools
  color: silver
arch: [x86-64]

links:
  website: https://code.visualstudio.com/
  documentation: https://code.visualstudio.com/docs
  github: https://github.com/coder/code-server

description: >
  VS Code in the browser.

enable:
  platys_init: CODE_SERVER
  example: |
    platys init --enable-services CODE_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28140>

parameters:
  - name: CODE_SERVER_enable
    default: "false"
    since: "1.3.0"
    description: >
      Generate Code Server (VS Code IDE) service

  - name: CODE_SERVER_volume_map_platform_root
    default: "false"
    since: "1.3.0"
    description: >
      Map the platform root into the editor, so files can be edited which are
      part of the platform.
