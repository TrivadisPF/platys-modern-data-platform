name: OpenMetadata
id: openmetadata
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://open-metadata.org/
  documentation: https://docs.open-metadata.org/
  github: https://github.com/open-metadata/OpenMetadata/

description: >
  Open Standard for Metadata. A Single place to Discover, Collaborate and Get
  your data right.

enable:
  platys_init: OPENMETADATA
  example: |
    platys init --enable-services OPENMETADATA
    platys gen

usage:
  - title: Usage
    content: |
      For the OpenMetadate UI, navigate to <http://dataplatform:8585>. Log in with user `admin@open-metadata.org` and password `admin`.
      
      For the OpenMetadata Ingestion UI, navigate to <http://dataplatform:28337>. Login in with user `admin` and password `admin`.

parameters:
  - name: OPENMETADATA_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate OpenMetadata service

  - name: OPENMETADATA_volume_map_data
    default: "false"
    since: "1.19.0"
    description: >
      Volume map the data volumes?

  - name: OPENMETADATA_database_type
    default: "mysql"
    since: "1.19.0"
    description: >
      Database to use, either `postgres` or `mysql`
