name: S3FS
id: s3fs
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  documentation: https://github.com/efrecon/docker-s3fs-client
  github: https://github.com/efrecon/docker-s3fs-client

description: >
  Alpine-based s3fs client: mount from container, make available to other
  containers.

enable:
  platys_init: S3FS
  example: |
    platys init --enable-services S3FS
    platys gen

parameters:
  - name: S3FS_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate S3FS service. You also have to enable either `minio` or external
      `s3`.

  - name: S3FS_bucket_name
    default: "false"
    since: "1.17.0"
    description: >
      The bucket name to use on S3.
