name: Confluent REST Proxy
id: kafka-rest
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://docs.confluent.io/platform/current/kafka-rest/index.html
  documentation: https://docs.confluent.io/platform/current/kafka-rest/index.html
  github: https://github.com/confluentinc/kafka-rest

description: >
  The Confluent REST Proxy provides a RESTful interface to a Apache Kafka®
  cluster, making it easy to produce and consume messages, view the state of
  the cluster, and perform administrative actions without using the native
  Kafka protocol or clients.

enable:
  platys_init: KAFKA,KAFKA_RESTPROXY
  example: |
    platys init --enable-services KAFKA,KAFKA_RESTPROXY
    platys gen

parameters:
  - name: KAFKA_RESTPROXY_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Confluent REST Proxy service
