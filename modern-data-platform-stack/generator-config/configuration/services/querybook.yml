name: Querybook
id: querybook
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.querybook.org/
  documentation: https://www.querybook.org/docs/
  github: https://github.com/pinterest/querybook

description: >
  Querybook is a Big Data Querying UI, combining collocated table metadata and
  a simple notebook interface.

enable:
  platys_init: QUERYBOOK
  example: |
    platys init --enable-services QUERYBOOK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28301>.

parameters:
  - name: QUERYBOOK_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Querybook service
