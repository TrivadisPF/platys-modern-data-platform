name: Taskcafé
id: taskcafe
category:
  id: 19_tools
  name: tools
  color: silver
arch: [x86-64]

links:
  website: https://github.com/JordanKnott/taskcafe
  documentation: https://github.com/JordanKnott/taskcafe/wiki
  github: https://github.com/JordanKnott/taskcafe

description: >
  An open source project management tool with Kanban boards.

enable:
  platys_init: TASKCAFE
  example: |
    platys init --enable-services TASKCAFE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3333/register> to register an initial user.
      
      After that you can use Takscafé by navigating to  <http://dataplatform:3333>.

parameters:
  - name: TASKCAFE_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Taskcafé Kanban board service

  - name: TASKCAFE_volume_map_db_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map `db-data` folder into the Taskcafé service.
