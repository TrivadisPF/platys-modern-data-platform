name: S3manager
id: s3manager
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  documentation: https://github.com/cloudlena/s3manager
  github: https://github.com/cloudlena/s3manager

description: >
  A Web GUI for your S3 buckets.

enable:
  platys_init: S3MANAGER
  example: |
    platys init --enable-services S3MANAGER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28176>

parameters:
  - name: S3MANGER_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate S3Manager service
