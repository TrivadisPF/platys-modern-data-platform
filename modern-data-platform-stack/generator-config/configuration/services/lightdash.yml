name: Lightdash
id: lightdash
category:
  id: 10_ui
  name: ui
  color: green
arch: [x86-64]

links:
  website: https://www.lightdash.com/
  documentation: https://docs.lightdash.com/
  github: https://github.com/lightdash/lightdash

description: >
  Lightdash is an open-source BI tool that connects directly to your dbt
  project, allowing data teams to define metrics in code and share them with
  the whole organization through a self-serve analytics interface.

enable:
  platys_init: LIGHTDASH
  example: |
    platys init --enable-services LIGHTDASH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28422>
      
      On first access, create your admin account and connect a dbt project or warehouse directly.
  - title: Setup using CLI
    content: |
      Login (generate the personal access token first in the GUI and replace `ldpat_XXXX` by it).
      
      ```bash
      lightdash login http://localhost:28422 --token ldpat_XXXX
      ```
      
      Create project
      
      ```
      lightdash deploy --create
      ```

parameters:
  - name: LIGHTDASH_enable
    default: "false"
    since: "1.20.0"
    description: >
      Enable the Lightdash service

  - name: LIGHTDASH_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Map a local directory for the dbt project
      (`./container-volume/lightdash/data`)

  - name: LIGHTDASH_secret
    default: "abc123!"
    since: "1.20.0"
    sensitive: true
    description: >
      Encryption secret for data at rest — must not change after first run

  - name: LIGHTDASH_postgres_dbname
    default: "lightdash"
    since: "1.20.0"
    description: >
      PostgreSQL database name

  - name: LIGHTDASH_postgres_user
    default: "lightdash"
    since: "1.20.0"
    description: >
      PostgreSQL user

  - name: LIGHTDASH_postgres_password
    default: "abc123!"
    since: "1.20.0"
    sensitive: true
    description: >
      PostgreSQL password

  - name: LIGHTDASH_s3_endpoint
    default: ""
    since: "1.20.0"
    description: >
      Optional S3/MinIO endpoint for file storage

  - name: LIGHTDASH_s3_bucket
    default: ""
    since: "1.20.0"
    description: >
      Optional S3 bucket name

  - name: LIGHTDASH_s3_region
    default: "us-east-1"
    since: "1.20.0"
    description: >
      S3 region
