name: Azurite
id: azurite
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/Azure/Azurite
  github: https://github.com/Azure/Azurite

description: >
  A lightweight server clone of Azure Storage that simulates most of the
  commands supported by it with minimal dependencies.

enable:
  platys_init: AZURITE
  example: |
    platys init --enable-services AZURITE
    platys gen

parameters:
  - name: AZURITE_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Azurite service

  - name: AZURITE_volume_map_data
    default: "false"
    since: "1.19.0"
    description: >
      Volume map data folder into Azurite.

  - name: AZURITE_start_service
    default: ""
    since: "1.19.0"
    description: >
      Control the services to start, either `blob`, `queue`, `table` to restrict
      starting only one service, or empty for all services.

  - name: AZURITE_account_name
    default: ""
    since: "1.19.0"
    description: >
      Customize storage account name. If left empty, then the default account
      name is used: `devstoreaccount1`.

  - name: AZURITE_account_key
    default: ""
    since: "1.19.0"
    description: >
      Customize storage account key. If left empty, then the default key is used:
      `Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==`.

  - name: AZURITE_blob_containers
    default: ""
    since: "1.19.0"
    description: >
      A comma separated list of blob containers to create upon start.
