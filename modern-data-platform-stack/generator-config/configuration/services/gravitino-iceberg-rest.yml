name: Gravitino Iceberg REST Server
id: gravitino-iceberg-rest
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://gravitino.apache.org/
  documentation: https://gravitino.apache.org/docs
  github: https://github.com/apache/gravitino

description: >
  World's most powerful open data catalog for building a high-performance,
  geo-distributed and federated metadata lake.

enable:
  platys_init: GRAVITINO_ICERBERG_REST
  example: |
    platys init --enable-services GRAVITINO_ICEBERG_REST
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28470>.

parameters:
  - name: GRAVITINO_ICEBERG_REST_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Gravitino Iceberg REST service

