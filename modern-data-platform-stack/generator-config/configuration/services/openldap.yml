name: OpenLDAP
id: openldap
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.openldap.org/
  documentation: https://www.openldap.org/doc/admin26/quickstart.html
  github: https://github.com/openldap/openldap

description: >
  OpenLDAP is an open-source implementation of the Lightweight Directory Access Protocol (LDAP), providing a robust directory server for centrally storing and managing identity and access data such as users, groups, and credentials.

enable:
  platys_init: OPENLDAP
  example: |
    platys init --enable-services OPENLDAP
    platys gen

parameters:
  - name: OPENLDAP_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate OpenLDAP service

  - name: OPENLDAP_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the `data` folder into the container.

  - name: OPENLDAP_volume_map_config
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the `config` folder into the container.
