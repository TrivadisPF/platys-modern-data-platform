name: Parquet Tools CLI
id: parquet-tools
category:
  id: 15_governance
  name: governance
  color: brown
arch: [x86-64]

links:
  website: https://parquet.apache.org/
  documentation: https://parquet.apache.org/docs/
  github: https://github.com/apache/parquet-mr/

description: >
  pache Parquet is an open source, column-oriented data file format designed
  for efficient data storage and retrieval. It provides efficient data
  compression and encoding schemes with enhanced performance to handle complex
  data in bulk. Parquet is available in multiple languages including Java, C++,
  Python, etc...

enable:
  platys_init: PARQUET_TOOLS
  example: |
    platys init --enable-services PARQUET_TOOLS
    platys gen

usage:
  - title: Usage
    content: |
      To use the parquet tool, once it is generated, just use the `docker exec` command:
      
      ```bash
      docker compose run --rm parquet-tools <command>
      ```

parameters:
  - name: PARQUET_TOOLS_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Parquet Tools CLI service.
