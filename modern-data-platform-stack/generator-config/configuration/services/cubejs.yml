name: Cube.js
id: cubejs
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://cube.dev/
  documentation: https://docs.cube.dev/docs/introduction
  github: https://github.com/cube-js/cube

description: >
  Cube is an open-source headless Business Intelligence platform that connects
  to any data source, provides a semantic layer for metrics, and delivers data
  to any frontend via APIs (REST, GraphQL, SQL). It is designed to work as a
  middleware between your data warehouse and your analytics applications.

enable:
  platys_init: CUBEJS
  example: |
    platys init --enable-services CUBEJS
    platys gen

usage:
  - title: Usage
    content: |
      In dev mode, navigate to the Developer Playground at <http://dataplatform:4003>.
      
      The Cube.js REST API is available at <http://dataplatform:4003/cubejs-api/v1>.
      s

parameters:
  - name: CUBEJS_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Cube.js service

  - name: CUBEJS_dev_mode
    default: "true"
    since: "1.20.0"
    description: >
      Enable Cube.js developer mode (activates the Developer Playground UI on
      port 4000).
