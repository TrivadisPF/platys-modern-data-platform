name: SearXNG
id: searxng
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  documentation: https://docs.searxng.org/
  github: https://github.com/searxng/searxng

description: >
  SearXNG is a free internet metasearch engine which aggregates results from
  various search services and databases. Users are neither tracked nor
  profiled.

enable:
  platys_init: SEARXNG
  example: |
    platys init --enable-services SEARXNG
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28389>.

parameters:
  - name: SEARXNG_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate SearXNG service
