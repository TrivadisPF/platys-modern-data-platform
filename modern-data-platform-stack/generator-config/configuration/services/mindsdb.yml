name: MindsDB
id: mindsdb
arch: [x86-64]

tags: []
dependencies: []
links:
  website: http://mindsdb.com
  documentation: https://docs.mindsdb.com/what-is-mindsdb
  github: https://github.com/mindsdb/mindsdb

description: >
  The platform for building custom AI, enabling smarter organizations.

enable:
  platys_init: MINDSDB
  example: |
    platys init --enable-services MINDSDB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:47334>.

parameters:
  - name: MINDSDB_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable MindsDB.
