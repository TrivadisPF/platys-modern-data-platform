name: Apache Druid
id: druid
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://druid.apache.org/
  documentation: https://druid.apache.org/community/
  github: https://github.com/apache/druid/

description: >
  Apache Druid is a real-time database to power modern analytics applications.

enable:
  platys_init: DRUID
  example: |
    platys init --enable-services DRUID
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28150>

parameters:
  - name: DRUID_enable
    default: "false"
    since: "1.4.0"
    description: >
      Generate Druid service

  - name: DRUID_edition
    default: "oss-sandbox"
    since: "1.4.0"
    description: >
      Generate single-server sandbox (`oss-sandbox`) or cluster (`oss-cluster`).
      Currently only `oss-sandbox` is supported.

  - name: DRUID_volume_map_data
    default: "false"
    since: "1.4.0"
    description: >
      Volume map data folder into the Druid service (currently has no impact).
