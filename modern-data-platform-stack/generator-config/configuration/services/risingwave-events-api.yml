name: RisingWave Events API
id: risingwave-events-api
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  documentation: https://github.com/risingwavelabs/events-api
  github: https://github.com/risingwavelabs/events-api

description: >
  | **[GitHub](https://github.com/risingwavelabs/events-api)**

enable:
  platys_init: RISINGWAVE,RISINGWAVE_EVENTS_API
  example: |
    platys init --enable-services RISINGWAVE,RISINGWAVE_EVENTS_API
    platys gen

parameters:
  - name: RISINGWAVE_EVENTS_API_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate RisingWave Events API service
