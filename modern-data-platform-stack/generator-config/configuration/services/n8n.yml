name: n8n
id: n8n
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64]

links:
  website: https://n8n.io
  documentation: https://docs.n8n.io/
  github: https://github.com/n8n-io/n8n

description: >
  Free and source-available fair-code licensed workflow automation tool. Easily
  automate tasks across different services.

enable:
  platys_init: N8N
  example: |
    platys init --enable-services N8N
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5678>.

parameters:
  - name: N8N_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate n8n service

  - name: N8N_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into n8n service

  - name: N8N_ai_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Whether AI features are enabled (true) or not (false). Enables Ask AI for
      the HTTP node.

  - name: N8N_execution_mode
    default: "regular"
    since: "1.18.0"
    description: >
      The execution mode to use, either `regular` or `queue` (scale-out). If you
      set it to `queue`, then `N8N_db_type` should **not** be set to `sqlite`.

  - name: N8N_workers
    default: "1"
    since: "1.18.0"
    description: >
      The number of n8n workers to start, only applicable if `N8N_execution_mode`
      is set to `queue`.

  - name: N8N_db_type
    default: "sqlite"
    since: "1.18.0"
    description: >
      The database type to use, either `sqlite` or `postgresdb` or `mysqldb`.

  - name: N8N_sqlite_vacum_on_startup_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable VACUUM operation on startup to rebuild the database. Reduces file
      size and optimizes indexes. This is a long running blocking operation and
      increases start-up time. Applicable, if `N8N_db_type` is set to `sqlite`.

  - name: N8N_postgres_dbname
    default: "postgres"
    since: "1.18.0"
    description: >
      the name of the database, if `N8N_db_type` is set to `postgresdb`.

  - name: N8N_postgres_schema
    default: "public"
    since: "1.18.0"
    description: >
      the name of the schema, if `N8N_db_type` is set to `postgresdb`.

  - name: N8N_postgres_user
    default: "postgres"
    since: "1.18.0"
    description: >
      the name of the database user, if `N8N_db_type` is set to `postgresdb`.

  - name: N8N_postgres_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      the password of the database user, if `N8N_db_type` is set to `postgresdb`.

  - name: N8N_mysql_dbname
    default: ""
    since: "1.18.0"
    description: >
      the name of the database, if `N8N_db_type` is set to `mysqldb`.

  - name: N8N_mysql_user
    default: ""
    since: "1.18.0"
    description: >
      the name of the database user, if `N8N_db_type` is set to `mysqldb `.

  - name: N8N_mysql_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      the password of the database user, if `N8N_db_type` is set to `mysqldb `.

  - name: N8N_available_binary_data_modes
    default: "filesystem"
    since: "1.18.0"
    description: >
      A comma separated list of available binary data modes. Supported data modes
      are `filesystem`, `s3`.

  - name: N8N_default_binary_data_mode
    default: "default"
    since: "1.18.0"
    description: >
      The default binary data mode. default keeps binary data in memory. Set to
      filesystem to use the `filesystem`, or `s3` to AWS S3.

  - name: N8N_s3_bucket_name
    default: "n8n-bucket"
    since: "1.18.0"
    description: >
      The name of the S3 bucket to use if binary data mode is set to `s3`.

  - name: N8N_encryption_key
    default: "changeEncryptionKey"
    since: "1.18.0"
    description: >
      The encryption key to use, if `N8N_execution_mode` is set to `queue`.

  - name: N8N_webhook_url
    default: ""
    since: "1.18.0"
    description: >
      if running behind a reverse proxy, set the webhook URL, so that n8n can
      display it in the Editor UI and register the correct webhook URLs with
      external services.
