name: Kapacitor
id: kapacitor
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://www.influxdata.com/time-series-platform/kapacitor/
  documentation: https://docs.influxdata.com/kapacitor/v1.6/
  github: https://github.com/influxdata/kapacitor

description: >
  Kapacitor is an open source data processing framework that makes it easy to
  create alerts, run ETL jobs and detect anomalies. Kapacitor is the final
  piece of the TICK stack.

enable:
  platys_init: INFLUXDB,
  example: |
    platys init --enable-services INFLUXDB,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28130/kapacitor/v1>

parameters:
  - name: KAPACITOR_enable
    default: "false"
    since: "1.1.0"
    description: >
      Generate Kapacitor service

  - name: KAPACITOR_volume_map_data
    default: "false"
    since: "1.2.0"
    description: >
      Volume map data folder into the Kapacitor service
