name: Perplexica
id: perplexica
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  documentation: https://github.com/ItzCrazyKns/Perplexica
  github: https://github.com/ItzCrazyKns/Perplexica

description: >
  Perplexica is an AI-powered search engine. It is an Open source alternative
  to Perplexity AI.

enable:
  platys_init: PERPLEXICA
  example: |
    platys init --enable-services PERPLEXICA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28406> for the Perplixica UI.

parameters:
  - name: PERPLEXICA_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Perplexica service

  - name: PERPLEXICA_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into the perplexica service.
