name: MailDev
id: maildev
category:
  id: 08_transfer
  name: transfer
  color: gray
arch: [x86-64]

links:
  website: https://maildev.github.io/maildev/
  documentation: https://maildev.github.io/maildev/
  github: https://github.com/maildev/maildev

description: >
  SMTP Server + Web Interface for viewing and testing emails during
  development.

enable:
  platys_init: MAILDEV
  example: |
    platys init --enable-services MAILDEV
    platys gen

usage:
  - title: Connect to MailDev
    content: |
      Navigate to <http://dataplatform:28316>

parameters:
  - name: MAILDEV_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate MailDev service

  - name: MAILDEV_smtp_port
    default: "25"
    since: "1.17.0"
    description: >
      Internal SMTP port to use.

  - name: MAILDEV_web_disable
    default: "false"
    since: "1.17.0"
    description: >
      Disable the use of the web interface. Useful for unit testing.
