name: Smashing
id: smashing
arch: [x86-64]

tags: []
dependencies: []
links:
  github: https://github.com/Smashing/smashing

description: >
  The exceptionally handsome dashboard framework in Ruby and Coffeescript.

enable:
  platys_init: SMASHING
  example: |
    platys init --enable-services SMASHING
    platys gen

usage:
  - title: Connect to Smashing
    content: |
      Navigate to <http://dataplatform:28171> to see the sample dashboard.

parameters:
  - name: SMASHING_enable
    default: "false"
    since: "1.8.0"
    description: >
      Generate Smashing dashboard service

  - name: SMASHING_volume_map_dashboards
    default: "false"
    since: "1.8.0"
    description: >
      Map `dashboards` folder into the container to add your own dashboards.

  - name: SMASHING_volume_map_jobs
    default: "false"
    since: "1.8.0"
    description: >
      Map `jobs` folder into the container to add your own dashboards.

  - name: SMASHING_volume_map_jobs
    default: "false"
    since: "1.8.0"
    description: >
      Map `widgets` folder into the container to add widgets.

  - name: SMASHING_install_gems
    default: "false"
    since: "1.8.0"
    description: >
      A list of additional gem names to install.

  - name: SMASHING_install_widgets
    default: "false"
    since: "1.8.0"
    description: >
      A list of gist IDs of additional widgets to install.
