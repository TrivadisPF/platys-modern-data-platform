name: OpenClaw
id: openclaw
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://openclaw.ai/
  documentation: https://docs.openclaw.ai/start/getting-started
  github: https://github.com/openclaw/openclaw

description: >
  Your own personal AI assistant. Any OS. Any Platform. The lobster way.

enable:
  platys_init: OPENCLAW
  example: |
    platys init --enable-services OPENCLAW
    platys gen

usage:
  - title: Usage
    content: |
      Navitage to <http://dataplatform:28484?token=<token> and login with username and password specified in the configuration.
      
      Pass the token using `?token=<token>`.
      
      
      ```
      docker exec -it openclaw openclaw devices list
      
      docker exec -it openclaw openclaw devices approve <request-id>
      ```
      
      to access a remote gateway, create an SSH tunnel from your local machine
      
      ```bash
      ssh -N -L 28484:127.0.0.1:28484 root@187.124.0.29
      ```

parameters:
  - name: OPENCLAW_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate OpenClaw service

  - name: OPENCLAW_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the data folder into OpenClaw.

  - name: OPENCLAW_gateway_bind
    default: ""
    since: "1.20.0"
    description: >
      Gateway bind mode. `loopback` = 127.0.0.1 only (nginx proxies LAN traffic).
      `lan` = 0.0.0.0 (direct access, bypasses nginx auth). Also: `tailnet`,
      `auto`, `custom`

  - name: OPENCLAW_with_auth
    default: "false"
    since: "1.20.0"
    description: >
      Enable authentication.

  - name: OPENCLAW_username
    default: ""
    since: "1.20.0"
    description: >
      Username for the admin user.

  - name: OPENCLAW_password
    default: ""
    since: "1.20.0"
    sensitive: true
    description: >
      Password for the admin user.

  - name: OPENCLAW_gateway_token
    default: "9c3b8b31072b56586fdd3a330145a8fd"
    since: "1.20.0"
    sensitive: true
    description: >
      Bearer token for gateway auth. Generate a new one using `openssl rand -hex
      16`.

  - name: OPENCLAW_primary_model
    default: ""
    since: "1.20.0"
    description: >
      Default model to use.

  - name: OPENCLAW_hooks_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Set to `true` to enable the webhook hooks endpoint.

  - name: OPENCLAW_hooks_token
    default: "c5bbd4b3d31fd7b53f863d1dbfe56556"
    since: "1.20.0"
    sensitive: true
    description: >
      Shared secret for hook request auth. Required by openclaw when hooks are
      enabled. Generate a new one using `openssl rand -hex 16`.

  - name: OPENCLAW_docker_apt_packages
    default: ""
    since: "1.20.0"
    description: >
      Space-separated list of apt packages to install at container startup (e.g.
      `ffmpeg build-essential`). Packages are installed before openclaw starts.
      Reinstalled on each container restart.

  - name: OPENCLAW_docker_init_script
    default: ""
    since: "1.20.0"
    description: >
      Script that runs on every container start before openclaw starts. Must be
      executable and idempotent. Place script into the `./init/openclaw` folder.
