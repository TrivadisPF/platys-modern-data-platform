name: Kadmin
id: kadmin
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  documentation: https://github.com/BetterCloud/kadmin
  github: https://github.com/BetterCloud/kadmin

description: >
  Web Based Kafka Consumer and Producer.

enable:
  platys_init: KADMIN
  example: |
    platys init --enable-services KADMIN
    platys gen

usage:
  - title: Connect to Kadmin
    content: |
      Navigate to <http://dataplatform:28106>

parameters:
  - name: KADMIN_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate KAdmin service
