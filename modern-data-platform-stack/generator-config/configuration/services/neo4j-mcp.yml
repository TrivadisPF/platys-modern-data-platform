name: Neo4J MCP
id: neo4j-mcp
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://neo4j.com/developer/genai-ecosystem/model-context-protocol-mcp/
  github: https://github.com/neo4j-contrib/mcp-neo4j

description: >
  Model Context Protocol with Neo4j.

enable:
  platys_init: NEO4J,NEO4J_MCP
  example: |
    platys init --enable-services NEO4J,NEO4J_MCP
    platys gen

parameters:
  - name: NEO4J_MCP_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate MCP Neo4J service

  - name: NEO4J_MCP_output_transport
    default: "http"
    since: "1.20.0"
    description: >
      The output transport protocol for the Neo4j MCP Server; one of `stdio` or
      `http`

  - name: NEO4J_MCP_http_allow_origin
    default: ""
    since: "1.20.0"
    description: >
      Comma-separated list of allowed CORS origins or a `*`. Default empty (no
      CORS).

  - name: NEO4J_MCP_schema_sample_size
    default: "100"
    since: "1.20.0"
    description: >
      Number of nodes to sample for schema inference.

  - name: NEO4J_MCP_read_only
    default: "false"
    since: "1.20.0"
    description: >
      Enable read-only mode.
