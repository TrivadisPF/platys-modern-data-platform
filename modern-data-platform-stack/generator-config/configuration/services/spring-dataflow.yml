name: Spring Cloud Data Flow
id: spring-dataflow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://spring.io/projects/spring-cloud-dataflow
  documentation: https://spring.io/projects/spring-cloud-dataflow
  github: https://github.com/spring-cloud/spring-cloud-dataflow

description: >
  A microservices-based Streaming and Batch data processing in Cloud Foundry
  and Kubernetes.

enable:
  platys_init: SPRING_DATAFLOW
  example: |
    platys init --enable-services SPRING_DATAFLOW
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9393>

parameters:
  - name: SPRING_DATAFLOW_enable
    default: "false"
    since: "1.10.0"
    description: >
      Generate Spring Cloud Data Flow service
