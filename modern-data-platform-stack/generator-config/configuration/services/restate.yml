name: Restate
id: restate
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://restate.dev
  documentation: https://docs.restate.dev
  github: https://github.com/restatedev/restate
  docker: https://hub.docker.com/r/restatedev/restate

description: >
  Restate is a durable execution engine that makes building resilient distributed
  applications simple. It provides durable functions, workflows, and event-driven
  patterns with built-in retries, persistence, and exactly-once semantics.

enable:
  platys_init: RESTATE
  example: |
    platys init --enable-services RESTATE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28217> to access the Restate Admin API.

      - Ingress port (for service calls): `28216` (internal: `8080`)
      - Admin API port: `28217` (internal: `9070`)
      - Metrics port: `28218` (internal: `9071`)

parameters:
  - name: RESTATE_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Restate durable execution engine service.

  - name: RESTATE_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Persist Restate data to `./container-volume/restate/data` on the Docker host.
      Enable this to retain state across container restarts.
