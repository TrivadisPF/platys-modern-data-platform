name: Apache Iceberg REST Catalog
id: iceberg-rest-catalog
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://iceberg.apache.org/
  documentation: https://tabular.io/blog/rest-catalog-docker/
  github: https://github.com/apache/iceberg

description: >
  The Iceberg REST Catalog.

enable:
  platys_init: SPARK,ICEBERG_REST
  example: |
    platys init --enable-services SPARK,ICEBERG_REST
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28287>

parameters:
  - name: ICEBERG_REST_CATALOG_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Iceberg REST Catalog service

  - name: ICEBERG_REST_CATALOG_type
    default: "jdbc"
    since: "1.16.0"
    description: >
      The catalog implementation to use, either `jdbc`, `hive` or `nessie`.

  - name: ICEBERG_REST_CATALOG_db_type
    default: "sqlite"
    since: "1.18.0"
    description: >
      The database to use `sqlite` or `postgres`, applicable if
      `ICEBERG_REST_CATALOG_type` is set to `jdbc`.

  - name: ICEBERG_REST_CATALOG_db_dbname
    default: "iceberg-catalog"
    since: "1.18.0"
    description: >
      the name of the database, applicable if `ICEBERG_REST_CATALOG_type` is set
      to `jdbc`.

  - name: ICEBERG_REST_CATALOG_db_user
    default: "iceberg"
    since: "1.18.0"
    description: >
      the name of the database user, applicable if `ICEBERG_REST_CATALOG_type` is
      set to `jdbc`.

  - name: ICEBERG_REST_CATALOG_db_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      the password of the database user, applicable if
      `ICEBERG_REST_CATALOG_type` is set to `jdbc`.

  - name: ICEBERG_REST_CATALOG_warehouse_dir
    default: ""
    since: "1.16.0"
    description: >
      the base location in the object store or filesystem where table data will
      be stored.
