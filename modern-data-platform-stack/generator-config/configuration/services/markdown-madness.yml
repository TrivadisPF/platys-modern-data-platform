name: "Markdown Madness - Instant Markdown Server"
id: markdown-madness
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://madness.dannyb.co/
  documentation: https://madness.dannyb.co/
  github: https://github.com/DannyBen/madness

description: >
  Madness is a command line server for rendering markdown documents in your
  browser. It is designed to facilitate easy development of internal
  markdown-based documentation sites.

enable:
  platys_init: MARKDOWN_MADNESS
  example: |
    platys init --enable-services MARKDOWN_MADNESS
    platys gen

usage:
  - title: Connect to Markdown Madness - Instant Markdown Server
    content: |
      Navigate to <http://dataplatform:28312>

parameters:
  - name: MARKDOWN_MADNESS_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate a Markdown Madness service.

  - name: MARKDOWN_MADNESS_custom_image_name
    default: ""
    since: "1.18.0"
    description: >
      Use a custom image name for the markdown madness service. If you want to
      specify the version, overwrite the `MARKDOWN_MADNESS_version` property.

  - name: MARKDOWN_MADNESS_description
    default: "Markdown Viewer"
    since: "1.18.0"
    description: >
      The description of the service in the service list.

  - name: MARKDOWN_MADNESS_volume_map_docs
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the `docs` folder of the container.

  - name: MARKDOWN_MADNESS_volume_map_custom_config_file
    default: "false"
    since: "1.18.0"
    description: >
      Volume map a `./custom-conf/markdown-madness/markdown-madness.yml` file
      into the container to overwrite the behaviour of Markdown Madness.

  - name: MARKDOWN_MADNESS_watchtower_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enable watchtower.
