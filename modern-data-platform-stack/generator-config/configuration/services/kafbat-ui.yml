name: Kafbat UI
id: kafbat-ui
arch: [x86-64]

tags: [ui]
dependencies: []
links:
  website: https://kafbat.io/
  documentation: https://ui.docs.kafbat.io/
  github: https://github.com/kafbat/kafka-ui

description: >
  Open-Source Web UI for managing Apache Kafka clusters

enable:
  platys_init: KAFKA,KAFBAT_UI
  example: |
    platys init --enable-services KAFKA,KAFBAT_UI
    platys gen

parameters:
  - name: KAFBAT_UI_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Kafbat UI service

  - name: KAFBAT_UI_read_only_mode
    default: "false"
    since: "1.20.0"
    description: >
      When set to `true`, the UI operates in read-only mode and no mutations are
      allowed.

  - name: KAFBAT_UI_mcp_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Enable the built-in MCP (Model Context Protocol) server.

  - name: KAFBAT_UI_swagger_enabled
    default: "true"
    since: "1.20.0"
    description: >
      Enable the Swagger UI at `/swagger-ui.html`.

  - name: KAFBAT_UI_audit_log_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Enable audit logging of user actions.

  - name: KAFBAT_UI_audit_log_to_console_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Write audit log entries to the container stdout.

  - name: KAFBAT_UI_audit_log_to_topic_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Write audit log entries to a Kafka topic.

  - name: KAFBAT_UI_audit_log_topic
    default: "__kafbat-ui-audit-log"
    since: "1.20.0"
    description: >
      Name of the Kafka topic to write audit log entries to. Only used when
      `KAFBAT_UI_audit_log_to_topic_enabled` is `true`.
