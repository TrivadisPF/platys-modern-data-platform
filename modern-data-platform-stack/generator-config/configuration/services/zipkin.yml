name: Zipkin
id: zipkin
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://zipkin.io/
  documentation: https://zipkin.io/
  github: https://github.com/openzipkin/zipkin

description: >
  Zipkin is a distributed tracing system. It helps gather timing data needed to
  troubleshoot latency problems in service architectures. Features include both
  the collection and lookup of this data.

enable:
  platys_init: ZIPKIN
  example: |
    platys init --enable-services ZIPKIN
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9411>

parameters:
  - name: ZIPKIN_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Zipkin service

  - name: ZIPKIN_storage_type
    default: "mem"
    since: "1.13.0"
    description: >
      Selects the storage type to use for Zipkin storage, one of `mem`,
      `cassandra3`, `mysql` or `elasticsearch`.

  - name: ZIPKIN_collect_kafka
    default: "false"
    since: "1.13.0"
    description: >
      Collect traces from Kafka

  - name: ZIPKIN_debug
    default: "false"
    since: "1.13.0"
    description: >
      Enable debug logging
