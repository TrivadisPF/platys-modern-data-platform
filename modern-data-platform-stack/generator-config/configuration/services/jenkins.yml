name: Jenkins
id: jenkins
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.jenkins.io/
  documentation: https://docs.unitycatalog.io/
  github: https://github.com/jenkinsci/jenkins

description: >
  The leading open source automation server, Jenkins provides hundreds of
  plugins to support building, deploying and automating any project.

enable:
  platys_init: JENKINS
  example: |
    platys init --enable-services JENKINS
    platys gen

usage:
  - title: Web UI
    content: |
      Navigate to <http://dataplatform:28446>.

parameters:
  - name: JENKINS_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Jenkins service

  - name: JENKINS_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map `data` folder into the container.
