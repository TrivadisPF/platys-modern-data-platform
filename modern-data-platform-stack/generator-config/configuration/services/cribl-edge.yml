name: Cribl Edge
id: cribl-edge
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://cribl.io/
  documentation: https://docs.cribl.io/edge/
  github: https://github.com/criblio/

description: >
  Cribl Edge helps you collect and process observability data – logs, metrics,
  application data, etc. – in real time, from your Linux and Windows machines,
  apps, microservices etc., and deliver them to Cribl Stream or any supported
  destination.

enable:
  platys_init: CRIBL_EDGE,CRIBL_STREAM
  example: |
    platys init --enable-services CRIBL_EDGE,CRIBL_STREAM
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28330> and login as User `admin` with password `admin`.

parameters:
  - name: CRIBL_EDGE_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Cribl Edge service

  - name: CRIBL_EDGE_nodes
    default: "1"
    since: "1.17.0"
    description: >
      Number of Cribl Edge nodes, if started in distributed mode

  - name: CRIBL_EDGE_managed
    default: "false"
    since: "1.17.0"
    description: >
      Do we want Cribl Edge to be managed by a Cribl Master node. For that you
      have to also enable Cribl Stream.

  - name: CRIBL_EDGE_fleet
    default: "default_fleet"
    since: "1.17.0"
    description: >
      Name of the Fleet the edge node is assigned to.
