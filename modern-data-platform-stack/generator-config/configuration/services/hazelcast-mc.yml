name: Hazelcast Management Center
id: hazelcast-mc
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://hazelcast.com/product-features/management-center/
  documentation: https://docs.hazelcast.com/management-center/latest/
  github: https://github.com/hazelcast

description: >
  Hazelcast Management Center enables monitoring and management of nodes
  running Hazelcast IMDG or Jet. This includes monitoring the overall state of
  clusters, as well as detailed analysis and browsing of data structures in
  real time, updating map configurations, and taking thread dumps from nodes.

enable:
  platys_init: HAZELCAST
  example: |
    platys init --enable-services HAZELCAST
    platys gen

parameters:
  - name: HAZELCAST_MC_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Hazelcast MC (Management Center) service
