name: MariaDB
id: mariadb
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://mariadb.org/
  documentation: https://mariadb.org/documentation/
  github: https://github.com/MariaDB/server

description: >
  MariaDB server is a community developed fork of MySQL server. Started by core
  members of the original MySQL team, MariaDB actively works with outside
  developers to deliver the most featureful, stable, and sanely licensed open
  SQL server in the industry.

enable:
  platys_init: MARIADB
  example: |
    platys init --enable-services MARIADB
    platys gen

parameters:
  - name: MARIADB_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate MariaDB service

  - name: MARIADB_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder into the MariaDB service

  - name: MARIADB_database
    default: "sample"
    since: "1.17.0"
    description: >
      the name of the MariaDB database

  - name: MARIADB_user
    default: "sample"
    since: "1.17.0"
    description: >
      the name of the MariaDB user

  - name: MARIADB_password
    default: "sample"
    since: "1.17.0"
    sensitive: true
    description: >
      the MariaDB user password
