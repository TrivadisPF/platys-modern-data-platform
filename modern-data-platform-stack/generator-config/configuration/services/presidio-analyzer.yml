name: Presidio Analyzer
id: presidio-analyzer
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  documentation: https://github.com/microsoft/presidio/tree/main/presidio-analyzer
  github: https://github.com/microsoft/presidio/tree/main/presidio-analyzer

description: >
  The Presidio analyzer is a Python based service for detecting PII entities in
  text. During analysis, it runs a set of different PII Recognizers, each one
  in charge of detecting one or more PII entities using different mechanisms.

enable:
  platys_init: PRESIDIO_ANALYZER
  example: |
    platys init --enable-services PRESIDIO_ANALYZER
    platys gen

parameters:
  - name: PRESIDIO_ANALYZER_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Presidio Analyzer service
