name: Nimtable
id: nimtable
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/nimtable/nimtable
  github: https://github.com/nimtable/nimtable

description: >
  The Control Plane for Apache Iceberg.

enable:
  platys_init: NIMTABLE,POSTGRESQL
  example: |
    platys init --enable-services NIMTABLE,POSTGRESQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28280>.

parameters:
  - name: NIMTABLE_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Nimtable service
