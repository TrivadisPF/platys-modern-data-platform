name: Postgresql Exporter
id: postgresql-exporter
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  documentation: https://github.com/prometheus-community/postgres_exporter
  github: https://github.com/prometheus-community/postgres_exporter

description: >
  A PostgreSQL metric exporter for Prometheus.

enable:
  platys_init: POSTGRESQL
  example: |
    platys init --enable-services POSTGRESQL
    platys gen

parameters:
  - name: POSTGRESQL_EXPORTER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Postgresql Exporter.
