name: Grafana Tempo
id: tempo
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64, arm]

links:
  website: https://grafana.com/oss/tempo/
  documentation: https://grafana.com/docs/tempo/latest/
  github: https://github.com/grafana/tempo

description: >
  Grafana Tempo is a high volume, minimal dependency distributed tracing
  backend.

enable:
  platys_init: TEMPO
  example: |
    platys init --enable-services TEMPO
    platys gen

parameters:
  - name: TEMPO_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Tempo service

  - name: TEMPO_volume_map_data
    default: "false"
    since: "1.14.0"
    description: >
      Volume Map Tempo data folder

  - name: TEMPO_with_tempo_query
    default: "false"
    since: "1.14.0"
    description: >
      Grafana 7.4.x is not able to query Tempo directly and requires the
      tempo-query component as an intermediary. Use this property to switch it
      on.

  - name: TEMPO_use_custom_conf
    default: "false"
    since: "1.14.0"
    description: >
      Use a `tempo.yaml` config file placed into `custom-conf/tempo` folder for
      configuring Tempo?
