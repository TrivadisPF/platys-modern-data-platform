name: Vault
id: vault
category:
  id: 16_security
  name: security
  color: red
arch: [x86-64, arm]

links:
  website: https://www.vaultproject.io/
  documentation: https://www.vaultproject.io/docs
  github: https://github.com/hashicorp/vault

description: >
  A tool for secrets management, encryption as a service, and privileged access
  management.

enable:
  platys_init: VAULT
  example: |
    platys init --enable-services VAULT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8200>

parameters:
  - name: VAULT_enable
    default: "false"
    since: "1.5.0"
    description: >
      Generate Vault service

  - name: VAULT_use_dev_mode
    default: "false"
    since: "1.14.0"
    description: >
      Start Vault in development mode? Dev server should only be used for
      experimentation with Vault features.

  - name: VAULT_dev_mode_token
    default: "abc123!"
    since: "1.17.0"
    sensitive: true
    description: >
      The value of the vault token to use if in development mode
      (`VAULT_use_dev_mode` is set to `true`).

  - name: VAULT_volume_map_data
    default: "false"
    since: "1.5.0"
    description: >
      Volume map data folder into the Vault service

  - name: VAULT_username
    default: ""
    since: "1.18.0"
    description: >
      The name of the inital user for Vault, if set to a value, then `userpass`
      authentication method will automatically be enabled.

  - name: VAULT_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the inital user for Vault.
