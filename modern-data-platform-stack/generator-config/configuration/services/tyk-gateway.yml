name: Tyk Gateway
id: tyk-gateway
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://tyk.io/open-source-api-gateway/
  documentation: https://tyk.io/docs/tyk-oss-gateway/
  github: https://github.com/TykTechnologies/tyk

description: >
  Tyk is an open source Enterprise API Gateway, supporting REST, GraphQL, TCP
  and gRPC protocols.

enable:
  platys_init: TYK_GATEWAY
  example: |
    platys init --enable-services TYK
    platys gen

parameters:
  - name: TYK_GATEWAY_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Tyk API Gateway service

  - name: TYK_GATEWAY_edition
    default: "oss"
    since: "1.16.0"
    allowed_values: [oss, pro]
    description: >
      The edition of Tyk to use, either `oss` for Open Source or `pro` for
      Professional edition.

  - name: TYK_GATEWAY_secret
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      The secret for the gateway.

