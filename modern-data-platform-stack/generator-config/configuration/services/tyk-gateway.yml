name: Tyk Gateway
id: tyk-gateway
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://tyk.io/open-source-api-gateway/
  documentation: https://tyk.io/docs/tyk-oss-gateway/
  github: https://github.com/TykTechnologies/tyk

description: >
  Tyk is an open source Enterprise API Gateway, supporting REST, GraphQL, TCP
  and gRPC protocols.

enable:
  platys_init: TYK
  example: |
    platys init --enable-services TYK
    platys gen

parameters:
  - name: TYK_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Tyk API Gateway service

  - name: TYK_edition
    default: "oss"
    since: "1.16.0"
    description: >
      The edition of Tyk to use, either `oss` for Open Source or `pro` for
      Professional edition.

  - name: TYK_secret
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      The secret for the gateway.

  - name: TYK_PUMP_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Tyk Pump service

  - name: TYK_PUMP_backend_type
    default: "mongo"
    since: "1.16.0"
    description: >
      Backend to use for Tyk Pump, either `mongo`, `postgres` or `kafka`
