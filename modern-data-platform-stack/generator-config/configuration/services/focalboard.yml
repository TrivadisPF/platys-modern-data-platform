name: Focalboard
id: focalboard
category:
  id: 19_tools
  name: tools
  color: silver
arch: [x86-64]

links:
  website: https://www.focalboard.com/
  documentation: https://github.com/mattermost/focalboard/#readme
  github: https://github.com/mattermost/focalboard/

description: >
  Focalboard is an open source, self-hosted alternative to Trello, Notion, and
  Asana.

enable:
  platys_init: FOCALBOARD
  example: |
    platys init --enable-services FOCALBOARD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28324>.

parameters:
  - name: FOCALBOARD_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Focalboard service

  - name: FOCALBOARD_volume_map_db_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map `db-data` folder into the Focalboard service.
