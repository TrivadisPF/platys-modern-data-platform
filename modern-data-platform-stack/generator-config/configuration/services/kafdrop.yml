name: Kafdrop
id: kafdrop
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  documentation: https://github.com/obsidiandynamics/kafdrop
  github: https://github.com/obsidiandynamics/kafdrop

description: >
  Kafdrop is a web UI for viewing Kafka topics and browsing consumer groups.
  The tool displays information such as brokers, topics, partitions, consumers,
  and lets you view messages.

enable:
  platys_init: KAFDROP
  example: |
    platys init --enable-services KAFDROP
    platys gen

usage:
  - title: Connect to Kafdrop
    content: |
      Navigate to <http://dataplatform:28110>

parameters:
  - name: KAFDROP_enable
    default: "false"
    since: "1.2.0"
    description: >
      Kafdrop is a Kafka UI service, which can be used to administer and managed
      a Kafka cluster.
