name: Cedalo Management Center
id: cedalo-mc
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://cedalo.com/
  documentation: https://docs.cedalo.com/management-center/2.2/mc-overview/
  github: https://github.com/cedalo/management-center

description: >
  The Cedalo Management Center allows to easily manage instances of Eclipse
  Mosquitto, e.g., to manage the new dynamic security feature.

enable:
  platys_init: CEDALO_MANAGEMENT_CENTER
  example: |
    platys init --enable-services CEDALO_MANAGEMENT_CENTER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28175> and login as user `cedalo` with password `abc123!`.

parameters:
  - name: CEDALO_MANAGEMENT_CENTER_enable
    default: "false"
    since: "1.9.0"
    description: >
      Generate the Cedalo Management Center for Mosquitto MQTT broker.

  - name: CEDALO_MANAGEMENT_CENTER_username
    default: "cedalo"
    since: "1.16.0"
    description: >
      The name of the cedalo default user.

  - name: CEDALO_MANAGEMENT_CENTER_password
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      The password of the cedalo default user.
