name: CMAK
id: cmak
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/yahoo/CMAK
  documentation: https://github.com/yahoo/CMAK
  github: https://github.com/yahoo/CMAK

description: >
  CMAK (Cluster Manager for Apache Kafka) is a tool for managing Apache Kafka clusters.

enable:
  platys_init: CMAK
  example: |
    platys init --enable-services CMAK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28104>

parameters:
  - name: CMAK_enable
    default: "false"
    since: "1.3.0"
    description: >
      Generate CMAK (Cluster Manger for Apache Kafka) service (used to be Kafka
      Manager)

  - name: CMAK_auth_enabled
    default: "false"
    since: "1.7.0"
    description: >
      if set to true then the manager will be secured with basic authentication

  - name: CMAK_username
    default: "admin"
    since: "1.7.0"
    description: >
      the username to use for basic auth

  - name: CMAK_password
    default: "abc123!"
    since: "1.7.0"
    sensitive: true
    description: >
      the password to use for basic auth
