name: Chronograf
id: chronograf
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://www.influxdata.com/time-series-platform/chronograf/
  documentation: https://docs.influxdata.com/chronograf/v1.7
  github: https://github.com/influxdata/chronograf

description: >
  Chronograf is InfluxData’s open source web application. Use Chronograf with
  the other components of the TICK stack to visualize your monitoring data and
  easily create alerting and automation rules.

enable:
  platys_init: INFLUXDB,
  example: |
    platys init --enable-services INFLUXDB,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28129>

parameters:
  - name: INFLUXDB_CHRONOGRAF_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Chronograf service

  - name: INFLUXDB_CHRONOGRAF_volume_map_data
    default: "false"
    since: "1.1.0"
    description: >
      Volume map data folder into the Chronograf service
