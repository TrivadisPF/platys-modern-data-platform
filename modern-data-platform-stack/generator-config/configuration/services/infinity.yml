name: Infinity
id: infinity
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://infiniflow.org/
  documentation: https://infiniflow.org/docs/category/get-started
  github: https://github.com/infiniflow/infinity

description: >
  The AI-native database built for LLM applications, providing incredibly fast
  hybrid search of dense vector, sparse vector, tensor (multi-vector), and
  full-text.

enable:
  platys_init: INFINITY
  example: |
    platys init --enable-services INFINITY
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:23820> for the Infinity UI.

parameters:
  - name: INFINITY_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Infinity service

  - name: INFINITY_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into service.

  - name: INFINITY_mem_limit
    default: "8073741824"
    since: "1.18.0"
    description: >
      The maximum amount of the memory, in bytes, that the Infinity can use while
      running.
