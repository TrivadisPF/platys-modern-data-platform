name: Elasticsearch Exporter
id: elasticsearch-exporter
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  documentation: https://github.com/prometheus-community/elasticsearch_exporter
  github: https://github.com/prometheus-community/elasticsearch_exporter

description: >
  Elasticsearch stats exporter for Prometheus.

enable:
  platys_init: ELASTICSEARCH
  example: |
    platys init --enable-services ELASTICSEARCH
    platys gen

parameters:
  - name: ELASTICSEARCH_EXPORTER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Elasticsearch Exporter.
