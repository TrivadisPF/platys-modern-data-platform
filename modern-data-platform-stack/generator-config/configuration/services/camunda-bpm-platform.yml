name: Camunda BPM Platform
id: camunda-bpm-platform
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://camunda.com/products/camunda-platform/
  documentation: https://docs.camunda.org/manual/latest

description: >
  A complete process automation tech stack with powerful execution engines for
  BPMN workflows and DMN decisions, combined with essential applications for
  modeling, operations, and analytics.

enable:
  platys_init: CAMUNDA_BPM_PLATFORM
  example: |
    platys init --enable-services CAMUNDA_BPM_PLATFORM
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28263/camunda-welcome/index.html>.
      
      User: demo, Password: demo

parameters:
  - name: CAMUNDA_BPM_PLATFORM_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Camunda BPM Platform service
