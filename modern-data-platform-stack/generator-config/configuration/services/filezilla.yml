name: FileZilla
id: filezilla
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://filezilla-project.org/
  documentation: https://wiki.filezilla-project.org/Documentation

description: >
  ```bash platys init --enable-services FILEZILLA platys gen ```

enable:
  platys_init: FILEZILLA
  example: |
    platys init --enable-services FILEZILLA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5800>.

parameters:
  - name: FILEZILLA_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate FileZilla service
