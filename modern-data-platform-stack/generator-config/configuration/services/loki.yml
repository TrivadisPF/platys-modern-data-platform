name: Grafana Loki
id: loki
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64, arm]

links:
  website: https://grafana.com/oss/loki/
  documentation: https://grafana.com/docs/loki/latest/
  github: https://github.com/grafana/loki

description: >
  Like Prometheus, but for logs. Grafana Loki is a set of components that can
  be composed into a fully featured logging stack.

enable:
  platys_init: LOKI
  example: |
    platys init --enable-services LOKI
    platys gen

parameters:
  - name: LOKI_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Loki service
