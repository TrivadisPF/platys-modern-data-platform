name: Cloudbeaver
id: cloudbeaver
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://cloudbeaver.io/
  documentation: https://cloudbeaver.io/docs/
  github: https://github.com/dbeaver/cloudbeaver

description: >
  Light and friendly interface for your datasources

enable:
  platys_init: CLOUDBEAVER
  example: |
    platys init --enable-services CLOUDBEAVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8978>

parameters:
  - name: CLOUDBEAVER_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Cloudbeaver RDBMS Admin UI service

  - name: CLOUDBEAVER_volume_map_workspace
    default: "false"
    since: "1.12.0"
    description: >
      Volume map workspace folder into the Cloudbeaver service

  - name: CLOUDBEAVER_admin_username
    default: ""
    since: "1.18.0"
    description: >
      The cloudbeaver admin username

  - name: CLOUDBEAVER_admin_password
    default: "Abc123!abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The cloudbeaver admin password
