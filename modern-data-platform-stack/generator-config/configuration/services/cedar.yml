name: Cedar Agent
id: cedar
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.cedarpolicy.com/en
  documentation: https://docs.cedarpolicy.com/
  github: https://github.com/permitio/cedar-agent

description: >
  Cedar-agent is the easiest way to deploy and run Cedar.

enable:
  platys_init: CEDAR
  example: |
    platys init --enable-services CEDAR
    platys gen

usage:
  - title: Usage
    content: |
      ```
      curl -X GET http://localhost:28409/v1/policies
      ```

parameters:
  - name: CEDAR_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Cedar service.

  - name: CEDAR_agent_authentication
    default: ""
    since: "1.18.0"
    description: >
      Generate Cedar service.

  - name: CEDAR_log_level
    default: "info"
    since: "1.18.0"
    description: >
      the log level of the Cedar service

  - name: CEDAR_schema
    default: ""
    since: "1.18.0"
    description: >
      Enable Cedar Agent.

  - name: CEDAR_data
    default: ""
    since: "1.18.0"
    description: >
      Enable Cedar Agent.

  - name: CEDAR_policies
    default: ""
    since: "1.18.0"
    description: >
      Enable Cedar Agent.
