name: DataStax Studio
id: datastax-studio
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.datastax.com/dev/datastax-studio
  documentation: https://docs.datastax.com/en/landing_page/doc/landing_page/docList.html#Studio

description: >
  Designed to facilitate Cassandra Query Language (CQL), Graph/Gremlin, and
  Spark SQL language development, DataStax Studio has all the tools needed for
  ad hoc queries, visualizing and exploring data sets, profiling performance
  and comes with a notebook interface that fuels collaboration.

enable:
  platys_init: DATASTAX
  example: |
    platys init --enable-services DATASTAX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28121>

parameters:
  - name: DATASTAX_STUDIO_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable DataStax Studio.
