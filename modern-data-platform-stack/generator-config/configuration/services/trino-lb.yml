name: "Trino-LB (LoadBalancer)"
id: trino-lb
category:
  id: 11_query
  name: query
  color: teal
arch: [x86-64]

links:
  documentation: https://github.com/stackabletech/trino-lb/
  github: https://github.com/stackabletech/trino-lb

description: >
  Trino load balancer with support for routing, queueing and auto-scaling.

enable:
  platys_init: TRINO,TRINO_LB
  example: |
    platys init --enable-services TRINO,TRINO_LB
    platys gen

parameters:
  - name: TRINO_LB_enable
    default: "false"
    since: "1.19.0"
    description: >
      Enable Trino LB (Load Balancer) service.

  - name: TRINO_LB_config_file_name
    default: "simple-single-trino.yaml"
    since: "1.19.0"
    description: >
      The name of a pre-defined config file within the `conf` folder. Specify the
      file name including the extension.

  - name: TRINO_LB_volume_map_custom_config_file
    default: "false"
    since: "1.19.0"
    description: >
      Should the file `trino-lb-config.yaml` from the `custom-conf` folder be
      used to configure Trino-LB?

  - name: TRINO_LB_max_running_queries
    default: "1"
    since: "1.19.0"
    description: >
      The number of queries a cluster accepts. Once a cluster has more running
      queries than this no further queries will be send to it and they will be
      queued in trino-lb instead.
