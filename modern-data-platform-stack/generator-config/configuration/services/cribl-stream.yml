name: Cribl Stream
id: cribl-stream
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64, arm]

links:
  website: https://cribl.io/
  documentation: https://docs.cribl.io/stream/
  github: https://github.com/criblio/

description: >
  Cribl Stream helps you process machine data – logs, instrumentation data,
  application data, metrics, etc. – in real time, and deliver them to your
  analysis platform of choice.

enable:
  platys_init: CRIBL_STREAM
  example: |
    platys init --enable-services CRIBL_STREAM
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28329> and login as User `admin` with password `admin`.

parameters:
  - name: CRIBL_STREAM_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Cribl Stream service

  - name: CRIBL_STREAM_workers
    default: "1"
    since: "1.17.0"
    description: >
      Number of Cribl Stream workers, if started in distributed mode

  - name: CRIBL_STREAM_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map Cribl data folder?
