name: Supabase
id: supabase
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://supabase.com/
  documentation: https://supabase.com/docs
  github: https://github.com/supabase/supabase

description: >
  The open source Firebase alternative. Supabase gives you a dedicated Postgres
  database to build your web, mobile, and AI applications.

enable:
  platys_init: SUPABASE
  example: |
    platys init --enable-services SUPABASE
    platys gen

parameters:
  - name: SUPABASE_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Supabase.
