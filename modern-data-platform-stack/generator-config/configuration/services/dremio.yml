name: Dremio
id: dremio
category:
  id: 11_query
  name: query
  color: teal
arch: [x86-64]

links:
  website: https://www.dremio.com/
  documentation: https://docs.dremio.com/
  github: https://github.com/dremio/dremio-oss

description: >
  Dremio's Data Lake Engine delivers lightning fast query speed and a
  self-service semantic layer operating directly against your data lake
  storage.

enable:
  platys_init: DREMIO
  example: |
    platys init --enable-services DREMIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9047>

parameters:
  - name: DREMIO_enable
    default: "false"
    since: "1.2.0"
    description: >
      Enable Dremio service.
