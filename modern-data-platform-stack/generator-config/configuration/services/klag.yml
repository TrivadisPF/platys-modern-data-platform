name: Klag
id: klag
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/themoah/klag
  github: https://github.com/themoah/klag

description: >
  New kafka lag exporter.

enable:
  platys_init: KLAG
  example: |
    platys init --enable-services KLAG
    platys gen

parameters:
  - name: KLAG_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate New Kafka Lag Exporter service

  - name: KLAG_mcp_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Enable the MCP (Model Context Protocol) server endpoint on KLag

  - name: KLAG_mcp_auth_token
    default: ""
    since: "1.20.0"
    description: >
      Authentication token for the KLag MCP server endpoint; if empty the endpoint is unauthenticated
