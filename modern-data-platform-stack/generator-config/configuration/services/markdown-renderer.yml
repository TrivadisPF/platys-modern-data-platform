name: Markdown Renderer
id: markdown-renderer
category:
  id: 19_tools
  name: tools
  color: silver
arch: [x86-64]


description: >
  Renders the Services list page and is automatically activated.

enable:
  platys_init: MARKDOWN_RENDERER
  example: |
    platys init --enable-services MARKDOWN_RENDERER
    platys gen

parameters:
  - name: MARKDOWN_RENDERER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Markdown Renderer.
