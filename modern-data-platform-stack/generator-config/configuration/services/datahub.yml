name: DataHub
id: datahub
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://datahubproject.io/
  documentation: https://datahubproject.io/docs/
  github: https://github.com/linkedin/datahub

description: >
  Data ecosystems are diverse — too diverse. DataHub's extensible metadata
  platform enables data discovery, data observability and federated governance
  that helps you tame this complexity.

enable:
  platys_init: DATAHUB
  example: |
    platys init --enable-services DATAHUB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28144>.
      
      Log in with user `datahub` and password `datahub`.
  - title: How to change the password of the `datahub`user?
    content: |
      Create a file `user.props` in `./security/datahub` and add a line with `datahub:<password>`
      
      ```
      datahub:abc123!
      ```
      
      Enable the mapping of `user.props` into the docker container
      
      ```yaml
            DATAHUB_map_user_props: true
      ```
      
      and re-run `platys gen`.

parameters:
  - name: DATAHUB_enable
    default: "false"
    since: "1.4.0"
    description: >
      Generate DataHub service

  - name: DATAHUB_volume_map_data
    default: "false"
    since: "1.4.0"
    description: >
      should the data of the databases be mapped to the outside of the container.

  - name: DATAHUB_mae_consumer_standalone
    default: "false"
    since: "1.13.0"
    description: >
      enable standalone MAE consumer? If set to `false`, the MAE will be started
      as part of the GMS service.

  - name: DATAHUB_mce_consumer_standalone
    default: "false"
    since: "1.13.0"
    description: >
      enable standalone MCE consumer? If set to `false`, the MAE will be started
      as part of the GMS service.

  - name: DATAHUB_ui_ingestion_enabled
    default: "true"
    since: "1.16.0"
    description: >
      enable ingestion over DataHub UI.

  - name: DATAHUB_ui_ingestion_default_cli_version
    default: "1.3.1.7"
    since: "1.19.1"
    description: >
      Which DataHub CLI does the UI try to install and run? Will be used by the
      UI ingestion for installing additional python dependencies (requirements).

  - name: DATAHUB_analytics_enabled
    default: "false"
    since: "1.16.0"
    description: >
      enable DataHub client-side analytics.

  - name: DATAHUB_use_kibana
    default: "false"
    since: "1.14.0"
    description: >
      enable Kibana service on the Eleasticsearch database of DataHub.

  - name: DATAHUB_auth_policies_enabled
    default: "true"
    since: "1.14.0"
    description: >
      enable the Policies feature?

  - name: DATAHUB_telemetry_enabled
    default: "false"
    since: "1.16.0"
    description: >
      enable sending of Telemetry to the DataHub project?

  - name: DATAHUB_precreate_topics
    default: "true"
    since: "1.16.0"
    description: >
      pre-create Kafka Topics on startup?

  - name: DATAHUB_graph_service_impl
    default: "neo4j"
    since: "1.14.0"
    description: >
      The Graph database to be used as the backend, either one of `neo4j` or
      `elasticsearch`.

  - name: DATAHUB_graph_service_diff_mode_enabled
    default: "true"
    since: "1.16.0"
    description: >
      enable diff mode for graph writes?

  - name: DATAHUB_search_service_impl
    default: "elasticsearch"
    since: "1.17.0"
    description: >
      The Search database to be used as the backend, either one of
      `elasticsearch` or `opensearch`.

  - name: DATAHUB_provision_sample_data
    default: "false"
    since: "1.14.0"
    description: >
      Should sample data be provisioned?

  - name: DATAHUB_secret
    default: "abc123!abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      Allows for changing the datahub secret.

  - name: DATAHUB_map_user_props
    default: "false"
    since: "1.16.0"
    sensitive: true
    description: >
      Map the `user.props` file from `./secret/datahub` into the
      `datahub-frontend-react` container for changing the `datahub` user password
      or for adding new users.

  - name: DATAHUB_actions_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable the Datahub actions service