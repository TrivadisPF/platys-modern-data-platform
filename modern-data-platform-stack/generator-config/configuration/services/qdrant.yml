name: Qdrant
id: qdrant
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://qdrant.tech/
  documentation: https://qdrant.tech/documentation
  github: https://github.com/qdrant/qdrant

description: >
  Chroma is a database for building AI applications with embeddings. It comes
  with everything you need to get started built in, and runs on your machine.

enable:
  platys_init: QDRANT
  example: |
    platys init --enable-services QDRANT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:6333/dashboard>.

parameters:
  - name: QDRANT_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Qdrant service

  - name: QDRANT_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder into service.

  - name: QDRANT_enable
    default: "false"
