name: Lakekeeper
id: lakekeeper
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://docs.lakekeeper.io/
  documentation: https://docs.lakekeeper.io/docs/nightly/concepts/
  github: https://github.com/lakekeeper/lakekeeper

description: >
  Lakekeeper is an Apache-Licensed, secure, fast and easy to use Apache Iceberg
  REST Catalog written in Rust.

enable:
  platys_init: LAKEKEEPER,POSTGRESQL
  example: |
    platys init --enable-services LAKEKEEPER,POSTGRESQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28275>.

parameters:
  - name: LAKEKEEPER_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Lakekeeper service

  - name: LAKEKEEPER_secret_backend
    default: "postgres"
    since: "1.19.0"
    sensitive: true
    description: >
      The secret backend to use, either `postgres` or `kv2` (hashicorp vault).
      For `kv2` you need to set `VAULT_enable` to `true`.

  - name: LAKEKEEPER_publish_events_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Publish events to an event store? Set the event store in the
      `LAKEKEEPER_publish_events_to` configuratio setting.

  - name: LAKEKEEPER_publish_events_to
    default: "kafka"
    since: "1.19.0"
    description: >
      The event store to use for publishing events, either `kafka` or `nats`.

  - name: LAKEKEEPER_log_events_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Log the events?
