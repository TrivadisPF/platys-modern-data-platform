name: Chroma
id: chroma
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.trychroma.com/
  documentation: https://docs.trychroma.com/
  github: https://github.com/chroma-core/chroma

description: >
  Chroma is a database for building AI applications with embeddings. It comes
  with everything you need to get started built in, and runs on your machine.

enable:
  platys_init: CHROMA
  example: |
    platys init --enable-services CHROMA
    platys gen

parameters:
  - name: CHROMA_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Chroma service

  - name: CHROMA_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder into service.

  - name: CHROMA_auth_token
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      To enable authentication, set the auth token.

  - name: CHROMA_enable_telemetry
    default: "false"
    since: "1.18.0"
    description: >
      Enable telemetry?
