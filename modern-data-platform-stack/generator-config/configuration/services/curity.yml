name: Curity Identity Server
id: curity
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://curity.io/
  documentation: https://curity.io/resources/getting-started/
  github: https://github.com/curityio

description: >
  The Community Edition is a free version of the Curity Identity Server
  enabling any organization or individual to secure their APIs and provide a
  great login experience to users.

enable:
  platys_init: CURITY
  example: |
    platys init --enable-services CURITY
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <https://dataplatform:6749> and log-in with user `admin` and the password specified in the `config.yml` file (defaults to `abc123!`).

parameters:
  - name: CURITY_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Curity service

  - name: CURITY_logging_level
    default: "INFO"
    since: "1.16.0"
    description: >
      Logging level

  - name: CURITY_password
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      The password of the `admin` user

  - name: CURITY_volume_map_license_file
    default: "false"
    since: "1.16.0"
    description: >
      Map the `license.json` file with the Curity license into the container. The
      file has to be placed unter `./licenses/curity/`. A license can also be
      specified/uploaded through the Admin UI.
