name: MinIO
id: minio
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://min.io/
  documentation: https://docs.min.io/minio/baremetal/
  github: https://github.com/minio/minio

description: >
  High Performance, Kubernetes Native Object Storage.

enable:
  platys_init: MINIO
  example: |
    platys init --enable-services MINIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9000>.
      
      Login with username `V42FCGRVMK24JJ8DHUYG` and password `bKhWxVF3kQoLY9kFmt91l+tDrEoZjqnWXzY9Eza` (if left to defaults).

parameters:
  - name: MINIO_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Minio service

  - name: MINIO_edition
    default: "minio"
    since: "1.20.0"
    description: >
      The MinIO edition to use. Use `community` for the legacy community edition
      or `aistor` for the new AIStore with free, enterprise lite and enterprise
      edition.

  - name: MINIO_aistor_license
    default: "minio"
    since: "1.20.0"
    description: >
      The aistor license if `MINIO_edition` is set to `aistor`.

  - name: MINIO_volume_map_data
    default: "false"
    since: "1.1.0"
    description: >
      Volume map data folder into the Minio service

  - name: MINIO_access_key
    default: "admin"
    since: "1.9.0"
    description: >
      The access key to be used for MinIO.

  - name: MINIO_secret_key
    default: "abc123abc123!"
    since: "1.9.0"
    sensitive: true
    description: >
      The secret key to be used for MinIO.

  - name: MINIO_admin_bucket_name
    default: "admin-bucket"
    since: "1.20.0"
    description: >
      The name of the admin bucket to create and use.

  - name: MINIO_buckets
    default: ""
    since: "1.16.0"
    description: >
      A comma separated list of buckets to create upon start.

  - name: MINIO_browser_enabled
    default: "true"
    since: "1.10.0"
    description: >
      To disable web browser access, set this value to `false`.

  - name: MINIO_upload_data_transfer_to_bucket_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Upload the content of the `/data-transfer` folder into Minio upon startup
      of the container. The bucket name is specified in
      `MINIO_upload_data_transfer_bucket_name`.

  - name: MINIO_upload_data_transfer_bucket_name
    default: "data-transfer-bucket"
    since: "1.18.0"
    description: >
      The name of the bucket to upload the data to.

  - name: MINIO_audit_webhook_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enable MinIO audit webhook service?

  - name: MINIO_audit_webhook_endpoint
    default: ""
    since: "1.17.0"
    description: >
      The HTTP endpoint of the audit webhook service.

  - name: MINIO_audit_webhook_auth_token
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      An authentication token of the appropriate type for the audit webhook
      service endpoint. Omit for endpoints which do not require authentication.

  - name: MINIO_audit_kafka_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Configure MinIO to publish audit logs to a Kafka broker.

  - name: MINIO_audit_kafka_topic
    default: "minio-audit-log"
    since: "1.17.0"
    description: >
      The name of the Kafka topic where MinIO audit log events should be
      published to.

  - name: MINIO_notify_snyc_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enables synchronous bucket notifications.

  - name: MINIO_notify_webhook_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enable bucket notification notifications webhook service?

  - name: MINIO_notify_webhook_endpoint
    default: ""
    since: "1.17.0"
    description: >
      The HTTP endpoint of the notify webhook service.

  - name: MINIO_notify_webhook_auth_token
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      An authentication token of the appropriate type for the bucket notification
      webhook service endpoint. Omit for endpoints which do not require
      authentication.

  - name: MINIO_notify_kafka_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Configure MinIO to publish bucket notifications to a Kafka broker.

  - name: MINIO_notify_kafka_topic
    default: "minio-notify-log"
    since: "1.17.0"
    description: >
      The name of the Kafka topic where MinIO bucket notification events should
      be published to.

  - name: MINIO_notify_mqtt_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Configure MinIO to publish bucket notifications to a MQTT broker.

  - name: MINIO_notify_mqtt_broker_endpoint
    default: "tcp://mosquitto-1:1883"
    since: "1.17.0"
    description: >
      The name of the MQTT server/broker endpoint where MinIO bucket notification
      events should be published to. MinIO supports TCP, TLS or Websocket
      connections.

  - name: MINIO_notify_mqtt_topic
    default: "minio-notify-log"
    since: "1.17.0"
    description: >
      The name of the MQTT topic where MinIO bucket notification events should be
      published to.

  - name: MINIO_notify_mqtt_username
    default: ""
    since: "1.17.0"
    description: >
      The MQTT username with which MinIO authenticates to the MQTT server/broker.

  - name: MINIO_notify_mqtt_password
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      The MQTT password with which MinIO authenticates to the MQTT server/broker.

  - name: MINIO_notify_redis_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Configure MinIO to publish bucket notifications to a Redis database.

  - name: MINIO_notify_redis_endpoint
    default: "redis-1:6379/0"
    since: "1.17.0"
    description: >
      The name of the Redis endpoint where MinIO bucket notification events
      should be published to.

  - name: MINIO_notify_redis_key
    default: "minio-key"
    since: "1.17.0"
    description: >
      Specify the Redis key to use for storing and updating events. Redis
      auto-creates the key if it does not exist.

  - name: MINIO_notify_redis_format
    default: "namespace"
    since: "1.17.0"
    description: >
      Specify the format of event data written to the Redis service endpoint.
      Either `namespace` or `access`.

  - name: MINIO_notify_redis_password
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      The password with which MinIO authenticates to the Redis database.

  - name: MINIO_lambda_webhook_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enable HTTP webhook endpoint for triggering an Object Lambda webhook
      endpoint?

  - name: MINIO_lambda_webhook_endpoint
    default: ""
    since: "1.17.0"
    description: >
      The HTTP endpoint of the Object Lambda webhook endpoint for a handler
      function.

  - name: MINIO_labmda_webhook_auth_token
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      An authentication token of the appropriate type for the lambda webhook
      service endpoint. Omit for endpoints which do not require authentication.

  - name: MINIO_key_encryption_service_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable MinIO Key Encryption Service (KES).

  - name: MINIO_policy_plugin_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable external authorization management using the MinIO Access Management
      Plugin.

  - name: MINIO_policy_type
    default: "opa"
    since: "1.18.0"
    description: >
      The policy engine to invoke, currently support for `opa` only. Will
      determine the wehook endoint to invoke.

  - name: MINIO_policy_namespace
    default: ""
    since: "1.18.0"
    description: >
      The policy namespace to use.

  - name: MINIO_policy_token
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The authentication token to present to the configured webhook endpoint.
