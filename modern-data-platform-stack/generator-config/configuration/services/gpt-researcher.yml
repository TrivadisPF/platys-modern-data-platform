name: GPT Researcher
id: gpt-researcher
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://docs.gptr.dev/docs/gpt-researcher/introduction
  github: https://github.com/assafelovic/gpt-researcher

description: >
  GPT based autonomous agent that does online comprehensive research on any
  given topic

enable:
  platys_init: GPT_RESEARCHER
  example: |
    platys init --enable-services GPT_RESEARCHER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28353>.

parameters:
  - name: GPT_RESEARCHER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate GPT Researcher service

  - name: GPT_RESEARCHER_llm_provider
    default: "openai"
    since: "1.18.0"
    description: >
      The LLM provider, either `openai` or `ollama` or `groq`

  - name: GPT_RESEARCHER_embedding_provider
    default: "false"
    since: "1.18.0"
    description: >
      The Embeddings provider, either `openai` or `ollama` or `groq`

  - name: GPT_RESEARCHER_fast_llm_model
    default: ""
    since: "1.18.0"
    description: >
      The fast LLM model to use, must be supported by the LLM provider

  - name: GPT_RESEARCHER_retriever
    default: "tavily"
    since: "1.18.0"
    description: >
      The Retriever API to use, either `tavily`, `yahoo`, `google`, `searx`,
      `serpapi`, `googleSerp`, `duckduckgo`, `bing` or `ArxivSearch`.

  - name: GPT_RESEARCHER_retriever_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The Retriever API key used for web searches.

  - name: GPT_RESEARCHER_retriever_api_key2
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      A second Retriever API key used for web searches (only necessary for
      `google`).

  - name: GPT_RESEARCHER_retriever_url
    default: ""
    since: "1.18.0"
    description: >
      The URL of the Retriever service used for web searches.

  - name: GPT_RESEARCHER_langchain_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The Langchain API key
