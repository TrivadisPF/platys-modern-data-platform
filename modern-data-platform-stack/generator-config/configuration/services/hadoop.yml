name: Apache Hadoop
id: hadoop
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://hadoop.apache.org/
  documentation: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/SingleCluster.html
  github: https://github.com/apache/hadoop

description: >
  The Apache™ Hadoop® project develops open-source software for reliable,
  scalable, distributed computing.

enable:
  platys_init: HADOOP
  example: |
    platys init --enable-services HADOOP
    platys gen

parameters:
  - name: HADOOP_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Hadoop services

  - name: HADOOP_datanodes
    default: "2"
    since: "1.0.0"
    description: >
      number of Hadoop Datanodes
