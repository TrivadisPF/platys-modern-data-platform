name: FUXA
id: fuxa
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://github.com/frangoteam/FUXA
  documentation: https://github.com/frangoteam/FUXA/wiki
  github: https://github.com/frangoteam/FUXA

description: >
  Web-based Process Visualization (SCADA/HMI/Dashboard) software.

enable:
  platys_init: FUXA
  example: |
    platys init --enable-services FUXA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:1881> for the FUXA UI.

parameters:
  - name: FUXA_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate FUXA service
  - name: FUXA_volume_map_data
    default: "false"
    since: "1.21.0"
    description: >
      Map the `_appdata`, `_db`, `_logs` and `_images` folders to `./container-volume/fuxa/`
