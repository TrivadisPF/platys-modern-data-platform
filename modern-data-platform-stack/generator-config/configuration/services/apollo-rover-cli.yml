name: Apollo Rover CLI
id: apollo-rover-cli
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.apollographql.com/docs/rover
  documentation: https://www.apollographql.com/docs/rover
  github: https://github.com/apollographql/rover
  docker: https://github.com/apollographql/rover/pkgs/container/rover

description: >
  Rover is the command-line interface for Apollo GraphOS. In the Platys platform it runs as a
  long-lived utility container with the required plugins (i.e. supergraph) installed, so you can
  compose supergraphs from your subgraphs with docker exec.

enable:
  platys_init: APOLLO_ROVER_CLI
  example: |
    platys init --enable-services APOLLO_ROVER_CLI
    platys gen

usage:
  - title: Usage
    content: |
      The platform folder is mounted at /workspace. Run rover through docker exec, i.e.
      docker exec apollo-rover-cli rover supergraph compose --config custom-conf/hive-router/supergraph.yaml

parameters:
  - name: APOLLO_ROVER_CLI_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Apollo Rover CLI container.

  - name: APOLLO_ROVER_CLI_plugins
    default: ""
    since: "1.21.0"
    description: >
      Comma-separated list of rover plugins installed on container start, one
      rover plugin install command per entry (i.e. supergraph@2,subgraph@2).

  - name: APOLLO_ROVER_CLI_log_level
    default: ""
    since: "1.21.0"
    description: >
      Log level of rover (error, warn, info, debug, trace), set through the APOLLO_LOG_LEVEL
      environment variable. Leave empty to not set it.
