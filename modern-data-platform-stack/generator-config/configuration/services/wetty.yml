name: Wetty (Web TTY)
id: wetty
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.hivemq.com/docs/hivemq/3.4/web-ui/introduction.html
  documentation: https://www.hivemq.com/docs/hivemq/3.4/web-ui/introduction.html
  github: https://github.com/hivemq/hivemq-mqtt-web-client

description: >
  Terminal in browser over http/https. (Ajaxterm/Anyterm alternative, but much
  better)

enable:
  platys_init: WETTY
  example: |
    platys init --enable-services WETTY
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3001>

parameters:
  - name: WETTY_enable
    default: "false"
    since: "1.9.0"
    description: >
      Generate WeTTY service (Terminal over HTTP)
