name: Conduit
id: conduit
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://conduit.io/
  documentation: https://www.conduit.io/docs/introduction/getting-started
  github: https://github.com/ConduitIO/conduit

description: >
  Conduit is a data integration tool for software engineers. Its purpose is to
  help you move data from A to B. You can use Conduit to send data from Kafka
  to Postgres, between files and APIs, between supported connectors, and any
  datastore you can build a plugin for.

enable:
  platys_init: CONDUIT
  example: |
    platys init --enable-services CONDUIT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28269>.

parameters:
  - name: CONDUIT_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Conduit service
