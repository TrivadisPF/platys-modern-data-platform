name: Quine
id: quine
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://quine.io/
  documentation: https://quine.io/docs/about-quine/what-is-quine
  github: https://github.com/thatdot/quine

description: >
  Quine is a freely available streaming graph that connects to your existing
  data streams and builds high-volume data into a stateful graph. Quine
  efficiently analyzes that graph for the “standing queries” you specify and
  streams results out immediately to trigger real-time event-driven workflows.

enable:
  platys_init: QUINE
  example: |
    platys init --enable-services QUINE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http:/dataplatform:28268>.

parameters:
  - name: QUINE_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Quine service
