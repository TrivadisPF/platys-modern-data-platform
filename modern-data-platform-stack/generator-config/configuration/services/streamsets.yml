name: StreamSets Data Collector Engine
id: streamsets
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://streamsets.com/products/dataops-platform/data-collector-engine/
  documentation: https://docs.streamsets.com/portal/#datacollector/latest/help/index.html
  github: https://github.com/streamsets/datacollector-oss

description: >
  StreamSets Data Collector is a lightweight, powerful design and execution
  engine that streams data in real time. Use Data Collector to route and
  process data in your data streams.

enable:
  platys_init: STREAMSETS
  example: |
    platys init --enable-services STREAMSETS
    platys gen

usage:
  - title: Connect to StreamSets Data Collector Engine
    content: |
      Navigate to <http://dataplatform:18630>

parameters:
  - name: STREAMSETS_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate StreamSets service

  - name: STREAMSETS_volume_map_data
    default: "false"
    since: "1.1.0"
    description: >
      Volume map StreamSets data folder

  - name: STREAMSETS_volume_map_logs
    default: "false"
    since: "1.9.0"
    description: >
      Volume map StreamSets logs folder

  - name: STREAMSETS_volume_map_security_policy
    default: "false"
    since: "1.8.0"
    description: >
      Volume map StreamSets `sdc-security.policy` file

  - name: STREAMSETS_activate_https
    default: "false"
    since: "1.2.0"
    description: >
      Activate HTTPS for StreamSets

  - name: STREAMSETS_additional_port_mappings
    default: "0"
    since: "1.2.0"
    description: >
      Number of additional port mappings to add to the StreamSets service. This
      is helpful when working with the HTTP Server component of SDC, so that
      these services can be reached from outside without having to manually
      change the docker-compose.yml.

  - name: STREAMSETS_stage_libs
    default: ""
    since: "1.11.0"
    description: >
      A comma separated list of additional StreamSets Stage Libs to be installed.
      The names can be found here.

  - name: STREAMSETS_enterprise_stage_libs
    default: ""
    since: "1.11.0"
    description: >
      A comma separated list of additional StreamSets Enterprise Stage Libs to be
      installed. The names can be found here.

  - name: STREAMSETS_jdbc_jars
    default: ""
    since: "1.14.0"
    description: >
      A comma separated list of JDBC Jars to be installed, made available in
      `./plugins/streamsets/libs-extras/streamsets-datacollector-jdbc-lib/`.

  - name: STREAMSETS_install_pipelines
    default: "false"
    since: "1.11.0"
    description: >
      Automatically install StreamSets pipelines placed inside
      `./scripts/streamsets/pipelines`?

  - name: STREAMSETS_http_authentication
    default: ""
    since: "1.9.0"
    description: >
      The authentication for the HTTP endpoint of the data collector, one of
      'none', 'basic', 'digest', 'form' or 'aster'

  - name: STREAMSETS_sdc_id
    default: ""
    since: "1.13.0"
    description: >
      Set the `sdc.id` file to the value provided here. The `SDC ID` a.k.a.
      product id is imporant for the activiation of StreamSets, as the Activation
      Code is linked to the product id.

  - name: STREAMSETS_use_external_conf_file
    default: "false"
    since: "1.15.0"
    description: >
      Indicates if an external runtime configuration properties file should be
      used. If set to `true`, then a file named `configuration.properties` should
      be defined in the folder `./custom-conf/streamsets`.
