name: Garage WebUI
id: garage-webui
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  documentation: https://github.com/khairul169/garage-webui
  github: https://github.com/khairul169/garage-webui

description: >
  WebUI for Garage Object Storage Service.

enable:
  platys_init: GARAGE
  example: |
    platys init --enable-services GARAGE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3909>.

parameters:
  - name: GARAGE_WEBUI_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Garage WebUI service

  - name: GARAGE_WEBUI_admin_username
    default: ""
    since: "1.19.0"
    description: >
      The username of the Admin user. If left empty, then the Web UI can be
      accessed without authentication.

  - name: GARAGE_WEBUI_admin_password
    default: "abc123!"
    since: "1.19.0"
    sensitive: true
    description: >
      The password for the Admin user.
