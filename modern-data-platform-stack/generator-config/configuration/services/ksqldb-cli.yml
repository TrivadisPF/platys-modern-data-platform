name: ksqlDB CLI
id: ksqldb-cli
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://ksqldb.io/
  documentation: https://ksqldb.io/quickstart.html
  github: https://github.com/confluentinc/ksql

description: >
  The database purpose-built for stream processing applications. This container
  runs the ksqlDB CLI.

enable:
  platys_init: KAFKA_KSQLDB
  example: |
    platys init --enable-services KAFKA_KSQLDB
    platys gen

usage:
  - title: Running the CLI
    content: |
      ```
      docker exec -it ksqldb-cli ksql http://ksqldb-server-1:8088
      ```

parameters:
  - name: KSQLDB_CLI_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable ksqlDB CLI.
