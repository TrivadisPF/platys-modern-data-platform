name: Stalwart
id: stalwart
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://stalw.art/
  documentation: https://stalw.art/docs/
  github: https://github.com/stalwartlabs/stalwart
  docker: https://hub.docker.com/r/stalwartlabs/stalwart

description: >
  Stalwart is an all-in-one mail and collaboration server supporting SMTP, IMAP, JMAP,
  CalDAV, CardDAV and WebDAV.

enable:
  platys_init: STALWART
  example: |
    platys init --enable-services STALWART
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28513/admin> and sign in as `admin` with the
      password set in `STALWART_admin_password` to complete the initial setup.

parameters:
  - name: STALWART_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Stalwart service

  - name: STALWART_admin_password
    default: "abc123!"
    since: "1.21.0"
    description: >
      The password of the temporary `admin` account used for the initial setup in the Admin UI (sets `STALWART_RECOVERY_ADMIN`). Without it, Stalwart prints a random password once in the log.

  - name: STALWART_volume_map_data
    default: "false"
    since: "1.21.0"
    description: >
      Map the `etc` (configuration) and `data` folders into the container (`/etc/stalwart` and `/var/lib/stalwart`).
