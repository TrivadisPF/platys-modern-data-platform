name: AutoMQ
id: automq
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://www.automq.com/
  documentation: https://docs.automq.com/
  github: https://github.com/automq/automq

description: >
  AutoMQ is a diskless Kafka® on S3. 10x Cost-Effective. No Cross-AZ Traffic
  Cost. Autoscale in seconds. Single-digit ms latency. Multi-AZ Availability.

enable:
  platys_init: AUTOMQ
  example: |
    platys init --enable-services AUTOMQ
    platys gen

parameters:
  - name: AUTOMQ_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable AutoMQ.
