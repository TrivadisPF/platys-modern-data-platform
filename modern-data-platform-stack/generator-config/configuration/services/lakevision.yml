name: Lakevision
id: lakevision
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  documentation: https://deepwiki.com/lakevision-project/lakevision
  github: https://github.com/lakevision-project/lakevision

description: >
  Lakevision is a tool which provides insights into your Apache Iceberg based
  Data Lakehouse.

enable:
  platys_init: LAKEVISION
  example: |
    platys init --enable-services LAKEVISION
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:

parameters:
  - name: LAKEVISION_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Lakevision service

  - name: LAKEVISION_public_health_enabled
    default: "false"
    since: "1.19.0"
    description: >
      enable the health feature?

  - name: LAKEVISION_database_url
    default: "postgresql://postgres:abc123!@postgres:5432/postgres"
    since: "1.19.0"
    description: >
      Url to the database used to store all health results, schedules, and the
      task queue. Only required if `LAKEVISION_public_health_enabled` is set to
      `true`.
