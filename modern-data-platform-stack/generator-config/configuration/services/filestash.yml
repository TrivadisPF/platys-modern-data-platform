name: Filestash
id: filestash
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/mickael-kerjean/filestash
  github: https://github.com/mickael-kerjean/filestash

description: >
  A modern web client for SFTP, S3, FTP, WebDAV, Git, Minio, LDAP, CalDAV,
  CardDAV, Mysql, Backblaze, ...

enable:
  platys_init: FILESTASH
  example: |
    platys init --enable-services FILESTASH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28192>.
  - title: Storage Backends
    content: |
      By default `s3`, `local`, `ftp` and `sftp` storage backends are enabled. Navigate to <http://dataplatform:28192/admin/backend> to change to the Admin console, where you can enable other storage backends.

parameters:
  - name: FILESTASH_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Filestash service

  - name: FILESTASH_set_default_config
    default: "true"
    since: "1.17.0"
    sensitive: true
    description: >
      Set default configuration with the admin password set to `abc123!` with
      `s3`, `local`, `ftp` and `sftp` storage backends enabled.
