name: SQL Chat
id: sqlchat
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.sqlchat.ai/
  documentation: https://github.com/sqlchat/sqlchat
  github: https://github.com/sqlchat

description: >
  Chat-based SQL Client and Editor for the next decade.

enable:
  platys_init: SQLCHAT
  example: |
    platys init --enable-services SQLCHAT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28305>

parameters:
  - name: SQLCHAT_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable SQL Chat.
