name: Whisper
id: whisper
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  documentation: https://ahmetoner.com/whisper-asr-webservice/
  github: https://github.com/ahmetoner/whisper-asr-webservice

description: >
  Whisper is a general-purpose speech recognition model. It is trained on a
  large dataset of diverse audio and is also a multitasking model that can
  perform multilingual speech recognition, speech translation, and language
  identification.

enable:
  platys_init: WHISPER
  example: |
    platys init --enable-services WHISPER
    platys gen

parameters:
  - name: WHISPER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Whisper service

  - name: WHISPER_model
    default: "turbo"
    since: "1.18.0"
    description: >
      The whisper model to use, more info here

  - name: WHISPER_engine
    default: "openai_whisper"
    since: "1.18.0"
    description: >
      the whisper engine to use, either `openai_whisper` or `faster_whisper`

  - name: WHISPER_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the model cache folder

  - name: WHISPER_gpu_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable GPU for Whisper service?
