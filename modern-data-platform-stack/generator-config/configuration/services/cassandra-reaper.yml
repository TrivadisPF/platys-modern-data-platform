name: Reaper
id: cassandra-reaper
arch: [x86-64]

tags: []
dependencies: []
links:
  website: http://cassandra-reaper.io/
  documentation: http://cassandra-reaper.io/docs/
  github: https://github.com/thelastpickle/cassandra-reaper

description: >
  Automated Repair Awesomeness for Apache Cassandra.

enable:
  platys_init: CASSANDRA
  example: |
    platys init --enable-services CASSANDRA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28232>.

parameters:
  - name: REAPER_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Reaper service.
