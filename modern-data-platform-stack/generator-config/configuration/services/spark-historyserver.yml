name: Spark History Server
id: spark-historyserver
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://spark.apache.org/
  documentation: https://spark.apache.org/docs/3.2.0/running-on-yarn.html#using-the-spark-history-server-to-replace-the-spark-web-ui
  github: https://github.com/apache/spark/

description: >
  The Spark history server is a monitoring tool that displays information about
  completed Spark applications

enable:
  platys_init: SPARK,SPARK_HISTORY
  example: |
    platys init --enable-services SPARK,SPARK_HISTORY
    platys gen

parameters:
  - name: SPARK_HISTORYSERVER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Spark History Server.
