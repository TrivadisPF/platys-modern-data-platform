name: SQL Server
id: sqlserver
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.microsoft.com/en-US/sql-server/sql-server-2019?rtc=1
  documentation: https://docs.microsoft.com/en-us/sql/sql-server/?view=sql-server-ver15

description: >
  Apache Kudu is an open source distributed data storage engine that makes fast
  analytics on fast and changing data easy.

enable:
  platys_init: SQLSERVER
  example: |
    platys init --enable-services SQLSERVER
    platys gen

parameters:
  - name: SQLSERVER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate SQL Server service

  - name: SQLSERVER_edition
    default: "Express"
    since: "1.19.0"
    description: >
      The SQL Server edition to use or a product key, one of `Evaluation`,
      `Developer`, `Express`, `Web`, `Standard`, `Standard`, `Enterprise`,
      `EnterpriseCore` or `#####-#####-#####-#####-#####` for a product key.

  - name: SQLSERVER_volume_map_data
    default: "false"
    since: "1.19.0"
    description: >
      Volume map the data files folder.

  - name: SQLSERVER_volume_map_backup
    default: "false"
    since: "1.19.0"
    description: >
      Volume map the backup directory location.

  - name: SQLSERVER_backup_local_dir
    default: ""
    since: "1.19.0"
    description: >
      A local directory/folder on your machine to put the backups in. If left
      empty, then the default folder `./container-volume/sqlserver/backups` is
      used. Applicable if `SQLSERVER_volume_map_backup` is set to `true`.

  - name: SQLSERVER_agent_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable SQL Server Agent?.

  - name: SQLSERVER_availability_groups_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable Availability Group?

  - name: SQLSERVER_provision_adventure_works
    default: "false"
    since: "1.15.0"
    description: >
      Provision the Adventureworks Sample database with SQL Server?.

  - name: SQLSERVER_provision_adventure_works_edition
    default: "oltp"
    since: "1.15.0"
    description: >
      Which edition of the Adventureworks sample database to provision, either
      `oltp`, `datawarehouse` or `light`.
