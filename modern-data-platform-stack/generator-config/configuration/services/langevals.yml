name: LangEvals
id: langevals
category:
  id: 13_science
  name: science
  color: violet
arch: [x86-64]

links:
  website: https://langwatch.ai/
  documentation: https://docs.langwatch.ai/langevals/documentation/introduction
  github: https://github.com/langwatch/langevals

description: >
  LangEvals aggregates various language model evaluators into a single
  platform, providing a standard interface for a multitude of scores and LLM
  guardrails, for you to protect and benchmark your LLM models and pipelines.

enable:
  platys_init: LANGEVALS
  example: |
    platys init --enable-services LANGEVALS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:7860>.

parameters:
  - name: LANGEVALS_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate LangEvals service
