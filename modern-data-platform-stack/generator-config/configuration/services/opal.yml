name: Open Policy Administration Layer (OPAL)
id: opal
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://opal.ac/
  documentation: https://opal.ac/
  github: https://github.com/permitio/opal

description: >
  Open Policy Agent (OPA) is an open source, general-purpose policy engine.

enable:
  platys_init: OPAL
  example: |
    platys init --enable-services OPAL
    platys gen

parameters:
  - name: OPAL_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Opal service

  - name: OPAL_policy_engine
    default: "opa"
    since: "1.18.0"
    description: >
      The policy engine to support, either `opa` or `cedar`.

  - name: OPAL_policy_source_type
    default: "git"
    since: "1.18.0"
    description: >
      Set the policy source type, can be `git` or `api`.

  - name: OPAL_policy_repo_polling_interval
    default: "30"
    since: "1.18.0"
    description: >
      The polling interval to watch for policy-changes, applicable for both `git`
      and `api`soruce types.

  - name: OPAL_policy_bundle_url
    default: ""
    since: "1.18.0"
    description: >
      Set API bundle URL, relevant only on `api` source type.

  - name: OPAL_policy_repo_url
    default: ""
    since: "1.18.0"
    description: >
      Set remote repo URL - this is relevant only to `git` source type.

  - name: OPAL_policy_repo_ssh_key
    default: ""
    since: "1.18.0"
    description: >
      This will allow you to authenticate to a private repository. You can
      generate a Github SSH key here.

  - name: OPAL_policy_repo_main_branch
    default: "main"
    since: "1.18.0"
    description: >
      The branch to clone.

  - name: OPAL_broadcast_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable broadcasting between multiple OPAL server instances?

  - name: OPAL_broadcast_type
    default: "postgres"
    since: "1.18.0"
    description: >
      Use `postgres` or `kafka` or `redis` for broadcasting between multiple OPAL
      server instances. You have to enable either postgresql, kafka or redis.

  - name: OPAL_inline_opa_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Whether or not OPAL should run OPA by itself in the same container.

  - name: OPAL_inline_cedar_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Whether or not OPAL should run CEDAR by itself in the same container.

  - name: OPAL_otel_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable exporting metrics and tracing information using OpenTelemetry.
