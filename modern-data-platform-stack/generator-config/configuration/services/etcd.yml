name: Etcd
id: etcd
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://etcd.io/
  documentation: https://etcd.io/docs
  github: https://github.com/etcd-io/etcd

description: >
  Distributed reliable key-value store for the most critical data of a
  distributed system .

enable:
  platys_init: ETCD
  example: |
    platys init --enable-services ETCD
    platys gen

parameters:
  - name: ETCD_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate etcd service
