name: Milvus
id: milvus
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://milvus.io/
  documentation: https://milvus.io/docs
  github: https://github.com/milvus-io/milvus

description: >
  A cloud-native vector database, storage for next generation AI applications.

enable:
  platys_init: MILVUS
  example: |
    platys init --enable-services MILVUS
    platys gen

parameters:
  - name: MILVUS_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Milvus service

  - name: MILVUS_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder into service.
