name: Hazelcast
id: hazelcast
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://hazelcast.com/
  documentation: https://docs.hazelcast.com/home/index.html
  github: https://github.com/hazelcast

description: >
  Open-source distributed computation and storage platform.

enable:
  platys_init: HAZELCAST
  example: |
    platys init --enable-services HAZELCAST
    platys gen

parameters:
  - name: HAZELCAST_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Hazelcast service

  - name: HAZELCAST_nodes
    default: "1"
    since: "1.13.0"
    description: >
      How many Hazelcast nodes should be generated

  - name: HAZELCAST_volume_map_custom_config
    default: ""
    since: "1.14.0"
    description: >
      Should a custom config file (`hazelcast.yaml`) be mapped into the
      container.

  - name: HAZELCAST_use_jet
    default: "false"
    since: "1.14.0"
    description: >
      Should the Jet service be enabled.
