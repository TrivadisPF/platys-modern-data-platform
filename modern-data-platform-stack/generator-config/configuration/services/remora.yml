name: Remora
id: remora
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  documentation: https://github.com/zalando-incubator/remora
  github: https://github.com/zalando-incubator/remora

description: >
  Kafka consumer lag-checking application for monitoring, written in Scala and
  Akka HTTP; a wrap around the Kafka consumer group command. Integrations with
  Cloudwatch and Datadog. Authentication recently added

enable:
  platys_init: KAFKA,REMORA
  example: |
    platys init --enable-services KAFKA,REMORA
    platys gen

usage:
  - title: Usage
    content: |
      Show active consumers
      
      ```bash
      curl http://dataplatform:28256/consumers
      ```
      
      Show specific consumer group information
      
      ```bash
      curl http://dataplatform:28256/consumers/<consumer-group-id>
      ```
      
      Show health
      
      ```bash
      curl http://dataplatform:28256/health
      ```
      
      Metrics
      
      ```bash
      curl http://dataplatform:28256/metrics
      ```

parameters:
  - name: REMORA_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Remora service
