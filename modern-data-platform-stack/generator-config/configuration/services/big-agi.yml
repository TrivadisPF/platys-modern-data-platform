name: "big-AGI"
id: big-agi
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://big-agi.com/
  documentation: https://big-agi.com/docs
  github: https://github.com/enricoros/big-AGI

description: >
  Personal AI application powered by GPT-4 and beyond, with AI personas, AGI
  functions, text-to-image, voice, response streaming, code highlighting and
  execution, PDF import, presets for developers, much more. Deploy and gift
  #big-AGI-energy! Using Next.js, React, Joy.

enable:
  platys_init: BIG_AGI
  example: |
    platys init --enable-services BIG_AGI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28355>.

parameters:
  - name: BIG_AGI_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate big-AGI service
