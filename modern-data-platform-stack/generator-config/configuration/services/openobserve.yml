name: OpenObserve
id: openobserve
category:
  id: 99_other
  name: other
  color: gray
arch: [x86-64, arm]

links:
  website: https://openobserve.ai/
  documentation: https://openobserve.ai/docs/
  github: https://github.com/openobserve/openobserve

description: >
  Cloud-native observability platform for logs, metrics, traces, analytics, and
  dashboards. OpenObserve provides a unified solution for ingesting and
  querying telemetry data with a built-in UI, SQL-based query interface, and
  high compression storage.

enable:
  platys_init: OPENOBSERVE
  example: |
    platys init --enable-services OPENOBSERVE
    platys gen

usage:
  - title: Connect to OpenObserve
    content: |
      Navigate to <http://dataplatform:5080>

parameters:
  - name: OPENOBSERVE_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate OpenObserve service

  - name: OPENOBSERVE_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Map the data directory to `./container-volumes/openobserve/data` on the
      Docker host for persistence across restarts.

  - name: OPENOBSERVE_root_user_email
    default: "root@example.com"
    since: "1.20.0"
    description: >
      Email address of the root/admin user.

  - name: OPENOBSERVE_root_user_password
    default: "abc123!"
    since: "1.20.0"
    sensitive: true
    description: >
      Password for the root/admin user.
