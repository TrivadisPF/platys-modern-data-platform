name: StreamSets Transformer Engine
id: streamsets-transformer
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64]

links:
  website: https://streamsets.com/products/dataops-platform/transformer-etl-engine/
  documentation: https://docs.streamsets.com/portal/transformer/latest/help/index.html

description: >
  StreamSets TransformerTM is an execution engine that runs data processing
  pipelines on Apache Spark, an open-source cluster-computing framework.
  Because Transformer pipelines run on Spark deployed on a cluster, the
  pipelines can perform transformations that require heavy processing on the
  entire data set in batch or streaming mode.

enable:
  platys_init: STREAMSETS_TRANSFORMER
  example: |
    platys init --enable-services STREAMSETS_TRANSFORMER
    platys gen

usage:
  - title: Connect to StreamSets Transformer Engine
    content: |
      Navigate to <http://dataplatform:19630>

parameters:
  - name: STREAMSETS_TRANSFORMER_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate StreamSets Transformer service
