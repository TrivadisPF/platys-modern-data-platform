name: Adminio UI
id: adminio
arch: [x86-64]

tags: [ui]
dependencies: [minio]
links:
  documentation: https://github.com/rzrbld/adminio-ui/
  github: https://github.com/rzrbld/adminio-ui

description: >
  This is a Web UI for minio s3 server. Web UI works on top of REST API -
  adminio-API.

enable:
  platys_init: ADMINIO
  example: |
    platys init --enable-services ADMINIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28190>

parameters:
  - name: ADMINIO_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Adminio UI service
