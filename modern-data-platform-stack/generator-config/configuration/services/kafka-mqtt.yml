name: Confluent MQTT Proxy
id: kafka-mqtt
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://docs.confluent.io/platform/current/kafka-mqtt/index.html
  documentation: https://docs.confluent.io/platform/current/kafka-mqtt/index.html

description: >
  MQTT Proxy provides a scalable and lightweight interface that allows MQTT
  clients to produce messages to Apache Kafka® directly, in a Kafka-native way
  that avoids redundant replication and increased lag.

enable:
  platys_init: KAFKA,KAFKA_MQTTPROXY
  example: |
    platys init --enable-services KAFKA,KAFKA_MQTTPROXY
    platys gen

parameters:
  - name: KAFKA_MQTTPROXY_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Confluent MQTT Proxy service

  - name: KAFKA_MQTTPROXY_topic_regex_list
    default: ""
    since: "1.8.0"
    description: >
      A comma-separated list of pairs of type : that is used to map MQTT topics
      to Kafka topics.
