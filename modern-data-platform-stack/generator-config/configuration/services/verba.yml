name: Weaviate Verba
id: verba
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/weaviate/Verba?tab=readme-ov-file#verba-walkthrough
  github: https://github.com/weaviate/Verba

description: >
  Custom RAG (retrieval augmented generation) friendly parsers for various file
  formats.

enable:
  platys_init: VERBA
  example: |
    platys init --enable-services VERBA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28373>

parameters:
  - name: VERBA_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Verba service

  - name: VERBA_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map `data` folder into the service.

  - name: VERBA_unstructured_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The API key for the unstructured API service. Instead of specifying in the
      `config.yml` it can be configured using the following
      `PLATYS_UNSTRUCTURED_API_KEY` environment variable.

  - name: VERBA_ollama_model
    default: ""
    since: "1.18.0"
    description: >
      The Ollama model to use.

  - name: VERBA_github_token
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      the Github token for data ingestion via GitHub.
