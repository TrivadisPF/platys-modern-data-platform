name: Puppy Graph
id: puppygraph
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.puppygraph.com//
  documentation: https://docs.puppygraph.com
  github: https://github.com/puppygraph

description: >
  Query your relational data as a graph in real-time. Zero ETL.

enable:
  platys_init: PUPPYGRAPH
  example: |
    platys init --enable-services PUPPYGRAPH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28472>.

parameters:
  - name: PUPPYGRAPH_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Puppy Graph service

  - name: PUPPYGRAPH_ai_enabled
    default: "false"
    since: "1.21.0"
    description: >
      Enable the AI assistant in Puppy Graph (sets the `AI_ENABLED` environment variable).

  - name: PUPPYGRAPH_ai_api_structure
    default: "anthropic_style"
    since: "1.21.0"
    description: >
      Request and response structure of the AI API (sets `AI_API_STRUCTURE`). Either
      `anthropic_style` (posts to `<AI_BASE_URL>/v1/messages`) or `openai_style` (posts to
      `<AI_BASE_URL>/chat/completions`). Other APIs that implement the selected structure can
      work too.

  - name: PUPPYGRAPH_ai_base_url
    default: ""
    since: "1.21.0"
    description: >
      Base URL of the AI API, not a complete model endpoint (sets `AI_BASE_URL`). Set together
      with `PUPPYGRAPH_ai_api_structure`. Use a securely deployed HTTPS endpoint, because
      requests carry catalog metadata, sampled rows and generated queries. It must not contain a
      query or fragment. Leave empty to use the PuppyGraph default (`https://api.anthropic.com`,
      or `https://api.openai.com/v1` with `openai_style`).

  - name: PUPPYGRAPH_ai_api_key
    default: ""
    since: "1.21.0"
    description: >
      Deployment-wide API key for the configured AI API (sets `AI_API_KEY`). PuppyGraph AI needs
      an API key before it can answer anything. Treat as a secret. A key a user saves for
      themselves overrides it for that user.

  - name: PUPPYGRAPH_ai_models
    default: ""
    since: "1.21.0"
    description: >
      Comma-separated model IDs the deployment allows (sets `AI_MODELS`). They fill the model
      selector on the AI page and the first entry is the default. Use models that support
      streaming and tool calling. Always set it when you change the API, as the PuppyGraph
      default list is Anthropic's (`claude-opus-5-5,claude-sonnet-5,claude-haiku-4-5-20251001`).
      Leave empty to use that default.

  - name: PUPPYGRAPH_ai_max_tokens
    default: "64000"
    since: "1.21.0"
    description: >
      Maximum tokens in a single model response (sets `AI_MAX_TOKENS`).

  - name: PUPPYGRAPH_metrics_enabled
    default: "true"
    since: "1.21.0"
    description: >
      Enable the Prometheus metrics endpoints of Puppy Graph (sets the `METRICS_ENABLED` environment variable).

  - name: PUPPYGRAPH_volume_map_data
    default: "false"
    since: "1.21.0"
    description: >
      Volume map the `data` folder (`/data/storage`) into the Puppy Graph service
