name: KIE Server
id: kie-server
category:
  id: 13_science
  name: science
  color: violet
arch: [x86-64]

links:
  website: https://drools.org/
  documentation: https://drools.org/learn/documentation.html
  github: https://github.com/kiegroup/drools

description: >
  Drools is a rule engine, DMN engine and complex event processing (CEP) engine
  for Java.

enable:
  platys_init: OPTUNA
  example: |
    platys init --enable-services OPTUNA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28236/business-central> or <http://dataplatform:28234>.

parameters:
  - name: KIE_SERVER_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Drools KIE Server service
