name: Confluent Schema Registry
id: schema-registry
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://docs.confluent.io/1.0/schema-registry/docs/intro.html
  documentation: https://docs.confluent.io/1.0/schema-registry/docs/intro.html
  github: https://github.com/confluentinc/schema-registry

description: >
  Confluent Schema Registry for Kafka

enable:
  platys_init: SCHEMA_REGISTRY
  example: |
    platys init --enable-services SCHEMA_REGISTRY
    platys gen

usage:
  - title: Uploading a Schema via script
    content: |
      using `curl`
      
      ```bash
      export TOPIC=topicName
      export SCHEMA=$(jq tostring $TOPIC-value.avsc)
      
      echo "{\"schema\":$SCHEMA}"
      
      curl -XPOST -H "Content-Type:application/json" -d"{\"schema\":$SCHEMA}" http://dataplatform:8081/subjects/$TOPIC-value/versions
      ```
      
      using `httpie`
      
      ```bash
      export TOPIC=topicName
      http -v POST :8081/subjects/example.with-schema.user-value/versions \
        Accept:application/vnd.schemaregistry.v1+json \
        schema=@avro/src/main/avro/user.avsc
      ```
  - title: Downloading a schema (for a subject) from schema registry
    content: |
      using `curl`
      
      ```bash
      export TOPIC=topicName
      curl http://dataplatfor:8081/subjects/$TOPIC-value/versions/latest | jq -r '.schema|fromjson' > $TOPIC-value.avsc
      ```
      
      using `httpie`
      
      
      ```bash
      export TOPIC=topicName
      http http://dataplatform:8081/subjects/$TOPIC-value/versions/latest \
        | jq -r '.schema|fromjson' \
        > $TOPIC-value.avsc
      ```

parameters:
  - name: SCHEMA_REGISTRY_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate the Schema Registry service.

  - name: SCHEMA_REGISTRY_flavour
    default: "confluent"
    since: "1.14.0"
    allowed_values: [confluent, apicurio]
    description: >
      Which schema registry implementation to use, either `confluent` or `apicurio`.

  - name: SCHEMA_REGISTRY_nodes
    default: "1"
    since: "1.14.0"
    description: >
      Number of Schema Registry nodes.

  - name: SCHEMA_REGISTRY_kafka_username
    default: "schemaregistry"
    since: "1.14.0"
    description: >
      Kafka username for the Schema Registry service.

  - name: SCHEMA_REGISTRY_kafka_password
    default: "schemaregistry-secret"
    since: "1.14.0"
    sensitive: true
    description: >
      Kafka password for the Schema Registry service.

  - name: SCHEMA_REGISTRY_confluent_use_zookeeper_election
    default: "false"
    since: "1.14.0"
    description: >
      Use Zookeeper for election of the master Schema Registry node.

  - name: SCHEMA_REGISTRY_confluent_group_id
    default: "schema-registry"
    since: "1.14.0"
    description: >
      The group ID for this Schema Registry instance.

  - name: SCHEMA_REGISTRY_confluent_replication_factor
    default: "1"
    since: "1.14.0"
    description: >
      Replication factor to use for the `_schemas` topic.

  - name: SCHEMA_REGISTRY_confluent_leader_eligibility
    default: "true"
    since: "1.14.0"
    description: >
      If `true`, this node can participate in primary election. In a multi-colocated
      setup, turn this off for clusters in the secondary data center.

  - name: SCHEMA_REGISTRY_confluent_mode_mutability
    default: "true"
    since: "1.14.0"
    description: >
      If `true`, the mode of this Schema Registry node can be changed.

  - name: SCHEMA_REGISTRY_confluent_schema_compatibility_level
    default: "backward"
    since: "1.14.0"
    allowed_values: [backward, none, backward_transitive, forward, forward_transitive, full, full_transitive]
    description: >
      The schema compatibility type. One of `none`, `backward`, `backward_transitive`,
      `forward`, `forward_transitive`, `full` or `full_transitive`.

  - name: SCHEMA_REGISTRY_confluent_log4j_root_loglevel
    default: "info"
    since: "1.14.0"
    description: >
      Change the rootLogger log level of the Schema Registry.

  - name: SCHEMA_REGISTRY_confluent_debug
    default: "false"
    since: "1.14.0"
    description: >
      Boolean indicating whether extra debugging information is generated in some
      error response entities.

  - name: SCHEMA_REGISTRY_apicurio_storage
    default: "kafkasql"
    since: "1.19.0"
    allowed_values: [kafkasql, memory, sql]
    description: >
      The storage type for Apicurio Registry: `memory` for in-memory, `sql` for
      database (PostgreSQL), or `kafkasql` for Kafka-based storage.

  - name: SCHEMA_REGISTRY_apicurio_sql_storage_database
    default: "apicuriodb"
    since: "1.14.0"
    description: >
      The database name to use when storage is `sql`.

  - name: SCHEMA_REGISTRY_apicurio_sql_storage_user
    default: "apicurio"
    since: "1.14.0"
    description: >
      The database user to use when storage is `sql`.

  - name: SCHEMA_REGISTRY_apicurio_sql_storage_password
    default: "abc123!"
    since: "1.14.0"
    sensitive: true
    description: >
      The database password to use when storage is `sql`.

  - name: SCHEMA_REGISTRY_apicurio_auth_enabled
    default: "false"
    since: "1.14.0"
    description: >
      Enable authentication via Keycloak. If set to `true`, `KEYCLOAK_enable` will
      be enabled automatically.

  - name: SCHEMA_REGISTRY_apicurio_auth_anonymous_read_access_enabled
    default: "false"
    since: "1.14.0"
    description: >
      Allow anonymous users (REST API calls with no credentials) to make read-only
      calls to the REST API.

  - name: SCHEMA_REGISTRY_apicurio_auth_import_default_users
    default: "false"
    since: "1.14.0"
    description: >
      If `true`, imports the pre-defined users `sr-view`, `sr-dev` and `sr-admin`
      into the `registry` Keycloak realm.

  - name: SCHEMA_REGISTRY_apicurio_basic_auth_enabled
    default: "false"
    since: "1.14.0"
    description: >
      Enable basic authentication. Requires `SCHEMA_REGISTRY_apicurio_auth_enabled`
      to be `true` and Keycloak configured accordingly.

  - name: SCHEMA_REGISTRY_apicurio_eventsourcing_enabled
    default: "false"
    since: "1.14.0"
    description: >
      Enable event sourcing, causing the registry to emit events when changes are made.

  - name: SCHEMA_REGISTRY_apicurio_eventsourcing_kafka_topic
    default: "registry-events"
    since: "1.14.0"
    description: >
      The Kafka topic to use for event sourcing when the transport is set to `kafka`.
