name: Dataverse
id: dataverse
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://dataverse.org/
  documentation: https://guides.dataverse.org/en/latest/user/index.html
  github: https://github.com/IQSS/dataverse

description: >
  Open source research data repository software.

enable:
  platys_init: DATAVERSE
  example: |
    platys init --enable-services DATAVERSE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28394>.
      Log in with user `dataverseAdmin` and password `admin1`.
      
      You can also access the Payara Admin Console if needed, which is available at <http://dataplatform:4848>. Log in with user `admin` and password `admin`.

parameters:
  - name: DATAVERSE_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Dataverse service

  - name: DATAVERSE_mail_host
    default: "maildev"
    since: "1.17.0"
    description: >
      A hostname (w/o port!) where to reach a Mail Server on port 25.

  - name: DATAVERSE_s3_bucket
    default: ""
    since: "1.17.0"
    description: >
      The bucket to use for dataverse in S3. Only has an effect if also either
      Minio is enabled (`MINIO_enable` set to `true`) or an external S3 is
      configured.

  - name: DATAVERSE_default_storage
    default: ""
    since: "1.17.0"
    description: >
      Storage service to use by default.

  - name: DATAVERSE_download_redirect
    default: "false"
    since: "1.17.0"
    description: >
      Enable direct download or proxy through dataverse.

  - name: DATAVERSE_upload_redirect
    default: "false"
    since: "1.17.0"
    description: >
      Enable direct upload of files added to a dataset to the S3 store.

  - name: DATAVERSE_url_expiration_minutes
    default: "60"
    since: "1.17.0"
    description: >
      If direct uploads/downloads: time until links expire.

  - name: DATAVERSE_direct_upload_limit
    default: ""
    since: "1.17.0"
    description: >
      Maximum size of direct upload files that can be ingested. Defaults to no
      limit.

  - name: DATAVERSE_minimal_part_size
    default: ""
    since: "1.17.0"
    description: >
      Multipart direct uploads will occur for files larger than this.

  - name: DATAVERSE_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Map the `data` folder into the container.

  - name: DATAVERSE_bootstrap_persona
    default: "dev"
    since: "1.18.0"
    description: >
      The persona to bootstrap, default to `dev` and uses the `init.sh` script
      provided by the configbaker docker image. You can overwrite it with your
      own `init.sh` script enabling the `DATAVERSE_volume_map_bootstrap_script`
      config setting.

  - name: DATAVERSE_volume_map_bootstrap_script
    default: "false"
    since: "1.18.0"
    description: >
      Map the `./scripts/dataverse/bootstrap/init.sh` script into the container
      to provide a custom `init.sh` for the bootstrapping. Use init.sh as a
      template.

  - name: DATAVERSE_previewers_provider_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Should the dataverse previewers provided locally?

  - name: DATAVERSE_previewers_configurer_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Should the configure previewers functionality be enabled?

  - name: DATAVERSE_previewers_provider_url
    default: "https://gdcc.github.io/dataverse-previewers"
    since: "1.18.0"
    description: >
      The previewer provider to use, by default the official Dataverse Github URL
      is used. Replace it with `http://${PUBLIC_IP}:28395` when you have
      configured the local provider by enabling
      `DATAVERSE_previewers_provider_enabled`

  - name: DATAVERSE_previewers_include
    default: ""
    since: "1.18.0"
    description: >
      A comma-separated list of previewers to install. To see which previewers
      are supported, you can execute `docker run -ti
      trivadis/dataverse-deploy-previewers:latest list` and then use what's
      listed in the `name` column. If an empty string is used, then all available
      previewers will be installed.

  - name: DATAVERSE_previewers_exclude
    default: ""
    since: "1.18.0"
    description: >
      A comma-separated list of previewers to exclude from the install. Only
      applicable it `DATAVERSE_previewers_include` is left empty.

  - name: DATAVERSE_previewers_remove_existing
    default: "false"
    since: "1.18.0"
    description: >
      Remove existing previewers before doing a deplyoment (i.e. if you want to
      run it again). If you don't remove existing previewers and you deploy the
      same ones again, there will be duplicates.
