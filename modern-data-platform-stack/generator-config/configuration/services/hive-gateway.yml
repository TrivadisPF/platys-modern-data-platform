name: GraphQL Hive Gateway
id: hive-gateway
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://the-guild.dev/graphql/hive/docs/gateway
  documentation: https://the-guild.dev/graphql/hive/docs/gateway
  github: https://github.com/graphql-hive/gateway
  docker: https://github.com/graphql-hive/gateway/pkgs/container/gateway

description: >
  GraphQL Hive Gateway is a fully open-source, highly performant GraphQL gateway
  compatible with Apollo Federation. It serves a composed supergraph and routes
  queries to the underlying subgraphs.

enable:
  platys_init: HIVE_GATEWAY
  example: |
    platys init --enable-services HIVE_GATEWAY
    platys gen

usage:
  - title: Usage
    content: |
      Place your composed supergraph SDL in conf/hive-gateway/ (default file name
      supergraph.graphql, configurable via HIVE_GATEWAY_supergraph_file), then run
      platys gen. The gateway GraphQL endpoint is available at
      <http://dataplatform:28147/graphql>.

parameters:
  - name: HIVE_GATEWAY_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate GraphQL Hive Gateway, a federation gateway serving a composed supergraph.

  - name: HIVE_GATEWAY_supergraph_file
    default: "supergraph.graphql"
    since: "1.21.0"
    description: >
      Name of the supergraph schema file placed in conf/hive-gateway/ that the gateway
      serves. It is mounted into the container at /gateway/.

  - name: HIVE_GATEWAY_log_level
    default: "info"
    since: "1.21.0"
    allowed_values: ["debug", "info", "warn", "error"]
    description: >
      Log level for the gateway.
