name: HAPI FHIR Server
id: hapi-fhir
category:
  id: 21_healthcare
  name: healthcare
  color: white
arch: [x86-64]

links:
  website: https://hapifhir.io/
  documentation: https://hapifhir.io/hapi-fhir/docs/
  github: https://github.com/hapifhir/hapi-fhir

description: >
  HAPI FHIR - Java API for HL7 FHIR Clients and Servers

enable:
  platys_init: HAPI_FHIR
  example: |
    platys init --enable-services HAPI_FHIR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28336/fhir>.

parameters:
  - name: HAPI_FHIR_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate HAPI FHIR server service
