name: Excalidraw
id: excalidraw
arch: [x86-64]

tags: []
dependencies: []
links:
  website: http://excalidraw.com/
  documentation: https://github.com/excalidraw/excalidraw#documentation
  github: https://github.com/excalidraw/excalidraw

description: >
  Virtual whiteboard for sketching hand-drawn like diagrams.

enable:
  platys_init: EXCALIDRAW
  example: |
    platys init --enable-services EXCALIDRAW
    platys gen

usage:
  - title: Connect to Excalidraw
    content: |
      Navigate to <http://dataplatform:28231>

parameters:
  - name: EXCALIDRAW_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Excalidraw service
