name: Kafka Connect UI
id: kafka-connect-ui
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://lenses.io/product/features/
  documentation: https://github.com/lensesio/kafka-connect-ui
  github: https://github.com/lensesio/kafka-connect-ui

description: >
  Web tool for Kafka Connect

enable:
  platys_init: KAFKA,KAFKA_CONNECT,KAFKA_CONNECT_UI
  example: |
    platys init --enable-services KAFKA,KAFKA_CONNECT,KAFKA_CONNECT_UI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28103>

parameters:
  - name: KAFKA_CONNECT_UI_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Landoop Connect UI service

  - name: KAFKA_CONNECT_UI_map_resolv_conf
    default: "true"
    since: "1.13.0"
    description: >
      If `true` the `conf/resolv.conf` is mapped into the container to avoid the
      `panic: runtime error: slice bounds out of range` when running Docker on an
      actual Ubunutu.
