name: GraphQL Hive Router
id: hive-router
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://the-guild.dev/graphql/hive/docs/router
  documentation: https://the-guild.dev/graphql/hive/docs/router
  github: https://github.com/graphql-hive/router
  docker: https://github.com/graphql-hive/router/pkgs/container/router

description: >
  GraphQL Hive Router is a high-performance GraphQL federation router written in Rust.
  It serves a composed supergraph and routes queries to the underlying subgraphs.

enable:
  platys_init: HIVE_ROUTER
  example: |
    platys init --enable-services HIVE_ROUTER
    platys gen

usage:
  - title: Usage
    content: |
      Place your composed supergraph SDL in custom-conf/hive-router/ (default file name
      supergraph.graphql, configurable via HIVE_ROUTER_supergraph_file), then run
      platys gen. The router GraphQL endpoint is available at
      <http://dataplatform:28148/graphql>.

parameters:
  - name: HIVE_ROUTER_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate GraphQL Hive Router, a high-performance Rust federation router serving a
      composed supergraph.

  - name: HIVE_ROUTER_supergraph_file
    default: "supergraph.graphql"
    since: "1.21.0"
    description: >
      Name of the supergraph schema file placed in custom-conf/hive-router/ that the router serves.
      It is mounted into the container at /app/ and referenced via the SUPERGRAPH_FILE_PATH
      environment variable.

  - name: HIVE_ROUTER_config_file
    default: ""
    since: "1.21.0"
    description: >
      Name of the router config file placed in custom-conf/hive-router/, mounted into the container
      at /app/. Leave empty to not mount one.
