name: KongMap
id: kong-map
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/yesinteractive/kong-map
  github: https://github.com/yesinteractive/kong-map

description: >
  Kongmap is a free visualization tool which allows you to view and edit
  configurations of your Kong API Gateway Clusters, including Routes, Services,
  and Plugins/Policies. The tool is being offered for installation via Docker
  and Kubernetes at this time.

enable:
  platys_init: KONG,
  example: |
    platys init --enable-services KONG,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8100>

parameters:
  - name: KONG_MAP_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate KongMap service
