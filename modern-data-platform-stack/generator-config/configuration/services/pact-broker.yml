name: Pact Broker
id: pact-broker
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: http://pactflow.io/
  documentation: https://docs.pactflow.io/
  github: https://github.com/pact-foundation/pact_broker

description: >
  Enables consumer driven contracts workflows.

enable:
  platys_init: PACT_BROKER,POSTGRESQL
  example: |
    platys init --enable-services PACT_BROKER,POSTGRESQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9292>

parameters:
  - name: PACT_BROKER_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Pact Broker service
