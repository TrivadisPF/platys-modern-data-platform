name: RabbitMQ
id: rabbitmq
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64, arm]

links:
  website: https://www.rabbitmq.com/
  documentation: https://www.rabbitmq.com/documentation.html
  github: https://github.com/rabbitmq/rabbitmq-server

description: >
  With tens of thousands of users, RabbitMQ is one of the most popular open
  source message brokers.

enable:
  platys_init: RABBITMQ
  example: |
    platys init --enable-services RABBITMQ
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:15672>

parameters:
  - name: RABBITMQ_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate RabbitMQ service

  - name: RABBITMQ_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the default user.
