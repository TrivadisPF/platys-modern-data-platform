name: Mailpit
id: mailpit
category:
  id: 08_transfer
  name: transfer
  color: gray
arch: [x86-64]

links:
  documentation: https://github.com/axllent/mailpit/wiki
  github: https://github.com/axllent/mailpit

description: >
  An email and SMTP testing tool with API for developers.

enable:
  platys_init: MAILPIT
  example: |
    platys init --enable-services MAILPIT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28318>.

parameters:
  - name: MAILPIT_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Mailpit service

  - name: MAILPIT_smtp_port
    default: "25"
    since: "1.17.0"
    description: >
      Internal SMTP port to use.

  - name: MAILPIT_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Map the `data` folder into the container.
