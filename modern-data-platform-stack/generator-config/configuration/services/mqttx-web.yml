name: MQTTX Web
id: mqttx-web
arch: [x86-64]

tags: [ui]
dependencies: []
links:
  website: https://mqttx.app/
  documentation: https://mqttx.app/docs
  github: https://github.com/emqx/MQTTX

description: >
  A Powerful and All-in-One MQTT 5.0 client toolbox for Desktop, CLI and
  WebSocket. This container runs the MQTTX web client.

enable:
  platys_init: MQTTX_WEB
  example: |
    platys init --enable-services MQTTX_WEB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28367>.

parameters:
  - name: MQTTX_WEB_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate MQTTX Web service.
