name: Dejavu
id: dejavu
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://opensource.appbase.io/dejavu/
  documentation: https://opensource.appbase.io/dejavu/
  github: https://github.com/appbaseio/dejavu

description: >
  The Missing Web UI for Elasticsearch: Import, browse and edit data with rich
  filters and query views, create search UIs visually.

enable:
  platys_init: DEJAVU
  example: |
    platys init --enable-services DEJAVU
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28125>

parameters:
  - name: DEJAVU_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Dejavu.
