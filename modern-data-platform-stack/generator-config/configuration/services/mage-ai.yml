name: Mage AI
id: mage-ai
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64]

links:
  website: https://www.mage.ai/
  documentation: https://docs.mage.ai/introduction/overview
  github: https://github.com/mage-ai/mage-ai

description: >
  Build, run, and manage data pipelines for integrating and transforming data.

enable:
  platys_init: MAGE_AI
  example: |
    platys init --enable-services MAGE_AI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:6789>.

parameters:
  - name: MAGE_AI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Mage AI service

  - name: MAGE_AI_project_name
    default: "mage-ai-project"
    since: "1.18.0"
    description: >
      Name of the project
