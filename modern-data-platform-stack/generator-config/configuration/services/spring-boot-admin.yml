name: Spring Boot Admin
id: spring-boot-admin
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  website: https://codecentric.github.io/spring-boot-admin/3.0.0-M8/
  documentation: https://codecentric.github.io/spring-boot-admin/3.0.0-M8/getting-started.html
  github: https://github.com/codecentric/spring-boot-admin

description: >
  ```bash platys init --enable-services SPRING_ADMIN_SERVER platys gen ```

enable:
  platys_init: SPRING_ADMIN_SERVER
  example: |
    platys init --enable-services SPRING_ADMIN_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28293>.

parameters:
  - name: SPRING_BOOT_ADMIN_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Spring Boot Admin service
