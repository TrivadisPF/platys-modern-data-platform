name: Tipboard
id: tipboard
category:
  id: 10_ui
  name: ui
  color: green
arch: [x86-64]

links:
  website: https://github.com/allegro/tipboard
  documentation: https://tipboard.readthedocs.io/en/latest/
  github: https://github.com/allegro/tipboard

description: >
  Tipboard - in-house, tasty, local dashboarding system

enable:
  platys_init: TIPBOARD
  example: |
    platys init --enable-services TIPBOARD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://${PUBLIC_IP}:28172>

parameters:
  - name: TIPBOARD_enable
    default: "false"
    since: "1.8.0"
    description: >
      Generate Tipboard dashboard service

  - name: TIPBOARD_volume_map_dashboards
    default: "false"
    since: "1.8.0"
    description: >
      Map `dashboards` folder into the container to add your own dashboards.
      Place the xxxx.yaml layout files in the `./scripts/tipboard` folder and it
      will be mapped to the right place.

  - name: TIPBOARD_api_key
    default: "e2c3275d0e1a4bc0da360dd225d74a43"
    since: "1.8.0"
    sensitive: true
    description: >
      the API key to use when sending data to the tipboard tiles.

  - name: TIPBOARD_project_name
    default: "sample"
    since: "1.8.0"
    description: >
      name of the project.

  - name: TIPBOARD_port
    default: "7272"
    since: "1.8.0"
    description: >
      port where tipboard binds to

  - name: TIPBOARD_redis_host
    default: "redis-1"
    since: "1.8.0"
    description: >
      the redis server tipboard is connecting to

  - name: TIPBOARD_redis_port
    default: "6379"
    since: "1.8.0"
    description: >
      the redis port tipboard is connecting to

  - name: TIPBOARD_redis_password
    default: ""
    since: "1.8.0"
    sensitive: true
    description: >
      the password for connecting to redis, no authentication to redis if empty

  - name: TIPBOARD_redis_db
    default: "4"
    since: "1.8.0"
    description: >
      the redis database to use

  - name: TIPBOARD_flipboard_interval
    default: "0"
    since: "1.8.0"
    description: >
      the interval in seconds to flip(rotate) multiple dashboards periodically

  - name: TIPBOARD_flipboard_sequence
    default: "''"
    since: "1.8.0"
    description: >
      set the dashboards you want to flip(rotate), if not all should be included.
      Specify a list of dashboard names: `'my_first_dashboard',
      'my_third_dashboard'`
