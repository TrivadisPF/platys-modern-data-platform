name: LakeFS
id: lakefs
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://lakefs.io/
  documentation: https://docs.lakefs.io/
  github: https://github.com/treeverse/lakeFS

description: >
  Git-like capabilities for your object storage.

enable:
  platys_init: LAKEFS,
  example: |
    platys init --enable-services LAKEFS,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28220>
      
      Login with username `V42FCGRVMK24JJ8DHUYG` and password `bKhWxVF3kQoLY9kFmt91l+tDrEoZjqnWXzY9Eza` (if left to defaults).
  - title: Using REST API
    content: |
      ```
      curl -X GET http://localhost:28220/api/v1/repositories -u "<accessKey>:<secretKey>"
      ```

parameters:
  - name: LAKEFS_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate LakeFS service

  - name: LAKEFS_use_as_drop_in_replacement_for_s3
    default: "false"
    since: "1.18.0"
    description: >
      Use LakeFS as a drop-in-replacement for S3? If enabled, all S3 endpoints
      will be configured to use the LakeFS S3 Gateway and the
      `LAKEFS_blockstore_type` config setting will then define the block adapter
      to use.

  - name: LAKEFS_database_type
    default: "local"
    since: "1.16.0"
    description: >
      Key-Value database to use for storing the metadata of LakeFS, one of
      [`local`, `postgresql`,`dynamodb`].

  - name: LAKEFS_database_username
    default: "postgres"
    since: "1.18.0"
    description: >
      The name of the user to connect to the database. Works only when
      `LAKEFS_database_type` is set to **not** `local`.

  - name: LAKEFS_database_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the user to connect to the database. Works only when
      `LAKEFS_database_type` is set to **not** `local`.

  - name: LAKEFS_database_dbname
    default: "postgres"
    since: "1.18.0"
    description: >
      The database name to connect to. Works only when `LAKEFS_database_type` is
      set to **not** `local`.

  - name: LAKEFS_blockstore_type
    default: "s3"
    since: "1.13.0"
    description: >
      Block adapter to use, one of [`local`, `s3`, `gs`, `azure`, `mem`]. This
      controls where the underlying data will be stored.

  - name: LAKEFS_blockstore_s3_credentials_file
    default: "~/lakefs/data"
    since: "1.18.0"
    sensitive: true
    description: >
      if specified, will be used as a credentials file.

  - name: LAKEFS_blockstore_s3_discover_bucket_region
    default: "true"
    since: "1.18.0"
    description: >
      Can be turned off if the underlying S3 bucket doesn’t support the
      GetBucketRegion API.

  - name: LAKEFS_blockstore_s3_client_log_request
    default: "false"
    since: "1.18.0"
    description: >
      Set SDK logging bit to log requests.

  - name: LAKEFS_blockstore_s3_client_log_retries
    default: "false"
    since: "1.18.0"
    description: >
      Set SDK logging bit to log retries.

  - name: LAKEFS_user_name
    default: "quickstart"
    since: "1.18.0"
    description: >
      When specified, an initial admin user will be created when the server is
      first run. Works only when `LAKEFS_database_type` is set to `local`.

  - name: LAKEFS_volume_map_data
    default: "INFO"
    since: "1.18.0"
    description: >
      Volume map the `data` and `metadata` folder into the LakeFS service.

  - name: LAKEFS_logging_level
    default: "INFO"
    since: "1.18.0"
    description: >
      Logging level to output, one of [`TRACE`, `DEBUG`, `INFO`, `WARN`, `ERROR`,
      `NONE`].

  - name: LAKEFS_logging_audit_log_level
    default: "INFO"
    since: "1.18.0"
    description: >
      Audit logs level to output, one of [`TRACE`, `DEBUG`, `INFO`, `WARN`,
      `ERROR`, `NONE`].

  - name: LAKEFS_actions_enabled
    default: "true"
    since: "1.18.0"
    description: >
      Enable access to environment variables from actions?

  - name: LAKEFS_actions_lua_net_http_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Setting this to true will load the net/http package.

  - name: LAKEFS_actions_env_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Setting this to true will load the net/http package.

  - name: LAKEFS_actions_env_prefix
    default: "LAKEFSACTION_"
    since: "1.18.0"
    description: >
      Access to environment variables is restricted to those with the prefix.
      When environment access is enabled and no prefix is provided, all variables
      are accessible.
