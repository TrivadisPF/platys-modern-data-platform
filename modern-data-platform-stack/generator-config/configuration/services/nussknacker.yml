name: Nussknacker
id: nussknacker
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://nussknacker.io/
  documentation: https://nussknacker.io/documentation/
  github: https://github.com/touk/nussknacker

description: >
  A visual tool to define and run real-time decision algorithms. Brings agility
  to business teams, liberates developers to focus on technology.

enable:
  platys_init: FLINK,NUSSKNACKER
  example: |
    platys init --enable-services FLINK,NUSSKNACKER
    platys gen

parameters:
  - name: NUSSKNACKER_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Nussknacker services

  - name: NUSSKNACKER_scenario_type
    default: "streaming"
    since: "1.16.0"
    description: >
      The processing mode (how a scenario deployed on an engine interacts with
      the outside world), one of `streaming`, `streaming-lite-embedded`,
      `request-response-embedded`.
