name: PostGraphile
id: postgraphile
arch: [x86-64]

tags: []
dependencies: [postgresql]
links:
  website: https://www.graphile.org/postgraphile/
  documentation: https://www.graphile.org/postgraphile/introduction/
  github: https://github.com/graphile/postgraphile
  docker: https://hub.docker.com/r/graphile/postgraphile

description: >
  PostGraphile builds a powerful, extensible and performant GraphQL API from a
  PostgreSQL schema in seconds, serving the GraphQL API and the GraphiQL IDE over HTTP.

enable:
  platys_init: POST_GRAPHILE
  example: |
    platys init --enable-services POSTGRESQL,POST_GRAPHILE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28151/graphiql> to use the GraphiQL IDE, or
      query the GraphQL API at <http://dataplatform:28151/graphql>.

      Requires a running PostgreSQL (the built-in `POSTGRESQL` service or an external one).

parameters:
  - name: POST_GRAPHILE_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate PostGraphile service, an instant GraphQL API for a PostgreSQL database.

  - name: POST_GRAPHILE_postgres_database
    default: "postgres"
    since: "1.21.0"
    description: >
      The PostgreSQL database to expose as a GraphQL API.

  - name: POST_GRAPHILE_postgres_user
    default: "postgres"
    since: "1.21.0"
    description: >
      The PostgreSQL user to connect as.

  - name: POST_GRAPHILE_postgres_password
    default: "abc123!"
    since: "1.21.0"
    description: >
      The PostgreSQL password to connect with. Can be overridden at runtime via the
      PLATYS_POSTGRESQL_PASSWORD environment variable.

  - name: POST_GRAPHILE_schema
    default: "public"
    since: "1.21.0"
    description: >
      The PostgreSQL schema (or comma-separated list of schemas) to expose through GraphQL.

  - name: POST_GRAPHILE_watch
    default: "true"
    since: "1.21.0"
    description: >
      Watch the database for schema changes and automatically update the GraphQL API
      (adds the --watch flag).

  - name: POST_GRAPHILE_enhance_graphiql
    default: "true"
    since: "1.21.0"
    description: >
      Enable the enhanced GraphiQL interface (adds the --enhance-graphiql flag).

  - name: POST_GRAPHILE_dynamic_json
    default: "true"
    since: "1.21.0"
    description: >
      Represent JSON and JSONB values as dynamic JSON rather than strings (adds the
      --dynamic-json flag).
