name: Raneto
id: raneto
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://raneto.com/
  documentation: https://docs.raneto.com/
  github: https://github.com/ryanlelek/Raneto

description: >
  Raneto is an open-source Knowledgebase platform that uses static Markdown
  files to power your Knowledgebase. It can be called a "static site generator"
  of sorts as it doesn't require a database. All of your content is stored in
  the content folder in Markdown (.md) files and the entire knowledgebase
  structure and content is generated by Raneto.

enable:
  platys_init: RANETO
  example: |
    platys init --enable-services RANETO
    platys gen

usage:
  - title: Connect to Raneto
    content: |
      Navigate to <http://dataplatform:28311>

parameters:
  - name: RANETO_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate a Raneto knowledge platform service.

  - name: RANETO_MADNESS_volume_map_config
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the `config` folder of the container.
