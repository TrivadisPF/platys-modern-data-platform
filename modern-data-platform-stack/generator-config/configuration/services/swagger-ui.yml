name: Swagger UI
id: swagger-ui
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://swagger.io/tools/swagger-ui/
  documentation: https://swagger.io/docs/open-source-tools/swagger-ui/
  github: https://github.com/swagger-api/swagger-ui

description: >
  Swagger UI allows anyone — be it your development team or your end consumers
  — to visualize and interact with the API’s resources without having any of
  the implementation logic in place. It’s automatically generated from your
  OpenAPI (formerly known as Swagger) Specification, with the visual
  documentation making it easy for back end implementation and client side
  consumption.

enable:
  platys_init: SWAGGER_UI
  example: |
    platys init --enable-services SWAGGER_UI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28157>

parameters:
  - name: SWAGGER_UI_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Swagger UI service
