name: Log4brains
id: log4brains
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/thomvaill/log4brains
  github: https://github.com/thomvaill/log4brains

description: >
  Log and publish your architecture decisions (ADR)

enable:
  platys_init: LOG4BRAINS
  example: |
    platys init --enable-services LOG4BRAINS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:4004>.

parameters:
  - name: LOG4BRAINS_enable
    default: "true"
    since: "1.11.0"
    description: >
      Generate log4brains service.

  - name: LOG4BRAINS_repository_name
    default: "trivadis"
    since: "1.11.0"
    description: >
      The repository name part of the log4brains docker image which should be
      used

  - name: LOG4BRAINS_image_name
    default: "log4brains"
    since: "1.11.0"
    description: >
      The image name part of the log4brains docker image which should be used

  - name: LOG4BRAINS_adr_source_dir
    default: "true"
    since: "1.11.0"
    description: >
      The folder holding the ADR sources.

  - name: LOG4BRAINS_command
    default: "preview"
    since: "1.11.0"
    description: >
      The log4brains command to run
