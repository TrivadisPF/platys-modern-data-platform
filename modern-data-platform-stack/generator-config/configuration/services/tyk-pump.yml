name: Tyk Pump
id: tyk-pump
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://tyk.io/open-source-api-gateway/
  documentation: https://tyk.io/docs/tyk-pump/
  github: https://github.com/TykTechnologies/tyk-pump

description: >
  Traffic analytics are captured by the Tyk Gateway nodes and then temporarily
  stored in Redis. The Tyk Pump is responsible for moving those analytics into
  a persistent data store, such as MongoDB, where the traffic can be analysed.

enable:
  platys_init: TYK,TYK_PUMP
  example: |
    platys init --enable-services TYK,TYK_PUMP
    platys gen

parameters:
  - name: TYK_PUMP_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Tyk Pump.
