name: EFAK (Eagle for Apache Kafka)
id: efak
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.kafka-eagle.org/
  documentation: https://www.kafka-eagle.org/articles/docs/documentation.html
  github: https://github.com/smartloli/EFAK

description: >
  A easy and high-performance monitoring system, for comprehensive monitoring
  and management of kafka cluster.

enable:
  platys_init: EFAK
  example: |
    platys init --enable-services EFAK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8048> and login as `admin` with password `123456`.

parameters:
  - name: EFAK_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate EFAK (Kafak Eagle) service
