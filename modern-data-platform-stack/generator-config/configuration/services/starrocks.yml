name: Starrocks
id: starrocks
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.starrocks.io/
  documentation: https://docs.starrocks.io/docs/introduction/StarRocks_intro/
  github: https://github.com/StarRocks/StarRocks

description: >
  StarRocks, a Linux Foundation project, is a next-generation sub-second MPP
  OLAP database for full analytics scenarios, including multi-dimensional
  analytics, real-time analytics, and ad-hoc queries.

enable:
  platys_init: STARROCKS
  example: |
    platys init --enable-services STARROCKS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:xxx>.

parameters:
  - name: STARROCKS_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Starrocks.
