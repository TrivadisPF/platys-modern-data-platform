name: Klaw
id: klaw
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.klaw-project.io/
  documentation: https://www.klaw-project.io/docs/getstarted
  github: https://github.com/Aiven-Open/klaw

description: >
  Klaw, the latest OS tool by Aiven, helps enterprises cope with Apache
  Kafka(r) topics, schema registry and connectors governance by introducing
  roles/authorizations to users of various teams of an org.

enable:
  platys_init: KAFKA,KLAW
  example: |
    platys init --enable-services KAFKA,KLAW
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28309> to use the Klaw UI.
      
      Login with default User: `superadmin` and Password: `abc123!`.

parameters:
  - name: KLAW_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate KLAW service

  - name: KLAW_cluster_id
    default: ""
    since: "1.17.0"
    description: >
      The cluster to use when security is enabled. Used for the prefix of the
      security configuration.

  - name: KLAW_superadmin_username
    default: "superadmin"
    since: "1.17.0"
    description: >
      The username of the superadmin user.

  - name: KLAW_superadmin_password
    default: "abc123!"
    since: "1.17.0"
    sensitive: true
    description: >
      The password of the superadmin user.

  - name: KLAW_mail_host
    default: "maildev"
    since: "1.17.0"
    description: >
      The host name of the mailserver to use when sending emails from Klaw.

  - name: KLAW_mail_port
    default: "25"
    since: "1.17.0"
    description: >
      The port of the mailserver to use when sending emails from Klaw.

  - name: KLAW_logging_level
    default: "info"
    since: "1.17.0"
    description: >
      The logging level to use

  - name: KLAW_quickstart_enabled
    default: "true"
    since: "1.17.0"
    description: >
      Enable the quickstart environment, e.g. automatically setup 2 users.

  - name: KLAW_quickstart_username_1
    default: "william"
    since: "1.17.0"
    description: >
      The name of the first user, only applicable if `KLAW_quickstart_enable` is
      set to `true`.

  - name: KLAW_quickstart_username_2
    default: "jennifer"
    since: "1.17.0"
    description: >
      The name of the second user, only applicable if `KLAW_quickstart_enable` is
      set to `true`.

  - name: KLAW_quickstart_password
    default: "welcome"
    since: "1.17.0"
    sensitive: true
    description: >
      The password of the two user, only applicable if `KLAW_quickstart_enable`
      is set to `true`.
