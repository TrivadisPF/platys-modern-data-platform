name: Crawl4AI
id: crawl4ai
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  website: https://crawl4ai.com/mkdocs
  documentation: https://crawl4ai.com/mkdocs/
  github: https://github.com/unclecode/crawl4ai

description: >
  Open-source LLM Friendly Web Crawler & Scraper.

enable:
  platys_init: CRAWL4AI
  example: |
    platys init --enable-services CRAWL4AI
    platys gen

parameters:
  - name: CRAWL4AI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Crawl4AI service

  - name: CRAWL4AI_openai_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      Specify OpenAPI key

  - name: CRAWL4AI_anthropic_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      Specify Anthropic key

  - name: CRAWL4AI_groq_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      Specify Groq key
