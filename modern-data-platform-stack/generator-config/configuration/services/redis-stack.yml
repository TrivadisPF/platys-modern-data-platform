name: Redis Stack
id: redis-stack
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://redis.io/
  documentation: https://redis.io/docs/about/about-stack/
  github: https://github.com/redis-stack/redis-stack

description: >
  A Redis server with additional database capabilities powered by Redis
  modules.

enable:
  platys_init: REDIS_STACK
  example: |
    platys init --enable-services REDIS_STACK
    platys gen

usage:
  - title: Usage
    content: |
      To connect to Redis Stack over the Redis-CLI, use
      
      ```
      docker exec -ti redis-stack-1 redis-cli
      ```

parameters:
  - name: REDIS_STACK_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Redis Stack service

  - name: REDIS_STACK_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder into the Redis Stack service

  - name: REDIS_STACK_password
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      Set the Redis server password, only used if `REDIS_allow_empty_password` is
      set to `false`. Alternative to setting it via `REDIS_password_file`.
