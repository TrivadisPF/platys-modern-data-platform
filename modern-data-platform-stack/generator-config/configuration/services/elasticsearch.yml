name: Elasticsearch
id: elasticsearch
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.elastic.co/elasticsearch/
  documentation: https://www.elastic.co/guide/en/elasticsearch/reference/current/index.html
  github: https://github.com/elastic/elasticsearch

description: >
  Elasticsearch is a distributed, RESTful search and analytics engine capable
  of addressing a growing number of use cases. As the heart of the Elastic
  Stack, it centrally stores your data for lightning fast search, fine‑tuned
  relevancy, and powerful analytics that scale with ease.

enable:
  platys_init: ELASTICSEARCH
  example: |
    platys init --enable-services ELASTICSEARCH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9200>

parameters:
  - name: ELASTICSEARCH_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Elasticsearch service

  - name: ELASTICSEARCH_major_version
    default: "9"
    since: "1.16.0"
    description: >
      Which major version of Elasticsearch to use, one of `7` or `8` or `9`. The
      exact version can then be specified using either the
      `ELASTICSEARCH_7_version` or `ELASTICSEARCH_8_version` or
      `ELASTICSEARCH_9_version` setting.

  - name: ELASTICSEARCH_edition
    default: "oss"
    since: "1.16.0"
    description: >
      The Elasticsearch edition to use, either `oss` or `elastic`.

  - name: ELASTICSEARCH_security_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable Elasticsearch security features on the node? This setting must be
      enabled to use Elasticsearch’s authentication, authorization and audit
      features.

  - name: ELASTICSEARCH_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the `elastic` user. Only applicable if
      `ELASTICSEARCH_security_enabled` is enabled.
