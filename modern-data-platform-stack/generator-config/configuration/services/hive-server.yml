name: Apache Hive
id: hive-server
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://hive.apache.org/
  documentation: https://cwiki.apache.org/confluence/display/Hive/GettingStarted
  github: https://github.com/apache/hive

description: >
  The Apache Hive ™ data warehouse software facilitates reading, writing, and
  managing large datasets residing in distributed storage using SQL. Structure
  can be projected onto data already in storage. A command line tool and JDBC
  driver are provided to connect users to Hive.

enable:
  platys_init: HIVE
  example: |
    platys init --enable-services HIVE
    platys gen

parameters:
  - name: HIVE_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Hive service
