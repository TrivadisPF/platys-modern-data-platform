name: Oracle RDBMS Enterprise Edition (EE)
id: oracledb-ee
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.oracle.com/database/technologies/appdev/xe.html
  documentation: https://www.oracle.com/database/technologies/appdev/xe/quickstart.html

description: >
  Whether you are a developer, a DBA, a data scientist, an educator, or just
  curious about databases, Oracle Database Express Edition (XE) is the ideal
  way to get started. It is the same powerful Oracle Database that enterprises
  rely on worldwide, packaged for simple download, ease-of-use, and a
  full-featured experience. You get an Oracle Database to use in any
  environment, plus the ability to embed and redistribute – all completely
  free!

enable:
  platys_init: ORACLE_XE
  example: |
    platys init --enable-services ORACLE_XE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28152>

parameters:
  - name: ORACLE_EE_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Oracle service. For using this service, you either need to have
      access to the private images located in the Docker Hub organisation
      specified in the `private_docker_repository_name` global property (defaults
      to `trivadis`) and be logged in when starting the platform.

  - name: ORACLE_EE_nodes
    default: "1"
    since: "1.18.0"
    description: >
      Number of Oracle Enterprise database nodes to enable, maximum is `3`.

  - name: ORACLE_EE_volume_map_data
    default: "false"
    since: "1.13.0"
    description: >
      Volume map data folder into the Oracle service

  - name: ORACLE_EE_password
    default: "EAo4KsTfRR"
    since: "1.13.0"
    sensitive: true
    description: >
      The password to use for the `SYS` and `SYSTEM` user.

  - name: ORACLE_EE_container_enabled
    default: "false"
    since: "1.13.0"
    description: >
      Enable a pluggable container database.

  - name: ORACLE_EE_characterset
    default: "AL32UTF8"
    since: "1.18.0"
    description: >
      The character set to use when creating the database.
