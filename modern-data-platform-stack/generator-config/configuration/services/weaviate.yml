name: Weaviate
id: weaviate
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://weaviate.io/
  documentation: https://weaviate.io/developers/weaviate
  github: https://github.com/weaviate/weaviate

description: >
  Weaviate is an open source vector database that stores both objects and
  vectors, allowing for combining vector search with structured filtering with
  the fault-tolerance and scalability of a cloud-native database, all
  accessible through GraphQL, REST, and various language clients.

enable:
  platys_init: WEAVIATE
  example: |
    platys init --enable-services WEAVIATE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28354>.

parameters:
  - name: WEAVIATE_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Weaviate service

  - name: WEAVIATE_modules
    default: ""
    since: "1.18.0"
    description: >
      Modules to enable in setup. A comma-separated list (find available modules
      here).

  - name: WEAVIATE_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder into service.
