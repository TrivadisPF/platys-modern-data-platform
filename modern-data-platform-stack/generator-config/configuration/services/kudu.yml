name: Apache Kudu
id: kudu
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://kudu.apache.org/
  documentation: https://kudu.apache.org/docs/
  github: https://github.com/projectkudu/kudu

description: >
  Apache Kudu is an open source distributed data storage engine that makes fast
  analytics on fast and changing data easy.

enable:
  platys_init: KUDU
  example: |
    platys init --enable-services KUDU
    platys gen

parameters:
  - name: KUDU_enable
    default: "false"
    since: "1.8.0"
    description: >
      Generate Kudu service
