name: LocalAI
id: local-ai
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://localai.io/
  documentation: https://localai.io
  github: https://github.com/mudler/LocalAI

description: >
  The free, Open Source OpenAI alternative. Self-hosted, community-driven and
  local-first. Drop-in replacement for OpenAI running on consumer-grade
  hardware. No GPU required. Runs gguf, transformers, diffusers and many more
  models architectures. It allows to generate Text, Audio, Video, Images. Also
  with voice cloning capabilities.

enable:
  platys_init: LOCAL_AI
  example: |
    platys init --enable-services LOCAL_AI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28356>.

parameters:
  - name: LOCAL_AI_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate LocalAI service

  - name: LOCAL_AI_gpu_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enable GPU for Local AI?

  - name: LOCAL_AI_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the data folder into the LocalAI service.

  - name: OPEN_WEBUI_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Open WebUI service

  - name: OPEN_WEBUI_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map `data` folder into Ollama WebUI service

  - name: OPEN_WEBUI_secret_key
    default: "false"
    since: "1.17.0"
    sensitive: true
    description: >
      Generate Ollama WebUI service

  - name: OPEN_WEBUI_gpu_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable GPU for Open WebUI service?

  - name: OPEN_WEBUI_database_type
    default: "sqlite"
    since: "1.18.0"
    description: >
      The database to store the data, either `sqlite` or `postgres`.

  - name: OPEN_WEBUI_database_username
    default: "postgres"
    since: "1.18.0"
    description: >
      The username for the database, only valid if `OPEN_WEBUI_database_type ` is
      not `sqlite`.

  - name: OPEN_WEBUI_database_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password for the database, only valid if `OPEN_WEBUI_database_type ` is
      not `sqlite`.

  - name: OPEN_WEBUI_database_name
    default: "postgres"
    since: "1.18.0"
    description: >
      The database name, only valid if `OPEN_WEBUI_database_type ` is not
      `sqlite`.

  - name: OPEN_WEBUI_vector_db
    default: "chroma"
    since: "1.18.0"
    description: >
      The vector database to use, either `chroma`, `elasticsearch`, `opensearch`,
      `milvus`, `milvus`, `qdrant`, `weaviate`, `pgvector`, `oracle23ai`.

  - name: OPEN_WEBUI_rag_embedding_engine
    default: ""
    since: "1.18.0"
    description: >
      The embedding engine to use for RAG. Either empty, which uses Sentence
      Transformers or one of `openai` or `ollama`.

  - name: OPEN_WEBUI_rag_embedding_model
    default: ""
    since: "1.18.0"
    description: >
      The embedding model to use, if `OPEN_WEBUI_rag_embedding_engine` is set to
      `openai` or `ollama`.

  - name: OPEN_WEBUI_audio_stt_engine
    default: ""
    since: "1.18.0"
    description: >
      The speech-to-text engine to use, either empty, for local whisper engine,
      or `openai`

  - name: OPEN_WEBUI_audio_transcriber_enabled
    default: ""
    since: "1.18.0"
    description: >
      Enable the audio transcriber service and configure it as the speech-to-text
      engine to use. Set `OPEN_WEBUI_audio_stt_engine` to `openai`.
