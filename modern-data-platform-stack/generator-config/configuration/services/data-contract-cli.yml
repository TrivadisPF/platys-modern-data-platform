name: Data Contract CLI
id: data-contract-cli
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://datacontract.com/
  documentation: https://cli.datacontract.com/
  github: https://github.com/datacontract/datacontract-cli/

description: >
  CLI to manage your datacontract.yaml files

enable:
  platys_init: DATA_CONTRACT_CLI
  example: |
    platys init --enable-services DATA_CONTRACT_CLI
    platys gen

parameters:
  - name: DATA_CONTRACT_CLI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Data Contract CLI service

  - name: DATA_CONTRACT_CLI_home_dir
    default: "${PWD}"
    since: "1.18.0"
    description: >
      the folder (home director) which is mapped into the container
