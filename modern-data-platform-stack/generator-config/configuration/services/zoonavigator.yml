name: Zoonavigator
id: zoonavigator
category:
  id: 20_infrastructure
  name: infrastructure
  color: steel
arch: [x86-64]

links:
  website: https://github.com/elkozmon/zoonavigator
  documentation: https://zoonavigator.elkozmon.com/en/latest/
  github: https://github.com/elkozmon/zoonavigator

description: >
  Web-based ZooKeeper UI / editor / browser.

enable:
  platys_init: ZOOKEEPER
  example: |
    platys init --enable-services ZOOKEEPER
    platys gen

parameters:
  - name: ZOONAVIGATOR_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Zoonavigator.
