name: CrewAI Studio
id: crewai-studio
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/strnad/CrewAI-Studio
  documentation: https://github.com/strnad/CrewAI-Studio
  github: https://github.com/strnad/CrewAI-Studio

description: >
  A user-friendly, multi-platform GUI for managing and running
  [CrewAI](https://www.crewai.com/) agents and tasks. Supports Conda and
  virtual environments, no coding needed.

enable:
  platys_init: CREWAI_STUDIO
  example: |
    platys init --enable-services CREWAI_STUDIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8501>.

parameters:
  - name: CREWAI_STUDIO_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate CrewAI Studio service

  - name: CREWAI_STUDIO_agentops_enabled
    default: "false"
    since: "1.18.0"
    sensitive: true
    description: >
      Enable integration with AgentOps observability. You need to specify the api
      key using the `PLATYS_CREWAI_STUDIO_AGENTOPS_API_KEY` environment variable.
