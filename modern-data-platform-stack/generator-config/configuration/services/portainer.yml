name: Portainer
id: portainer
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://www.portainer.io/
  documentation: https://docs.portainer.io/
  github: https://github.com/portainer/portainer

description: >
  Portainer can be deployed on top of any K8s, Docker or Swarm environment. It
  works seamlessly in the cloud, on prem and at the edge to give you a
  consolidated view of all your containers.

enable:
  platys_init: PORTAINER
  example: |
    platys init --enable-services PORTAINER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28137>. 
      
      Use `admin` for user and `abc123!abc123!` for the password.

parameters:
  - name: PORTAINER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Portainer Container UI service
