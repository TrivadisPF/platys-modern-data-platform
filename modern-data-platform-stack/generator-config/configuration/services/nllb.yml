name: No Language Left Behind (NLLB)
id: nllb
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/winstxnhdw/nllb-api
  github: https://github.com/winstxnhdw/nllb-api

description: >
  A performant high-throughput CPU-based API for Meta's No Language Left Behind
  (NLLB) using CTranslate2, hosted on Hugging Face Spaces.

enable:
  platys_init: NLLB
  example: |
    platys init --enable-services NLLB
    platys gen

usage:
  - title: Usage
    content: |
      REST API documentation available [here](http://dataplatform:28257/api/schema/swagger).
      
      Translate
      
      ```bash
      curl 'http://dataplatform:28257/api/v4/translator?text=Hello&source=eng_Latn&target=spa_Latn'
      ```

parameters:
  - name: NLLB_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate NLLB service

  - name: NLLB_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the model cache folder

  - name: NLLB_gpu_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable GPU for NLLB service?
