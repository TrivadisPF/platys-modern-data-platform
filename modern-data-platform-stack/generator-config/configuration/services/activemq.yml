name: Apache ActiveMQ
id: activemq
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://activemq.apache.org/
  documentation: https://activemq.apache.org/components/classic/documentation
  github: https://github.com/apache/activemq

description: >
  Apache ActiveMQ® is the most popular open source, multi-protocol, Java-based
  message broker. It supports industry standard protocols so users get the
  benefits of client choices across a broad range of languages and platforms.
  Connect from clients written in JavaScript, C, C++, Python, .Net, and more.
  Integrate your multi-platform applications using the ubiquitous AMQP
  protocol. Exchange messages between your web applications using STOMP over
  websockets. Manage your IoT devices using MQTT. Support your existing JMS
  infrastructure and beyond. ActiveMQ offers the power and flexibility to
  support any messaging use-case.

enable:
  platys_init: ACTIVEMQ
  example: |
    platys init --enable-services ACTIVEMQ
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8161> for the ActiveMQ dashboard.
      
      To manage the ActiveMQ server, navigate to <http://dataplatform:8161/admin/> and use `admin` for the user and `admin` for the password when asked for.

parameters:
  - name: ACTIVEMQ_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate ActiveMQ service

  - name: ACTIVEMQ_edition
    default: "classic"
    since: "1.17.0"
    description: >
      The ActiveMQ component to use, either `classic` or `artemis`.

  - name: ACTIVEMQ_user
    default: "activemq"
    since: "1.17.0"
    description: >
      The ActiveMQ user.

  - name: ACTIVEMQ_password
    default: "abc123!"
    since: "1.17.0"
    sensitive: true
    description: >
      The ActiveMQ password to use for the user.
