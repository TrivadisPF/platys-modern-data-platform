name: Kafka Topics UI
id: kafka-topics-ui
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://lenses.io/product/features/
  documentation: https://github.com/lensesio/kafka-topics-ui
  github: https://github.com/lensesio/kafka-topics-ui

description: >
  Web tool for Kafka Connect

enable:
  platys_init: KAFKA,KAFKA_TOPICS_UI
  example: |
    platys init --enable-services KAFKA,KAFKA_TOPICS_UI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://${PUBLIC_IP}:28141>

parameters:
  - name: KAFKA_TOPICS_UI_enable
    default: "false"
    since: "1.4.0"
    description: >
      Generate Landoop Kafka Topics UI service

  - name: KAFKA_TOPICS_UI_map_resolv_conf
    default: "true"
    since: "1.13.0"
    description: >
      If `true` the `conf/resolv.conf` is mapped into the container to avoid the
      `panic: runtime error: slice bounds out of range` when running Docker on an
      actual Ubunutu.
