name: Coder
id: coder
arch: [x86-64]

tags: []
dependencies:
  - postgresql

links:
  website: https://coder.com
  documentation: https://coder.com/docs
  github: https://github.com/coder/coder

description: >
  Coder is an open-source platform for creating and managing cloud development
  environments (CDEs) running on your own infrastructure. Developers connect to
  remote workspaces via VS Code, JetBrains, or a browser-based IDE, with
  reproducible environments defined as Terraform templates.

enable:
  platys_init: CODER
  example: |
    platys init --enable-services POSTGRESQL,CODER
    platys gen

usage:
  - title: Open the Coder UI
    content: |
      Navigate to <http://dataplatform:28494>.

      On first access create an admin account, then define workspace templates
      and provision developer workspaces.

  - title: Use the Coder CLI
    content: |
      Install the CLI:

      ```bash
      curl -L https://coder.com/install.sh | sh
      ```

      Authenticate and create a workspace:

      ```bash
      coder login http://dataplatform:28494
      coder templates list
      coder create my-workspace --template <template-name>
      ```

parameters:
  - name: CODER_enable
    default: "false"
    since: "1.20.0"
    description: >
      Enable the Coder cloud development environment service.
      Requires POSTGRESQL_enable: true.

  - name: CODER_access_url
    default: "http://dataplatform:28494"
    since: "1.20.0"
    description: >
      The URL at which Coder is accessible. Must be reachable from both
      browsers and workspace agents. Change this to your public IP or hostname
      when deploying on a remote server.

  - name: CODER_postgres_dbname
    default: "coder"
    since: "1.20.0"
    description: >
      PostgreSQL database name for Coder.

  - name: CODER_postgres_user
    default: "coder"
    since: "1.20.0"
    description: >
      PostgreSQL user for Coder.

  - name: CODER_postgres_password
    default: "abc123!"
    since: "1.20.0"
    sensitive: true
    description: >
      PostgreSQL password for Coder.

  - name: CODER_mount_docker_socket
    default: "true"
    since: "1.20.0"
    description: >
      Mount the host Docker socket (/var/run/docker.sock) into Coder so it can
      provision Docker-based workspaces without an external provisioner.
