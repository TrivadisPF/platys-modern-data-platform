name: Glances
id: glances
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  website: https://nicolargo.github.io/glances/
  documentation: http://glances.readthedocs.org/en/latest/
  github: https://github.com/nicolargo/glances

description: >
  Glances an Eye on your system. A top/htop alternative for GNU/Linux, BSD, Mac
  OS and Windows operating systems.

enable:
  platys_init: GLANCES
  example: |
    platys init --enable-services GLANCES
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28383>.

parameters:
  - name: GLANCES_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Glances service

  - name: GLANCES_with_gpu
    default: "false"
    since: "1.18.0"
    description: >
      Enable GPU plugin
