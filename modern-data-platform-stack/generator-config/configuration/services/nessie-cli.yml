name: Nessie CLI
id: nessie-cli
arch: [x86-64]

tags: [cli]
dependencies: [nessie]
links:
  website: https://projectnessie.org/
  documentation: https://projectnessie.org/features/
  github: https://github.com/projectnessie/nessie

description: >
  Transactional Catalog for Data Lakes with Git-like semantics. This
  container runs the Nessie CLI.

enable:
  platys_init: NESSIE_CLI
  example: |
    platys init --enable-services NESSIE_CLI
    platys gen

usage:
  - title: Running the CLI
    content: |
      The container starts the CLI already connected to Nessie. Attach to it
      interactively:

      ```bash
      docker attach nessie-cli
      ```

parameters:
  - name: NESSIE_CLI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate the `nessie-cli` service.
