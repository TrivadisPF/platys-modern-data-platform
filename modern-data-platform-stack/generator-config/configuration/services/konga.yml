name: Konga
id: konga
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://pantsel.github.io/konga/
  documentation: https://github.com/pantsel/konga/blob/master/README.md
  github: https://github.com/pantsel/konga

description: >
  An open source tool that enables you to manage your Kong API Gateway with
  ease.

enable:
  platys_init: KONG,
  example: |
    platys init --enable-services KONG,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:1337>

parameters:
  - name: KONGA_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Konga Admin UI service

  - name: KONGA_volume_map_data
    default: "false"
    since: "1.16.0"
    description: >
      Volume map folder into Konga service?
