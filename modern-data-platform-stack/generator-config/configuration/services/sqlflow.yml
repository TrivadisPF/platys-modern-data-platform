name: SQLFlow
id: sqlflow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/turbolytics/sql-flow
  documentation: https://github.com/turbolytics/sql-flow
  github: https://github.com/turbolytics/sql-flow

description: >
  SQLFlow is a stream processing engine that lets you filter, transform and
  enrich streaming data using just SQL.

enable:
  platys_init: SQLFLOW
  example: |
    platys init --enable-services SQLFLOW
    platys gen

usage:
  - title: Running scripts
    content: |
      Place SQLFlow scripts (`.yml` config files) into `./scripts/sqlflow` and
      list the ones to run on startup with `SQLFLOW_scripts`.

parameters:
  - name: SQLFLOW_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate SQLFlow service.

  - name: SQLFLOW_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data folder into SQLFlow.

  - name: SQLFLOW_scripts
    default: ""
    since: "1.18.0"
    description: >
      A comma-separated list of scripts (the name), placed in
      `./scripts/sqlflow` to start SQLFlow with.
