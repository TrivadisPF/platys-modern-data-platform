name: Platys Modern Data Platform Init Service
id: platys-mdp-init
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/trivadispf/docker-platys-mdp-init
  github: https://github.com/trivadispf/docker-platys-mdp-init

description: >
  Executes shell scripts provided in folder `docker-entrypoint-init.d` upon
  startup. Can be used to initialize other services, for example by calling
  their REST APIs.

enable:
  platys_init: PLATYS_MDP_INIT
  example: |
    platys init --enable-services PLATYS_MDP_INIT
    platys gen

parameters:
  - name: PLATYS_MDP_INIT_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Platys MDP Init service

  - name: PLATYS_MDP_INIT_env_variables
    default: ""
    since: "1.18.0"
    description: >
      A comma-separated list of key-value pairs to setup as environment variable
      in the Platys MDP Init service: `=,=`.

  - name: PLATYS_MDP_INIT_use_env_file
    default: "false"
    since: "1.18.0"
    description: >
      Map a file (defining environment variables) into the service? Use
      `PLATYS_MDP_INIT_env_filename` to specify the name of the file.

  - name: PLATYS_MDP_INIT_env_filename
    default: ".env"
    since: "1.18.0"
    description: >
      The name of the file.

  - name: PLATYS_MDP_DOCKER_DEPLOY_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Platys MDP Docker Image Deploy service

  - name: PLATYS_MDP_DOCKER_DEPLOY_env_variables
    default: ""
    since: "1.19.0"
    description: >
      A comma-separated list of key-value pairs to setup as environment variable
      in the Platys MDP Docker Image Deploy service: `=,=`.
