name: Apache Pinot
id: pinot
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://pinot.apache.org/
  documentation: https://docs.pinot.apache.org/
  github: https://github.com/apache/pinot

description: >
  Realtime distributed OLAP datastore, designed to answer OLAP queries with low
  latency.

enable:
  platys_init: PINOT
  example: |
    platys init --enable-services PINOT
    platys gen

parameters:
  - name: PINOT_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate Pinot service

  - name: PINOT_servers
    default: "1"
    since: "1.12.0"
    description: >
      The number of Pinot `server` nodes to start in the cluster.

  - name: PINOT_volume_map_data
    default: "false"
    since: "1.12.0"
    description: >
      Volume map data folder into the Pinot service (currently has no impact).
