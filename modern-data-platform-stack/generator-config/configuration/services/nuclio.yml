name: Nuclio
id: nuclio
category:
  id: 19_tools
  name: tools
  color: silver
arch: [x86-64]

links:
  website: https://nuclio.io/
  documentation: https://nuclio.io/docs/latest
  github: https://github.com/nuclio/nuclio

description: >
  Nuclio is an open source and managed serverless platform used to minimize
  development and maintenance overhead and automate the deployment of
  data-science based applications.

enable:
  platys_init: NUCLIO
  example: |
    platys init --enable-services NUCLIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28131>

parameters:
  - name: NUCLIO_enable
    default: "false"
    since: "1.13.0"
    description: >
      Enable Nuclio service.

  - name: NUCLIO_map_tmp_folder
    default: "false"
    since: "1.17.0"
    description: >
      Map local `/tmp` folder into container?
