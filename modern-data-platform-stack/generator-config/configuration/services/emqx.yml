name: EMQ X
id: emqx
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.emqx.io/
  documentation: https://docs.emqx.io/en/broker/v4.3/index.html
  github: https://github.com/emqx/emqx

description: >
  An Open-Source, Cloud-Native, Distributed MQTT Broker for IoT.

enable:
  platys_init: EMQX
  example: |
    platys init --enable-services EMQX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28225>

parameters:
  - name: EMQX_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate EMQX service

  - name: EMQX_edition
    default: "oss"
    since: "1.12.0"
    description: >
      Generate EMQX service, either `oss` for the open-source or `enterprise` for
      the enterprise edition.
