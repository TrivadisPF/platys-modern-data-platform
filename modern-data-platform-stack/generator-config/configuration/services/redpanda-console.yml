name: Redpanda Console
id: redpanda-console
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://redpanda.com/
  documentation: https://docs.redpanda.com/docs/platform/console/
  github: https://github.com/redpanda-data/console

description: >
  Redpanda Console is a developer-friendly UI for managing your Kafka/Redpanda
  workloads. Console gives you a simple, interactive approach for gaining
  visibility into your topics, masking data, managing consumer groups, and
  exploring real-time data with time-travel debugging.

enable:
  platys_init: KAFKA,REDPANDA_CONSOLE
  example: |
    platys init --enable-services KAFKA,REDPANDA_CONSOLE
    platys gen

usage:
  - title: Connect to Redpanda Console
    content: |
      Navigate to <http://dataplatform:28289>

parameters:
  - name: REDPANDA_CONSOLE_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Redpanda Console (new home for Kowl) service

  - name: REDPANDA_CONSOLE_edition
    default: "oss"
    since: "1.16.0"
    description: >
      The edition of Redpanda Console, either `oss` or `enterprise`.
