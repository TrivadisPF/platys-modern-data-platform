name: Draw.io
id: drawio
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.drawio.com/
  documentation: https://www.drawio.com
  github: https://github.com/jgraph/drawio

description: >
  draw.io is a JavaScript, client-side editor for general diagramming.

enable:
  platys_init: DRAWIO
  example: |
    platys init --enable-services DRAWIO
    platys gen

usage:
  - title: Connect to Draw.io
    content: |
      Navigate to <http://dataplatform:28390>

parameters:
  - name: DRAWIO_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Draw.io service
