name: Trino Gateway
id: trino-gateway
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://trinodb.github.io/trino-gateway/
  github: https://github.com/trinodb/trino-gateway

description: >
  A load balancer, proxy server, and configurable routing gateway for multiple
  Trino clusters.

enable:
  platys_init: TRINO,TRINO_GATEWAY
  example: |
    platys init --enable-services TRINO,TRINO_GATEWAY
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28270>.

parameters:
  - name: TRINO_GATEWAY_enable
    default: "false"
    since: "1.19.0"
    description: >
      Enable Trino Gateway service.

  - name: TRINO_GATEWAY_volume_map_custom_config_file
    default: "false"
    since: "1.19.0"
    description: >
      Should the file `trino-gateway-config.yaml` from the `custom-conf` folder
      be used to configure Trino Gateway?

  - name: TRINO_GATEWAY_rules_engine_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable Trino Gateway routing rule engine?

  - name: TRINO_GATEWAY_rules_type
    default: "FILE"
    since: "1.19.0"
    description: >
      if routing rule engine is enabled, are the rules processed internally (type
      `FILE`) or by an external service (type `EXTERNAL`).

  - name: TRINO_GATEWAY_rules_file
    default: "routing_rules.yml"
    since: "1.19.0"
    description: >
      if `TRINO_GATEWAY_rules_type` is set to `FILE` specify the name of the
      routing rule file, placed in folder `./scripts/trino-gateway/rules`.

  - name: TRINO_GATEWAY_url_path
    default: ""
    since: "1.19.0"
    description: >
      if `TRINO_GATEWAY_rules_type` is set to `EXTERNAL` specify the URL of the
      external service for routing rules processing. The service will be invoked
      using POST request.

  - name: TRINO_GATEWAY_monitor_type
    default: ""
    since: "1.19.0"
    description: >
      Strategy for performing health checks, one of `NOOP`, `INFO_API`, `UI_API`,
      `JDBC`, `JMX`, `METRICS`.

  - name: TRINO_GATEWAY_analyze_request_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Set to `true` to make `trinoQueryProperties` and `trinoRequestUser`
      available.

  - name: TRINO_GATEWAY_ui_pages_disabled
    default: ""
    since: "1.19.0"
    description: >
      Comma separated list of UI pages to disable, use one or more of the
      following IDs for the corresponding page:
      `dashboard`,`cluster`,`resource-group`,`selector`,`history`,`routing-rules`.
      So if you want to disable the Routing Rules and the Cluster page, then
      specify `routing-rules,cluster`.

  - name: TRINO_GATEWAY_modules_enabled
    default: ""
    since: "1.19.0"
    description: >
      The modules (router) to enable, as a comma separted list of module IDs.
      Currently the following modules are supported: `query-count-based-router`.

  - name: TRINO_GATEWAY_db_migrations_enabled
    default: "true"
    since: "1.19.0"
    description: >
      Enable flyway database migrations?

  - name: TRINO_GATEWAY_query_history_enabled
    default: "true"
    since: "1.20.0"
    description: >
      Enable query history tracking in Trino Gateway?
