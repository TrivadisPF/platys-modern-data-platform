name: RStudio
id: rstudio
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.rstudio.com/
  documentation: https://docs.rstudio.com/
  github: https://github.com/rstudio/rstudio

description: >
  An integrated development environment for R and Python, with a console,
  syntax-highlighting editor that supports direct code execution, and tools for
  plotting, history, debugging and workspace management.

enable:
  platys_init: RSTUDIO
  example: |
    platys init --enable-services RSTUDIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8787>

parameters:
  - name: RSTUDIO_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate RStudio service

  - name: RSTUDIO_run_as_root
    default: "false"
    since: "1.13.0"
    description: >
      Run RStudio with root permissions?

  - name: RSTUDIO_password
    default: "rstudio"
    since: "1.13.0"
    sensitive: true
    description: >
      The password of the `rstudio` user

  - name: RSTUDIO_disable_auth
    default: "false"
    since: "1.13.0"
    description: >
      Run RStudio without authentication?
