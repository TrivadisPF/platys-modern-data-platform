name: Anything LLM
id: anything-llm
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://useanything.com/
  documentation: https://docs.useanything.com/
  github: https://github.com/Mintplex-Labs/anything-llm

description: >
  A multi-user ChatGPT for any LLMs and vector database. Unlimited documents,
  messages, and storage in one privacy-focused app. Now available as a desktop
  application!

enable:
  platys_init: ANYHING_LLM
  example: |
    platys init --enable-services ANYHING_LLM
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28344>.

parameters:
  - name: ANYTHING_LLM_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Anything LLM service

  - name: ANYTHING_LLM_volume_map_dotenv
    default: "false"
    since: "1.17.0"
    description: >
      Map the `.env` file from `custom-conf/anything-llm` folder into the
      container. Can be used to overwrite default settings.

  - name: ANYTHING_LLM_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Map the `data` folder into the container.
