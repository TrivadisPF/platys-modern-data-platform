name: Hue
id: hue
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://gethue.com//
  documentation: https://gethue.com/
  github: https://github.com/cloudera/hue

description: >
  Open source SQL Query Assistant service for Databases/Warehouses.

enable:
  platys_init: HUE
  example: |
    platys init --enable-services HUE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8888>

parameters:
  - name: HUE_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Hue UI service
