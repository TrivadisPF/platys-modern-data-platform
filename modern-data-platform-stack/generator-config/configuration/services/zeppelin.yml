name: Apache Zeppelin
id: zeppelin
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://zeppelin.apache.org/
  documentation: https://zeppelin.apache.org/
  github: https://github.com/apache/zeppelin

description: >
  Web-based notebook that enables data-driven, interactive data analytics and
  collaborative documents with SQL, Scala and more.

enable:
  platys_init: ZEPPELIN
  example: |
    platys init --enable-services ZEPPELIN
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28080>

parameters:
  - name: ZEPPELIN_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Apache Zeppelin service

  - name: ZEPPELIN_volume_map_data
    default: "false"
    since: "1.0.0"
    description: >
      Volume map notebooks folder into Zeppelin service

  - name: ZEPPELIN_admin_username
    default: "admin"
    since: "1.10.0"
    description: >
      Username of the user with admin role

  - name: ZEPPELIN_admin_password
    default: "changeme"
    since: "1.10.0"
    sensitive: true
    description: >
      Password of the user with admin role

  - name: ZEPPELIN_user_username
    default: "zeppelin"
    since: "1.10.0"
    description: >
      Username of the user with user role

  - name: ZEPPELIN_admin_password
    default: "changeme"
    since: "1.10.0"
    sensitive: true
    description: >
      Password of the user with user role

  - name: ZEPPELIN_spark_cores_max
    default: ""
    since: "1.10.0"
    description: >
      the maximum amount of CPU cores to request for the application from across
      the cluster (not from each machine). If not set, the default will be
      `spark.deploy.defaultCores` to be set through `SPARK_MASTER_OPTS`.

  - name: ZEPPELIN_spark_executor_memory
    default: ""
    since: "1.10.0"
    description: >
      Amount of memory to use per executor process, in the same format as JVM
      memory strings with a size unit suffix ('k', 'm', 'g' or 't') (e.g. 512m,
      2g). If not set, the default will be `1g`.

  - name: ZEPPELIN_notebook_dir
    default: "notebook"
    since: "1.15.0"
    description: >
      Directory where the notebooks are saved. If the default is used, then the
      tutorial notebooks will be shown.

  - name: ZEPPELIN_notebook_cron_enabled
    default: ""
    since: "1.10.0"
    description: >
      Enable cron scheduler on each notebook.

  - name: ZEPPELIN_spark_submit_options
    default: ""
    since: "1.12.0"
    description: >
      Add spark submit options additional to the one which are already set by
      default.

  - name: ZEPPELIN_use_local_spark
    default: ""
    since: "1.15.0"
    description: >
      Use local spark environment if set to `true` by setting the `SPARK_MASTER`
      setting to `local[*]`

  - name: ZEPPELIN_pyspark_driver_python_path
    default: "/opt/conda/envs/python_3_with_R/bin/python3"
    since: "1.20.0"
    description: >
      Path to the Python executable used as the PySpark driver
      (`PYSPARK_DRIVER_PYTHON`).

  - name: ZEPPELIN_python_packages
    default: ""
    since: "1.20.0"
    description: >
      Space-separated list of Python packages to install via `pip` when starting
      Zeppelin (e.g. `pyspark==3.5.3 boto3 numpy`). Leave empty to skip pip
      install.
