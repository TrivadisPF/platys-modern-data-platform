name: Polaris
id: polaris
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://polaris.apache.org/
  documentation: https://polaris.apache.org/in-dev/unreleased/
  github: https://github.com/apache/polaris

description: >
  Apache Polaris, the interoperable, open source catalog for Apache Iceberg.

enable:
  platys_init: POLARIS
  example: |
    platys init --enable-services POLARIS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28284>.

parameters:
  - name: POLARIS_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Polaris service

  - name: POLARIS_persistence_type
    default: "in-memory"
    since: "1.19.0"
    description: >
      The database to use, either `in-memory` or `relational-jdbc`.

  - name: POLARIS_db_type
    default: "postgresql"
    since: "1.19.0"
    description: >
      The database to use, currently ony `postgresql`.

  - name: POLARIS_db_dbname
    default: "postgres"
    since: "1.19.0"
    description: >
      The database name.

  - name: POLARIS_db_username
    default: "postres"
    since: "1.19.0"
    description: >
      The database username.

  - name: POLARIS_db_password
    default: "abc123!"
    since: "1.19.0"
    sensitive: true
    description: >
      The database user password.
