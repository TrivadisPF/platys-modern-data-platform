name: Data Contract Editor
id: data-contract-editor
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/datacontract/datacontract-editor
  github: https://github.com/datacontract/datacontract-editor

description: >
  A web-based editor for creating and managing data contracts using the Open
  Data Contract Standard (ODCS).

enable:
  platys_init: DATA_CONTRACT_EDITOR
  example: |
    platys init --enable-services DATA_CONTRACT_EDITOR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:4173>

parameters:
  - name: DATA_CONTRACT_EDITOR_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Data Contract Editor service

  - name: DATA_CONTRACT_EDITOR_ai_enabled
    default: "false"
    since: "1.21.0"
    description: >
      Enable the AI assistant of the editor. It uses Ollama (the `ollama`
      service of the platform or the external Ollama configured with
      `external['OLLAMA_url']`).

  - name: DATA_CONTRACT_EDITOR_ai_model
    default: ""
    since: "1.21.0"
    applicable_when: "DATA_CONTRACT_EDITOR_ai_enabled == true"
    description: >
      The name of the model to use for the AI assistant (e.g. `llama3.2`). If
      empty, no model is passed to the editor. The model has to be available
      in Ollama.
