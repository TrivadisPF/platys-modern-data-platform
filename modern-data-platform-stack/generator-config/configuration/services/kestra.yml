name: Kestra
id: kestra
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64]

links:
  website: https://kestra.io/
  documentation: https://kestra.io/docs
  github: https://github.com/kestra-io/kestra

description: >
  Workflow Automation Platform. Orchestrate & Schedule code in any language,
  run anywhere, 500+ plugins. Alternative to Zapier, Rundeck, Camunda,
  Airflow...

enable:
  platys_init: KESTRA
  example: |
    platys init --enable-services KESTRA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28245>.

parameters:
  - name: KESTRA_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Kestra service

  - name: KESTRA_flavour
    default: "local"
    since: "1.18.0"
    description: >
      The Kestra server type to start, either `local` (with h2 database) or
      `standalone` (requiring a postgresql database)

  - name: KESTRA_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data folder into Kestra service

  - name: KESTRA_volume_map_temp
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the temp folder into Kestra service

  - name: KESTRA_database_type
    default: "postgres"
    since: "1.18.0"
    description: >
      The database type to use, only `postgres` currently supported, applicable
      if `KESTRA_flavour` is set to `standlone`.

  - name: KESTRA_database_user
    default: "postgres"
    since: "1.18.0"
    description: >
      The username to connect to the database, applicable if `KESTRA_flavour` is
      set to `standlone`.

  - name: KESTRA_database_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the user to connect to the database, applicable if
      `KESTRA_flavour` is set to `standlone`.

  - name: KESTRA_database_password
    default: "postgres"
    since: "1.18.0"
    sensitive: true
    description: >
      The name of the database to connect to, applicable if `KESTRA_flavour` is
      set to `standlone`.

  - name: KESTRA_storage_type
    default: "local"
    since: "1.18.0"
    description: >
      The storage type to use, either 'local` filesystem or `s3` object storage.

  - name: KESTRA_bucket_name
    default: "kestra-bucket"
    since: "1.18.0"
    description: >
      The bucket to use, if `KESTRA_storage_type` is set to `s3`.

  - name: KESTRA_provision_tutorial_flows
    default: "false"
    since: "1.18.0"
    description: >
      Provision the tutorial flows when starting Kestra the first time?

  - name: KESTRA_auth_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable authentication?

  - name: KESTRA_username
    default: "admin@kestra.io"
    since: "1.18.0"
    description: >
      Name of the user, applicable if `KESTRA_auth_enabled` is enabled. Must be a
      valid email address.

  - name: KESTRA_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      Password of the user, applicable if `KESTRA_auth_enabled` is enabled

  - name: KESTRA_env_variables
    default: ""
    since: "1.18.0"
    description: >
      A comma-separated list of key-value pairs to setup as environment variable
      in the kestra service: `=,=`. Will be created with the prefix `KESTRA_`, so
      that they are available in the flows.
