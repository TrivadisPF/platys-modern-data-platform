name: Fluent Bit
id: fluent-bit
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64, arm]

links:
  website: https://fluentbit.io/
  documentation: https://docs.fluentbit.io/manual
  github: https://github.com/fluent/fluent-bit

description: >
  Fast and Lightweight Logs and Metrics processor for Linux, BSD, OSX and
  Windows

enable:
  platys_init: FLUENT_BIT
  example: |
    platys init --enable-services FLUENT_BIT
    platys gen

usage:
  - title: Usage
    content: |
      Place a `fluent-bit.conf` or `fluent-bit.yaml` file into the `./custom-conf/fluent-bit/` folder and set the `FLUENT_BIT_volume_map_config` to `true` and specify the file-name using the `FLUENT_BIT_config_filename` property.
      
      Here an example of a config file using the YAML notation:
      
      ```yaml
      pipeline:
          inputs:
              - name: cpu
                tag: my_cpu
      
          outputs:
              - name: stdout
                match: '*'
      ```

parameters:
  - name: FLUENT_BIT_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Fluent Bit service

  - name: FLUENT_BIT_volume_map_config
    default: "false"
    since: "1.18.0"
    description: >
      Map a fluent-bit config file into the service?

  - name: FLUENT_BIT_config_filename
    default: "fluent-bit.yaml"
    since: "1.18.0"
    description: >
      The name of the fluent-bit config file. You have to enable
      `FLUENT_BIT_volume_map_config` so that it becomes effective. You can also
      use a `.conf` file (the traditional way for configuration of Fluent Bit).
