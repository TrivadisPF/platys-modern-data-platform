name: Karapace Schema Registry
id: karapace-schema-registry
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://karapace.io
  documentation: https://karapace.io/docs/
  github: https://github.com/aiven-open/karapace
  docker: https://ghcr.io/aiven-open/karapace

description: >
  Karapace is an open-source Confluent-compatible Schema Registry implementation
  by Aiven. It stores schemas (Avro, JSON Schema, Protobuf) in a Kafka topic and
  exposes the Confluent Schema Registry REST API, making it a drop-in replacement.

enable:
  platys_init: SCHEMA_REGISTRY
  example: |
    platys init --enable-services SCHEMA_REGISTRY
    platys gen

usage:
  - title: Usage
    content: |
      Set `SCHEMA_REGISTRY_flavour: karapace` in `config.yml` to use Karapace.

      Navigate to <http://dataplatform:8081> to access the Schema Registry REST API.

parameters:
  - name: SCHEMA_REGISTRY_karapace_group_id
    default: "karapace-schema-registry"
    since: "1.20.0"
    description: >
      Kafka consumer group ID used by Karapace to store and read schema data.

  - name: SCHEMA_REGISTRY_karapace_log_level
    default: "INFO"
    since: "1.20.0"
    allowed_values: ["DEBUG", "INFO", "WARNING", "ERROR"]
    description: >
      Log level for the Karapace process.

  - name: SCHEMA_REGISTRY_karapace_master_election_strategy
    default: "highest"
    since: "1.20.0"
    allowed_values: ["highest", "lowest"]
    description: >
      Strategy used to elect the primary (master) Karapace node in a multi-node setup.
