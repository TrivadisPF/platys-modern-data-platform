name: OpenSearch
id: opensearch
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://opensearch.org/
  documentation: https://opensearch.org/docs/latest/
  github: https://github.com/opensearch-project/OpenSearch

description: >
  Open source distributed and RESTful search engine. OpenSearch is a
  community-driven, open source fork of Elasticsearch and Kibana following the
  licence change in early 2021.

enable:
  platys_init: OPENSEARCH
  example: |
    platys init --enable-services OPENSEARCH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:29200>

parameters:
  - name: OPENSEARCH_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate OpenSearch service

  - name: OPENSEARCH_nodes
    default: "1"
    since: "1.15.0"
    description: >
      The number of nodes to generate

  - name: OPENSEARCH_volume_map_data
    default: "false"
    since: "1.15.0"
    description: >
      Volume map the data folder?

  - name: OPENSEARCH_initial_admin_password
    default: "abc123!"
    since: "1.21.0"
    description: >
      Sets the initial admin user password, required for OpenSearch 2.12 and later

