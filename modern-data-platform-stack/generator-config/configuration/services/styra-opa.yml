name: Styra Enterprise OPA
id: styra-opa
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.styra.com/
  documentation: https://docs.styra.com/enterprise-opa
  github: https://github.com/StyraInc/enterprise-opa

description: >
  Enterprise OPA is a distribution of Open Policy Agent with enterprise-grade
  features to get OPA into production quickly, easily, and inexpensively.

enable:
  platys_init: STYRA
  example: |
    platys init --enable-services STYRA
    platys gen

parameters:
  - name: STYRA_OPA_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Styra Enterprise OPA.
