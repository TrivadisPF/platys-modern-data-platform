name: Vector
id: vector
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://vector.dev/docs/
  github: https://github.com/vectordotdev/vector

description: >
  Vector is a high-performance observability data pipeline that collects,
  transforms, and routes logs, metrics, and traces.

enable:
  platys_init: VECTOR
  example: |
    platys init --enable-services VECTOR
    platys gen

parameters:
  - name: VECTOR_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Vector observability data pipeline service

  - name: VECTOR_nodes
    default: "1"
    since: "1.20.0"
    description: >
      Number of Vector instances to generate (vector-1, vector-2, …). Each node gets
      its own config file (conf/vector/vector-N.yaml) and its own block of additional
      port mappings starting from 28730 offset by node index.

  - name: VECTOR_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the data folder (./container-volume/vector) into the Vector service

  - name: VECTOR_log_level
    default: "info"
    since: "1.20.0"
    description: >
      Log level for Vector (trace, debug, info, warn, error)

  - name: VECTOR_watch_config_enabled
    default: "true"
    since: "1.20.0"
    description: >
      Watch the configuration file for changes and automatically reload Vector

  - name: VECTOR_volume_map_docker_daemon
    default: "true"
    since: "1.20.0"
    description: >
      Volume map the Docker daemon socket (/var/run/docker.sock) into the Vector service,
      needed for collecting Docker container logs and metrics

  - name: VECTOR_additional_port_mappings
    default: "[0]"
    since: "1.20.0"
    description: >
      Array of port counts, one entry per Vector node (maximum 3 per node). Each node is
      allocated a fixed block of 3 ports: node 1 gets 28730-28732, node 2 gets 28733-28735,
      etc. (formula: 28730 + (node_index - 1) * 3). The element value controls how many of
      those 3 ports are actually exposed. For example, [2, 0, 3] exposes ports 28730-28731
      for node 1, none for node 2, and 28733-28735 for node 3.
