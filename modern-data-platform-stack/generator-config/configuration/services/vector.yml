name: Vector
id: vector
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://vector.dev/docs/
  github: https://github.com/vectordotdev/vector

description: >
  Vector is a high-performance observability data pipeline that collects,
  transforms, and routes logs, metrics, and traces.

enable:
  platys_init: VECTOR
  example: |
    platys init --enable-services VECTOR
    platys gen

parameters:
  - name: VECTOR_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Vector observability data pipeline service

  - name: VECTOR_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the data folder (./container-volume/vector) into the Vector service

  - name: VECTOR_log_level
    default: "info"
    since: "1.20.0"
    description: >
      Log level for Vector (trace, debug, info, warn, error)

  - name: VECTOR_watch_config_enabled
    default: "true"
    since: "1.20.0"
    description: >
      Watch the configuration file for changes and automatically reload Vector
