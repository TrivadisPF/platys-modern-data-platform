name: Apache StreamPipes
id: streampipes
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64, arm]

links:
  website: https://streampipes.apache.org/
  documentation: https://streampipes.apache.org/docs/docs/user-guide-introduction.html
  github: https://github.com/apache/incubator-streampipes

description: >
  Apache StreamPipes - A self-service (Industrial) IoT toolbox to enable
  non-technical users to connect, analyze and explore IoT data streams.

enable:
  platys_init: STREAMPIPES
  example: |
    platys init --enable-services STREAMPIPES
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28255>

parameters:
  - name: STREAMPIPES_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Apache StreamPipeps service
