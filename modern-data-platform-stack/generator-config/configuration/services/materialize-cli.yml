name: Materialize CLI
id: materialize-cli
arch: [x86-64]

tags: [cli]
dependencies: [materialize]
links:
  website: https://materialize.com/
  documentation: https://materialize.com/docs/
  github: https://github.com/MaterializeInc/materialize

description: >
  Materialize simplifies application development with streaming data. This
  container runs the `mzcli` command-line client for connecting to Materialize.

enable:
  platys_init: MATERIALIZE_CLI
  example: |
    platys init --enable-services MATERIALIZE_CLI
    platys gen

usage:
  - title: Running the CLI
    content: |
      ```bash
      docker exec -ti mzcli mzcli -h materialize-1
      ```

parameters:
  - name: MATERIALIZE_CLI_enable
    default: "false"
    since: "1.15.0"
    description: >
      Enable the Materialize CLI (`mzcli`).
