name: Forgejo
id: forgejo
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://forgejo.org/
  documentation: https://forgejo.org/docs/latest/
  github: https://codeberg.org/forgejo/forgejo

description: >
  Forgejo is a lightweight, self-hosted Git service. It provides repositories,
  issue tracking, pull requests, CI/CD integration, and a web UI, making it a
  drop-in alternative to GitHub or GitLab for on-premises use.

enable:
  platys_init: FORGEJO
  example: |
    platys init --enable-services FORGEJO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3004> to access the Forgejo web UI.
      SSH clone URL: `ssh://git@dataplatform:2223/<user>/<repo>.git`

parameters:
  - name: FORGEJO_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Forgejo service (lightweight self-hosted Git service).
      Web UI on port `3004`, SSH on port `2223`.
