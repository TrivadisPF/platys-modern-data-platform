name: FluentD
id: fluentd
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64, arm]

links:
  website: https://www.fluentd.org/
  documentation: https://docs.fluentd.org/
  github: https://github.com/fluent/fluentd

description: >
  Fluentd: Unified Logging Layer (project under CNCF).

enable:
  platys_init: FLUENTD
  example: |
    platys init --enable-services FLUENTD
    platys gen

parameters:
  - name: FLUENTD_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate FluentD service

  - name: FLUENTD_conf_file_name
    default: ""
    since: "1.17.0"
    description: >
      Name of a custom config file to map into the FluentD container.

  - name: FLUENTD_s3_bucket_name
    default: "docker-log"
    since: "1.17.0"
    description: >
      Name of the S3 bucket to use if Minio is enabled.

  - name: FLUENTD_s3_bucket_file_type
    default: "json"
    since: "1.17.0"
    description: >
      Name of the S3 bucket to use if Minio is enabled.
