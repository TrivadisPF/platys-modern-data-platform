name: Azure Storage Explorer
id: azure-storage-explorer
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  documentation: https://github.com/sebagomez/azurestorageexplorer
  github: https://github.com/sebagomez/azurestorageexplorer

description: >
  Manage your Azure Storage blobs, tables, queues and file shares from this
  simple and intuitive web application.

enable:
  platys_init: AZURE_STORAGE_EXPLORER
  example: |
    platys init --enable-services AZURE_STORAGE_EXPLORER
    platys gen

usage:
  - title: Usage
    content: |
      Navigat to <http://dataplatform:28279>.

parameters:
  - name: AZURE_STORAGE_EXPLORER_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Azure Storage Explorer service
