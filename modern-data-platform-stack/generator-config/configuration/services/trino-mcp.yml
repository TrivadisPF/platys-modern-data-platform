name: Trino MCP
id: trino-mcp
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/tuannvm/mcp-trino
  github: https://github.com/tuannvm/mcp-trino

description: >
  A high-performance Model Context Protocol (MCP) server for Trino implemented
  in Go.

enable:
  platys_init: TRINO
  example: |
    platys init --enable-services TRINO
    platys gen

parameters:
  - name: TRINO_MCP_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate MCP Trino service

  - name: TRINO_MCP_scheme
    default: "http"
    since: "1.19.0"
    description: >
      Connection scheme (http/https)

  - name: TRINO_MCP_default_catalog
    default: "memory"
    since: "1.19.0"
    description: >
      Default catalog to use.

  - name: TRINO_MCP_allow_write_queries
    default: "false"
    since: "1.19.0"
    description: >
      Allow non-read-only SQL queries.
