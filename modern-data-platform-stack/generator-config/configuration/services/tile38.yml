name: Tile38
id: tile38
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://tile38.com/
  documentation: https://tile38.com/topics/installation
  github: https://github.com/tidwall/tile38

description: >
  Fast Geospatial Database & Geofencing Server.

enable:
  platys_init: TILE38
  example: |
    platys init --enable-services TILE38
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9851>

parameters:
  - name: TILE38_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Tile38 service
