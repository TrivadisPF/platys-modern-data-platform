name: ngrok
id: ngrok
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://ngrok.com/
  documentation: https://ngrok.com/docs
  github: https://github.com/ngrok/snap-ngrok

description: >
  ngrok is a reverse proxy that creates a secure tunnel from a public endpoint
  to a locally running web service. ngrok captures and analyzes all traffic
  over the tunnel for later inspection and replay.

enable:
  platys_init: NGROK
  example: |
    platys init --enable-services NGROK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28247>.

parameters:
  - name: NGROK_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate ngrok reverse proxy service

  - name: NGROK_auth_token
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The ngrok authentication token

  - name: NGROK_expose_ports
    default: ""
    since: "1.18.0"
    description: >
      A comma separated list of external ports to expose on the reverse proxy.
