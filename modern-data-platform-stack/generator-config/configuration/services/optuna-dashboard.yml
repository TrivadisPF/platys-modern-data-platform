name: Optuna Dashboard
id: optuna-dashboard
arch: [x86-64]

tags: [ui]
dependencies: [optuna]
links:
  website: https://optuna.org/
  documentation: https://optuna.readthedocs.io/projects/optuna-dashboard/
  github: https://github.com/optuna/optuna-dashboard

description: >
  A real-time web dashboard for Optuna, used to visualize and analyze
  hyperparameter optimization studies.

enable:
  platys_init: OPTUNA_DASHBOARD
  example: |
    platys init --enable-services OPTUNA_DASHBOARD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28231>

parameters:
  - name: OPTUNA_DASHBOARD_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Optuna Dashboard service.
