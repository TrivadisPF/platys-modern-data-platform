name: Graphiti
id: graphiti
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://help.getzep.com/welcome
  documentation: https://help.getzep.com/graphiti/graphiti/overview
  github: https://github.com/getzep/graphiti

description: >
  Build Real-Time Knowledge Graphs for AI Agents.

enable:
  platys_init: GRAPHITI,NEO4J
  example: |
    platys init --enable-services GRAPHITI,NEO4J
    platys gen

parameters:
  - name: GRAPHITI_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Graphiti service

  - name: GRAPHITI_http_server_enabled
    default: "true"
    since: "1.19.0"
    description: >
      Enable http server ?

  - name: GRAPHITI_mcp_server_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable MCP server ?
