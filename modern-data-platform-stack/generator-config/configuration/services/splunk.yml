name: Splunk
id: splunk
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://splunk.com/
  documentation: https://docs.splunk.com/Documentation
  github: https://github.com/splunk/docker-splunk

description: >
  Search, analysis and visualization for actionable insights from all of your
  data.

enable:
  platys_init: SPLUNK
  example: |
    platys init --enable-services SPLUNK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28308> to use the Splunk UI.

parameters:
  - name: SPLUNK_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Splunk service
