name: Local Deep Researcher
id: local-deep-researcher
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/langchain-ai/local-deep-researcher
  github: https://github.com/langchain-ai/local-deep-researcher

description: >
  Fully local web research and report writing assistant

enable:
  platys_init: LOCAL_DEEP_RESEARCHER
  example: |
    platys init --enable-services LOCAL_DEEP_RESEARCHER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:2024>.

parameters:
  - name: LOCAL_DEEP_RESEARCHER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Ollama Deep Researcher service

  - name: LOCAL_DEEP_RESEARCHER_ollama_model
    default: "llama3.2"
    since: "1.18.0"
    description: >
      The Ollama Model to use.

  - name: LOCAL_DEEP_RESEARCHER_search_api
    default: "duckduckgo"
    since: "1.18.0"
    description: >
      The Search API to use, one of `duckduckgo`, `tavily`, `perplexity` or
      `searxng`.

  - name: LOCAL_DEEP_RESEARCHER_tavily_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The API key for the Tavily search API service, applicable if
      `LOCAL_DEEP_RESEARCHER_search_api` is set to `tavily`

  - name: LOCAL_DEEP_RESEARCHER_perplexity_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The API key for the Perplexity search API service, applicable if
      `LOCAL_DEEP_RESEARCHER_search_api` is set to `perplexity`
