name: MLflow
id: mlflow
category:
  id: 13_science
  name: science
  color: violet
arch: [x86-64]

links:
  website: https://www.mlflow.org/docs/latest/index.html
  documentation: https://www.mlflow.org/docs/latest/index.html
  github: https://github.com/mlflow/mlflow

description: >
  MLflow is an open source platform for managing the end-to-end machine
  learning lifecycle. It tackles four primary functions

enable:
  platys_init: MLFLOW_SERVER
  example: |
    platys init --enable-services MLFLOW_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28229>

parameters:
  - name: MLFLOW_SERVER_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate MLflow server service

  - name: MLFLOW_SERVER_volume_map_data
    default: "false"
    since: "1.13.0"
    description: >
      Volume map data folder into the MLflow server service

  - name: MLFLOW_SERVER_backend
    default: "file"
    since: "1.13.0"
    description: >
      The backend store to use, one of `file`, `postgresql` or `mysql`

  - name: MLFLOW_SERVER_db_user
    default: "mlflow"
    since: "1.13.0"
    description: >
      the db user to use, if `MLFLOW_SERVER_backend` is either set to `postgres`
      or `mysql`

  - name: MLFLOW_SERVER_db_password
    default: "mlflow"
    since: "1.13.0"
    sensitive: true
    description: >
      the db password to use, if `MLFLOW_SERVER_backend` is either set to
      `postgres` or `mysql`

  - name: MLFOW_SERVER_artifact_root
    default: "/mlruns"
    since: "1.13.0"
    description: >
      the location of the artifact store.
