name: MongoDB
id: mongodb
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.mongodb.com/
  documentation: https://docs.mongodb.com/manual/?_ga=2.106702979.188924324.1640807635-167415985.1640807632
  github: https://github.com/mongodb/mongo

description: >
  MongoDB is a document database designed for ease of application development
  and scaling.

enable:
  platys_init: MONGO
  example: |
    platys init --enable-services MONGO
    platys gen

parameters:
  - name: MONGO_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate MongoDB service

  - name: MONGO_nodes
    default: "1"
    since: "1.3.0"
    description: >
      number of MongoDB nodes in replicaset

  - name: MONGO_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      volume map the `data` folder into the MongoDB instance.

  - name: MONGO_volume_map_log
    default: "false"
    since: "1.17.0"
    description: >
      volume map the `log` folder into the MongoDB instance.

  - name: MONGO_root_username
    default: ""
    since: "1.17.0"
    description: >
      The username of the root user, if undefined or empty, then authentication
      is disabled.

  - name: MONGO_root_password
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      The password of the root user, if undefined or empty, then authentication
      is disabled.

  - name: MONGO_init_database
    default: ""
    since: "1.17.0"
    description: >
      This variable allows you to specify the name of a database to be used for
      creation scripts in the `./init/mongo/` folder.
