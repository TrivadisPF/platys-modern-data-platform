name: Mirror Maker 2
id: mirror-maker2
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://kafka.apache.org/
  documentation: https://kafka.apache.org/documentation/#georeplication
  github: https://github.com/apache/kafka

description: >
  Adminer (formerly phpMinAdmin) is a full-featured database management tool
  written in PHP. Adminer is available for MySQL, MariaDB, PostgreSQL, SQLite,
  MS SQL, Oracle, Elasticsearch, MongoDB and others via plugin.

enable:
  platys_init: KAFKA_MM2
  example: |
    platys init --enable-services KAFKA_MM2
    platys gen

parameters:
  - name: KAFKA_MM2_enable
    default: "false"
    since: "1.14.0"
    description: >
      Enable Kafka Mirror Maker 2.
