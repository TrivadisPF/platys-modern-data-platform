name: OpenEHR Tool
id: openehr-tool
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/crs4/openEHR-tool/
  github: https://github.com/crs4/openEHR-tool

description: >
  Tool for openEHR.

enable:
  platys_init: OPENEHR_TOOL,EHRBASE
  example: |
    platys init --enable-services OPENEHR_TOOL,EHRBASE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28283>.

parameters:
  - name: OPENEHR_TOOL_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate OpenEHR Tool service
