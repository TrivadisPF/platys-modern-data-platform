name: Burrow UI
id: burrow-ui
category:
  id: 14_monitoring
  name: monitoring
  color: cyan
arch: [x86-64]

links:
  website: https://github.com/GeneralMills/BurrowUI
  documentation: https://github.com/GeneralMills/BurrowUI
  github: https://github.com/GeneralMills/BurrowUI

description: >
  A frontend UI for Kafka cluster monitoring with Burrow.

enable:
  platys_init: KAFKA,BURROW,BURROW_UI
  example: |
    platys init --enable-services KAFKA,BURROW,BURROW_UI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28258>

parameters:
  - name: BURROW_UI_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Burrow UI.
