name: Hasura
id: hasura
category:
  id: 11_query
  name: query
  color: teal
arch: [x86-64]

links:
  website: https://hasura.io/
  documentation: https://hasura.io/docs/latest/graphql/core/index.html
  github: https://github.com/hasura/graphql-engine

description: >
  Hasura is a fast, instant realtime GraphQL APIs on your DB with fine grained
  access control, also trigger webhooks on database events.

enable:
  platys_init: HASURA
  example: |
    platys init --enable-services HASURA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28177>

parameters:
  - name: HASURA_enable
    default: "false"
    since: "1.11.0"
    description: >
      Enable Hasura GraphQL server service.

  - name: HASURA_log_level
    default: "info"
    since: "1.16.0"
    description: >
      Set the logging level. Options: `debug`, `info`, `warn` or `error`.

  - name: HASURA_admin_secret
    default: ""
    since: "1.16.0"
    sensitive: true
    description: >
      Admin secret key, required to access the Hasura instance. This is mandatory
      when you use webhook or JWT.

  - name: HASURA_pro_key
    default: ""
    since: "1.16.0"
    description: >
      The pro key to enable Hasura EE.
