name: Elasticvue
id: elasticvue
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://elasticvue.com/
  documentation: https://elasticvue.com/usage
  github: https://github.com/cars10/elasticvue

description: >
  Elasticvue is a free and open-source elasticsearch gui for the browser.

enable:
  platys_init: ELASTICVUE
  example: |
    platys init --enable-services ELASTICVUE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28275>

parameters:
  - name: ELASTICVUE_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Elasticvue.
