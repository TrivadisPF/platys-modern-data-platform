name: Apache Ranger
id: ranger
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://ranger.apache.org/
  documentation: https://ranger.apache.org/
  github: https://github.com/apache/ranger

description: >
  Apache Ranger™ is a framework to enable, monitor and manage comprehensive
  data security across the Hadoop platform.

enable:
  platys_init: RANGER
  example: |
    platys init --enable-services RANGER
    platys gen

parameters:
  - name: RANGER_enable
    default: "false"
    since: "1.5.0"
    description: >
      Generate Apache Ranger service. Ranger is a framework to enable, monitor
      and manage comprehensive data security across the Hadoop platform.

  - name: RANGER_postgresql_volume_map_data
    default: "false"
    since: "1.8.0"
    description: >
      Volume map the `data` folder into the container.
