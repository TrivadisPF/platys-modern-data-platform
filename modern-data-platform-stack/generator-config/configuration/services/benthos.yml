name: Benthos
id: benthos
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.benthos.dev/
  documentation: https://www.benthos.dev/docs/about
  github: https://github.com/benthosdev/benthos

description: >
  ```bash platys init --enable-services BENTHOS platys gen ```

enable:
  platys_init: BENTHOS
  example: |
    platys init --enable-services BENTHOS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:4195>.

parameters:
  - name: BENTHOS_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Benthos service

  - name: BENTHOS_SERVER_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Benthos Server with an interactive Bloblang editor.
