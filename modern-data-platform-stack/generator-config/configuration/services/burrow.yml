name: Burrow
id: burrow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/linkedin/Burrow
  documentation: https://github.com/linkedin/Burrow
  github: https://github.com/linkedin/Burrow

description: >
  Burrow is a monitoring companion for Apache Kafka that provides consumer lag
  checking as a service without the need for specifying thresholds. It monitors
  committed offsets for all consumers and calculates the status of those
  consumers on demand. An HTTP endpoint is provided to request status on
  demand, as well as provide other Kafka cluster information. There are also
  configurable notifiers that can send status out via email or HTTP calls to
  another service.

enable:
  platys_init: KAFKA,BURROW
  example: |
    platys init --enable-services KAFKA,BURROW
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28260>

parameters:
  - name: BURROW_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Burrow service

  - name: BURROW_UI_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Burrow UI service

  - name: BURROW_DASHBOARD_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Burrow Dashboard service
