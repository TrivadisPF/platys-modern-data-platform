name: Apicurio Registry
id: apicurio-registry
category:
  id: 99_other
  name: other
  color: gray
arch: [x86-64]

links:
  website: https://www.apicur.io/registry/
  documentation: https://www.apicur.io/registry/docs/apicurio-registry/2.0.1.Final/index.html
  github: https://github.com/Apicurio/apicurio-registry

description: >
  In the context of Apicurio, a registry is a runtime system (server) that
  stores a specific set of artifacts (files). At its core, a registry provides
  the ability to add, update, and remove the artifacts from the store,
  typically via a remote API of some kind (often a REST API).

enable:
  platys_init: APICURIO_REGISTRY
  example: |
    platys init --enable-services APICURIO_REGISTRY
    platys gen

usage:
  - title: Usage
    content: |
      You can use it as a Confluent-compliant registry by using the following Schema Registry URL
      
      ```
      http://dataplatform:8081/apis/ccompat/v6
      ```

parameters:
  - name: APICURIO_REGISTRY_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Apicurio Registry.
