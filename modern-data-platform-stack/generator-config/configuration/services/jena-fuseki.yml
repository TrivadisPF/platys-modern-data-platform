name: Apache Jena Fuseki
id: jena-fuseki
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://jena.apache.org/index.html
  documentation: https://jena.apache.org/documentation/fuseki2/
  github: https://github.com/apache/jena

description: >
  A free and open source Java framework for building Semantic Web and Linked
  Data applications.

enable:
  platys_init: JENA_FUSEKI
  example: |
    platys init --enable-services JENA_FUSEKI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3030>.
      
      Login as user `admin` with password `abc123!`.

parameters:
  - name: JENA_FUSEKI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Jena-Fuseki service

  - name: JENA_FUSEKI_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the `data` folder into the Jena-Fuseki service?

  - name: JENA_FUSEKI_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the `data` folder into the Jena-Fuseki service?

  - name: JENA_FUSEKI_admin_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The initial admin password, if left empty the password will be generated
      and shown in the log.

  - name: JENA_FUSEKI_tdb2_enabled
    default: ""
    since: "1.18.0"
    description: >
      Set to `true` to enable TDB v2.

  - name: JENA_FUSEKI_datasets
    default: ""
    since: "1.18.0"
    description: >
      A comma-separated list of dataset names to create empty dataset for upon
      startup.
