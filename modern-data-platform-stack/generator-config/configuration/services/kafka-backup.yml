name: Kafka Backup
id: kafka-backup
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/osodevops/kafka-backup
  github: https://github.com/osodevops/kafka-backup

description: >
  Kafka Backup is a tool to back up and restore Kafka topics to and from
  S3-compatible object storage.

enable:
  platys_init: KAFKA
  example: |
    platys init --enable-services KAFKA
    platys gen

parameters:
  - name: KAFKA_BACKUP_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Kafka Backup service

  - name: KAFKA_BACKUP_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the data folder (./container-volume/kafka-backup/data) into the Kafka Backup service

  - name: KAFKA_BACKUP_s3_bucket
    default: "admin-bucket"
    since: "1.20.0"
    description: >
      S3 bucket name to store the backups in

  - name: KAFKA_BACKUP_s3_prefix
    default: ""
    since: "1.20.0"
    description: >
      Key prefix (folder path) within the S3 bucket for backup objects

  - name: KAFKA_BACKUP_continuous_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Enable continuous backup mode; when true the backup runs indefinitely consuming new messages as they arrive

  - name: KAFKA_BACKUP_rust_log
    default: "info"
    since: "1.20.0"
    description: >
      Rust log level for the Kafka Backup process (trace, debug, info, warn, error)
