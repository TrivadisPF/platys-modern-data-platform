name: Kafka Backup
id: kafka-backup
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/osodevops/kafka-backup
  github: https://github.com/osodevops/kafka-backup

description: >
  Kafka Backup is a tool to back up and restore Kafka topics to and from
  S3-compatible object storage.

enable:
  platys_init: KAFKA
  example: |
    platys init --enable-services KAFKA
    platys gen

parameters:
  - name: KAFKA_BACKUP_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Kafka Backup service

  - name: KAFKA_BACKUP_rust_log
    default: "info"
    since: "1.20.0"
    description: >
      Rust log level for the Kafka Backup process (trace, debug, info, warn, error)
