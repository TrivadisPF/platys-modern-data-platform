name: Apache Cassandra
id: cassandra
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://cassandra.apache.org
  documentation: https://cassandra.apache.org/doc/latest/
  github: https://github.com/apache/cassandra

description: >
  Apache Cassandra is an open source NoSQL distributed database trusted by
  thousands of companies for scalability and high availability without
  compromising performance. Linear scalability and proven fault-tolerance on
  commodity hardware or cloud infrastructure make it the perfect platform for
  mission-critical data.

enable:
  platys_init: CASSANDRA
  example: |
    platys init --enable-services CASSANDRA
    platys gen

usage:
  - title: Usage
    content: |
      To connect with the Cassandra CLI
      
      ```bash
      docker exec -ti cassandra-1 cqlsh -u cassandra -p cassandra
      ```

parameters:
  - name: CASSANDRA_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Elasticsearch service

  - name: CASSANDRA_major_version
    default: "4"
    since: "1.13.0"
    description: >
      Which major version of Cassandra to use, one of `3` or `4` or `5`. The
      exact version can then be specified using either the `CASSANDRA_3_version`
      or `CASSANDRA_4_version` or `CASSANDRA_4_version` setting.

  - name: CASSANDRA_volume_map_data
    default: "false"
    since: "1.15.0"
    description: >
      Volume map data folder into the Cassandra service

  - name: CASSANDRA_nodes
    default: "1"
    since: "1.15.0"
    description: >
      number of Cassandra nodes to form a Cassandra cluster. Support for up to 5
      nodes.

  - name: CASSANDRA_local_jmx
    default: "yes"
    since: "1.16.0"
    description: >
      set it to `no` to open JMX port for remote access while requiring
      authentication.

  - name: CASSANDRA_useranme
    default: "cassandra"
    since: "1.16.0"
    description: >
      Cassandra user name.

  - name: CASSANDRA_password
    default: "cassandra"
    since: "1.16.0"
    sensitive: true
    description: >
      Cassandra user password.
