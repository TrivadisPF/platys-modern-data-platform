name: Docker in Docker (DinD)
id: docker-dind
arch: [x86-64]

tags: []
dependencies: []
links:
  github: https://github.com/docker-library/docker

description: >
  Docker Official Image packaging for Docker

enable:
  platys_init: DOCKER_IN_DOCKER
  example: |
    platys init --enable-services DOCKER_IN_DOCKER
    platys gen

parameters:
  - name: DOCKER_IN_DOCKER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Docker in Docker service
