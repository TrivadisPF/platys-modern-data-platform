name: dbt Workbench
id: dbt-workbench
arch: [x86-64]

tags: []
dependencies:
  - postgresql
links:
  github: https://github.com/rezer-bleede/dbt-Workbench

description: >
  dbt Workbench is a web-based IDE for dbt projects. It provides a browser-based
  interface for editing dbt models, running queries, browsing documentation, and
  managing artifacts. The backend exposes a REST API; the frontend is a Vite/React
  application. Requires PostgreSQL for its internal metadata store.

enable:
  platys_init: DBT_WORKBENCH,POSTGRESQL
  example: |
    platys init --enable-services DBT_WORKBENCH,POSTGRESQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28497> to access the dbt Workbench UI.
      The backend REST API is available at <http://dataplatform:28496>.

parameters:
  - name: DBT_WORKBENCH_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate dbt Workbench service (web-based IDE for dbt projects).
      Frontend on port `28497`, backend API on port `28496`. Requires PostgreSQL.

  - name: DBT_WORKBENCH_db_user
    default: "dbt_workbench"
    since: "1.21.0"
    description: >
      PostgreSQL username for the dbt Workbench metadata database.

  - name: DBT_WORKBENCH_db_password
    default: "abc123!"
    since: "1.21.0"
    description: >
      PostgreSQL password for the dbt Workbench metadata database.

  - name: DBT_WORKBENCH_db_name
    default: "dbt_workbench"
    since: "1.21.0"
    description: >
      PostgreSQL database name for the dbt Workbench metadata store.

  - name: DBT_WORKBENCH_ai_enabled
    default: "false"
    since: "1.21.0"
    description: >
      Enable AI features in dbt Workbench (requires an OpenAI-compatible API key configured separately).

  - name: DBT_WORKBENCH_volume_map_data
    default: "false"
    since: "1.21.0"
    description: >
      Volume-map the `/app/data` folder of the backend container to `./container-volume/dbt-workbench/data/`
      on the host, enabling direct file access and persistent storage of dbt project files and artifacts.
