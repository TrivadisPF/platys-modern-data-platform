name: Kowl
id: kowl
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://cloudhut.dev/
  documentation: https://cloudhut.dev/docs
  github: https://github.com/cloudhut/kowl

description: >
  Apache Kafka Web UI for exploring messages, consumers, configurations and
  more with a focus on a good UI & UX.

enable:
  platys_init: KOWL
  example: |
    platys init --enable-services KOWL
    platys gen

usage:
  - title: Connect to Kowl
    content: |
      Navigate to <http://dataplatform:28239>

parameters:
  - name: KOWL_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Kowl service
