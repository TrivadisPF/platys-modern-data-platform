name: Alpaca WebUI
id: alpaca-webui
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/mmo80/alpaca-webui
  github: https://github.com/mmo80/alpaca-webui

description: >
  Web UI for ollama, OpenAI, together.ai, mistral.ai

enable:
  platys_init: ALPACA_WEBUI
  example: |
    platys init --enable-services ALPACA_WEBUI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28365>.

parameters:
  - name: ALPACA_WEBUI_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Alpaca WebUI service
