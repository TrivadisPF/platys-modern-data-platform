name: Marquez
id: marquez
category:
  id: 15_governance
  name: governance
  color: brown
arch: [x86-64]

links:
  website: https://marquezproject.github.io/marquez/
  documentation: https://marquezproject.github.io/marquez/
  github: https://github.com/MarquezProject/marquez

description: >
  Marquez is an open source metadata service for the collection, aggregation,
  and visualization of a data ecosystem’s metadata. It maintains the provenance
  of how datasets are consumed and produced, provides global visibility into
  job runtime and frequency of dataset access, centralization of dataset
  lifecycle management, and much more.

enable:
  platys_init: MARQUEZ
  example: |
    platys init --enable-services MARQUEZ
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3005>

parameters:
  - name: MARQUEZ_enable
    default: "false"
    since: "1.5.0"
    description: >
      Generate Marquez service, an open source metadata service for the
      collection, aggregation, and visualization of a data ecosystem’s metadata.

  - name: MARQUEZ_search_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable Search in the lineage data?

  - name: MARQUEZ_volume_map_data
    default: "false"
    since: "1.5.0"
    description: >
      should the data of the databases be mapped to the outside of the container.
