name: "`docker exec` web console"
id: docker-exec-webconsole
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/bitbull-team/docker-exec-web-console
  github: https://github.com/bitbull-team/docker-exec-web-console

description: >
  A web UI to docker exec from the browser

enable:
  platys_init: DOCKER_EXEC_WEBCONSOLE
  example: |
    platys init --enable-services DOCKER_EXEC_WEBCONSOLE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28375>.
      
      You can select the container to exec into passing its id directly via `cid` query parameter ( eg. `http://dataplatform: 28375?cid=<container id>` ) or in the prompt that will show at page load.
      
      You can pass the command to execute passing it via `cmd` query parameter ( eg. `http://dataplatform:28375?cid=<container id>&cmd=/bin/sh` ), otherwise it default to `/bin/bash`.

parameters:
  - name: DOCKER_EXEC_WEBCONSOLE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Docker Exec Web Console service

  - name: DOCKER_EXEC_WEBCONSOLE_context_path
    default: ""
    since: "1.18.0"
    description: >
      context path to which the container will responds, i.e. `/webconsole` so
      that the console will be reachable at
      `http://dataplatform:28375/webconsole`
