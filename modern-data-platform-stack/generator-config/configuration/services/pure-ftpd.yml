name: Pure FTPd
id: pure-ftpd
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.pureftpd.org/project/pure-ftpd/
  documentation: https://www.pureftpd.org/project/pure-ftpd/doc/
  github: https://github.com/jedisct1/pure-ftpd

description: >
  Pure FTP server.

enable:
  platys_init: PURE_FTPD
  example: |
    platys init --enable-services PURE_FTPD
    platys gen

parameters:
  - name: PURE_FTPD_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Pure FTPd service

  - name: PURE_FTPD_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the local `data` folder into the Pure FTPd service

  - name: PURE_FTPD_volume_map_data_transfer
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the local `data-transfer` folder into the SFTP service

  - name: PURE_FTPD_username
    default: "ftp"
    since: "1.17.0"
    description: >
      The username of the user on the Pure FTPd Server

  - name: PURE_FTPD_username
    default: "abc123!"
    since: "1.17.0"
    sensitive: true
    description: >
      The password of the user on the Pure FTPd Server

  - name: PURE_FTPD_home
    default: "/home/ftp-data"
    since: "1.17.0"
    description: >
      The home directory on the Pure FTPd Server
