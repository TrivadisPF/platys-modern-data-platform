name: kafkactl
id: kafkactl
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://www.jbvm.io/kafkactl/
  documentation: https://www.jbvm.io/kafkactl/gettingstarted/
  github: https://github.com/jbvmio/kafkactl

description: >
  CLI for Apache Kafka Management.

enable:
  platys_init: KAFKACTL
  example: |
    platys init --enable-services KAFKACTL
    platys gen

usage:
  - title: Usage
    content: |
      ```
      docker exec -ti kafkactl kafkactl
      ```

parameters:
  - name: KAFKACTL_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate `kafkactl` CLI service
