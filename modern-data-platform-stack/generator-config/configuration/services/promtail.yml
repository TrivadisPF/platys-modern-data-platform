name: Grafana Promtail
id: promtail
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://grafana.com/oss/loki/
  documentation: https://grafana.com/docs/loki/latest/clients/promtail/
  github: https://github.com/grafana/loki#loki-like-prometheus-but-for-logs

description: >
  Promtail is an agent which ships the contents of local logs to a private
  Grafana Loki instance or Grafana Cloud. It is usually deployed to every
  machine that has applications needed to be monitored.

enable:
  platys_init: PROMTAIL
  example: |
    platys init --enable-services PROMTAIL
    platys gen

parameters:
  - name: PROMTAIL_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Promtail service
