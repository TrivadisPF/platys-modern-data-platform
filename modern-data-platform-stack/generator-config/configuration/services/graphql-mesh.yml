name: GraphQL Mesh
id: graphql-mesh
category:
  id: 11_query
  name: query
  color: teal
arch: [x86-64]

links:
  website: https://www.graphql-mesh.com/
  documentation: https://www.graphql-mesh.com/docs/getting-started/introduction
  github: https://github.com/urigo/graphql-mesh

description: >
  GraphQL Mesh — Query anything, run anywhere.

enable:
  platys_init: GRAPHQL_MESH
  example: |
    platys init --enable-services GRAPHQL_MESH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:4000>

parameters:
  - name: GRAPHQL_MESH_enable
    default: "false"
    since: "1.11.0"
    description: >
      Enable Hasura GraphQL Mesh service.
