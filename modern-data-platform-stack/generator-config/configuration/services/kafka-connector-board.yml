name: Kafka Connector Board
id: kafka-connector-board
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/tranglolab/kafka_connectors_board
  github: https://github.com/tranglolab/kafka_connectors_board

description: >
  Kafka connector management board.

enable:
  platys_init: KAFKA_CONNECTOR_BOARD
  example: |
    platys init --enable-services KAFKA_CONNECTOR_BOARD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28282>.

parameters:
  - name: KAFKA_CONNECTOR_BOARD_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Kafka Connector Board service
