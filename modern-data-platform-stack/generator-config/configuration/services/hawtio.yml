name: Hawtio
id: hawtio
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://hawt.io/docs/
  github: https://github.com/hawtio/hawtio

description: >
  Hawtio web console helps you manage your JVM stuff and stay cool!

enable:
  platys_init: HAWTIO
  example: |
    platys init --enable-services HAWTIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28155>

parameters:
  - name: HAWTIO_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Hawtio service
