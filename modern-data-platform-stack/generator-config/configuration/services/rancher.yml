name: Rancher
id: rancher
category:
  id: 20_infrastructure
  name: infrastructure
  color: steel
arch: [x86-64, arm]

links:
  website: https://www.rancher.com/
  documentation: https://ranchermanager.docs.rancher.com
  github: https://github.com/rancher/rancher

description: >
  Rancher is a Kubernetes management tool to deploy and run clusters anywhere
  and on any provider.

enable:
  platys_init: RANCHER
  example: |
    platys init --enable-services RANCHER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28370>.
      
      To get the initial password, execute the following
      
      ```bash
      docker logs  rancher  2>&1 | grep "Bootstrap Password:"docker logs  rancher  2>&1 | grep "Bootstrap Password:"
      ```

parameters:
  - name: RANCHER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Rancher service

  - name: RANCHER_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into the container.
