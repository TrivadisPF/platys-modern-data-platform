name: Moat
id: moat
category:
  id: 99_other
  name: other
  color: gray
arch: [x86-64]

links:
  documentation: https://moat-io.github.io/moat/
  github: https://github.com/moat-io/moat

description: >
  A Data Control Plane for Trino & OPA.

enable:
  platys_init: MOAT
  example: |
    platys init --enable-services MOAT
    platys gen

parameters:
  - name: MOAT_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Moat.
