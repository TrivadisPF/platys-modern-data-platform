name: Quix
id: quix
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://wix.github.io/quix/
  documentation: https://wix.github.io/quix/docs/installation
  github: https://github.com/wix/quix

description: >
  An easy-to-use notebook manager.

enable:
  platys_init: QUIX
  example: |
    platys init --enable-services QUIX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28160>

parameters:
  - name: QUIX_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Quix Database Notebook service
