name: Mosquitto
id: mosquitto
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://mosquitto.org/
  documentation: https://mosquitto.org/documentation/
  github: https://github.com/eclipse/mosquitto

description: >
  Eclipse Mosquitto - An open source MQTT broker

enable:
  platys_init: MOSQUITTO
  example: |
    platys init --enable-services MOSQUITTO
    platys gen

parameters:
  - name: MOSQUITTO_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Mosquitto service
