name: Pitchfork
id: pitchfork
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://opensource.expediagroup.com/pitchfork/
  documentation: https://opensource.expediagroup.com/pitchfork/docs/about/introduction.html
  github: https://github.com/ExpediaGroup/pitchfork

description: >
  Pitchfork converts tracing data between Zipkin and Haystack formats.

enable:
  platys_init: ZIPKIN,PITCHFORK
  example: |
    platys init --enable-services ZIPKIN,PITCHFORK
    platys gen

parameters:
  - name: PITCHFORK_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Pitchfork service.

  - name: PITCHFORK_server_port
    default: "9413"
    since: "1.14.0"
    description: >
      HTTP port where Pitchfork is listening.

  - name: PITCHFORK_use_logging
    default: "false"
    since: "1.14.0"
    description: >
      Enable the logging of spans for troubleshooting.

  - name: PITCHFORK_use_zipkin_http
    default: "false"
    since: "1.14.0"
    description: >
      If enabled Pitchfork will forward spans to an HTTP Zipkin server.

  - name: PITCHFORK_use_haystack_kafka
    default: "false"
    since: "1.14.0"
    description: >
      If enabled Pitchfork will forward spans to a Kafka broker.

  - name: PITCHFORK_haystack_kafka_topic
    default: "proto-spans"
    since: "1.14.0"
    description: >
      The name of the Kafka topic where the spans will be submitted to.
