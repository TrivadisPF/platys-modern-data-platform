name: Gravitino
id: gravitino
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://gravitino.apache.org/
  documentation: https://gravitino.apache.org/docs
  github: https://github.com/apache/gravitino

description: >
  World's most powerful open data catalog for building a high-performance,
  geo-distributed and federated metadata lake.

enable:
  platys_init: GRAVITINO
  example: |
    platys init --enable-services GRAVITINO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28286>.

parameters:
  - name: GRAVITINO_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Gravitino service

  - name: GRAVITINO_volume_map_data
    default: "false"
    since: "1.19.0"
    description: >
      Map the data volume of the Gravitino service.

  - name: GRAVITINO_entity_store
    default: "relational"
    since: "1.19.0"
    description: >
      The entity store to use, currently only `relational` supported.

  - name: GRAVITINO_db_type
    default: "h2"
    since: "1.19.0"
    description: >
      The database to use, either `h2` or `postgresql`.

  - name: GRAVITINO_db_username
    default: "postres"
    since: "1.19.0"
    description: >
      The database username.

  - name: GRAVITINO_db_password
    default: "abc123!"
    since: "1.19.0"
    sensitive: true
    description: >
      The database user password.

  - name: GRAVITINO_mcp_server_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable the MCP server?

  - name: GRAVITINO_ICEBERG_REST_SERVER_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Generate Gravitino Iceberg REST server
