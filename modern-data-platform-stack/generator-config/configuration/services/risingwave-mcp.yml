name: RisingWave MCP Server
id: risingwave-mcp
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/risingwavelabs/risingwave-mcp
  github: https://github.com/risingwavelabs/risingwave-mcp-server

description: >
  Model Context Protocol server for RisingWave.

enable:
  platys_init: RISINGWAVE
  example: |
    platys init --enable-services RISINGWAVE
    platys gen

usage:
  - title: Usage
    content: |
      Configure your MCP client to connect to <http://dataplatform:28409/mcp>.

parameters:
  - name: RISINGWAVE_MCP_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate RisingWave MCP service

  - name: RISINGWAVE_MCP_output_transport
    default: "streamable-http"
    since: "1.20.0"
    description: >
      Output transport used by the RisingWave MCP server. Supported values depend
      on the container image, for example `streamable-http` or `sse`.
