name: SFTP
id: sftp
category:
  id: 08_transfer
  name: transfer
  color: gray
arch: [x86-64]

links:
  website: https://man.openbsd.org/sftp-server
  documentation: https://man.openbsd.org/sftp-server
  github: https://github.com/atmoz/sftp

description: >
  ```bash platys init --enable-services SFTP platys gen ```

enable:
  platys_init: SFTP
  example: |
    platys init --enable-services SFTP
    platys gen

parameters:
  - name: SFTP_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate SFTP service

  - name: SFTP_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the local `data` folder into the SFTP service

  - name: SFTP_volume_map_data_transfer
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the local `data-transfer` folder into the SFTP service

  - name: SFTP_username
    default: "ftp"
    since: "1.16.0"
    description: >
      The username of the user on the SFTP Server

  - name: SFTP_username
    default: "abc123!"
    since: "1.16.0"
    sensitive: true
    description: >
      The password of the user on the SFTP Server

  - name: SFTP_home
    default: "ftp-data"
    since: "1.16.0"
    description: >
      The home directory on the SFTP Server
