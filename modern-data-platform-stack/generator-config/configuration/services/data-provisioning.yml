name: Data Provisioning
id: data-provisioning
category:
  id: 22_provisioning
  name: provisioning
  color: black
arch: [x86-64]


description: >
  A service to automatically provision sample data to the `data-transfer`
  folder.

enable:
  platys_init: DATA_PROVISIONING
  example: |
    platys init --enable-services DATA_PROVISIONING
    platys gen

parameters:
  - name: DATA_PROVISIONING_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Data Provisioning.
