name: Cosmo Router
id: cosmo-router
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://cosmo-docs.wundergraph.com/router/intro
  documentation: https://cosmo-docs.wundergraph.com/router/configuration
  github: https://github.com/wundergraph/cosmo

description: >
  WunderGraph Cosmo Router — a high-performance, open-source GraphQL router for federated graphs.

enable:
  platys_init: COSMO_ROUTER
  example: |
    platys init --enable-services COSMO_ROUTER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28495>.

      The router requires an execution config file at `./conf/cosmo-router/config.json`.
      Generate it with the Cosmo CLI or the WunderGraph Cosmo Cloud, then place it in that path before starting the stack.

parameters:
  - name: COSMO_ROUTER_enable
    default: "false"
    since: "1.20.0"
    description: >
      Enable WunderGraph Cosmo GraphQL Router service.
