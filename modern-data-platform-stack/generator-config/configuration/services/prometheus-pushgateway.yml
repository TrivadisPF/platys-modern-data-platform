name: Prometheus Pushgateway
id: prometheus-pushgateway
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://prometheus.io/
  documentation: https://github.com/prometheus/pushgateway
  github: https://github.com/prometheus/pushgateway

description: >
  The Prometheus Pushgateway exists to allow ephemeral and batch jobs to expose
  their metrics to Prometheus. Since these kinds of jobs may not exist long
  enough to be scraped, they can instead push their metrics to a Pushgateway.
  The Pushgateway then exposes these metrics to Prometheus.

enable:
  platys_init: PROMETHEUS,PROMETHEUS_PUSHGATEWAY
  example: |
    platys init --enable-services PROMETHEUS,PROMETHEUS_PUSHGATEWAY
    platys gen

parameters:
  - name: PROMETHEUS_PUSHGATEWAY_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Prometheus Pushgateway service
