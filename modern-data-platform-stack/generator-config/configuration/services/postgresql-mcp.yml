name: PostgreSQL MCP Server
id: postgresql-mcp
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  documentation: https://github.com/crystaldba/postgres-mcp
  github: https://github.com/crystaldba/postgres-mcp

description: >
  Postgres MCP Pro provides configurable read/write access and performance
  analysis for you and your AI agents.

enable:
  platys_init: POSTGRESQL,
  example: |
    platys init --enable-services POSTGRESQL,
    platys gen

usage:
  - title: Usage
    content: |
      Configure  to <http://dataplatform:28487/sse> if transport configuration setting is left to default.

parameters:
  - name: POSTGRESQL_MCP_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate PostgreSQL MCP Server service

  - name: POSTGRESQL_MCP_output_transport
    default: "sse"
    since: "1.20.0"
    description: >
      The output transport protocol; one of `stdio`, `sse`, or `streamable-http`

  - name: POSTGRESQL_MCP_access_mode
    default: "unrestricted"
    since: "1.20.0"
    description: >
      Access mode for the MCP server; either `unrestricted` (all SQL) or
      `restricted` (read-only)

  - name: POSTGRESQL_MCP_database
    default: "postgres"
    since: "1.20.0"
    description: >
      The database to connect to; defaults to `POSTGRESQL_database` if not set
