name: DataStax Enterprise (DSE)
id: datastax
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.datastax.com/
  documentation: https://docs.datastax.com/en/landing_page/doc/landing_page/docList.html

description: >
  Built on Apache Cassandra™, DataStax Enterprise is hardened by the largest
  internet apps, proven by the Fortune 100, and supports more NoSQL workloads -
  from Graph to Search and Analytics.

enable:
  platys_init: DATASTAX
  example: |
    platys init --enable-services DATASTAX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28121>

parameters:
  - name: DATASTAX_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable DataStax Enterprise (DSE).
