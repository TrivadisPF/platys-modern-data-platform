name: Solace Kafka Proxy
id: solace-kafka-proxy
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://solace.com/
  documentation: https://docs.solace.com
  github: https://github.com/SolaceLabs/pubsubplus-client-proxy-kafka-producer

description: >
  A simple proxy that allows a Kafka producer to publish to a PubSub+ topic
  without changes to the Kafka client app.

enable:
  platys_init: SOLACE_KAFKA_PROXY
  example: |
    platys init --enable-services SOLACE_KAFKA_PROXY
    platys gen

parameters:
  - name: SOLACE_KAFKA_PROXY_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Solace Kafka Proxy service

  - name: SOLACE_KAFKA_PROXY_vpn_name
    default: "default"
    since: "1.17.0"
    description: >
      the Message VPN of the Solace broker to connect to

  - name: SOLACE_KAFKA_PROXY_separators
    default: "_."
    since: "1.17.0"
    description: >
      if the Kafka topic contains a 'level separator', this will convert it into
      a Solace topic level separator `/`. Can take multiple characters, e.g.:
      `_.` will convert either underscore or period to a slash.
