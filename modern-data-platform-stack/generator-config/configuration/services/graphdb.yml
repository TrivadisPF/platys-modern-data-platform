name: Graphdb
id: graphdb
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://graphdb.ontotext.com/
  documentation: https://graphdb.ontotext.com/documentation/free/

description: >
  GraphDB is an enterprise ready Semantic Graph Database, compliant with W3C
  Standards. Semantic graph databases (also called RDF triplestores) provide
  the core infrastructure for solutions where modelling agility, data
  integration, relationship exploration and cross-enterprise data publishing
  and consumption are important.

enable:
  platys_init: GRAPHDB
  example: |
    platys init --enable-services GRAPHDB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:17200>

parameters:
  - name: GRAPHDB_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate GraphDB service

  - name: GRAPHDB_edition
    default: "free"
    since: "1.20.0"
    description: >
      the GraphDB edtion to use, either `free` or `enterprise`.

  - name: GRAPHDB_volume_map_data
    default: "false"
    since: "1.11.0"
    description: >
      Volume map data folder into the GraphDB service

  - name: GRAPHDB_heap_size
    default: "2G"
    since: "1.11.0"
    description: >
      GraphDB heap size

  - name: GRAPHDB_workbench_import_dir
    default: "/opt/graphdb/examples"
    since: "1.11.0"
    description: >
      the location of the file import folder
