name: DuckDB
id: duckdb
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://duckdb.org/
  documentation: https://duckdb.org/docs/stable/
  github: https://github.com/duckdb/duckdb

description: >
  DuckDB is an analytical in-process SQL database management system.

enable:
  platys_init: DUCKDB
  example: |
    platys init --enable-services DUCKDB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28120>.

parameters:
  - name: DUCKDB_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate DuckDB service

  - name: DUCKDB_ui_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable the DuckdDB UI.

  - name: DUCKDB_db_folder
    default: ""
    since: "1.18.0"
    description: >
      The name of the folder containing a DuckDB database file to map as `/db`
      into the container.

  - name: DUCKDB_init_script
    default: ""
    since: "1.19.0"
    description: >
      The name of a init script (sql) available in `./init/duckdb` folder to run
      when starting the duckdb service.
