name: Git Web
id: gitweb
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://git-scm.com/book/en/v2/Git-on-the-Server-GitWeb
  documentation: https://git-scm.com/book/en/v2/Git-on-the-Server-GitWeb
  github: https://github.com/rockstorm101/gitweb-docker

description: >
  Lightweight Docker image containing an Nginx webserver to visualize git
  repositories (through GitWeb) and provide read-only access to them over HTTP.

enable:
  platys_init: GIT_WEB
  example: |
    platys init --enable-services GIT_WEB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28250>.

parameters:
  - name: GITWEB_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Git Web.
