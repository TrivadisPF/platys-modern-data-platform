name: Keycloak
id: keycloak
category:
  id: 16_security
  name: security
  color: red
arch: [x86-64]

links:
  website: https://www.keycloak.org/
  documentation: https://www.keycloak.org/documentation
  github: https://github.com/keycloak/keycloak

description: >
  Open Source Identity and Access Management For Modern Applications and
  Services.

enable:
  platys_init: KEYCLOAK
  example: |
    platys init --enable-services KEYCLOAK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28204>.
      
      Login with user `admin` and password `abc123!`.

parameters:
  - name: KEYCLOAK_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Keycloak service

  - name: KEYCLOAK_import_realm_enabled
    default: "true"
    since: "1.17.0"
    description: >
      Import realm files (with extension `.json`) available in
      `/opt/keycloak/data/import` automatically.

  - name: KEYCLOAK_db_vendor
    default: "h2"
    since: "1.14.0"
    description: >
      The database to use, currently `postgres`, `h2`, `mssql` or `mysql` are
      supported by platys.

  - name: KEYCLOAK_loglevel
    default: "info"
    since: "1.14.0"
    description: >
      Sets the log level for Keycloak.

  - name: KEYCLOAK_features
    default: ""
    since: "1.17.0"
    description: >
      A comma-separated list of features to enable (some supported features, and
      all preview features are disabled by default). See .
