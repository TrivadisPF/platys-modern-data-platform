name: Stardog Studio
id: stardog-studio
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.stardog.com/studio/
  documentation: https://docs.stardog.com/archive/7.5.1/studio/

description: >
  Dgraph is the simplest way to implement a GraphQL backend for your
  applications. Everything you need to build apps, unite your data, and scale
  your operations is included, out-of-the-box.

enable:
  platys_init: STARDOG_STUDIO
  example: |
    platys init --enable-services STARDOG_STUDIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28170>

parameters:
  - name: STARDOG_STUDIO_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Stardog Studio.
