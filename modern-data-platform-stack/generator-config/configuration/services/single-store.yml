name: SingleStore
id: single-store
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://www.singlestore.com/
  documentation: https://docs.singlestore.com/
  github: https://github.com/singlestore-labs/singlestoredb-dev-image

description: >
  SingleStoreDB is a distributed SQL database that offers high-throughput
  transactions (inserts and upserts), low-latency analytics and context from
  real-time vector data.

enable:
  platys_init: SINGLE_STORE
  example: |
    platys init --enable-services SINGLE_STORE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28351> to run the SingleStore UI. Login with password `abc123!`.

parameters:
  - name: SINGLE_STORE_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate SingleStore service

  - name: SINGLE_STORE_license
    default: ""
    since: "1.17.0"
    description: >
      The license to use. You can sign up for a free SingleStore license.
