name: Redis Insight
id: redis-insight
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://redis.com/redis-enterprise/redis-insight/
  documentation: https://redis.com/redis-enterprise/redis-insight/
  github: https://github.com/RedisInsight/RedisInsight

description: >
  RedisInsight is a visual tool that provides capabilities to design, develop
  and optimize your Redis application. Query, analyse and interact with your
  Redis data.

enable:
  platys_init: REDIS_INSIGHT
  example: |
    platys init --enable-services REDIS_INSIGHT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28174>

parameters:
  - name: REDIS_INSIGHT_enable
    default: "false"
    since: "1.9.0"
    description: >
      Generate Redis Insight service
