name: Kafka Connect
id: kafka-connect
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: http://kafka.apache.org
  documentation: https://kafka.apache.org/documentation/#connectapi
  github: https://github.com/apache/kafka

description: >
  Kafka Connect is a tool for scalably and reliably streaming data between
  Apache Kafka® and other data systems. It makes it simple to quickly define
  connectors that move large data sets into and out of Kafka.

enable:
  platys_init: KAFKA,KAFKA_CONNECT
  example: |
    platys init --enable-services KAFKA,KAFKA_CONNECT
    platys gen

parameters:
  - name: KAFKA_CONNECT_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Kafka Connect service

  - name: KAFKA_CONNECT_nodes
    default: "1"
    since: "1.13.0"
    description: >
      number of Kafka Connect nodes

  - name: KAFKA_CONNECT_connectors
    default: ""
    since: "1.6.0"
    description: >
      A comma separated list of components to be installed from Confluent Hub.
      Specify identifier of the form owner/component:version for the component in
      Confluent Hub.

  - name: KAFKA_CONNECT_config_providers
    default: ""
    since: "1.9.0"
    sensitive: true
    description: >
      A comma-separated list of names for ConfigProviders. Allows to use
      variables in connector configurations that are dynamically resolved when
      the connector is (re)started. Can be used for secrets or any other
      configuration information which should be resolved dynamically at runtime.

  - name: KAFKA_CONNECT_config_providers_classes
    default: ""
    since: "1.9.0"
    description: >
      The Java class names for the providers listed in the
      `KAFKA_CONNECT_config_providers` property.

  - name: KAFKA_CONNECT_map_settings_file
    default: "false"
    since: "1.9.0"
    description: >
      Map the `settings.properties` file placed in the
      `$DATAPLATFORM_HOME/conf.override/kafka-connect/` folder into the
      container. Use it when enabling the `FileConfigProvider` trough the
      `KAFKA_CONNECT_config_providers` and
      `KAFKA_CONNECT_config_providers_classes` properties.
