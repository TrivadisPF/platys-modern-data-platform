name: Timescale
id: timescaledb
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://www.timescale.com/
  documentation: https://docs.timescale.com/
  github: https://github.com/timescale/timescaledb

description: >
  An open-source time-series SQL database optimized for fast ingest and complex
  queries. Packaged as a PostgreSQL extension.

enable:
  platys_init: TIMESCALDEB
  example: |
    platys init --enable-services TIMESCALDEB
    platys gen

usage:
  - title: Connect to Timescale
    content: |
      docker exec -it timescaledb psql -U timescaledb

parameters:
  - name: TIMESCALEDB_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate TimeScale DB service

  - name: TIMESCALEDB_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder

  - name: TIMESCALEDB_user
    default: "timescaledb"
    since: "1.20.0"
    description: >
      The username for the TimescaleDB database

  - name: TIMESCALEDB_password
    default: "abc123!"
    since: "1.20.0"
    sensitive: true
    description: >
      The password for the TimescaleDB database user

  - name: TIMESCALEDB_db
    default: "timescaledb"
    since: "1.20.0"
    description: >
      The name of the default TimescaleDB database
