name: dbt CLI (Data Build Tool)
id: dbt
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.getdbt.com/
  documentation: https://www.getdbt.com/docs/
  github: https://github.com/dbt-labs/dbt-core

description: >
  dbt enables data analysts and engineers to transform their data using the
  same practices that software engineers use to build applications.

enable:
  platys_init: DBT
  example: |
    platys init --enable-services DBT
    platys gen

usage:
  - title: Usage
    content: |
      To work with the dbt CLI, use:
      
      ```bash
      docker exec -it dbt-cli dbt --version
      ```

parameters:
  - name: DBT_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate dbt CLI service
