name: MCP Toolbox for Databases
id: mcp-toolbox
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  documentation: https://googleapis.github.io/genai-toolbox/getting-started/introduction/
  github: https://github.com/googleapis/genai-toolbox

description: >
  MCP Toolbox for Databases is an open source MCP server for databases.

enable:
  platys_init: MCP_TOOLBOX
  example: |
    platys init --enable-services MCP_TOOLBOX
    platys gen

usage:
  - title: Usage
    content: |
      Create a file `tools.yaml` in `./custom-conf/mcp-toolbox/` folder with the configuration for the database(s) before you start the platform. You can find more information about the configuration [here](https://googleapis.github.io/genai-toolbox/resources/sources/).

parameters:
  - name: MCP_TOOLBOX_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate MCP Toolbox for Databases service
