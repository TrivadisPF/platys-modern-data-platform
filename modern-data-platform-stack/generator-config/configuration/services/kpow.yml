name: kpow
id: kpow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://kpow.io/
  documentation: https://docs.kpow.io/
  github: https://github.com/factorhouse/kpow

description: >
  ``` platys init --enable-services KAFKA,KPOW platys gen ```

enable:
  platys_init: KAFKA,KPOW
  example: |
    platys init --enable-services KAFKA,KPOW
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28283>.
      
      You have to get a license from [kpow](https://kpow.io/) here: <https://kpow.io/pricing/>.
      
      Either add the license details to `config.yml` (if `KPOW_use_external_license_info` is set to `false`)
      
      ```yaml
            KPOW_use_external_license_info: false
            KPOW_license_id:
            KPOW_license_code: 
            KPOW_licensee:
            KPOW_license_expiry:
            KPOW_license_signature:  
      
      ```
      
      or add it to `./licenses/kpow/kpow-license.env` if `KPOW_use_external_license_info` is set to `true`
      
      ```

parameters:
  - name: KPOW_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate kpow service

  - name: KPOW_edition
    default: "cc"
    since: "1.16.0"
    description: >
      The edition to use, either `ce` (community edition) or `se` (standard
      edition) or `ee` (enterprise edition)

  - name: KPOW_use_external_license_info
    default: "false"
    since: "1.16.0"
    description: >
      if `true`, then the license information should be placed in a file called
      `./license/kpow/kpow-license.env`, otherwise the config settings
      `KPOW_licenseXXX` should be used.

  - name: KPOW_license_id
    default: ""
    since: "1.16.0"
    description: >
      The kpow license id you retrieved with your license. You can get a trial
      license from .

  - name: KPOW_license_code
    default: ""
    since: "1.16.0"
    description: >
      The kpow license code you retrieved with your license.

  - name: KPOW_licensee
    default: ""
    since: "1.16.0"
    description: >
      The kpow license you retrieved with your license.

  - name: KPOW_license_signature
    default: ""
    since: "1.16.0"
    description: >
      The kpow license signature you retrieved with your license.

  - name: KPOW_license_expiry
    default: ""
    since: "1.16.0"
    description: >
      The kpow license expiry you retrieved with your license.
