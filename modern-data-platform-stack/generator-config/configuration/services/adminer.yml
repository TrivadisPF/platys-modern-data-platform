name: Adminer
id: adminer
arch: [x86-64]

tags: [ui]
dependencies: []
links:
  website: https://www.adminer.org/
  documentation: https://www.adminer.org/en/
  github: https://github.com/vrana/adminer/

description: >
  Adminer (formerly phpMinAdmin) is a full-featured database management tool
  written in PHP. Adminer is available for MySQL, MariaDB, PostgreSQL, SQLite,
  MS SQL, Oracle, Elasticsearch, MongoDB and others via plugin.

enable:
  platys_init: ADMINER
  example: |
    platys init --enable-services ADMINER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28131>

parameters:
  - name: ADMINER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Adminer RDBMS Admin UI service
