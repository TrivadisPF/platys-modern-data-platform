name: Kaskade
id: kaskade
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  documentation: https://https://github.com/sauljabin/kaskade
  github: https://github.com/sauljabin/kaskade

description: >
  Kafka text user interface in style!

enable:
  platys_init: KASKADE
  example: |
    platys init --enable-services KASKADE
    platys gen

usage:
  - title: Usage
    content: |
      ```
      docker exec -ti kaskade kaskade
      ```

parameters:
  - name: KASKADE_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate `kaskade` CLI service
