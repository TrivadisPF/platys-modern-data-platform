name: Oracle RDBMS XE
id: oracle-xe
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.oracle.com/database/technologies/appdev/xe.html
  documentation: https://www.oracle.com/database/technologies/appdev/xe/quickstart.html

description: >
  Whether you are a developer, a DBA, a data scientist, an educator, or just
  curious about databases, Oracle Database Express Edition (XE) is the ideal
  way to get started. It is the same powerful Oracle Database that enterprises
  rely on worldwide, packaged for simple download, ease-of-use, and a
  full-featured experience. You get an Oracle Database to use in any
  environment, plus the ability to embed and redistribute – all completely
  free!

enable:
  platys_init: ORACLE_XE
  example: |
    platys init --enable-services ORACLE_XE
    platys gen

usage:
  - title: Connect through SQL Plus
    content: |
      ```
      docker exec -ti oracledb-xe sqlplus "user1/abc123!"@//localhost/XEPDB1
      ```
  - title: Connect through JDBC
    content: |
      * **JDBC Url:**  	`jdbc:oracle:thin:@dataplatform:1522/XEPDB1`
      * **JDBC Driver Class Name:** 	`oracle.jdbc.driver.OracleDriver`

parameters:
  - name: ORACLE_XE_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Oracle XE service.

  - name: ORACLE_XE_edition
    default: "regular"
    since: "1.13.0"
    description: >
      The image flavour to use, one of `regular`, `slim` or `full`

  - name: ORACLE_XE_use_faststart
    default: "false"
    since: "1.16.0"
    description: >
      Use Expanded and ready to go database inside the image? Trades image size
      on disk for faster startup time

  - name: ORACLE_XE_volume_map_data
    default: "false"
    since: "1.13.0"
    description: >
      Volume map data folder into the Oracle service

  - name: ORACLE_XE_database
    default: ""
    since: "1.13.0"
    description: >
      Set this variable to a non-empty string to create a new pluggable database
      with the name specified in this variable.

  - name: ORACLE_XE_password
    default: "EAo4KsTfRR"
    since: "1.13.0"
    sensitive: true
    description: >
      The password to use for the `SYS` and `SYSTEM` user.

  - name: ORACLE_XE_random_password
    default: ""
    since: "1.13.0"
    sensitive: true
    description: >
      Set this variable to a non-empty value, like yes, to generate a random
      initial password for the `SYS` and `SYSTEM` users. The generated password
      will be printed to stdout (`ORACLE PASSWORD FOR SYS AND SYSTEM: ...`).

  - name: ORACLE_XE_app_user
    default: ""
    since: "1.13.0"
    description: >
      Set this parameter to a non-empty string to create a new database schema
      user with the name specified in this variable. The user will be created in
      the default XEPDB1 pluggable database. If `ORACLE_XE_database` has been
      specified, the user will also be created in that pluggable database.

  - name: ORACLE_XE_app_user_password
    default: ""
    since: "1.13.0"
    sensitive: true
    description: >
      Set this variable to a non-empty string to define a password for the
      database schema user specified by `ORACLE_XE_app_user`.
