name: Zeebe
id: camunda-zeebe
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://camunda.com/products/cloud/workflow-engine/
  documentation: https://docs.camunda.io/docs/components/zeebe/zeebe-overview
  github: https://github.com/camunda-cloud/zeebe

description: >
  Distributed Workflow Engine for Microservices Orchestration.

enable:
  platys_init: CAMUNDA_ZEEBE
  example: |
    platys init --enable-services CAMUNDA_ZEEBE
    platys gen

parameters:
  - name: CAMUNDA_ZEEBE_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate Camunda Zeebe service

  - name: CAMUNDA_ZEEBE_volume_map_data
    default: "false"
    since: "1.12.0"
    description: >
      Map the `data` folder into the container.
