name: Confluent Control Center Next Generation
id: confluent-control-center-ng
category:
  id: 99_other
  name: other
  color: gray
arch: [x86-64]

links:
  website: https://docs.confluent.io/platform/current/control-center/index.html
  documentation: https://docs.confluent.io/platform/current/control-center/index.html

description: >
  Confluent Control Center is a web-based tool for managing and monitoring
  Apache Kafka®. Control Center provides a user interface that allows
  developers and operators to get a quick overview of cluster health, observe
  and control messages, topics, and Schema Registry, and to develop and run
  ksqlDB queries.

enable:
  platys_init: KAFKA
  example: |
    platys init --enable-services KAFKA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://${PUBLIC_IP}:9025>

parameters:
  - name: CONFLUENT_CCC_NG_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Confluent Control Center Next Generation service
