name: Allure
id: allure
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://allurereport.org/
  documentation: https://allurereport.org/docs/
  github: https://github.com/allure-framework/allure2

description: >
  Allure Report is a flexible, lightweight multi-language test reporting tool.
  It provides clear graphical reports and allows everyone involved in the
  development process to extract the maximum of information from the everyday
  testing process.

enable:
  platys_init: ALLURE
  example: |
    platys init --enable-services ALLURE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28462>.

parameters:
  - name: ALLURE_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Allure service

  - name: ALLURE_volume_map_result_dir
    default: "false"
    since: "1.19.0"
    description: >
      Map the results folder into the container. You can specify the location by
      the `ALLURE_results_dir` config.

  - name: ALLURE_results_dir
    default: "./container-volume/allure/allure-results"
    since: "1.19.0"
    description: >
      The folder where the Allure results are provided. Can be a relative or
      absolute folder path.

  - name: ALLURE_check_results_every_seconds
    default: "10"
    since: "1.19.0"
    description: >
      The interval in seconds to check for updates in the result folder. Set to
      `NONE` to deactivate it.

  - name: ALLURE_keep_history
    default: "true"
    since: "1.19.0"
    description: >
      Keep a history of runs, if enable specify the number of entries to keep in
      the `ALLURE_keep_history_latest` setting.

  - name: ALLURE_keep_history_latest
    default: "25"
    since: "1.19.0"
    description: >
      The number of historical runs to keep.

  - name: ALLURE_security_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable security?

  - name: ALLURE_admin_user
    default: "admin"
    since: "1.19.0"
    description: >
      Name of the Admin user, if security is enabled.

  - name: ALLURE_admin_password
    default: "abc123!"
    since: "1.19.0"
    sensitive: true
    description: >
      Password of the Admin user, if security is enabled.

  - name: ALLURE_viewer_user
    default: "viewer"
    since: "1.19.0"
    description: >
      Name of the Viewer user, if security is enabled.

  - name: ALLURE_viewer_password
    default: "abc123!"
    since: "1.19.0"
    sensitive: true
    description: >
      Password of the Viewer user, if security is enabled.

  - name: ALLURE_make_viewer_endpoints_public
    default: "false"
    since: "1.19.0"
    description: >
      Only allow viewer endpoints.
