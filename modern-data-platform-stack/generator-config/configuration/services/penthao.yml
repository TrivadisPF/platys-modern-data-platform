name: Penthao
id: penthao
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://help.hitachivantara.com/Documentation/Pentaho/9.2/
  github: https://github.com/pentaho

description: >
  No-code software to easily integrate, access, and analyze all your enterprise
  data.

enable:
  platys_init: PENTHAO
  example: |
    platys init --enable-services PENTHAO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28154>

parameters:
  - name: PENTHAO_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Penthao Webspoon service
