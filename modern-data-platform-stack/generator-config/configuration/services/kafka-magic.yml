name: Kafka Magic
id: kafka-magic
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.kafkamagic.com/
  documentation: https://www.kafkamagic.com/

description: >
  Kafka Magic is a GUI tool for working with Apache Kafka clusters. It can find
  and display messages, transform and move messages between topics, review and
  update schemas, manage topics, and automate complex tasks.

enable:
  platys_init: KAFKA_MAGIC
  example: |
    platys init --enable-services KAFKA_MAGIC
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28254>

parameters:
  - name: KAFKA_MAGIC_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Kafka Magic service

  - name: KAFKA_WEBVIEW_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Kafka WebView service
