name: Avro Tools CLI
id: avro-tools
category:
  id: 15_governance
  name: governance
  color: brown
arch: [x86-64]

links:
  website: https://avro.apache.org/
  documentation: https://avro.apache.org/
  github: https://github.com/apache/avro

description: >
  Apache Avro™ is a data serialization system and Avro Tools help workin with
  Avro instances and schmeas.

enable:
  platys_init: AVRO_TOOLS
  example: |
    platys init --enable-services AVRO_TOOLS
    platys gen

usage:
  - title: Usage
    content: |
      To use the avro tool, once it is generated, just use the `docker exec` command:
      
      ```bash
      docker compose run --rm avro-tools <command>
      ```

parameters:
  - name: AVRO_TOOLS_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Avro Tools CLI.
