name: Apache Drill
id: drill
category:
  id: 11_query
  name: query
  color: teal
arch: [x86-64]

links:
  website: https://drill.apache.org/
  documentation: https://drill.apache.org/docs/
  github: https://github.com/apache/drill

description: >
  Schema-free SQL Query Engine for Hadoop, NoSQL and Cloud Storage.

enable:
  platys_init: DRILL
  example: |
    platys init --enable-services DRILL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8047s>

parameters:
  - name: DRILL_enable
    default: "false"
    since: "1.4.0"
    description: >
      Enable Apache Drill service.
