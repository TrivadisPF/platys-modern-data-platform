name: NeoDash
id: neodash
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://neo4j.com/labs/neodash/
  documentation: https://neo4j.com/labs/neodash/2.4/user-guide/
  github: https://github.com/neo4j-labs/neodash

description: >
  NeoDash is an open source tool for visualizing your Neo4j data. It lets you
  group visualizations together as dashboards, and allow for interactions
  between reports.

enable:
  platys_init: NEODASH
  example: |
    platys init --enable-services NEODASH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5005>.

parameters:
  - name: NEODASH_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate NeoDash service
