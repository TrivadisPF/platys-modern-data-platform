name: Kong decK
id: kong-deck
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://konghq.com/products/api-gateway-platform
  documentation: https://docs.konghq.com/deck/latest/
  github: https://github.com/kong/deck/

description: >
  decK helps manage Kong’s configuration in a declarative fashion. This means
  that a developer can define the desired state of Kong Gateway or Konnect –
  services, routes, plugins, and more – and let decK handle implementation
  without needing to execute each step manually, as you would with the Kong
  Admin API.

enable:
  platys_init: KONG
  example: |
    platys init --enable-services KONG
    platys gen

usage:
  - title: Usage
    content: |
      ```bash
      docker exec -ti kong-deck deck
      ```

parameters:
  - name: KONG_DECK_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Kong Deck service
