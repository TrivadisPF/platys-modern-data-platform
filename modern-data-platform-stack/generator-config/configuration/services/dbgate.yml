name: DbGate
id: dbgate
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://dbgate.io/
  documentation: https://docs.dbgate.io/
  github: https://github.com/dbgate/dbgate/

description: >
  Database manager for MySQL, PostgreSQL, SQL Server, MongoDB, SQLite and
  others. Runs under Windows, Linux, Mac or as web application.

enable:
  platys_init: DBGATE
  example: |
    platys init --enable-services DBGATE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28120>.

parameters:
  - name: DBGATE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate DbGate service

  - name: DBGATE_edition
    default: "community"
    since: "1.18.0"
    description: >
      Either `community` or `premium`.

  - name: DBGATE_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map data folder into container.

  - name: DBGATE_license
    default: ""
    since: "1.18.0"
    description: >
      The license to use the `premium` edition.

  - name: DBGATE_user
    default: ""
    since: "1.18.0"
    description: >
      The username to use, if set then authentication is enabled.

  - name: DBGATE_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The password, if authentication is enabled.
