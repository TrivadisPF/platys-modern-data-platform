name: Presidio Anonymizer
id: presidio-anonymizer
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/microsoft/presidio/tree/main/presidio-anonymizer
  github: https://github.com/microsoft/presidio/tree/main/presidio-anonymizer

description: >
  The Presidio anonymizer is a Python based module for anonymizing detected PII
  text entities with desired values.

enable:
  platys_init: PRESIDIO_ANONYMIZER
  example: |
    platys init --enable-services PRESIDIO_ANONYMIZER
    platys gen

parameters:
  - name: PRESIDIO_ANONYMIZER_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate Presidio Anonymizer service
