name: Flowise
id: flowise
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  website: https://flowiseai.com/
  documentation: https://docs.flowiseai.com/
  github: https://github.com/FlowiseAI/Flowise

description: >
  Flowise is a low-code/no-code drag & drop tool with the aim to make it easy
  for people to visualize and build LLM apps.

enable:
  platys_init: FLOWISE
  example: |
    platys init --enable-services FLOWISE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28340>.
      
      Login with username `flowise` and password `abc123!`.

parameters:
  - name: FLOWISE_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Flowise service

  - name: FLOWISE_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map the data folder into flowise.

  - name: FLOWISE_username
    default: ""
    since: "1.17.0"
    description: >
      Name of the user for Flowise service, if empty then it runs without
      authentication.

  - name: FLOWISE_password
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      Password of the user for Flowise service, if empty then it runs without
      authentication.

  - name: FLOWISE_debug
    default: "false"
    since: "1.17.0"
    description: >
      Print logs onto the console?

  - name: FLOWISE_log_level
    default: "info"
    since: "1.17.0"
    description: >
      Log Level, one of `error`, `warn`, `info`, `verbose`, `debug`.

  - name: FLOWISE_disable_telemetry
    default: "true"
    since: "1.17.0"
    description: >
      Enable telemetry?

  - name: FLOWISE_database_type
    default: "sqlite"
    since: "1.17.0"
    description: >
      The database to store the Flowise data, either `sqlite`, `mysql` or
      `postgres`.

  - name: FLOWISE_database_username
    default: ""
    since: "1.17.0"
    description: >
      The username for the database, only valid if `FLOWISE_database_type` is not
      `sqlite`.

  - name: FLOWISE_database_password
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      The password for the database, only valid if `FLOWISE_database_type` is not
      `sqlite`.

  - name: FLOWISE_database_name
    default: ""
    since: "1.17.0"
    description: >
      The database name, only valid if `FLOWISE_database_type` is not `sqlite`.

  - name: FLOWISE_storage_type
    default: "local"
    since: "1.19.0"
    description: >
      The storage type to store the uploaded data (files, images, audio, ..),
      either `local`, `s3`.

  - name: FLOWISE_s3_storage_bucket_name
    default: "flowise-bucket"
    since: "1.19.0"
    description: >
      The name of the bucket, if `FLOWISE_storage_type` is set to `s3`.

  - name: FLOWISE_langchain_tracing_v2
    default: "false"
    since: "1.17.0"
    description: >
      Turn LangSmith tracing on?

  - name: FLOWISE_langchain_endpoint
    default: ""
    since: "1.17.0"
    description: >
      LangSmith endpoint

  - name: FLOWISE_langchain_api_key
    default: ""
    since: "1.17.0"
    sensitive: true
    description: >
      LangSmith API Key

  - name: FLOWISE_langchain_project
    default: ""
    since: "1.17.0"
    description: >
      Project to trace on LangSmith
