name: NLM Ingestor
id: nlm-ingestor
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/nlmatics/nlm-ingestor
  github: https://github.com/nlmatics/nlm-ingestor

description: >
  Custom RAG (retrieval augmented generation) friendly parsers for various file
  formats.

enable:
  platys_init: NLM_INGESTOR
  example: |
    platys init --enable-services NLM_INGESTOR
    platys gen

usage:
  - title: Usage
    content: |
      llmsherpa_url: `http://dataplatorm:28372/api/parseDocument?renderFormat=all&useNewIndentParser=true`

parameters:
  - name: NLM_INGESTOR_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate NLP Ingestor service
