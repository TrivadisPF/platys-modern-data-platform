name: Camunda Operate
id: camunda-operate
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://camunda.com/de/products/cloud/operate/
  documentation: https://docs.camunda.io/docs/components/operate/index/
  github: https://github.com/camunda-cloud/zeebe

description: >
  Operate is a tool for monitoring and troubleshooting process instances
  running in Zeebe.

enable:
  platys_init: CAMUNDA_OPERATE
  example: |
    platys init --enable-services CAMUNDA_OPERATE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28207>.

parameters:
  - name: CAMUNDA_OPERATE_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate Camunda Operate service
