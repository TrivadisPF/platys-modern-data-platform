name: MonitoFi
id: monitofi
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64]

links:
  documentation: https://github.com/microsoft/MonitoFi
  github: https://github.com/microsoft/MonitoFi

description: >
  Health & Performance Monitor for your Apache NiFi.

enable:
  platys_init: NIFI,
  example: |
    platys init --enable-services NIFI,
    platys gen

parameters:
  - name: MONITOFI_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate MonitoFi service (you also have to enable InfluxDB and Grafana)

  - name: MONITOFI_sleep_interval
    default: "60"
    since: "1.17.0"
    description: >
      The refresh interval
