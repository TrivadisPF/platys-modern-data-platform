name: Kibana
id: kibana
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://www.elastic.co/kibana/
  documentation: https://www.elastic.co/guide/en/kibana/current/index.html
  github: https://github.com/elastic/kibana

description: >
  Kibana is a free and open user interface that lets you visualize your
  Elasticsearch data and navigate the Elastic Stack. Do anything from tracking
  query load to understanding the way requests flow through your apps.

enable:
  platys_init: ELASTICSEARCH,KIBANA
  example: |
    platys init --enable-services ELASTICSEARCH,KIBANA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5601>

parameters:
  - name: KIBANA_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Kibana service (use `ELASTICSEARCH_edition` to specify if the open
      source or Elastic package should be used).

  - name: DEJAVU_enable
    default: "false"
    since: "1.4.0"
    description: >
      Enable DajaVu Elasticsearch UI

  - name: CEREBRO_enable
    default: "false"
    since: "1.4.0"
    description: >
      Generate Cerebro Elasticserach UI service

  - name: ELASTICHQ_enable
    default: "false"
    since: "1.4.0"
    description: >
      Generate ElasticHQ Elasticsearch UI service

  - name: ELASTICVUE_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate ElasticVue Elasticsearch UI service
