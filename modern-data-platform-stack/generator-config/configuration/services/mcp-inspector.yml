name: MCP Inspector
id: mcp-inspector
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  website: https://modelcontextprotocol.io/
  documentation: https://modelcontextprotocol.io/introduction
  github: https://github.com/modelcontextprotocol/inspector

description: >
  Visual testing tool for MCP servers.

enable:
  platys_init: MCP_INSPECTOR
  example: |
    platys init --enable-services MCP_INSPECTOR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:6274>.

parameters:
  - name: MCP_INSPECTOR_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate MCP Inspector service

  - name: MCP_INSPECTOR_with_authentication
    default: "false"
    since: "1.19.0"
    description: >
      Enable authentication?

  - name: MCP_INSPECTOR_auth_token
    default: ""
    since: "1.19.0"
    sensitive: true
    description: >
      The auth token to use if authentication is enabled, if not specified then a
      token will be generated and used upon startup.
