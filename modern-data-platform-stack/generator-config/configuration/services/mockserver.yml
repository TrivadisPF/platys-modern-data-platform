name: MockServer
id: mockserver
category:
  id: 17_api
  name: api
  color: lime
arch: [x86-64]

links:
  website: https://mock-server.com/
  documentation: https://mock-server.com/
  github: https://github.com/mock-server/mockserver

description: >
  MockServer enables easy mocking of any system you integrate with via HTTP or
  HTTPS with clients written in Java, JavaScript and Ruby. MockServer also
  includes a proxy that introspects all proxied traffic including encrypted SSL
  traffic and supports Port Forwarding, Web Proxying (i.e. HTTP proxy), HTTPS
  Tunneling Proxying (using HTTP CONNECT) and…

enable:
  platys_init: MOCK_SERVER
  example: |
    platys init --enable-services MOCK_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28273/mockserver/dashboard>.
  - title: Setting expectations using Json Config File
    content: |
      ```json
      [ {
        "httpRequest" : {
          "path" : "/some/path"
        },
        "httpResponse" : {
          "statusCode": 200,
            "body": {
              "value": "one"
            }
        }
      } ]
      ```
  - title: Setting expectations using Curl
    content: |
      ```bash
      curl -X PUT 'localhost:28273/mockserver/expectation' \
      -d '[
        {
          "httpRequest": {
            "path": "/some/path"
          },
          "httpResponse": {
            "statusCode": 200,
            "body": {
              "value": "one"
            }
          }
        }
      ]'
      ```

parameters:
  - name: MOCK_SERVER_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate MockServer service

  - name: MOCK_SERVER_log_level
    default: "DEBUG"
    since: "1.15.0"
    description: >
      The the minimum level of logs to record in the event log and to output to
      system out.

  - name: MOCK_SERVER_persist_expectations
    default: "false"
    since: "1.15.0"
    description: >
      Enable the persisting of expectations as json, which is updated whenever
      the expectation state is updated (i.e. add, clear, expires, etc).

  - name: MOCK_SERVER_persisted_expecations_path
    default: ""
    since: "1.15.0"
    description: >
      The file path used to save persisted expectations as json, which is updated
      whenever the expectation state is updated (i.e. add, clear, expires, etc).

  - name: MOCK_SERVER_initialization_json_path
    default: ""
    since: "1.15.0"
    description: >
      The name of the json file (stored in `./scripts/mockserver/` used to
      initialize expectations in MockServer at startup, if set MockServer will
      load this file and initialise expectations for each item in the file when
      is starts.
