name: MQTTX
id: mqttx
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://mqttx.app/
  documentation: https://mqttx.app/docs
  github: https://github.com/emqx/MQTTX

description: >
  A Powerful and All-in-One MQTT 5.0 client toolbox for Desktop, CLI and
  WebSocket.

enable:
  platys_init: MQTTX_CLI
  example: |
    platys init --enable-services MQTTX_CLI
    platys gen

usage:
  - title: Web
    content: |
      Navigate to <http://dataplatform:28367>.
  - title: CLI
    content: |
      ```bash
      docker exec -ti mqttx-cli mqttx
      ```

parameters:
  - name: MQTTX_CLI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate MQTTX CLI service

  - name: MQTTX_WEB_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate MQTTX Web service
