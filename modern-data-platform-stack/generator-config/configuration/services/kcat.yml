name: kcat (formerly known as Kafkacat)
id: kcat
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://github.com/edenhill/kcat
  documentation: https://github.com/edenhill/kcat
  github: https://github.com/edenhill/kcat

description: >
  Generic command line non-JVM Apache Kafka producer and consumer.

enable:
  platys_init: KCAT
  example: |
    platys init --enable-services KCAT
    platys gen

usage:
  - title: Usage
    content: |
      against non-secure cluster (`PLAINTEXT`)
      
      ```bash
      docker exec -ti kcat kcat -b <broker> -t <topic>
      ```
      
      against secure cluster
      
      ```bash
      docker exec -ti kcat kcat -b <broker> -t <topic>
      			-X security.protocol=SASL_PLAINTEXT
      			-X sasl.mechanism=SCRAM-SHA-512
      			-X sasl.username=client
      			-X sasl.password=client-secret
      ```
  - title: Consume with Consumer Group
    content: |
      ```bash
      docker exec -ti kcat kcat -G mygroup mytopic -b kafka-1:19092  -c 1 -o end
      ```

parameters:
  - name: KCAT_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate `kcat` CLI service
