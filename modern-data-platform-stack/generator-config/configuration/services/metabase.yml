name: Metabase
id: metabase
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.metabase.com/
  documentation: https://www.metabase.com/docs/latest/
  github: https://github.com/metabase/metabase

description: >
  Metabase is a simple and powerful analytics tool which lets anyone learn and
  make decisions from their company’s data—no technical knowledge required.

enable:
  platys_init: METABASE
  example: |
    platys init --enable-services METABASE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28257>

parameters:
  - name: METABASE_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Metabase service

  - name: METABASE_db_type
    default: "h2"
    since: "1.14.0"
    description: >
      The database type to use, either `h2` or `postgres`.

  - name: METABASE_postgres_dbname
    default: "metabasedb"
    since: "1.14.0"
    description: >
      the name of the database, if `METABASE_db_type` is set to `postgres`.

  - name: METABASE_postgres_user
    default: "metabasedb"
    since: "1.14.0"
    description: >
      the name of the database user, if `METABASE_db_type` is set to `postgres`.

  - name: METABASE_postgres_password
    default: "abc123!"
    since: "1.14.0"
    sensitive: true
    description: >
      the password of the database user, if `METABASE_db_type` is set to
      `postgres`.

  - name: METABASE_mysql_dbname
    default: "metabasedb"
    since: "1.17.0"
    description: >
      the name of the database, if `METABASE_db_type` is set to `mysql`.

  - name: METABASE_mysql_user
    default: "metabasedb"
    since: "1.17.0"
    description: >
      the name of the database user, if `METABASE_db_type` is set to `mysql `.

  - name: METABASE_mysql_password
    default: "abc123!"
    since: "1.17.0"
    sensitive: true
    description: >
      the password of the database user, if `METABASE_db_type` is set to `mysql
      `.

  - name: METABASE_volume_map_data
    default: "false"
    since: "1.14.0"
    description: >
      Volume Map Metabase data folder?

  - name: METABASE_query_caching_enabled
    default: "false"
    since: "1.17.0"
    description: >
      Enabling caching will save the results of queries that take a long time to
      run.

  - name: METABASE_prometheus_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enabling Prometheus export metrics.
