name: Streams Explorer
id: streams-explorer
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://github.com/bakdata/streams-explorer#streams-explorer
  documentation: https://github.com/bakdata/streams-explorer#streams-explorer
  github: https://github.com/bakdata/streams-explorer

description: >
  Explore Data Pipelines in Apache Kafka.

enable:
  platys_init: STREAMS_EXPLORER
  example: |
    platys init --enable-services STREAMS_EXPLORER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28195>

parameters:
  - name: STREAMS_EXPLORER_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Streams Explorer service
