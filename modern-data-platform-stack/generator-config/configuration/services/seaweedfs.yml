name: SeaweedFS
id: seaweedfs
type: engine
arch: [x86-64]

tags: [storage,s3]
dependencies: []
links:
  website: https://seaweedfs.com
  documentation: https://github.com/seaweedfs/seaweedfs/wiki
  github: https://github.com/seaweedfs/seaweedfs

description: >
  SeaweedFS is a simple and highly scalable distributed file system
  with an S3-compatible object storage API.

enable:
  platys_init: SEAWEEDFS
  example: |
    platys init --enable-services SEAWEEDFS
    platys gen

usage:
  - title: Use the S3 API
    content: |
      The S3 API is exposed on <http://dataplatform:8333>.

parameters:
  - name: SEAWEEDFS_enable
    default: "false"
    since: "1.21.0"
    description: >
      Enable SeaweedFS object storage service.

  - name: SEAWEEDFS_volume_map_data
    default: "false"
    since: "1.21.0"
    description: >
      Volume map the data folder into the container.

  - name: SEAWEEDFS_access_key
    default: "admin"
    since: "1.21.0"
    description: >
      S3 access key used to authenticate with SeaweedFS.

  - name: SEAWEEDFS_secret_key
    default: "abc123abc123!"
    since: "1.21.0"
    sensitive: true
    description: >
      S3 secret key used to authenticate with SeaweedFS.

  - name: SEAWEEDFS_buckets
    default: ""
    since: "1.21.0"
    description: >
      Comma-separated list of additional buckets to create on startup.
      The admin-bucket is created by default.
