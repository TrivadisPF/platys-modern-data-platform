name: MQTT UI
id: mqtt-ui
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://www.hivemq.com/docs/hivemq/3.4/web-ui/introduction.html
  documentation: https://www.hivemq.com/docs/hivemq/3.4/web-ui/introduction.html
  github: https://github.com/hivemq/hivemq-mqtt-web-client

description: >
  A websockets based MQTT Client for your browser.

enable:
  platys_init: HIVEMQ_MQTT_WEB_CLIENT
  example: |
    platys init --enable-services HIVEMQ_MQTT_WEB_CLIENT
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28136>

parameters:
  - name: MQTT_UI_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate MQTT UI service
