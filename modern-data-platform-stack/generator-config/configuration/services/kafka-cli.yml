name: Apache Kafka CLI
id: kafka-cli
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: http://kafka.apache.org
  documentation: https://kafka.apache.org/documentation
  github: https://github.com/apache/kafka

description: >
  Apache Kafka is an open-source distributed event streaming platform used by
  thousands of companies for high-performance data pipelines, streaming
  analytics, data integration, and mission-critical applications.

enable:
  platys_init: KAFKA_CLI
  example: |
    platys init --enable-services KAFKA_CLI
    platys gen

usage:
  - title: Usage
    content: |
      Connecting to the container for using the CLI's
      
      ```bash
      docker exec -ti kafka-cli bash
      ```
      
      Using the `kafka-topics` command to list topics
      
      ```bash
      docker exec -ti kafka-cli kafka-topics --bootstrap-sever kafka-1:29092 --list
      ```

parameters:
  - name: KAFKA_CLI_enable
    default: "false"
    since: "1.16.0"
    description: >
      Use confluent Kafka

  - name: SCHEMA_REGISTRY_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Confluent Schema Registry service

  - name: SCHEMA_REGISTRY_flavour
    default: "confluent"
    since: "1.14.0"
    description: >
      Which schema registry to use, either `confluent` or `apicurio`

  - name: SCHEMA_REGISTRY_nodes
    default: "false"
    since: "1.14.0"
    description: >
      number of Confluent Schema Registry nodes

  - name: CONFLUENT_SCHEMA_REGISTRY_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Confluent Schema Registry service - **Deprecated!!** will just set
      the `SCHEMA_REGISTRY_enable` and the `SCHEMA_REGISTRY_flavour` to
      `confluent`.

  - name: CONFLUENT_SCHEMA_REGISTRY_use_zookeeper_election
    default: "false"
    since: "1.14.0"
    description: >
      use Zookeeper for election of 'master' Schema Registry node

  - name: CONFLUENT_SCHEMA_REGISTRY_replication_factor
    default: "1"
    since: "1.14.0"
    description: >
      replication factor to use for the `_schemas` topic

  - name: CONFLUENT_SCHEMA_REGISTRY_leader_eligibility
    default: "true"
    since: "1.14.0"
    description: >
      if `true`, this node can participate in primary election. In a
      multi-colocated setup, turn this off for clusters in the secondary data
      center.

  - name: CONFLUENT_SCHEMA_REGISTRY_mode_mutability
    default: "true"
    since: "1.14.0"
    description: >
      if `true` the mode of this Schema Registry node can be changed.

  - name: CONFLUENT_SCHEMA_REGISTRY_schema_compatibility_level
    default: "backward"
    since: "1.14.0"
    description: >
      The schema compatibility type. One of `none`, `backward`,
      `backward_transitive`, `forward`, `forward_transitive`, `full` or
      `full_transitive`.

  - name: CONFLUENT_SCHEMA_REGISTRY_log4j_root_loglevel
    default: "info"
    since: "1.14.0"
    description: >
      Change the `rootLogger` loglevel of the Schema Registry.

  - name: CONFLUENT_SCHEMA_REGISTRY_debug
    default: "false"
    since: "1.14.0"
    description: >
      Boolean indicating whether extra debugging information is generated in some
      error response entities.

  - name: APICURIO_SCHEMA_REGISTRY_storage
    default: "kafkasql"
    since: "1.19.0"
    description: >
      The storage type to use, either `memory` for In-Memory, `sql` for database
      (currently only Postgresql) or `kafkasql` for Kafka based storage.

  - name: APICURIO_SCHEMA_REGISTRY_sql_storage_database
    default: "apicuriodb"
    since: "1.14.0"
    description: >
      The database to use if storage is `sql` or `mssql`.

  - name: APICURIO_SCHEMA_REGISTRY_sql_storage_user
    default: "apicurio"
    since: "1.14.0"
    description: >
      The user to use if storage is `sql` or `mssql`.

  - name: APICURIO_SCHEMA_REGISTRY_sql_storage_password
    default: "abc123!"
    since: "1.14.0"
    sensitive: true
    description: >
      The password to use if storage is `sql` or `mssql`.

  - name: APICURIO_auth_enabled
    default: "false"
    since: "1.14.0"
    description: >
      Enable authentication using Keycloak? If set to `true` then
      `KEYCLOAK_enable` will be enabled automatically.

  - name: APICURIO_auth_anonymous_read_access_enabled
    default: "false"
    since: "1.14.0"
    sensitive: true
    description: >
      Allow anonymous users (REST API calls with no authentication credentials
      provided) to make read-only calls to the REST API.

  - name: APICURIO_auth_import_default_users
    default: "false"
    since: "1.14.0"
    description: >
      If set to `true`, imports the following pre-defined users `sr-view`,
      `sr-dev` and `sr-admin` into the `registry` realm.

  - name: APICURIO_basic_auth_enabled
    default: "false"
    since: "1.14.0"
    description: >
      Enable basic authentication? To set it to `true`, `APICURIO_auth_enable`
      has to be enabled as well and Keycloak configured accordingly. Basic
      authentication is just the authentication API layer, the authentication
      will still happen over keycloak.

  - name: APICURIO_eventsourcing_enabled
    default: "false"
    since: "1.14.0"
    description: >
      Enable Event Sourcing, i.e. enable the Schema Registry to send events when
      changes are made to the registry.

  - name: APICURIO_eventsourcing_kafka_topic
    default: "registry-events"
    since: "1.14.0"
    description: >
      The Kafka topic to use, if `APICURIO_eventsourcing_transport` is set to
      `kafka`.
