name: pgAdmin
id: pgadmin
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.pgadmin.org/
  documentation: https://www.pgadmin.org/docs/pgadmin4/latest/index.html
  github: https://github.com/postgres/pgadmin4

description: >
  pgAdmin is the most popular and feature rich Open Source administration and
  development platform for PostgreSQL.

enable:
  platys_init: POSTRESQL
  example: |
    platys init --enable-services POSTRESQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28247>

parameters:
  - name: PGADMIN_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate pgAdmin service
