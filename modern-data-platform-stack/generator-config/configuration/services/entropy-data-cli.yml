name: Entropy Data CLI
id: entropy-data-cli
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://entropy-data.com/
  docker: https://hub.docker.com/r/entropydata/entropy-data-cli

description: >
  Command line interface for Entropy Data

enable:
  platys_init: ENTROPY_DATA_CLI
  example: |
    platys init --enable-services ENTROPY_DATA_CLI
    platys gen

parameters:
  - name: ENTROPY_DATA_CLI_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Entropy Data CLI service

  - name: ENTROPY_DATA_CLI_home_dir
    default: "${PWD}"
    since: "1.21.0"
    description: >
      the folder (home directory) which is mapped into the container at `/home/entropy-data`
