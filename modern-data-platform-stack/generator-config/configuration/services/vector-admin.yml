name: Vector Admin
id: vector-admin
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://vectoradmin.com/
  documentation: https://docs.vectoradmin.com/
  github: https://github.com/Mintplex-Labs/vector-admin

description: >
  A cloud-native vector database, storage for next generation AI applications.

enable:
  platys_init: VECTOR_ADMIN,
  example: |
    platys init --enable-services VECTOR_ADMIN,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28350>.

parameters:
  - name: VECTOR_ADMIN_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Vector Admin service

  - name: VECTOR_ADMIN_postgresql_database
    default: ""
    since: "1.18.0"
    description: >
      the PostgreSQL database to use for connecting to the PostgreSQL. If not
      set, the value of the `POSTGRESQL_database` property is used.

  - name: VECTOR_ADMIN_postgresql_user
    default: ""
    since: "1.18.0"
    description: >
      the PostgreSQL user to use for connecting to the PostgreSQL database. If
      not set, the value of the `POSTGRESQL_user` property is used.

  - name: VECTOR_ADMIN_postgresql_password
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      the PostgreSQL password to use for connecting to the PostgreSQL database.
      If not set, the value of the `POSTGRESQL_password` property is used.
