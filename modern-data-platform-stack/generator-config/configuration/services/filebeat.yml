name: FileBeat
id: filebeat
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://www.elastic.co/beats/filebeat
  documentation: https://www.elastic.co/guide/en/beats/filebeat/current/index.html
  github: https://github.com/elastic/beats

description: >
  🐠 Beats - Lightweight shippers for Elasticsearch & Logstash.

enable:
  platys_init: FILEBEAT
  example: |
    platys init --enable-services FILEBEAT
    platys gen

parameters:
  - name: FILEBEAT_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate FileBeat service

  - name: FILEBEAT_conf_file_name
    default: ""
    since: "1.17.0"
    description: >
      Name of a custom config file to map into the FileBeat container.
