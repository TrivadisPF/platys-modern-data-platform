name: InfluxDB v3 Explorer
id: influxdb3-explorer
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.influxdata.com/
  documentation: https://docs.influxdata.com/influxdb3/core/
  github: https://github.com/influxdata/influxdb

description: >
  Build, execute, and visualize SQL queries in the InfluxDB UI Data Explorer.

enable:
  platys_init: INFLUXDB3-EXPLORER
  example: |
    platys init --enable-services INFLUXDB3-EXPLORER
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28448>.

parameters:
  - name: INFLUXDB3_EXPLORER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate InfluxDB 3 Explorer (UI) service

  - name: INFLUXDB3_EXPLORER_mode
    default: "admin"
    since: "1.20.0"
    description: >
      The mode to run InfluxDB 3 Explorer in; either `admin` or `query`

  - name: INFLUXDB3_EXPLORER_session_secret_key
    default: ""
    since: "1.20.0"
    sensitive: true
    description: >
      The secret key used to sign session tokens; generate with `openssl rand
      -hex 32`

  - name: INFLUXDB3_EXPLORER_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Volume map data folder into the InfluxDB 3 Explorer service
