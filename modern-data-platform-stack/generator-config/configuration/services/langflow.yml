name: Langflow
id: langflow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.langflow.org/
  documentation: https://docs.langflow.org/
  github: https://github.com/langflow-ai/langflow

description: >
  Langflow is a dynamic graph where each node is an executable unit. Its
  modular and interactive design fosters rapid experimentation and prototyping,
  pushing hard on the limits of creativity.

enable:
  platys_init: LANGFLOW,POSTGRESQL
  example: |
    platys init --enable-services LANGFLOW,POSTGRESQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:7860>.
  - title: Load flows on startup
    content: |
      Place flow JSON files to be loaded on startup into `./init/langflow/` folder. Note that this feature only works if `LANGFLOW_auth_enable` is disabled.
  - title: Provide custom components
    content: |
      Place custom components into `./plugins/langflow` and set `LANGFLOW_volume_map_components` to `true`.

parameters:
  - name: LANGFLOW_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Langflow service

  - name: LANGFLOW_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data folder into langflow.

  - name: LANGFLOW_volume_map_components
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the components (plugins) folder into langflow.

  - name: LANGFLOW_database_type
    default: "sqlite"
    since: "1.18.0"
    description: >
      The database to store the Langflow data, either `sqlite` or `postgres`.

  - name: LANGFLOW_database_username
    default: "postgres"
    since: "1.18.0"
    description: >
      The username for the PostgreSQL database.

  - name: LANGFLOW_database_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password for the PostgreSQL database.

  - name: LANGFLOW_database_name
    default: "postgres"
    since: "1.18.0"
    description: >
      The PostgreSQL database name.

  - name: LANGFLOW_auth_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable authentication?

  - name: LANGFLOW_superuser_username
    default: "langflow"
    since: "1.18.0"
    description: >
      The username of the superuser, applicable if `LANGFLOW_auth_enable` is set
      to `true`.

  - name: LANGFLOW_superuser_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password of the superuser, applicable if `LANGFLOW_auth_enable` is set
      to `true`.

  - name: LANGFLOW_secret_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      Key used for encrypting sensitive data like API keys. If not provided, a
      secure key will be auto-generated.

  - name: LANGFLOW_backend_only
    default: "false"
    since: "1.18.0"
    description: >
      Only run Langflow's backend server (no frontend)?.

  - name: LANGFLOW_log_level
    default: "info"
    since: "1.18.0"
    description: >
      Set the logging level for Langflow.

  - name: LANGFLOW_store_enabled
    default: "true"
    since: "1.18.0"
    description: >
      Enable Langflow Store.
