name: Dockhand
id: dockhand
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/fnsys/dockhand
  documentation: https://github.com/fnsys/dockhand
  github: https://github.com/fnsys/dockhand

description: >
  Dockhand is a lightweight Docker container management UI that lets you view,
  start, stop, and manage containers directly from your browser.

enable:
  platys_init: DOCKHAND
  example: |
    platys init --enable-services DOCKHAND
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28498>.

parameters:
  - name: DOCKHAND_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Dockhand Docker container management UI service

  - name: DOCKHAND_volume_map_data
    default: "false"
    since: "1.21.0"
    description: >
      Map the Dockhand data directory (`/app/data`) to `./container-volume/dockhand`
      on the host for persistent storage.
