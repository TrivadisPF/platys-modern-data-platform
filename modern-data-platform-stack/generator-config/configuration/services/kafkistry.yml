name: Kafkistry
id: kafkistry
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://github.com/infobip/kafkistry
  documentation: https://github.com/infobip/kafkistry/blob/master/DOCUMENTATION.md
  github: https://github.com/infobip/kafkistry/tree/master

description: >
  Registry service for Apache Kafka which keeps track of topics,
  consumer-groups, acls, quotas and their configuration/state/metadata across
  multiple kafka-clusters.

enable:
  platys_init: KAFKISTRY
  example: |
    platys init --enable-services KAFKISTRY
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28303> to show the Kafkistry UI.
      
      Login as the **Admin User**: User `admin` and Password `abc123!`.

parameters:
  - name: KAFKISTRY_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Kafkistry service
