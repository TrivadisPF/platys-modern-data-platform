name: cAdvisor
id: cadvisor
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/google/cadvisor
  github: https://github.com/google/cadvisor

description: >
  Analyzes resource usage and performance characteristics of running
  containers.

enable:
  platys_init: CADVISOR
  example: |
    platys init --enable-services CADVISOR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28138>

parameters:
  - name: CADVISOR_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate CAdvisor Container UI service
