name: MQTTX CLI
id: mqttx-cli
arch: [x86-64]

tags: [cli]
dependencies: []
links:
  website: https://mqttx.app/
  documentation: https://mqttx.app/docs/cli/introduction
  github: https://github.com/emqx/MQTTX

description: >
  A Powerful and All-in-One MQTT 5.0 client toolbox for Desktop, CLI and
  WebSocket. This container runs the MQTTX CLI.

enable:
  platys_init: MQTTX_CLI
  example: |
    platys init --enable-services MQTTX_CLI
    platys gen

usage:
  - title: Running the CLI
    content: |
      ```bash
      docker exec -ti mqttx-cli mqttx
      ```
  - title: Using the Simulator
    content: |
      List the built-in scenarios

      ```bash
      docker exec -ti mqttx-cli mqttx ls --scenarios
      ```

      Run the `smart_home` scenario

      ```bash
      docker exec -ti mqttx-cli mqttx simulate -sc smart_home -c 100 conn -h 'mosquitto-1' -p 1883
      ```

parameters:
  - name: MQTTX_CLI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate MQTTX CLI service.
