name: SQLPad
id: sqlpad
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://getsqlpad.com/#/
  documentation: https://getsqlpad.com/#/
  github: https://github.com/sqlpad/sqlpad

description: >
  Web-based SQL editor run in your own private cloud. Supports MySQL, Postgres,
  SQL Server, Vertica, Crate, ClickHouse, Trino, Presto, SAP HANA, Cassandra,
  Snowflake, BigQuery, SQLite, and more with ODBC

enable:
  platys_init: SQLPAD
  example: |
    platys init --enable-services SQLPAD
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28194>

parameters:
  - name: SQLPAD_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate SQLPad UI service

  - name: SQLCHAT_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate SQL Chat UI service

  - name: SQLCHAT_api_key
    default: ""
    since: "1.16.0"
    sensitive: true
    description: >
      OpenAI API key.

  - name: SQLCHAT_api_endpoint
    default: "https://api.openai.com"
    since: "1.16.0"
    description: >
      OpenAI API endpoint.

  - name: SQLCHAT_database_less
    default: "false"
    since: "1.16.0"
    description: >
      Set to `true` to start SQL Chat in database-less mode.
