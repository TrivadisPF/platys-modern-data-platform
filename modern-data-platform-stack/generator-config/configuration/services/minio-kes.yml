name: MinIO KES
id: minio-kes
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://min.io/
  documentation: https://min.io/docs/kes/cli/kes-server
  github: https://github.com/minio/kes

description: >
  KES is a cloud-native distributed key management and encryption server
  designed to secure modern applications at scale.

enable:
  platys_init: MINIO
  example: |
    platys init --enable-services MINIO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9000>.
      
      Login with username `V42FCGRVMK24JJ8DHUYG` and password `bKhWxVF3kQoLY9kFmt91l+tDrEoZjqnWXzY9Eza` (if left to defaults).

parameters:
  - name: MINIO_KES_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Minio KES service
