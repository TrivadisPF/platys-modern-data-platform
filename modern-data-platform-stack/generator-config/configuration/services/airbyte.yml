name: Airbyte
id: airbyte
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://airbyte.com/
  documentation: https://docs.airbyte.com/
  github: https://github.com/airbytehq/airbyte

description: >
  Airbyte is an open-source EL(T) platform that helps you replicate your data
  in your warehouses, lakes and databases.

enable:
  platys_init: AIRBYTE
  example: |
    platys init --enable-services AIRBYTE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28271>.

parameters:
  - name: AIRBYTE_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Airbyte service

  - name: AIRBYTE_volume_map_data
    default: "false"
    since: "1.15.0"
    description: >
      Volume Map the data folder of the `airbyte-db` service.

  - name: AIRBYTE_database_user
    default: "airbyte"
    since: "1.15.0"
    description: >
      The database user to use for the `airbyte-db` service.

  - name: AIRBYTE_database_password
    default: "abc123!"
    since: "1.15.0"
    sensitive: true
    description: >
      The password to use for the `airbyte-db` service.

  - name: AIRBYTE_database_db
    default: "airbyte"
    since: "1.15.0"
    description: >
      The name of the database to use for the `airbyte-db` service.

  - name: AIRBYTE_database_host
    default: "airbyte-db"
    since: "1.15.0"
    description: >
      The host name to use for the `airbyte-db` service.

  - name: AIRBYTE_database_port
    default: "5432"
    since: "1.15.0"
    description: >
      The port to use for the `airbyte-db` service.

  - name: AIRBYTE_configs_database_minimum_flyway_migration_version
    default: "0.40.23.002"
    since: "1.15.0"
    description: >
      The minimum configs database version for the flyway migration.

  - name: AIRBYTE_jobs_database_minimum_flyway_migration_version
    default: "0.40.26.001"
    since: "1.15.0"
    description: >
      The minimum jobs database version for the flyway migration.

  - name: AIRBYTE_log_level
    default: "INFO"
    since: "1.15.0"
    description: >
      The log level for airbyte.
