name: Redis MCP Server
id: redis-mcp
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  documentation: https://github.com/redis/mcp-redis
  github: https://github.com/redis/mcp-redis

description: >
  The official Redis MCP Server is a natural language interface designed for
  agentic applications to manage and search data in Redis efficiently.

enable:
  platys_init: REDIS,
  example: |
    platys init --enable-services REDIS,
    platys gen

usage:
  - title: Usage
    content: |
      Configure  to <http://dataplatform:28225/sse> if transport configuration setting is left to default.

parameters:
  - name: REDIS_MCP_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Redis MCP Server service

  - name: REDIS_MCP_output_transport
    default: "sse"
    since: "1.20.0"
    description: >
      The output transport protocol for the Redis MCP Server; one of `stdio`,
      `sse`, `ws`, or `streamableHttp`
