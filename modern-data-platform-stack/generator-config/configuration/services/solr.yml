name: Solr
id: solr
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://solr.apache.org/
  documentation: https://solr.apache.org/
  github: https://github.com/apache/solr

description: >
  Solr is the popular, blazing-fast, open source enterprise search platform
  built on Apache Lucene.

enable:
  platys_init: SOLR
  example: |
    platys init --enable-services SOLR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:8983>

parameters:
  - name: SOLR_enable
    default: "false"
    since: "1.0.0"
    description: >
      Generate Solr service
