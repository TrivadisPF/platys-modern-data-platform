name: Telegraf
id: telegraf
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://www.influxdata.com/time-series-platform/telegraf/
  documentation: https://docs.influxdata.com/telegraf/latest/
  github: https://github.com/influxdata/telegraf

description: >
  Telegraf is a plugin-driven server agent for collecting & reporting metrics,
  and is the first piece of the TICK stack. Telegraf has plugins to source a
  variety of metrics directly from the system it’s running on, pull metrics
  from third party APIs, or even listen for metrics via a statsd and Kafka
  consumer services. It also has output plugins to send metrics to a variety of
  other datastores, services, and message queues, including InfluxDB, Graphite,
  OpenTSDB, Datadog, Librato, Kafka, MQTT, NSQ, and many others.

enable:
  platys_init: INFLUXDB,
  example: |
    platys init --enable-services INFLUXDB,
    platys gen

parameters:
  - name: INFLUXDB_TELEGRAF_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Telegraf service

  - name: INFLUXDB_TELEGRAF_custom_conf_file
    default: "false"
    since: "1.18.0"
    description: >
      Overwrite default `telegraf.conf` file with your own file, to be stored in
      `custom-conf/telegraf` folder.

  - name: INFLUXDB_TELEGRAF_influx_token
    default: "false"
    since: "1.18.0"
    sensitive: true
    description: >
      The authentication token to use to connect to the InfluxDB service. This
      configuration setting is only used, if the environment variable
      `PLATYS_INFLUXDB_TOKEN` is not set.

  - name: INFLUXDB_TELEGRAF_monitor_docker_host_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable to monitoring the Docker Engine Host from within a container. If set
      to `true` then a file mount of the host filesystems into the container is
      done and environment variables are used to instruct Telegraf where to
      locate the filesystems.
