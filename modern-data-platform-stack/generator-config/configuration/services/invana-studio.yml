name: Invana Studio
id: invana-studio
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://invana.io/
  documentation: https://docs.invana.io/products/invana-studio
  github: https://github.com/invana/invana-studio

description: >
  Open source graph visualiser. 

enable:
  platys_init: INVANA_STUDIO,
  example: |
    platys init --enable-services INVANA_STUDIO,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28292> and enter `http://dataplatform:28291/graphql` into the connection string to connect to the Invana GraphQL Engine.

parameters:
  - name: INVANA_STUDIO_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Invana Studio service
