name: Baserow
id: baserow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://baserow.io/
  documentation: https://baserow.io/docs/index
  github: https://gitlab.com/bramw/baserow

description: >
  Baserow is an open source no-code database and Airtable alternative. Create
  your own database without technical experience. Our user friendly no-code
  tool gives you the powers of a developer without leaving your browser.

enable:
  platys_init: BASEROW
  example: |
    platys init --enable-services BASEROW
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28299>.

parameters:
  - name: BASEROW_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate Baserow service

  - name: BASEROW_volume_map_data
    default: "false"
    since: "1.16.0"
    description: >
      Volume map data folder into the Baserow service
