name: Opik
id: opik
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.comet.com/site/products/opik/
  documentation: https://www.comet.com/docs/opik/
  github: https://github.com/comet-ml/opik

description: >
  Opik is an open-source LLM engineering platform for evaluating, testing,
  and monitoring LLM applications.

enable:
  platys_init: OPIK
  example: |
    platys init --enable-services OPIK
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5173>

parameters:
  - name: OPIK_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Opik service.
