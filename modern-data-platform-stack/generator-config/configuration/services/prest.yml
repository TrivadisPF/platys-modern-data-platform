name: pREST
id: prest
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://docs.prest.com.br/
  github: https://github.com/prest/prest

description: >
  pREST (PostgreSQL REST) is a fully RESTful API from any existing PostgreSQL database,
  written in Go.

enable:
  platys_init: PREST
  example: |
    platys init --enable-services PREST
    platys gen

parameters:
  - name: PREST_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate pREST service

  - name: PREST_debug
    default: "false"
    since: "1.20.0"
    description: >
      Enable debug mode for pREST

  - name: PREST_auth_enabled
    default: "true"
    since: "1.20.0"
    description: >
      Enable authentication for pREST

  - name: PREST_pg_host
    default: "postgresql"
    since: "1.20.0"
    description: >
      PostgreSQL host for pREST to connect to

  - name: PREST_pg_user
    default: "postgres"
    since: "1.20.0"
    description: >
      PostgreSQL user for pREST to connect with

  - name: PREST_pg_password
    default: "postgres"
    since: "1.20.0"
    description: >
      PostgreSQL password for pREST to connect with

  - name: PREST_pg_database
    default: "postgres"
    since: "1.20.0"
    description: >
      PostgreSQL database for pREST to connect to

  - name: PREST_pg_port
    default: "5432"
    since: "1.20.0"
    description: >
      PostgreSQL port for pREST to connect to

  - name: PREST_ssl_mode
    default: "disable"
    since: "1.20.0"
    description: >
      PostgreSQL SSL mode (`disable`, `require`, `verify-ca`, `verify-full`)

  - name: PREST_cache_enabled
    default: "false"
    since: "1.20.0"
    description: >
      Enable caching in pREST
