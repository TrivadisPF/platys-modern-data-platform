name: LangWatch
id: langwatch
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://langwatch.ai/
  documentation: https://docs.langwatch.ai/introduction
  github: https://github.com/langwatch/langwatch

description: >
  The ultimate LLM Ops platform - Monitoring, Analytics, Evaluations, Datasets
  and Prompt Optimization.

enable:
  platys_init: LANGWATCH,LANGEVALS
  example: |
    platys init --enable-services LANGWATCH,LANGEVALS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5560>.

parameters:
  - name: LANGWATCH_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Langwatch service

  - name: LANGWATCH_volume_map_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the data of the Langwatch service
