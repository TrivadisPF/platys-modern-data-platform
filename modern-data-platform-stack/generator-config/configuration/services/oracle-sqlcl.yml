name: Oracle SQLcl
id: oracle-sqlcl
arch: [x86-64]

tags: [cli]
dependencies: []
links:
  website: https://www.oracle.com/database/technologies/appdev/sqlcl.html
  documentation: https://docs.oracle.com/en/database/oracle/sql-developer-command-line/

description: >
  Oracle SQL Developer Command Line (SQLcl) is a free command line interface
  for Oracle Database. It allows you to interactively or batch execute SQL and
  PL/SQL. SQLcl provides in-line editing, statement completion, and command
  recall for a feature-rich experience, all while also supporting your
  previously written SQL*Plus scripts.

enable:
  platys_init: ORACLE_SQLCL
  example: |
    platys init --enable-services ORACLE_SQLCL
    platys gen

parameters:
  - name: ORACLE_SQLCL_enable
    default: "false"
    since: "1.15.0"
    description: >
      Generate Oracle SQLcl service
