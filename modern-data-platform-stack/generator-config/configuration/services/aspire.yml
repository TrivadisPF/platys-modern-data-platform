name: Accenture Aspire Framework
id: aspire
arch: [x86-64]

tags: []
dependencies: [elasticsearch]
links:
  website: https://www.accenture.com
  documentation: https://www.accenture.com
  github: https://www.accenture.com

description: >
  Accenture Aspire is a connector and content-processing framework used to
  crawl, transform, and index content from a wide range of enterprise
  repositories into a search or analytics backend.

enable:
  platys_init: ASPIRE
  example: |
    platys init --enable-services ASPIRE
    platys gen

usage:
  - title: Usage
    content: |
      Place a valid `AspireLicense.lic` into `./licenses/aspire/` and the
      Aspire settings into `./conf/aspire/settings.json` before starting the
      stack.

      Navigate to <http://dataplatform:50443>

parameters:
  - name: ASPIRE_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Accenture Aspire service.
