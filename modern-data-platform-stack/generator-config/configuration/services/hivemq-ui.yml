name: HiveMQ Web UI
id: hivemq-ui
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://www.hivemq.com/docs/hivemq/3.4/web-ui/introduction.html
  documentation: https://www.hivemq.com/docs/hivemq/3.4/web-ui/introduction.html

description: >
  With the HiveMQ Web UI for advanced analysis and administrative tasks,
  administrators are able to drill down on specific client information and can
  perform administrative actions like disconnecting a client.

enable:
  platys_init: MQTT_UI
  example: |
    platys init --enable-services MQTT_UI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28136>

parameters:
  - name: HIVEMQ_UI_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable HiveMQ Web UI.
