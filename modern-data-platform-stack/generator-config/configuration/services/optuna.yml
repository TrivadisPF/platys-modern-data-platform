name: Optuna
id: optuna
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://optuna.org/
  documentation: https://optuna.org/
  github: https://github.com/optuna/optuna

description: >
  An open source hyperparameter optimization framework to automate
  hyperparameter search.

enable:
  platys_init: OPTUNA
  example: |
    platys init --enable-services OPTUNA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28230>

parameters:
  - name: OPTUNA_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Optuna service

  - name: OPTUNA_DASHBOARD_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Optuna Dashboard service
