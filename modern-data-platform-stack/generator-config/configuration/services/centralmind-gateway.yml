name: CentralMind API/MCP Gateway
id: centralmind-gateway
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://centralmind.ai/
  documentation: https://docs.centralmind.ai/
  github: https://github.com/centralmind/gateway

description: >
  Universal MCP-Server for your Databases optimized for LLMs and AI-Agents.

enable:
  platys_init: CENTRALMIND_GATEWAY
  example: |
    platys init --enable-services CENTRALMIND_GATEWAY
    platys gen

parameters:
  - name: CENTRALMIND_GATEWAY_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate CentralMind API/MCP Gateway service
