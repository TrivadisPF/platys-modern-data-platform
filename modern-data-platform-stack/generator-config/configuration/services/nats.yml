name: NATS
id: nats
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://nats.io/
  documentation: https://docs.nats.io/
  github: https://github.com/nats-io/nats-server

description: >
  High-Performance server for NATS.io, the cloud and edge native messaging
  system.

enable:
  platys_init: NATS
  example: |
    platys init --enable-services NATS
    platys gen

usage:
  - title: Usage
    content: |
      ```bash
      telnet dataplatform 4222
      ```
      
      you should see a result similar to this
      
      ```
      Trying ::1...
      Connected to dataplatform.
      Escape character is '^]'.
      INFO {"server_id":"NDP7NP2P2KADDDUUBUDG6VSSWKCW4IC5BQHAYVMLVAJEGZITE5XP7O5J","version":"2.0.0","proto":1,"go":"go1.11.10","host":"0.0.0.0","port":4222,"max_payload":1048576,"client_id":13249}
      ```
      
      You can also test the monitoring endpoint, viewing <http://dataplatform:8222>.

parameters:
  - name: NATS_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate NATS service
