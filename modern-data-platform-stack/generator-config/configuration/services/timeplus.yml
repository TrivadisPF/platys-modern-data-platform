name: Timeplus
id: timeplus
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://www.timeplus.com/
  documentation: https://docs.timeplus.com/proton
  github: https://github.com/timeplus-io/proton/

description: >
  High-performance, low-footprint SQL database written in C++. Process millions
  of rows per second from Kafka, Pulsar, or ClickHouse, and seamlessly write
  results back. Supports powerful features like JOIN, CDC, UPSERT, and LOOKUP,
  enabling real-time analytics and ETL at scale.

enable:
  platys_init: TIMEPLUS
  example: |
    platys init --enable-services TIMEPLUS
    platys gen

parameters:
  - name: TIMEPLUS_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Timeplus service

  - name: TIMEPLUS_edition
    default: "oss"
    since: "1.18.0"
    description: >
      Either generate the `oss` (proton server) or `enterprise` edition (30 days
      free trial).
