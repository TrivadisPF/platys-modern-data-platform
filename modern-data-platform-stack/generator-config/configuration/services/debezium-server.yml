name: Debezium Server
id: debezium-server
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://debezium.io/documentation/reference/operations/debezium-ui.html
  documentation: https://debezium.io/documentation/reference/operations/debezium-server.html
  github: https://github.com/debezium/debezium/tree/master/debezium-server

description: >
  Debezium can be deployed either as connector instances in a Kafka Connect
  cluster, or as a standalone application - Debezium Server. Debezium Server is
  a Quarkus-based high-performance application that streams data from database
  to a one of supported sinks or a user developed sink.

enable:
  platys_init: DEBEZIUM_SERVER
  example: |
    platys init --enable-services DEBEZIUM_SERVER
    platys gen

parameters:
  - name: DEBEZIUM_SERVER_enable
    default: "false"
    since: "1.13.0"
    description: >
      Generate Debezium Server service

  - name: DEBEZIUM_SERVER_volume_map_data
    default: "false"
    since: "1.13.0"
    description: >
      Volume map data folder into the Debezium Server service
