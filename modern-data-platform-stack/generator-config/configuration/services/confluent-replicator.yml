name: Confluent Replicator
id: confluent-replicator
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://docs.confluent.io/platform/current/multi-dc-deployments/replicator/index.html
  documentation: https://docs.confluent.io/platform/current/multi-dc-deployments/replicator/index.html

description: >
  Confluent Replicator allows you to easily and reliably replicate topics from
  one Kafka cluster to another. In addition to copying the messages, Replicator
  will create topics as needed preserving the topic configuration in the source
  cluster.

enable:
  platys_init: KAFKA_REPLICATOR
  example: |
    platys init --enable-services KAFKA_REPLICATOR
    platys gen

parameters:
  - name: KAFKA_REPLICATOR_enable
    default: "false"
    since: "1.6.0"
    description: >
      Enable Confluent Replicator (part of Confluent Enterprise Platform).
