name: Redpanda Connect
id: redpanda-connect
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://www.redpanda.com/connect
  documentation: https://docs.redpanda.com/redpanda-connect/about/
  github: https://github.com/redpanda-data/connect
  docker: https://hub.docker.com/r/redpandadata/connect

description: >
  Redpanda Connect (formerly Benthos) is a high-performance, declarative stream
  processor. It connects a wide range of sources and sinks with built-in mapping,
  enrichment, and transformation, configured through a single YAML file.

enable:
  platys_init: REDPANDA_CONNECT
  example: |
    platys init --enable-services REDPANDA_CONNECT
    platys gen

usage:
  - title: Usage
    content: |
      Edit `conf/redpanda-connect/connect.yaml` to define your input, pipeline and
      output, then run `platys gen` and start the stack.

      The HTTP health check / metrics endpoint is available at
      <http://dataplatform:4197>.

      When Kafka is enabled, the broker list is injected into the container via the
      `KAFKA_BROKERS` environment variable, which you can reference in the config as
      `${KAFKA_BROKERS}`.

parameters:
  - name: REDPANDA_CONNECT_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Redpanda Connect stream processing service. The configuration is read
      from conf/redpanda-connect/connect.yaml. When Kafka is enabled, the broker list
      is injected via the KAFKA_BROKERS environment variable.

  - name: REDPANDA_CONNECT_mode
    default: "standard"
    since: "1.20.0"
    allowed_values: ["standard", "streams"]
    description: >
      Execution mode. 'standard' runs a single pipeline from conf/redpanda-connect/connect.yaml.
      'streams' runs Redpanda Connect in streams mode, loading one stream per YAML file in
      conf/redpanda-connect/streams/ (mounted into the container at /streams).

  - name: REDPANDA_CONNECT_watch_config_enabled
    default: "true"
    since: "1.20.0"
    description: >
      Watch the config file(s) for changes and reload automatically (adds the --watcher flag).
      Supported in both 'standard' and 'streams' mode.

  - name: REDPANDA_CONNECT_additional_port_mappings
    default: "0"
    since: "1.20.0"
    description: >
      Number of additional ports to expose from the Redpanda Connect service, mapped sequentially
      starting from external port 28740. Use this when your config listens on extra ports (e.g. an
      http_server input).
