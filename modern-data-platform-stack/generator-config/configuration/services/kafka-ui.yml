name: Kafka UI
id: kafka-ui
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/provectus/kafka-ui
  documentation: https://github.com/provectus/kafka-ui
  github: https://github.com/provectus/kafka-ui

description: >
  ``` platys init --enable-services KAFKA,KAFKA_UI platys gen ```

enable:
  platys_init: KAFKA,KAFKA_UI
  example: |
    platys init --enable-services KAFKA,KAFKA_UI
    platys gen

parameters:
  - name: KAFKA_UI_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Kafka UI service
