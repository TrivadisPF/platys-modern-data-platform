name: ClickHouse UI
id: clickhouse-ui
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://ch-ui.com/
  documentation: https://ch-ui.com/docs/
  github: https://github.com/caioricciuti/ch-ui

description: >
  Use CH-UI to work with your data from Click House self-hosted with a
  user-friendly interface. CH-UI is a modern and feature-rich user interface
  for ClickHouse databases. It offers an intuitive platform for querying
  ClickHouse databases, executing queries, and visualizing metrics about your
  instance.

enable:
  platys_init: CLICKHOUSE_UI
  example: |
    platys init --enable-services CLICKHOUSE_UI
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5521>.

parameters:
  - name: CLICKHOUSE_UI_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate ClickHouse UI service
