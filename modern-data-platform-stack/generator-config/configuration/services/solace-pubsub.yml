name: Solace PubSub+
id: solace-pubsub
category:
  id: 07_messaging
  name: messaging
  color: yellow
arch: [x86-64]

links:
  website: https://solace.com/
  documentation: https://docs.solace.com
  github: https://github.com/SolaceLabs/solace-single-docker-compose

description: >
  PubSub+ event brokers power an event mesh, a modern messaging layer that can
  be deployed across every environment and component of the distributed
  enterprise, to stream events across them all.

enable:
  platys_init: SOLACE_PUBSUB
  example: |
    platys init --enable-services SOLACE_PUBSUB
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28358>.
      
      Login with username `admin	` and password `abc123!`.
  - title: Using the CLI
    content: |
      ```bash
      docker exec -it solace /usr/sw/loads/currentload/bin/cli -A
      ```

parameters:
  - name: SOLACE_PUBSUB_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Solace PubSub+ service

  - name: SOLACE_PUBSUB_volume_map_data
    default: "false"
    since: "1.17.0"
    description: >
      Volume map data folder into the Solace PubSub+ broker

  - name: SOLACE_PUBSUB_username
    default: "admin"
    since: "1.17.0"
    description: >
      Username of the admin user

  - name: SOLACE_PUBSUB_password
    default: "abc123!"
    since: "1.17.0"
    sensitive: true
    description: >
      Password of the admin user
