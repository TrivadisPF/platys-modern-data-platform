name: Apache NiFi Toolkit
id: nifi-toolkit
category:
  id: 06_integration
  name: integration
  color: orange
arch: [x86-64]

links:
  website: https://nifi.apache.org
  documentation: https://nifi.apache.org/docs/nifi-docs/html/toolkit-guide.html
  github: https://github.com/apache/nifi

description: >
  The NiFi Toolkit contains several command line utilities to setup and support
  NiFi in standalone and clustered environments.

enable:
  platys_init: NIFI,NIFI_TOOLKIT
  example: |
    platys init --enable-services NIFI,NIFI_TOOLKIT
    platys gen

parameters:
  - name: NIFI_TOOLKIT_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Apache NiFi Toolkit.
