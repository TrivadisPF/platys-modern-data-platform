name: LDAP User Manager
id: ldap-user-manager
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/wheelybird/ldap-user-manager
  github: https://github.com/wheelybird/ldap-user-manager

description: >
  A PHP web-based interface for LDAP user account management and self-service password change.

enable:
  platys_init: OPENLDAP,
  example: |
    platys init --enable-services OPENLDAP,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <https://dataplatform:28297>.

parameters:
  - name: LDAP_USER_MANAGER_enable
    default: "false"
    since: "1.16.0"
    description: >
      Generate LDAP User Manager service

  - name: LDAP_USER_MANAGER_ldap_host
    default: "openldap"
    since: "1.16.0"
    description: >
      the LDAP host to connect to
