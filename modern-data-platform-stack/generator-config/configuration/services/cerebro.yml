name: Cerebro
id: cerebro
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://github.com/lmenezes/cerebro
  github: https://github.com/lmenezes/cerebro

description: >
  cerebro is an open source(MIT License) elasticsearch web admin tool built
  using Scala, Play Framework, AngularJS and Bootstrap.

enable:
  platys_init: CEREBRO
  example: |
    platys init --enable-services CEREBRO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28126>

parameters:
  - name: CEREBRO_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Cerebro.
