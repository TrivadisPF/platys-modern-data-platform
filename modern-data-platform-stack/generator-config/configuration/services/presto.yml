name: Presto
id: presto
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://prestodb.io/
  documentation: https://prestodb.io/docs/current/
  github: https://github.com/prestodb/presto

description: >
  Distributed SQL Query Engine for Big Data.

enable:
  platys_init: PRESTO
  example: |
    platys init --enable-services PRESTO
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28081>

parameters:
  - name: PRESTO_enable
    default: "false"
    since: "1.2.0"
    description: >
      Enable Presto service.

  - name: PRESTO_install
    default: "single"
    since: "1.6.0"
    description: >
      Install a `single` presto node or a presto `cluster`.

  - name: PRESTO_workers
    default: "3"
    since: "1.6.0"
    description: >
      the number of presto workers to setup for a Presto cluster, if
      `PRESTO_install` is set to `cluster`.

  - name: PRESTO_hive_storage_format
    default: "ORC"
    since: "1.20.0"
    description: >
      The default file format used when creating new tables.

  - name: PRESTO_hive_compression_codec
    default: "GZIP"
    since: "1.20.0"
    description: >
      The compression codec to use when writing files. Possible values are
      `NONE`, `SNAPPY`, `LZ4`, `ZSTD`, or `GZIP`.

  - name: PRESTO_kafka_descriptor_supplier
    default: "file"
    since: "1.20.0"
    description: >
      Which kafka descriptor strategy to use, either `file` or `schema-registry`.
      Only effective, it `KAFKA_enable` is set to `true`.

  - name: PRESTO_kafka_table_names
    default: ""
    since: "1.20.0"
    description: >
      Comma-separated list of all tables (kafka topics) provided by the kafka
      catalog. Only effective, it `KAFKA_enable` is set to `true` and
      `PRESTO_kafka_descriptor_supplier` is set to `file`.

  - name: PRESTO_kafka_default_schema
    default: ""
    since: "1.20.0"
    description: >
      Default schema name for 'Kafka tables'. Only effective, it `KAFKA_enable`
      is set to `true` and `PRESTO_kafka_descriptor_supplier` is set to `file`.

  - name: PRESTO_with_iceberg_rest_catalog
    default: "false"
    since: "1.20.0"
    description: >
      enable the Iceberg REST Catalog.

  - name: PRESTO_iceberg_rest_catalog_url
    default: "http://iceberg-rest-catalog:8181"
    since: "1.20.0"
    description: >
      the URL of the Iceberg REST Catalog service.

  - name: PRESTO_iceberg_rest_catalog_warehouse
    default: ""
    since: "1.20.0"
    description: >
      Warehouse identifier/location for the catalog (optional). Example:
      `s3://my_bucket/warehouse_location`.

  - name: TRINO_with_hive_metastore_db_catalog
    default: "false"
    since: "1.19.0"
    description: >
      Map the Hive Metastore DB catalog into Trino, only valid if
      `HIVE_METASTORE_enable` is set to `true`.
