name: CockroachDB
id: cockroachdb
arch: [x86-64, arm]

tags: []
dependencies: []
links:
  website: https://www.cockroachlabs.com/
  documentation: https://www.cockroachlabs.com/docs/
  github: https://github.com/cockroachdb/cockroach

description: >
  CockroachDB is a cloud-native distributed SQL database built for high
  availability, horizontal scalability, and strong consistency. It is
  wire-compatible with PostgreSQL.

enable:
  platys_init: COCKROACHDB
  example: |
    platys init --enable-services COCKROACHDB
    platys gen

usage:
  - title: Usage
    content: |
      Connect using any PostgreSQL-compatible client on port `26257`:
      
      ```bash
      docker exec -it cockroachdb-1 ./cockroach sql --insecure
      ```
      
      Or connect via `psql`:
      
      ```bash
      psql -h dataplatform -p 26257 -U root defaultdb
      ```
      
      Navigate to <http://dataplatform:28080> to access the CockroachDB Admin UI.

parameters:
  - name: COCKROACHDB_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate CockroachDB service (insecure mode)

  - name: COCKROACHDB_nodes
    default: "1"
    since: "1.20.0"
    description: >
      Number of CockroachDB nodes to generate. Use `1` for single-node, `3` for a
      cluster.

  - name: COCKROACHDB_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Map the CockroachDB data directory to
      `./container-volume/cockroachdb-/data` on the Docker host.
