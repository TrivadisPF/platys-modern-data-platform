name: Zookeeper
id: zookeeper
arch: [x86-64]

tags: [engine]
dependencies: []
links:
  website: https://zookeeper.apache.org/
  documentation: https://zookeeper.apache.org/doc/r3.7.0/index.html
  github: https://github.com/apache/zookeeper

description: >
  ZooKeeper is a high-performance coordination service for distributed
  applications. It exposes common services - such as naming, configuration
  management, synchronization, and group services - in a simple interface so
  you don't have to write them from scratch. You can use it off-the-shelf to
  implement consensus, group management, leader election, and presence
  protocols. And you can build on it for your own, specific needs.

enable:
  platys_init: ZOOKEEPER
  example: |
    platys init --enable-services ZOOKEEPER
    platys gen

usage:
  - title: Connect to Zookeeper
    content: |
      docker exec -ti zookeeper-1 bash

parameters:
  - name: ZOOKEEPER_enable
    default: "false"
    since: "1.0.0"
    description: >
      Apache Zookeeper is a coordination service used by Apache Kafka and Apache
      Atlas services. It is automatically enabled if using either of the two.

  - name: ZOOKEEPER_nodes
    default: "1"
    since: "1.0.0"
    description: >
      number of Zookeeper nodes

  - name: ZOOKEEPER_volume_map_data
    default: "false"
    since: "1.1.0"
    description: >
      Volume map the data and log folders of Zookeeper.
