name: Camunda Optimize
id: camunda-optimize
category:
  id: 18_orchestration
  name: orchestration
  color: indigo
arch: [x86-64]

links:
  website: https://camunda.com/products/camunda-platform/optimize/
  documentation: https://docs.camunda.org/optimize/latest/

description: >
  Get the insights you need to understand and continuously improve your
  business processes.

enable:
  platys_init: CAMUNDA_BPM_PLATFORM,CAMUNDA_OPTIMIZE,ELASTICSEARCH
  example: |
    platys init --enable-services CAMUNDA_BPM_PLATFORM,CAMUNDA_OPTIMIZE,ELASTICSEARCH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28264> and login as user `demo` with password `demo`.

parameters:
  - name: CAMUNDA_OPTIMIZE_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Camunda Optimize service
