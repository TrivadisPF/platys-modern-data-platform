name: AutoGen Studio
id: autogen-studio
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  website: https://autogen-studio.com/
  documentation: https://autogen-studio.com/
  github: https://github.com/microsoft/autogen

description: >
  A comprehensive tool for AI development, suitable for developers of all skill
  levels.

enable:
  platys_init: AUTOGEN_STUDIO
  example: |
    platys init --enable-services AUTOGEN_STUDIO
    platys gen

parameters:
  - name: AUTOGEN_STUDIO_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate AutoGen Studio service

  - name: AUTOGEN_STUDIO_workers
    default: "1"
    since: "1.17.0"
    description: >
      Specify the number of concurrent worker processes or threads to be used by
      the AutoGen tooling for parallel execution

  - name: AUTOGEN_STUDIO_openai_api_key
    default: "false"
    since: "1.17.0"
    sensitive: true
    description: >
      The Open AI API Key
