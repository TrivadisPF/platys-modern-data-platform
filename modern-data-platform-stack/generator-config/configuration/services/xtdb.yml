name: XTDB
id: xtdb
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64, arm]

links:
  website: https://xtdb.com/
  documentation: https://docs.xtdb.com/
  github: https://github.com/xtdb/xtdb

description: >
  An immutable SQL database for application development, time-travel reporting
  and data compliance.

enable:
  platys_init: XTDB
  example: |
    platys init --enable-services XTDB
    platys gen

parameters:
  - name: XTDB_enable
    default: "false"
    since: "1.19.0"
    description: >
      Generate XTDB service

  - name: XTDB_bucket_name
    default: "xtdb-bucket"
    since: "1.19.0"
    description: >
      The bucket name in S3 object storage to store the data.
