name: ToolJet
id: tooljet
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://tooljet.com/
  documentation: https://docs.tooljet.com/docs/
  github: https://github.com/ToolJet/ToolJet

description: >
  Low-code platform for building business applications. Connect to databases,
  cloud storages, GraphQL, API endpoints, Airtable, Google sheets, OpenAI, etc
  and build apps using drag and drop application builder. Built using
  JavaScript/TypeScript.

enable:
  platys_init: TOOLJET
  example: |
    platys init --enable-services TOOLJET
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28334>.

parameters:
  - name: TOOLJET_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate ToolJet low-code platform service
