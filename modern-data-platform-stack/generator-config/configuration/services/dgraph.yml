name: DGraph
id: dgraph
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://dgraph.io/
  documentation: https://dgraph.io/docs
  github: https://github.com/dgraph-io/dgraph

description: >
  Dgraph is the simplest way to implement a GraphQL backend for your
  applications. Everything you need to build apps, unite your data, and scale
  your operations is included, out-of-the-box.

enable:
  platys_init: DGRAPH
  example: |
    platys init --enable-services DGRAPH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28182>

parameters:
  - name: DGRAPH_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Dgraph service
