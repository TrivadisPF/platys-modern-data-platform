name: RisingWave
id: risingwave
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://risingwave.com/
  documentation: https://docs.risingwave.com/docs/current/intro/
  github: https://github.com/risingwavelabs/risingwave

description: >
  The streaming database: redefining stream processing. PostgreSQL-compatible,
  highly performant, scalable, elastic, and reliable.

enable:
  platys_init: RISINGWAVE,
  example: |
    platys init --enable-services RISINGWAVE,
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5691>

parameters:
  - name: RISINGWAVE_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate RisingWave service

  - name: RISINGWAVE_flavor
    default: "cluster"
    since: "1.18.0"
    description: >
      Specify the RisingWave flavor to start, either `playground`, `standalone`
      or `cluster`.

  - name: RISINGWAVE_meta_store_type
    default: "sqlite"
    since: "1.18.0"
    description: >
      Specify the database type to use for the meta data, either `sqlite` or
      `postgresql` or `mysql`.

  - name: RISINGWAVE_meta_store_database
    default: "postgres"
    since: "1.18.0"
    description: >
      The database name of the Postgresql or MySQL database.

  - name: RISINGWAVE_meta_store_username
    default: "postgres"
    since: "1.18.0"
    description: >
      The username of the Postgresql or MySQL database.

  - name: RISINGWAVE_meta_store_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The passowrd of the Postgresql or MySQL database.

  - name: RISINGWAVE_state_store_type
    default: "s3"
    since: "1.18.0"
    description: >
      Specify the state store type to use for the state data, currently onl `s3`
      supported (`azure` or `gcp` might be added in future).

  - name: RISINGWAVE_s3_bucket_name
    default: "risingwave-bucket"
    since: "1.18.0"
    description: >
      The S3 bucket to use for storing state data.

  - name: RISINGWAVE_data_directory
    default: "risingwave-state"
    since: "1.18.0"
    description: >
      The name of the directory for storing state data.

  - name: RISINGWAVE_telemetry_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enable telemetry?

  - name: RISINGWAVE_compactor_nodes
    default: "1"
    since: "1.18.0"
    description: >
      The number of compactor nodes to start

  - name: RISINGWAVE_compute_nodes
    default: "1"
    since: "1.18.0"
    description: >
      The number of compute nodes to start

  - name: RISINGWAVE_compute_memory
    default: "4G"
    since: "1.18.0"
    description: >
      The memory limits of the compute node

  - name: RISINGWAVE_console_enabled
    default: "false"
    since: "1.19.0"
    description: >
      Enable the RisingWave console.
