name: Authelia
id: authelia
category:
  id: 16_security
  name: security
  color: red
arch: [x86-64, arm]

links:
  website: https://www.authelia.com/
  documentation: https://www.authelia.com/overview/prologue/introduction/
  github: https://github.com/authelia/authelia

description: >
  The Single Sign-On Multi-Factor portal for web apps.

enable:
  platys_init: AUTHELIA
  example: |
    platys init --enable-services AUTHELIA
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28399> for the Authelia dashboard.

parameters:
  - name: AUTHELIA_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Authelia service
