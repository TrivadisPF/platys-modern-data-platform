name: Eventstore
id: eventstore
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://www.eventstore.com/
  documentation: https://developers.eventstore.com/
  github: https://github.com/EventStore/EventStore

description: >
  The stream database built for Event Sourcing.

enable:
  platys_init: EVENTSTORE
  example: |
    platys init --enable-services EVENTSTORE
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:2113>

parameters:
  - name: EVENTSTORE_enable
    default: "false"
    since: "1.12.0"
    description: >
      Generate EventStore service
