name: Microcks
id: microcks
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://microcks.io/
  documentation: https://microcks.io/documentation/
  github: https://github.com/microcks/microcks

description: >
  Microcks is a platform for turning your API and microservices assets -
  OpenAPI specs, AsyncAPI specs, Postman collections, SoapUI projects - into
  live mocks in seconds.

enable:
  platys_init: MICROCKS
  example: |
    platys init --enable-services MICROCKS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28203>

parameters:
  - name: MICROCKS_enable
    default: "false"
    since: "1.11.0"
    description: >
      Generate Microcks service
