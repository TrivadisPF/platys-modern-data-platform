name: RAGFlow
id: ragflow
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://ragflow.io/
  documentation: https://ragflow.io/docs/dev/
  github: https://github.com/infiniflow/ragflow/

description: >
  RAGFlow is an open-source RAG (Retrieval-Augmented Generation) engine based
  on deep document understanding.

enable:
  platys_init: RAGFLOW,MINIO,ELASTICSEARCH,MYSQL
  example: |
    platys init --enable-services RAGFLOW,MINIO,ELASTICSEARCH,MYSQL
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28396>.

parameters:
  - name: RAGFLOW_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate RAGFlow service

  - name: RAGFLOW_edition
    default: "dev-slim"
    since: "1.18.0"
    description: >
      The RAGFlow edition to run, either `dev-slim` (docker image without
      embedding model) or `dev` (Docker image with a few embedding models
      preinstalled).

  - name: RAGFLOW_db_type
    default: "mysql"
    since: "1.18.0"
    description: >
      The database to use, either `mysql` or `postgresql`.

  - name: RAGFLOW_use_huggingface_mirror
    default: "mysql"
    since: "1.18.0"
    description: >
      Use the huggingface mirror?

  - name: RAGFLOW_use_macos_optimization
    default: "false"
    since: "1.18.0"
    description: >
      Use Max OS-X optimization?.

  - name: RAGFLOW_volume_map_redis_data
    default: "false"
    since: "1.18.0"
    description: >
      Volume map `redis-data` folder into the service.

  - name: RAGFLOW_volume_map_logs
    default: "false"
    since: "1.18.0"
    description: >
      Volume map `data` folder into the service.

  - name: RAGFLOW_redis_password
    default: "abc123!"
    since: "1.18.0"
    sensitive: true
    description: >
      The password for the Redis instance.
