name: Materialize
id: materialize
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://materialize.com/
  documentation: https://materialize.com/docs/
  github: https://github.com/MaterializeInc/materialize

description: >
  Materialize simplifies application development with streaming data.
  Incrementally-updated materialized views - in PostgreSQL and in real time.
  Materialize is powered by Timely Dataflow.

enable:
  platys_init: MATERIALIZE
  example: |
    platys init --enable-services MATERIALIZE
    platys gen

usage:
  - title: Usage
    content: |
      You can connect via `mzcli` (enable it using `MATERIALIZE_CLI_enable`)
      
      ```bash
      docker exec -ti mzcli mzcli -h materialize-1
      ```

parameters:
  - name: MATERIALIZE_enable
    default: "false"
    since: "1.12.0"
    description: >
      Enable Materialize streaming database for real-time applications.
