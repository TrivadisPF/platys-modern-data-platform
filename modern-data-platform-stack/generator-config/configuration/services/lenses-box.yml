name: Lenses Box
id: lenses-box
category:
  id: 05_engine
  name: engine
  color: blue
arch: [x86-64]

links:
  website: https://lenses.io/
  documentation: https://docs.lenses.io/3.0/dev/lenses-box/
  github: https://github.com/lensesio/fast-data-dev

description: >
  Lenses Box is a Docker image which contains Lenses and a full installation of
  Kafka with all its relevant components. The image packs Lenses’ Stream
  Reactor Connector collection as well. It is all pre-setup and the only
  requirement is having Docker installed. It contains Lenses, Kafka Broker,
  Schema Registry, Kafka Connect, 25+ Kafka Connectors with SQL support and
  various CLI tools.

enable:
  platys_init: LENSES_BOX
  example: |
    platys init --enable-services LENSES_BOX
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:3030> and login with admin/admin.

parameters:
  - name: LENSES_BOX_enable
    default: "false"
    since: "1.14.0"
    description: >
      Generate Lenses Box (Development) service.

  - name: LENSES_BOX_license
    default: "false"
    since: "1.14.0"
    description: >
      Set the end-user-license string you have gotten from by email.
