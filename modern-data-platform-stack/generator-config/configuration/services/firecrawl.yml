name: Firecrawl
id: firecrawl
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://firecrawl.dev/
  documentation: https://docs.firecrawl.dev/introduction
  github: https://github.com/mendableai/firecrawl

description: >
  Turn entire websites into LLM-ready markdown or structured data. Scrape,
  crawl and extract with a single API.

enable:
  platys_init: FIRECRAWL
  example: |
    platys init --enable-services FIRECRAWL
    platys gen

parameters:
  - name: FIRECRAWL_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable Firecrawl.
