name: OpenSearch Dashboards
id: opensearch-dashboards
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  website: https://opensearch.org/
  documentation: https://opensearch.org/docs/latest/dashboards/index/
  github: https://github.com/opensearch-project/OpenSearch-Dashboards

description: >
  Open source visualization dashboards for OpenSearch. OpenSearch is a
  community-driven, open source fork of Elasticsearch and Kibana following the
  licence change in early 2021.

enable:
  platys_init: OPENSEARCH_DASHBOARDS,OPENSEARCH
  example: |
    platys init --enable-services OPENSEARCH_DASHBOARDS,OPENSEARCH
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:5603>

parameters:
  - name: OPENSEARCH_DASHBOARDS_enable
    default: "false"
    since: "1.0.0"
    description: >
      Enable OpenSearch Dashboards.
