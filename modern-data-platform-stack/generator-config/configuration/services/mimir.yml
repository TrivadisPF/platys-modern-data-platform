name: Grafana Mimir
id: mimir
arch: [x86-64]

tags: []
dependencies: []
links:
  documentation: https://grafana.com/docs/mimir/latest/
  github: https://github.com/grafana/mimir

description: >
  Grafana Mimir is an open-source, horizontally scalable, highly available,
  multi-tenant, long-term storage for Prometheus metrics.

enable:
  platys_init: MIMIR
  example: |
    platys init --enable-services MIMIR
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:9104>

parameters:
  - name: MIMIR_enable
    default: "false"
    since: "1.20.0"
    description: >
      Generate Grafana Mimir service

  - name: MIMIR_volume_map_data
    default: "false"
    since: "1.20.0"
    description: >
      Volume map the data folder (./container-volume/mimir) into the Mimir service

  - name: MIMIR_target
    default: "all"
    since: "1.20.0"
    description: >
      Mimir deployment target; all runs all components in a single process;
      can also be a specific component (ingester, querier, distributor, ...)
