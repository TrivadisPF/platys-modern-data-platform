name: Streamsheets
id: streamsheets
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://cedalo.com/products/streamsheets/
  documentation: https://docs.cedalo.com/streamsheets/2.5/installation/
  github: https://github.com/eclipse/streamsheets

description: >
  Streamsheets are server-based spreadsheets that consume, process and produce
  data streams. Data streams can originate from many sources, such as sensors,
  machines, websites, data bases, applications and many more. How incoming data
  streams are processed, analysed, visualized and combined as well as which
  outgoing data streams are produced is modelled entirely with spreadsheet
  formulas and especially without writing a single line of program code.

enable:
  platys_init: STREAMSHEETS
  example: |
    platys init --enable-services STREAMSHEETS
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28158> and enter `admin` into the **User** and `1234`into the **Password** field.

parameters:
  - name: STREAMSHEETS_enable
    default: "false"
    since: "1.6.0"
    description: >
      Generate Streamsheets service
