name: Attu
id: attu
category:
  id: 09_storage
  name: storage
  color: purple
arch: [x86-64]

links:
  github: https://github.com/zilliztech/attu

description: >
  Attu is an all-in-one Milvus administration tool. With Attu, you can
  dramatically reduce the cost of managing milvus.

enable:
  platys_init: MILVUS,ATTU
  example: |
    platys init --enable-services MILVUS,ATTU
    platys gen

usage:
  - title: Usage
    content: |
      Navigate to <http://dataplatform:28343>.

parameters:
  - name: ATTU_enable
    default: "false"
    since: "1.17.0"
    description: >
      Generate Attu service
