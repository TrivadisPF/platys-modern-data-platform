name: Nvidia NIM
id: nvidia-nim
category:
  id: 12_ai
  name: ai
  color: pink
arch: [x86-64]

links:
  website: https://www.nvidia.com/en-us/ai/
  documentation: https://docs.nvidia.com/nim/index.html

description: >
  NVIDIA NIM (NVIDIA Inference Microservices) is a set of optimized AI model
  microservices designed to simplify the deployment of AI models in production.
  NIM provides pre-optimized, ready-to-use AI models that can be deployed as
  containerized services, making it easier for developers and enterprises to
  integrate AI into applications without needing deep expertise in model
  optimization, fine-tuning, or infrastructure management.

enable:
  platys_init: NVIDIA_NIM
  example: |
    platys init --enable-services NVIDIA_NIM
    platys gen

parameters:
  - name: NVIDIA_NIM_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Nvidia NIM service(s)

  - name: NVIDIA_NIM_images
    default: ""
    since: "1.18.0"
    description: >
      A comma separated list of NIM image names to support. You can find
      available models here.

  - name: NVIDIA_NIM_volume_map_cache
    default: "false"
    since: "1.18.0"
    description: >
      Volume map the cache folder.

  - name: NVIDIA_NIM_api_key
    default: ""
    since: "1.18.0"
    sensitive: true
    description: >
      The API key for the model image.

  - name: NVIDIA_NIM_gpu_enabled
    default: "false"
    since: "1.18.0"
    description: >
      Enble GPUs.

  - name: NVIDIA_NIM_gpu_counts
    default: ""
    since: "1.18.0"
    description: >
      A comma separated list of GPU counts to use for each of the images
      specified in `NVIDIA_NIM_images`, if `NVIDIA_NIM_gpu_enabled` is set to
      `true`.
