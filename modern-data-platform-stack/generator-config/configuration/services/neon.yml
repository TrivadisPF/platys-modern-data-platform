name: Neon
id: neon
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://neon.com
  documentation: https://neon.com/docs/introduction
  github: https://github.com/neondatabase/neon

description: >
  Neon is a serverless, open-source alternative to AWS Aurora Postgres.
  It separates storage and compute to offer autoscaling, branching, and
  scale-to-zero for Postgres databases.

enable:
  platys_init: NEON
  example: |
    platys init --enable-services NEON
    platys gen

usage:
  - title: Usage
    content: |
      The Postgres wire protocol is exposed on port `55433` of the
      `compute-1` node, the pageserver HTTP API on `9898`, and the
      storage broker on `50051`.

parameters:
  - name: NEON_enable
    default: "false"
    since: "1.21.0"
    description: >
      Generate Neon service.
