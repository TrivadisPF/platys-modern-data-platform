name: Schema Registry UI
id: schema-registry-ui
arch: [x86-64]

tags: []
dependencies: []
links:
  website: https://github.com/lensesio/schema-registry-ui
  documentation: https://github.com/lensesio/schema-registry-ui
  github: https://github.com/lensesio/schema-registry-ui

description: >
  Web tool for Avro Schema Registry

enable:
  platys_init: KAFKA,SCHEMA_REGISTRY,SCHEMA_REGISTRY_UI
  example: |
    platys init --enable-services KAFKA,SCHEMA_REGISTRY,SCHEMA_REGISTRY_UI
    platys gen

parameters:
  - name: SCHEMA_REGISTRY_UI_enable
    default: "false"
    since: "1.2.0"
    description: >
      Generate Landoop Schema-Registry UI service

  - name: SCHEMA_REGISTRY_UI_use_public_ip
    default: "true"
    since: "1.10.0"
    description: >
      If `true` use PUBLIC_IP, if `false` use DOCKER_HOST_IP for the IP address
      of the schema registry API.

  - name: SCHEMA_REGISTRY_UI_map_resolv_conf
    default: "true"
    since: "1.13.0"
    description: >
      If `true` the `conf/resolv.conf` is mapped into the container to avoid the
      `panic: runtime error: slice bounds out of range` when running Docker on an
      actual Ubunutu.
