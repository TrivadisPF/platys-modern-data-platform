name: Jikkou API Server
id: jikkou-server
arch: [x86-64]

tags: []
dependencies: [kafka]
links:
  website: https://streamthoughts.github.io/jikkou/
  documentation: https://streamthoughts.github.io/jikkou/docs/
  github: https://github.com/streamthoughts/jikkou

description: >
  Jikkou API Server exposes the Resource as Code capabilities of Jikkou for
  Apache Kafka over a REST API.

enable:
  platys_init: JIKKOU_SERVER
  example: |
    platys init --enable-services JIKKOU_SERVER
    platys gen

usage:
  - title: Usage
    content: |
      The REST API is exposed on <http://dataplatform:28388>.

parameters:
  - name: JIKKOU_SERVER_enable
    default: "false"
    since: "1.18.0"
    description: >
      Generate Jikkou API server service.
