name: External Services
description: >
  Settings for connecting to external (off-stack) services instead of running them locally.

services:

  - name: Sonatype Nexus
    id: nexus
    parameters:
      - name: NEXUS_enable
        default: "false"
        since: "1.20.0"
        description: >
          Use an external Sonatype Nexus Repository Manager instead of the built-in one.
          When enabled, services that download Maven artifacts (Spark, Flink, Jupyter, etc.)
          will resolve dependencies through the external Nexus instance specified by `NEXUS_url`.

      - name: NEXUS_url
        default: ""
        since: "1.20.0"
        description: >
          Base URL of the external Nexus instance (e.g. `http://nexus.example.com:8081`).
          Only required when `NEXUS_enable` is `true`.
