  - name: Streamlit
    id: streamlit
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://streamlit.io/
      documentation: https://docs.streamlit.io/
      github: https://github.com/streamlit/streamlit
    description: >
      Streamlit turns data scripts into shareable web apps in minutes.
    enable:
      platys_init: STREAMLIT
      example: |
        platys init --enable-services STREAMLIT
        platys gen
    usage:
      - title: Usage
        content: |
          Navigate to <http://dataplatform:28340>. 
          
          By default the `HelloWorld` Streamlit application is used which is available in `./scripts/streamlit/apps/hello-world/hello-world.py`. Just create your application by adding a new folder to the `./scripts/streamlit/apps` and place the python code there. 
          
          Then configure platys to pick it up my changing the `config.yml` file to
          
          ```yaml
                STREAMLIT_enable: true
                STREAMLIT_image: 'python'
                STREAMLIT_artefacts_folder: './scripts/streamlit/apps'
                STREAMLIT_apps: 'my-app/my-app.py'
                STREAMLIT_apps_description: 'My Streamlit App'
          ```
    parameters:
      - name: STREAMLIT_enable
        default: "false"
        since: "1.17.0"
        description: >
          Generate Streamlit application(s).

      - name: STREAMLIT_image
        default: "python"
        since: "1.17.0"
        description: >
          The base docker image to use to install Streamlit into upon start.

      - name: STREAMLIT_artefacts_folder
        default: "./scripts/streamlit/apps"
        since: "1.17.0"
        description: >
          The folder on the docker host, where the Streamlit application files
          are hosted.

      - name: STREAMLIT_apps
        default: "hello-world/hello-world.py"
        since: "1.17.0"
        description: >
          The name of the Streamlit application python file. By default the
          hello-world application is provisioned. Can be a single app or a
          comma-separated list of multiple applications, each started as a
          separate container.

      - name: STREAMLIT_apps_description
        default: "Streamlit Hello World App"
        since: "1.17.0"
        description: >
          The description of the Streamlit application. By default the
          hello-world application is provisioned. Can be a single string
          description or a comma-separated list of description, must match the
          number of `STREAMLIT_apps`.

      - name: STREAMLIT_requirements_files
        default: ""
        since: "1.17.0"
        description: >
          The filename(s) of the requirements file to be used (please note that
          the script should be inside the folder mounted using
          `STREAMLIT_artefacts_folder`). Can be a single file or a
          comma-separated list of files, must match the number of
          `STREAMLIT_apps`.

      - name: STREAMLIT_python_packages
        default: ""
        since: "1.17.0"
        description: >
          Python packages to install, as a space separated list of packages: `
          `.

      - name: STREAMLIT_env_variables
        default: ""
        since: "1.17.0"
        description: >
          A comma-separated list of key-value pairs to setup as environment
          variable in each of the streamlit applications: `=,=`.

      - name: STREAMLIT_enable_https
        default: "false"
        since: "1.18.0"
        description: >
          Enable https? If enabled, then a `key.pem` and a `cert.pem` file
          needs to be available in the same folder like the application.

