  - name: Neo4J
    id: neo4j
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://neo4j.com/
      documentation: https://neo4j.com/docs/
      github: https://github.com/neo4j/neo4j
    description: >
      Neo4j gives developers and data scientists the most trusted and advanced
      tools to quickly build today’s intelligent applications and machine
      learning workflows. Available as a fully managed cloud service or
      self-hosted.
    enable:
      platys_init: NEO4J
      example: |
        platys init --enable-services NEO4J
        platys gen
    usage:
      - title: Usage
        content: |
          Navigate to <http://dataplatform:7474> to use the Neo4J Browser. Login with user `neo4j` and password `abc123abc123`.
          
          To use the `cypher-shell`, in a terminal window execute
          
          ```bash
          docker exec -ti neo4j-1 ./bin/cypher-shell -u neo4j -p abc123abc123
          ```
          
          To use the `neo4j-admin`, in a terminal window, execute 
          
          ```bash
          docker exec -ti neo4j-1 neo4j-admin
          ```
    parameters:
      - name: NEO4J_enable
        default: "false"
        since: "1.0.0"
        description: >
          Generate Neo4J service

      - name: NEO4J_major_version
        default: "26"
        since: "1.17.0"
        description: >
          The Neo4j major version to use, either `4` or `5` or `25` or `26`.

      - name: NEO4J_edition
        default: "community"
        since: "1.16.0"
        description: >
          Which edition to start, either `community` or `enterprise`.

      - name: NEO4J_nodes
        default: "1"
        since: "1.18.0"
        description: >
          the number of Neo4j instances to start (a maximum of 4 nodes is
          supported by the port mapping reservations).

      - name: NEO4J_volume_map_data
        default: "false"
        since: "1.0.0"
        description: >
          Volume map data folder into the Neo4J service

      - name: NEO4J_volume_map_logs
        default: "false"
        since: "1.0.0"
        description: >
          Volume map logs folder into the Neo4J service

      - name: NEO4J_server_logs_debug_enabled
        default: "false"
        since: "1.18.0"
        description: >
          Enable the debug log?

      - name: NEO4J_server_memory_pagecache_size
        default: ""
        since: "1.18.0"
        description: >
          The amount of memory to use for mapping the store files, in bytes (or
          kilobytes with the `k` suffix, megabytes with `m` and gigabytes with
          `g`). By default the size of page cache will be 50% of available RAM
          minus the max heap size.

      - name: NEO4J_server_memory_heap_initial_size
        default: ""
        since: "1.18.0"
        description: >
          Maximum heap size. By default it is calculated based on available
          system resources. By default, the JVM heap size is calculated based
          on the available system resources.

      - name: NEO4J_server_memory_heap_max_size
        default: ""
        since: "1.18.0"
        description: >
          Maximum heap size. By default it is calculated based on available
          system resources. By default, the JVM heap size is calculated based
          on the available system resources.

      - name: NEO4J_download_plugins
        default: ""
        since: "1.18.0"
        description: >
          a comma-separated list of NEO4J plugins to download and install. See
          here for all supported plugins and the keys to use here (i.e. `apoc`
          or `streams`).

      - name: NEO4J_mount_plugins
        default: ""
        since: "1.18.0"
        description: >
          a comma-separated list of NEO4J plugins jars to install. Specify the
          full name of the JAR file placed into the `plugins/neo4j` folder.

      - name: NEO4J_dbms_security_procedures_allowlist
        default: ""
        since: "1.18.0"
        description: >
          a comma-separated list of procedures and user-defined functions that
          should be available from a library. It defines a comma-separated list
          of procedures and functions that are to be loaded. The list may
          contain both fully qualified procedure names, and partial names with
          the wildcard *. This means that if you do not explicitly give it a
          value (or no value), all libraries in the plugins directory will be
          loaded.

      - name: NEO4J_dbms_security_procedures_unrestricted
        default: ""
        since: "1.17.0"
        description: >
          For security reasons, procedures and functions that use internal APIs
          are disabled by default. A comma-separated list of procedures and
          user-defined functions that are to be unrestricted. The list may
          contain both fully qualified procedure and function names, and
          partial names with the wildcard (*) expression. Note that this
          enables these procedures to bypass security. Use with caution.

      - name: NEO4J_dbms_security_allow_csv_import_from_file_urls
        default: "true"
        since: "1.18.0"
        description: >
          Determines if Cypher will allow using file URLs when loading data
          using LOAD CSV. Setting this value to `false` will cause Neo4j to
          fail LOAD CSV clauses that load data from the file system.

      - name: NEO4J_server_directories_import
        default: ""
        since: "1.18.0"
        description: >
          Sets the root directory for file URLs used with the Cypher LOAD CSV
          clause. This should be set to a directory relative to the Neo4j
          installation path, restricting access to only those files within that
          directory and its subdirectories. For example the value 'import' will
          only enable access to files within the 'import' folder. Removing this
          setting will disable the security feature, allowing all files in the
          local system to be imported. Setting this to an empty field will
          allow access to all files within the Neo4j installation folder.

      - name: NEO4J_extension_script
        default: ""
        since: "1.15.0"
        sensitive: true
        description: >
          pointing to a location in a folder you need to mount (i.e. in
          `./init/neo4j`). You can use this script to perform an additional
          initialization or configuration of the environment, for example,
          loading credentials or dynamically setting `neo4j.conf` settings,
          etc.

      - name: NEO4J_source_enabled
        default: "true"
        since: "1.15.0"
        description: >
          Enable the Source plugin? You also have to either add `streams` to
          the `NEO4J_plugins` setting or manually download the plugin to the
          `./plugins/neo4j/` folder.

      - name: NEO4J_topic_name
        default: "neo4j"
        since: "1.15.0"
        description: >
          The topic name to route the change messages to.

      - name: NEO4J_streams_source_topic_nodes_neo4j
        default: ""
        since: "1.15.0"
        description: >
          Maximum heap size. By default it is calculated based on available
          system resources. If left empty, Neo4J uses `512M`.

      - name: NEO4J_kafka_acks
        default: "1"
        since: "1.15.0"
        description: >
          The Kafka `acks` setting to use when writing to Kafka topic. .

      - name: NEO4J_kafka_transactional_id
        default: ""
        since: "1.15.0"
        description: >
          The Kafka `trascational.id` setting to use when writing to Kafka
          topic.

      - name: NEO4J_password
        default: "abc123abc123"
        since: "1.18.0"
        sensitive: true
        description: >
          The Password of the `neo4j` user. A password must be at least 8
          characters.

      - name: NEO4J_server_config_strict_validation_enabled
        default: "true"
        since: "1.17.0"
        description: >
          Strict configuration validation will prevent the database from
          starting up if unknown configuration options are specified in the
          neo4j settings namespace (such as dbms., cypher., etc) or if settings
          are declared multiple times. Only applicable if `NEO4J_major_version`
          is set to `5`.

      - name: NEO4J_apoc_export_file_enabled
        default: "false"
        since: "1.18.0"
        description: >
          Enables writing files to the file system.

      - name: NEO4J_apoc_import_file_enabled
        default: "false"
        since: "1.18.0"
        description: >
          Enables reading files from the file system.

      - name: NEO4J_apoc_import_file_use_neo4j_config
        default: "true"
        since: "1.18.0"
        description: >
          APOC will adhere to Neo4j configuration settings when reading or
          writing to the file system.

      - name: NEO4J_apoc_import_file_allow_read_from_fs
        default: "false"
        since: "1.19.0"
        description: >
          Allows APOC to read files from the filesystem.

      - name: NEO4J_apoc_trigger_enabled
        default: "false"
        since: "1.18.0"
        description: >
          Enables the procedures in the `apoc.trigger` package.

      - name: NEO4J_apoc_trigger_refresh
        default: "60000"
        since: "1.18.0"
        description: >
          Triggers refresh rate, in milliseconds. The refresh rate refers to
          how long the database will wait before checking whether any new
          triggers have been installed, dropped, or stopped.

  - name: Neo4J MCP
    id: neo4j-mcp
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      documentation: https://neo4j.com/developer/genai-ecosystem/model-context-protocol-mcp/
      github: https://github.com/neo4j-contrib/mcp-neo4j
    description: >
      Model Context Protocol with Neo4j.
    enable:
