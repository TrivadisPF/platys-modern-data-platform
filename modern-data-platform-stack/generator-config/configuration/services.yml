services:

  # ---- Stream Processing ----

  - name: Apache Kafka
    id: kafka
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://kafka.apache.org
      documentation: https://kafka.apache.org/documentation
      github: https://github.com/apache/kafka
    description: >
      Apache Kafka is an open-source distributed event streaming platform used
      by thousands of companies for high-performance data pipelines, streaming
      analytics, data integration, and mission-critical applications.
    parameters:
      - name: KAFKA_enable
        default: "false"
        since: "1.0.0"
        description: >
          Enable Apache Kafka.

      - name: KAFKA_edition
        default: "community"
        since: "1.19.0"
        allowed_values: [oss, inkless, community, enterprise]
        description: >
          Kafka edition to use. oss = open source Apache Kafka, inkless =
          Aiven's diskless Kafka (KIP-1150 preview), community = Confluent
          Community, enterprise = Confluent Enterprise.

      - name: KAFKA_use_kraft_mode
        default: "true"
        since: "1.13.0"
        description: >
          Enable Zookeeper-less KRaft mode. Must be true when using Kafka 4.x.

      - name: KAFKA_unstable_api_enabled
        default: "false"
        since: "1.18.0"
        description: >
          Enable unstable APIs. Currently enables
          group.coordinator.rebalance.protocols.

      - name: KAFKA_nodes
        default: "3"
        since: "1.0.0"
        description: >
          Number of Kafka broker nodes to start.

      - name: KAFKA_cluster_id
        default: "y4vRIwfDT0SkZ65tD7Ey2A"
        since: "1.17.0"
        description: >
          Unique base64 UUID identifier for the Kafka cluster. Replace the
          default with a fresh UUID: docker run confluentinc/cp-kafka
          kafka-storage random-uuid.

      - name: KAFKA_internal_replication_factor
        default: "3"
        since: "1.6.0"
        description: >
          Replication factor for Kafka internal topics.

      - name: KAFKA_volume_map_data
        default: "false"
        since: "1.0.0"
        description: >
          Volume map the data folder into the Kafka broker container.

      - name: KAFKA_use_standard_port_for_external_interface
        default: "true"
        since: "1.14.0"
        description: >
          Use standard ports 9092–9095 for the external interface. Set to false
          to use them for the private (docker host) interface instead.

      - name: KAFKA_delete_topic_enable
        default: "true"
        since: "1.0.0"
        description: >
          Allow deletion of Kafka topics.

      - name: KAFKA_auto_create_topics_enable
        default: "false"
        since: "1.0.0"
        description: >
          Allow automatic creation of topics when a producer or consumer
          references a non-existent topic.

      - name: KAFKA_message_timestamp_type
        default: "CreateTime"
        since: "1.8.0"
        allowed_values: [CreateTime, LogAppendTime]
        description: >
          Whether the message timestamp reflects the producer create time or
          the broker log append time.

      - name: KAFKA_log_dirs
        default: ""
        since: "1.17.0"
        description: >
          Comma-separated list of directories where log data is stored.

      - name: KAFKA_log_segment_bytes
        default: "1073741824"
        since: "1.8.0"
        description: >
          Maximum size of a single log segment file (default 1 GB).

      - name: KAFKA_log_retention_ms
        default: ""
        since: "1.8.0"
        description: >
          Milliseconds to retain log files. If not set, log.retention.hours is
          used. Set to -1 to disable time-based retention.

      - name: KAFKA_log_retention_hours
        default: "168"
        since: "1.8.0"
        description: >
          Hours to retain log files (default 7 days). Tertiary to
          log.retention.ms.

      - name: KAFKA_log_retention_bytes
        default: "-1"
        since: "1.8.0"
        description: >
          Maximum total size of the log before deletion. -1 means no size
          limit.

      - name: KAFKA_compression_type
        default: "producer"
        since: "1.8.0"
        allowed_values: [producer, uncompressed, gzip, snappy, lz4, zstd]
        description: >
          Final compression type for topic data. producer retains the
          compression set by the producer.

      - name: KAFKA_min_insync_replicas
        default: "1"
        since: "1.8.0"
        description: >
          Minimum number of in-sync replicas required when a producer uses
          acks=all. Writes are rejected if this minimum cannot be met.

      - name: KAFKA_replica_selector_class
        default: ""
        since: "1.8.0"
        description: >
          Fully qualified class name implementing ReplicaSelector, used to
          choose the preferred read replica.

      - name: KAFKA_log4j_root_level
        default: "INFO"
        since: "1.14.0"
        allowed_values: [TRACE, DEBUG, INFO, WARN, ERROR]
        description: >
          Default log4j logging level for the Kafka broker.

      - name: KAFKA_log4j_loggers
        default: ""
        since: "1.14.0"
        description: >
          Fine-grained log level overrides, e.g.
          kafka.controller=TRACE,kafka.request.logger=WARN.

      - name: KAFKA_tools_log4j_level
        default: "INFO"
        since: "1.14.0"
        allowed_values: [TRACE, DEBUG, INFO, WARN, ERROR]
        description: >
          Default log4j logging level for Kafka CLI tools.

      - name: KAFKA_additional_jars
        default: ""
        since: "1.17.0"
        description: >
          Comma-separated list of custom JAR names (without .jar extension) to
          copy to the broker on startup.

      - name: KAFKA_security_protocol
        default: "PLAINTEXT"
        since: "1.17.0"
        allowed_values: [PLAINTEXT, SASL_PLAINTEXT]
        description: >
          Default security protocol for broker communication. Use
          KAFKA_<listener>_security_protocol to override per listener.

      - name: KAFKA_sasl_mechanism
        default: "PLAIN"
        since: "1.17.0"
        allowed_values: [PLAIN, SCRAM-SHA-256, SCRAM-SHA-512]
        description: >
          Default SASL mechanism for client connections. Use
          KAFKA_<listener>_sasl_mechanism to override per listener.

      - name: KAFKA_admin_user
        default: "admin"
        since: "1.17.0"
        description: >
          Username of the Kafka admin user.

      - name: KAFKA_admin_password
        default: "admin-secret"
        since: "1.17.0"
        sensitive: true
        description: >
          Password of the Kafka admin user.

      - name: KAFKA_inkless_bucket_name
        default: "inkless-bucket"
        since: "1.19.0"
        applicable_when: "KAFKA_edition == inkless"
        description: >
          S3 bucket name used by the inkless (diskless) Kafka edition.

      - name: KAFKA_inkless_control_plane_type
        default: "in-memory"
        since: "1.19.0"
        allowed_values: [in-memory, postgres]
        applicable_when: "KAFKA_edition == inkless"
        description: >
          Control plane backend for inkless Kafka. Use postgres for persistence
          (requires POSTGRESQL_enable: true).

      - name: KAFKA_inkless_control_db_dbname
        default: "postgres"
        since: "1.19.0"
        applicable_when: "KAFKA_inkless_control_plane_type == postgres"
        description: >
          PostgreSQL database name for the inkless control plane.

      - name: KAFKA_inkless_control_db_username
        default: "postgres"
        since: "1.19.0"
        applicable_when: "KAFKA_inkless_control_plane_type == postgres"
        description: >
          PostgreSQL username for the inkless control plane.

      - name: KAFKA_inkless_control_db_password
        default: "abc123!"
        since: "1.19.0"
        sensitive: true
        applicable_when: "KAFKA_inkless_control_plane_type == postgres"
        description: >
          PostgreSQL password for the inkless control plane.

      - name: KAFKA_confluent_log_placement_constraints
        default: "{}"
        since: "1.8.0"
        applicable_when: "KAFKA_edition == enterprise"
        description: >
          JSON object controlling which brokers (replicas) may join the ISR and
          which are observers. Enterprise edition only.

      - name: KAFKA_confluent_cluster_link_enabled
        default: "false"
        since: "1.17.0"
        applicable_when: "KAFKA_edition == enterprise"
        description: >
          Enable Confluent Cluster Linking.

      - name: KAFKA_confluent_tier_feature
        default: "false"
        since: "1.8.0"
        applicable_when: "KAFKA_edition == enterprise"
        description: >
          Enable Tiered Storage at the broker level.

      - name: KAFKA_confluent_tier_enabled
        default: "false"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Allow tiering for topics. All non-compacted topics will use tiered
          storage.

      - name: KAFKA_confluent_tier_backend
        default: "S3"
        since: "1.8.0"
        allowed_values: [S3, GCS]
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Cloud storage backend for tiered storage.

      - name: KAFKA_confluent_tier_s3_bucket
        default: "kafka-logs"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_backend == S3"
        description: >
          S3 bucket name for tiered storage data.

      - name: KAFKA_confluent_tier_s3_prefix
        default: ""
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_backend == S3"
        description: >
          Prefix added to all objects written to S3 tiered storage.

      - name: KAFKA_confluent_tier_s3_region
        default: "us-east-1"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_backend == S3"
        description: >
          AWS region for tiered storage S3 bucket.

      - name: KAFKA_confluent_tier_s3_aws_endpoint_override
        default: ""
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_backend == S3"
        description: >
          Override the S3 endpoint, e.g. when using MinIO as on-premises
          storage.

      - name: KAFKA_confluent_tier_s3_force_path_style_access
        default: "false"
        since: "1.13.0"
        applicable_when: "KAFKA_confluent_tier_backend == S3"
        description: >
          Force path-style access for all S3 requests. Required for MinIO and
          other S3-compatible stores that do not support virtual hosted-style
          access.

      - name: KAFKA_confluent_tier_local_hotset_bytes
        default: "-1"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Maximum partition size kept on broker-local storage (hotset) in
          bytes. -1 means no size limit (only time-based via hotset_ms
          applies).

      - name: KAFKA_confluent_tier_local_hotset_ms
        default: "86400000"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Maximum time (ms) a log segment is kept on broker-local storage
          before being offloaded to tiered storage (default 1 day). -1 disables
          the limit.

      - name: KAFKA_confluent_tier_archiver_num_threads
        default: "2"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Thread pool size for archiving data to tiered storage and garbage
          collection.

      - name: KAFKA_confluent_tier_fetcher_num_threads
        default: "4"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Thread pool size for fetching data from tiered storage.

      - name: KAFKA_confluent_tier_topic_delete_check_interval_ms
        default: "10800000"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Interval (ms) at which tiered storage cleanup runs for deleted topics
          (default 3 hours).

      - name: KAFKA_confluent_tier_metadata_replication_factor
        default: "1"
        since: "1.8.0"
        applicable_when: "KAFKA_confluent_tier_feature == true"
        description: >
          Replication factor for the internal tier metadata topic. Increase for
          higher availability.

      - name: KAFKA_INIT_enable
        default: "false"
        since: "1.17.0"
        description: >
          Enable the Kafka Init container to automatically create topics on
          startup.

  - name: Apache Kafka CLI
    id: kafka-cli
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: http://kafka.apache.org
      documentation: https://kafka.apache.org/documentation
      github: https://github.com/apache/kafka
    description: >
      Apache Kafka is an open-source distributed event streaming platform used
      by thousands of companies for high-performance data pipelines, streaming
      analytics, data integration, and mission-critical applications.
    enable:
      platys_init: KAFKA_CLI
      example: |
        platys init --enable-services KAFKA_CLI
        platys gen
    usage:
      - title: Usage
        content: |
          Connecting to the container for using the CLI's
          
          ```bash
          docker exec -ti kafka-cli bash
          ```
          
          Using the `kafka-topics` command to list topics
          
          ```bash
          docker exec -ti kafka-cli kafka-topics --bootstrap-sever kafka-1:29092 --list
          ```
    parameters:
      - name: KAFKA_CLI_enable
        default: "false"
        since: "1.16.0"
        description: >
          Use confluent Kafka

      - name: SCHEMA_REGISTRY_enable
        default: "false"
        since: "1.14.0"
        description: >
          Generate Confluent Schema Registry service

      - name: SCHEMA_REGISTRY_flavour
        default: "confluent"
        since: "1.14.0"
        description: >
          Which schema registry to use, either `confluent` or `apicurio`

      - name: SCHEMA_REGISTRY_nodes
        default: "false"
        since: "1.14.0"
        description: >
          number of Confluent Schema Registry nodes

      - name: CONFLUENT_SCHEMA_REGISTRY_enable
        default: "false"
        since: "1.14.0"
        description: >
          Generate Confluent Schema Registry service - **Deprecated!!** will
          just set the `SCHEMA_REGISTRY_enable` and the
          `SCHEMA_REGISTRY_flavour` to `confluent`.

      - name: CONFLUENT_SCHEMA_REGISTRY_use_zookeeper_election
        default: "false"
        since: "1.14.0"
        description: >
          use Zookeeper for election of 'master' Schema Registry node

      - name: CONFLUENT_SCHEMA_REGISTRY_replication_factor
        default: "1"
        since: "1.14.0"
        description: >
          replication factor to use for the `_schemas` topic

      - name: CONFLUENT_SCHEMA_REGISTRY_leader_eligibility
        default: "true"
        since: "1.14.0"
        description: >
          if `true`, this node can participate in primary election. In a
          multi-colocated setup, turn this off for clusters in the secondary
          data center.

      - name: CONFLUENT_SCHEMA_REGISTRY_mode_mutability
        default: "true"
        since: "1.14.0"
        description: >
          if `true` the mode of this Schema Registry node can be changed.

      - name: CONFLUENT_SCHEMA_REGISTRY_schema_compatibility_level
        default: "backward"
        since: "1.14.0"
        description: >
          The schema compatibility type. One of `none`, `backward`,
          `backward_transitive`, `forward`, `forward_transitive`, `full` or
          `full_transitive`.

      - name: CONFLUENT_SCHEMA_REGISTRY_log4j_root_loglevel
        default: "info"
        since: "1.14.0"
        description: >
          Change the `rootLogger` loglevel of the Schema Registry.

      - name: CONFLUENT_SCHEMA_REGISTRY_debug
        default: "false"
        since: "1.14.0"
        description: >
          Boolean indicating whether extra debugging information is generated
          in some error response entities.

      - name: APICURIO_SCHEMA_REGISTRY_storage
        default: "kafkasql"
        since: "1.19.0"
        description: >
          The storage type to use, either `memory` for In-Memory, `sql` for
          database (currently only Postgresql) or `kafkasql` for Kafka based
          storage.

      - name: APICURIO_SCHEMA_REGISTRY_sql_storage_database
        default: "apicuriodb"
        since: "1.14.0"
        description: >
          The database to use if storage is `sql` or `mssql`.

      - name: APICURIO_SCHEMA_REGISTRY_sql_storage_user
        default: "apicurio"
        since: "1.14.0"
        description: >
          The user to use if storage is `sql` or `mssql`.

      - name: APICURIO_SCHEMA_REGISTRY_sql_storage_password
        default: "abc123!"
        since: "1.14.0"
        sensitive: true
        description: >
          The password to use if storage is `sql` or `mssql`.

      - name: APICURIO_auth_enabled
        default: "false"
        since: "1.14.0"
        description: >
          Enable authentication using Keycloak? If set to `true` then
          `KEYCLOAK_enable` will be enabled automatically.

      - name: APICURIO_auth_anonymous_read_access_enabled
        default: "false"
        since: "1.14.0"
        sensitive: true
        description: >
          Allow anonymous users (REST API calls with no authentication
          credentials provided) to make read-only calls to the REST API.

      - name: APICURIO_auth_import_default_users
        default: "false"
        since: "1.14.0"
        description: >
          If set to `true`, imports the following pre-defined users `sr-view`,
          `sr-dev` and `sr-admin` into the `registry` realm.

      - name: APICURIO_basic_auth_enabled
        default: "false"
        since: "1.14.0"
        description: >
          Enable basic authentication? To set it to `true`,
          `APICURIO_auth_enable` has to be enabled as well and Keycloak
          configured accordingly. Basic authentication is just the
          authentication API layer, the authentication will still happen over
          keycloak.

      - name: APICURIO_eventsourcing_enabled
        default: "false"
        since: "1.14.0"
        description: >
          Enable Event Sourcing, i.e. enable the Schema Registry to send events
          when changes are made to the registry.

      - name: APICURIO_eventsourcing_kafka_topic
        default: "registry-events"
        since: "1.14.0"
        description: >
          The Kafka topic to use, if `APICURIO_eventsourcing_transport` is set
          to `kafka`.

  - name: AutoMQ
    id: automq
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://www.automq.com/
      documentation: https://docs.automq.com/
      github: https://github.com/automq/automq
    description: >
      AutoMQ is a diskless Kafka® on S3. 10x Cost-Effective. No Cross-AZ
      Traffic Cost. Autoscale in seconds. Single-digit ms latency. Multi-AZ
      Availability.
    enable:
      platys_init: AUTOMQ
      example: |
        platys init --enable-services AUTOMQ
        platys gen
    parameters:
      - name: AUTOMQ_enable
        default: "false"
        since: "1.0.0"
        description: >
          Enable AutoMQ.

  - name: Confluent Schema Registry
    id: schema-registry
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://docs.confluent.io/1.0/schema-registry/docs/intro.html
      documentation: https://docs.confluent.io/1.0/schema-registry/docs/intro.html
      github: https://github.com/confluentinc/schema-registry
    description: >
      Confluent Schema Registry for Kafka
    enable:
      platys_init: SCHEMA_REGISTRY
      example: |
        platys init --enable-services SCHEMA_REGISTRY
        platys gen
    usage:
      - title: Uploading a Schema via script
        content: |
          using `curl`
          
          ```bash
          export TOPIC=topicName
          export SCHEMA=$(jq tostring $TOPIC-value.avsc)
          
          echo "{\"schema\":$SCHEMA}"
          
          curl -XPOST -H "Content-Type:application/json" -d"{\"schema\":$SCHEMA}" http://dataplatform:8081/subjects/$TOPIC-value/versions
          ```
          
          using `httpie`
          
          ```bash
          export TOPIC=topicName
          http -v POST :8081/subjects/example.with-schema.user-value/versions \
            Accept:application/vnd.schemaregistry.v1+json \
            schema=@avro/src/main/avro/user.avsc
          ```
    usage:
      - title: Downloading a schema (for a subject) from schema registry
        content: |
          using `curl`
          
          ```bash
          export TOPIC=topicName
          curl http://dataplatfor:8081/subjects/$TOPIC-value/versions/latest | jq -r '.schema|fromjson' > $TOPIC-value.avsc
          ```
          
          using `httpie`
          
          
          ```bash
          export TOPIC=topicName
          http http://dataplatform:8081/subjects/$TOPIC-value/versions/latest \
            | jq -r '.schema|fromjson' \
            > $TOPIC-value.avsc
          ```
    parameters:
      - name: SCHEMA_REGISTRY_enable
        default: "false"
        since: "1.0.0"
        description: >
          Enable Confluent Schema Registry.

  - name: Schema Registry UI
    id: schema-registry-ui
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://github.com/lensesio/schema-registry-ui
      documentation: https://github.com/lensesio/schema-registry-ui
      github: https://github.com/lensesio/schema-registry-ui
    description: >
      Web tool for Avro Schema Registry
    enable:
      platys_init: KAFKA,SCHEMA_REGISTRY,SCHEMA_REGISTRY_UI
      example: |
        platys init --enable-services KAFKA,SCHEMA_REGISTRY,SCHEMA_REGISTRY_UI
        platys gen
    parameters:
      - name: SCHEMA_REGISTRY_UI_enable
        default: "false"
        since: "1.2.0"
        description: >
          Generate Landoop Schema-Registry UI service

      - name: SCHEMA_REGISTRY_UI_use_public_ip
        default: "true"
        since: "1.10.0"
        description: >
          If `true` use PUBLIC_IP, if `false` use DOCKER_HOST_IP for the IP
          address of the schema registry API.

      - name: SCHEMA_REGISTRY_UI_map_resolv_conf
        default: "true"
        since: "1.13.0"
        description: >
          If `true` the `conf/resolv.conf` is mapped into the container to
          avoid the `panic: runtime error: slice bounds out of range` when
          running Docker on an actual Ubunutu.

  - name: Kafka Connect
    id: kafka-connect
    arch: [x86-64]
    tags: [integration]
    dependencies: [kafka]
    links:
      website: http://kafka.apache.org
      documentation: https://kafka.apache.org/documentation/#connectapi
      github: https://github.com/apache/kafka
    description: >
      Kafka Connect is a tool for scalably and reliably streaming data between
      Apache Kafka® and other data systems. It makes it simple to quickly
      define connectors that move large data sets into and out of Kafka.
    enable:
      platys_init: KAFKA,KAFKA_CONNECT
      example: |
        platys init --enable-services KAFKA,KAFKA_CONNECT
        platys gen
    parameters:
      - name: KAFKA_CONNECT_enable
        default: "false"
        since: "1.2.0"
        description: >
          Generate Kafka Connect service

      - name: KAFKA_CONNECT_nodes
        default: "1"
        since: "1.13.0"
        description: >
          number of Kafka Connect nodes

      - name: KAFKA_CONNECT_connectors
        default: ""
        since: "1.6.0"
        description: >
          A comma separated list of components to be installed from Confluent
          Hub. Specify identifier of the form owner/component:version for the
          component in Confluent Hub.

      - name: KAFKA_CONNECT_config_providers
        default: ""
        since: "1.9.0"
        sensitive: true
        description: >
          A comma-separated list of names for ConfigProviders. Allows to use
          variables in connector configurations that are dynamically resolved
          when the connector is (re)started. Can be used for secrets or any
          other configuration information which should be resolved dynamically
          at runtime.

      - name: KAFKA_CONNECT_config_providers_classes
        default: ""
        since: "1.9.0"
        description: >
          The Java class names for the providers listed in the
          `KAFKA_CONNECT_config_providers` property.

      - name: KAFKA_CONNECT_map_settings_file
        default: "false"
        since: "1.9.0"
        description: >
          Map the `settings.properties` file placed in the
          `$DATAPLATFORM_HOME/conf.override/kafka-connect/` folder into the
          container. Use it when enabling the `FileConfigProvider` trough the
          `KAFKA_CONNECT_config_providers` and
          `KAFKA_CONNECT_config_providers_classes` properties.

