  - name: ShadowTraffic
    id: shadowtraffic
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://shadowtraffic.io/
      documentation: https://docs.shadowtraffic.io/
    description: >
      ShadowTraffic is a product that helps you rapidly simulate production
      traffic to your backend—primarily to Apache Kafka, Postgres, S3,
      webhooks, and a few others.
    enable:
      platys_init: SHADOW_TRAFFIC
      example: |
        platys init --enable-services SHADOW_TRAFFIC
        platys gen
    usage:
      - title: Usage
        content: |
          Place a config into the `./scripts/shadowtraffic` folder. By default 
          
          You can use the following environment variables in the config file:
          
          if `KAFKA_enable is` set to `true` (internal or external)
          
          * `KAFKA_BOOTSTRAP_SERVERS` - for the Kafka bootstrap server
          
          if `SCHEMA_REGISTRY_enable` is set to `true` (internal or external)
          
          * `KAFKA_SCHEMA_REGISTRY_URL` - the URL of the schema registry
          
          if `POSTGRESQL_enable` is set to `true` (internal or external)
          
          * `POSTGRESQL_HOST` - the host of the postgresql db
          * `POSTGRESQL_PORT` - the port of the postgresql db
          * `POSTGRESQL_DATABASE` - the default database
          * `POSTGRESQL_USER` -  the user
          * `POSTGRESQL_PASSWORD` - the password
          
          if `MINIO_enable` or external `S3_enable` is set to `true`
          
          * `S3_ENDPOINT` - the endpoint of the S3 service
          * `S3_PATH_STYLE_ACCESS` - use path style access style
          * `AWS_REGION` - the region, will be automatically used by Shadowtraffic
          * `AWS_ACCESS_KEY_ID` - the access key id, will be automatically used by Shadowtraffic
          * `AWS_SECRET_ACCESS_KEY`- the secret access key id, will be automatically used by Shadowtraffic
          
          you can then use them as shown in be snippet below for the Kafka bootstrap server:
          
          ```json
              "connections": {
                  "kafka": {
                      "kind": "kafka",
                      "producerConfigs": {
                          "bootstrap.servers": {
                              "_gen": "env",
                              "var": "KAFKA_BOOTSTRAP_SERVERS"
                          },
                          "key.serializer": "io.shadowtraffic.kafka.serdes.JsonSerializer",
                          "value.serializer": "io.shadowtraffic.kafka.serdes.JsonSerializer"
                      }
                  },
                  "postgres": {
                      "kind": "postgres",
                      "tablePolicy": "dropAndCreate",
                      "connectionConfigs": {
                          "host": {
                              "_gen": "env",
                              "var": "POSTGRESQL_HOST"
                          },
                          "port": {
                              "_gen": "env",
                              "var": "POSTGRESQL_PORT",
                              "as": "integer"
                          },
                          "db":{
                              "_gen": "env",
                              "var": "POSTGRESQL_DATABASE"
                          },
                          "username": {
                              "_gen": "env",
                              "var": "POSTGRESQL_USER"
                          },
                          "password": {
                              "_gen": "env",
                              "var": "POSTGRESQL_PASSWORD"
                          }
                      }
                  }
                  
                  
              }
          ```
    parameters:
      - name: SHADOW_TRAFFIC_enable
        default: "false"
        since: "1.19.0"
        description: >
          Generate ShadowTraffic service

      - name: SHADOW_TRAFFIC_compose_profile
        default: ""
        since: "1.20.0"
        description: >
          The docker compose profile the service should run in.

      - name: SHADOW_TRAFFIC_config_file
        default: "config.json"
        since: "1.19.0"
        description: >
          the config file to use, place it in `./scripts/shadowtraffic`

      - name: SHADOW_TRAFFIC_watch_config_file_change
        default: "false"
        since: "1.20.0"
        description: >
          restart generation on config file changes?

      - name: SHADOW_TRAFFIC_reload_policy
        default: "completion"
        since: "1.20.0"
        description: >
          Pair with `SHADOW_TRAFFIC_watch_config_file_change` to control when
          the configuration file reloads. Must be one of `completion` and
          `immediate`. Immediate interrupts an existing run to reload.
          Completion waits to reload until the run terminates.

      - name: SHADOW_TRAFFIC_sample_size
        default: ""
        since: "1.20.0"
        description: >
          Generates the specified number of events and then stops immediately.
          Disalbed if no value set.

      - name: SHADOW_TRAFFIC_seed_value
        default: ""
        since: "1.20.0"
        description: >
          Initializes random generators with this seed, enabling repeatable
          runs.

      - name: SHADOW_TRAFFIC_to_stdout
        default: ""
        since: "1.20.0"
        description: >
          Ignore output targets in config file and forward all generated data
          to standard out. Good for debugging the configuration, especially
          when combined with enabling `SHADOW_TRAFFIC_watch_config_file_change`
          and optionally setting a sample size with
          `SHADOW_TRAFFIC_sample_size`.

      - name: SHADOW_TRAFFIC_with_studio
        default: "false"
        since: "1.20.0"
        description: >
          enable the ShadowTraffic Studio? You also need to set
          `SHADOW_TRAFFIC_sample_size` to the number of events to generate.

      - name: SHADOW_TRAFFIC_report_benchmark
        default: "false"
        since: "1.20.0"
        description: >
          Prints performance statistics after all generators complete.

      - name: SHADOW_TRAFFIC_license_id
        default: "b96c45d8-7af3-4ba7-b00b-623da5a9b356"
        since: "1.19.0"
        description: >
          the license id for ShadowTraffic

      - name: SHADOW_TRAFFIC_license_email
        default: "michael+examples@shadowtraffic.io"
        since: "1.19.0"
        description: >
          the email provided with the license

      - name: SHADOW_TRAFFIC_license_organization
        default: "ShadowTraffic"
        since: "1.19.0"
        description: >
          the organization provided with the license

      - name: SHADOW_TRAFFIC_license_edition
        default: "ShadowTraffic Free Trial"
        since: "1.19.0"
        description: >
          the license edition

      - name: SHADOW_TRAFFIC_license_expiration
        default: "2026-02-26"
        since: "1.19.0"
        description: >
          the license expiration date

      - name: SHADOW_TRAFFIC_license_signature
        default: ""
        since: "1.19.0"
        description: >
          the license signature


