  - name: Open Data Discovery Platform (ODD)
    id: odd-platform
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://opendatadiscovery.org/
      documentation: https://docs.opendatadiscovery.org/
      github: https://github.com/opendatadiscovery/odd-platform
    description: >
      First open-source data discovery and observability platform. We make a
      life for data practitioners easy so you can focus on your business.
    enable:
      platys_init: ODD_PLATFORM
      example: |
        platys init --enable-services ODD_PLATFORM
        platys gen
    usage:
      - title: Usage
        content: |
          For the Open Data Discovery Platform UI, navigate to <http://dataplatform:28399>. 
          
          If authentication is enabled, by default the user `admin` with password `abc123!` can be used.
    usage:
      - title: Using ODD Collector
        content: |
          Enable the ODD collector for automatic data ingestion by setting `ODD_PLATFORM_collector_enabled` to `true`, set a token (which you get by creating a collector in ODD Platform) by configuring `ODD_PLATFORM_token` and create a file named `collector_config.yaml` in `./custom-conf/odd-platform` folder before starting the platform and add the necessary plugins to run. Here an example for harvesting the Postgresql database of ODD itself.
          
          ```yaml
          platform_host_url: !ENV ${PLATFORM_HOST_URL}
          default_pulling_interval: 10
          token: !ENV ${TOKEN}
          plugins:
            - type: postgresql
              name: test_postgresql_adapter
              host: "odd-platform-db"
              port: 5432
              database: "odd_platform_db"
              user: "odd_platform"
              password: "abc123!"
          ```
          
          To find out more about the available plugins and examples, see <https://github.com/opendatadiscovery/odd-collectors>.
    parameters:
      - name: ODD_PLATFORM_enable
        default: "false"
        since: "1.19.1"
        description: >
          Generate Open Data Discovery Platform Platform service

      - name: ODD_PLATFORM_volume_map_data
        default: "false"
        since: "1.19.1"
        description: >
          Volume map the data volumes?

      - name: ODD_PLATFORM_collector_enabled
        default: "false"
        since: "1.19.1"
        description: >
          Enable ODD collector?

      - name: ODD_PLATFORM_auth_type
        default: "DISABLED"
        since: "1.19.1"
        sensitive: true
        description: >
          Enable authentication? Set to `LOGIN_FORM` to enable login form
          authentication. Use the configruation settting
          `ODD_PLATFORM_auth_login_form_credentials` to configure users.

      - name: ODD_PLATFORM_auth_login_form_credentials
        default: "admin:abc123!"
        since: "1.19.1"
        sensitive: true
        description: >
          Use a comma separated list of `:` tuples.

      - name: ODD_PLATFORM_notifications_enabled
        default: "false"
        since: "1.19.1"
        description: >
          Enable ODD notifications feature?

      - name: ODD_PLATFORM_notifications_receivers_webhook_url
        default: "false"
        since: "1.19.1"
        description: >
          Webhook URL for notification feature.

      - name: ODD_PLATFORM_collector_enabled
        default: "false"
        since: "1.19.1"
        description: >
          Enable ODD collector service.

      - name: ODD_PLATFORM_token
        default: ""
        since: "1.19.1"
        sensitive: true
        description: >
          Token from a collector registered in ODD Platform.

      - name: ODD_PLATFORM_provision_sample_data
        default: "false"
        since: "1.19.1"
        description: >
