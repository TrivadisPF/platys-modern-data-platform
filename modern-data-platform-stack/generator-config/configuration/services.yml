  # ---- Query & Analytical Engines ----

  - name: Trino (formerly PrestoSQL)
    id: trino
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://trino.io/
      documentation: https://trino.io/docs/current/
      github: https://github.com/trinodb/trino
    description: >
      Trino is a distributed SQL query engine designed to query large data sets
      distributed over one or more heterogeneous data sources.
    enable:
      platys_init: TRINO
      example: |
        platys init --enable-services TRINO
        platys gen
    usage:
      - title: Usage
        content: |
          Navigate to <http://dataplatform:28082>
          
          To connect over the CLI, use:
          
          ```
          docker exec -it trino-cli trino --server trino-1:8080
          ```
          
          if authentication is enabled (`TRINO_auth_enabled`), then you have to connect over `https` and specify the user and the keystore:
          
          ```
          docker exec -it trino-cli trino --server https://trino-1:8443 --user admin --password --insecure --keystore-path /etc/trino/trino.jks --keystore-password abc123!
          ```
    usage:
      - title: Security
        content: |
          Security for Trino can be enabled with `TRINO_auth_enabled` (to enable authentication) and `TRINO_access_control_enabled` (to enable access control). 
          
          #### Authentication
          
          By default the following 3 users and passwords are pre-configured:
          
          1. `admin` : `abc123!`
          2. `userA` : `abc123!`
          3. `userB` : `abc123!`
          
          You can specify your own password file in `conf/trino/security/password.db` by enabling `TRINO_auth_use_custom_password_file`. See [here](https://trino.io/docs/current/security/password-file.html#creating-a-password-file) for how to add users to the password file. 
          
          You can also create groups by enabling `TRINO_auth_with_groups` and specifying them in `custom-conf/trino/security/group.txt`.
          
          #### Access Control
          
          Enable access control with `TRINO_access_control_enabled` and set the access control rules in `custom-conf/trino/security/rules.json`.
    parameters:
      - name: TRINO_enable
        default: "false"
        since: "1.11.0"
        description: >
          Enable Trino service.

      - name: TRINO_custom_image_name
        default: ""
        since: "1.18.0"
        description: >
          Use a custom image name for the trino service. If you want to specify
          the version, overwrite the `TRINO_version` property.

      - name: TRINO_install
        default: "single"
        since: "1.11.0"
        description: >
          Install a `single` trino node or a trino `cluster`.

      - name: TRINO_workers
        default: "3"
        since: "1.6.0"
        description: >
          the number of trino workers to setup for a Trino cluster, if
          `TRINO_install` is set to `cluster`.

      - name: TRINO_edition
        default: "oss"
        since: "1.11.0"
        description: >
          The Trino edition to use, either `starburstdata` or `oss`.

      - name: TRINO_catalog_management
        default: "static"
        since: "1.19.0"
        description: >
          Either `static` or `dynamic`. When set to `static`, Trino reads
          catalog property files and configures available catalogs only on
          server startup. When set to `dynamic`, catalog configuration can also
          be managed using CREATE CATALOG and DROP CATALOG.

      - name: TRINO_max_memory_per_node
        default: "4GB"
        since: "1.19.0"
        description: >
          Max amount of user memory a query can use on a worker. User memory is
          allocated during execution for things that are directly attributable
          to, or controllable by, a user query.

      - name: TRINO_db_migrations_enabled
        default: "true"
        since: "1.19.0"
        description: >
          Enable flyway database migrations?

      - name: TRINO_auth_enabled
        default: "false"
        since: "1.16.0"
        sensitive: true
        description: >
          Enable password file authentication? A default password file is
          provided with 3 users (`admin`, `userA` and `userB`). You can specify
          a custom password file in `custom-conf/trino/password.db` if
          `TRINO_auth_use_custom_password_file` is set to `true`.

      - name: TRINO_auth_use_custom_password_file
        default: "false"
        since: "1.16.0"
        sensitive: true
        description: >
          Use a custom password file? The password file has to be specified in
          `custom-conf/trino/password.db`.

      - name: TRINO_auth_use_custom_certs
        default: "false"
        since: "1.16.0"
        description: >
          Use a custom self-signed certificates? The keystore has to be created
          in `custom-conf/trino/certs`.

      - name: TRINO_auth_with_groups
        default: "false"
        since: "1.16.0"
        description: >
          Enable mapping user names onto groups for easier access control and
          resource group management? Use file
          `custom-conf/trino/security/group.txt` for specifying the groups.

      - name: TRINO_access_control_enabled
        default: "false"
        since: "1.16.0"
        description: >
          Enable file-based access control where access to data and operations
          is defined by rules declared in manually-configured JSON files? Use
          file `custom-conf/trino/security/rules.json` to specify authorization
          rules for the whole cluster.

      - name: TRINO_access_control_method
        default: "file"
        since: "1.18.0"
        description: >
          Which access control method to use, either `file` or `opa`. Only
          applicable when `TRINO_access_control_enabled` is set to `true`.

      - name: TRINO_opa_namespace
        default: "trino"
        since: "1.18.0"
        description: >
          Namespace (e.g. package) the OPA Rego rules for Trino are defined in.

      - name: TRINO_resource_groups_enabled
        default: "false"
        since: "1.19.0"
        description: >
          Enable the Resource Groups feature of Trino? Specify the way to
          configure it using the `TRINO_resource_groups_type` configuration
          seeting.

      - name: TRINO_resource_groups_type
        default: "file"
        since: "1.19.0"
        description: >
          Use file-based or a database-based resource group manager? Specify
          either `file` or `db`. If you use the file-based manager, then you
          also need to configure the resource groups in the file
          `./custom-conf//resource-groups/resource-groups.json`.

      - name: TRINO_hive_storage_format
        default: "ORC"
        since: "1.16.0"
        description: >
          The default file format used when creating new tables.

      - name: TRINO_hive_compression_codec
        default: "GZIP"
        since: "1.16.0"
        description: >
          The compression codec to use when writing files. Possible values are
          `NONE`, `SNAPPY`, `LZ4`, `ZSTD`, or `GZIP`.

      - name: TRINO_hive_views_enabled
        default: "false"
        since: "1.16.0"
        description: >
          Support Hive Views defined in HiveQL.

      - name: TRINO_hive_run_as_invoker
        default: "false"
        since: "1.16.0"
        description: >
          Set to `true` to run the Hive Views in `invoker` security mode, if
          `false` Hive Views are run in `definer` security mode.

      - name: TRINO_hive_legacy_translation
        default: "false"
        since: "1.16.0"
        description: >
          Set to `true` to enable legacy behaviour which interprets any HiveQL
          query that defines a view as if it is written in SQL. It does not do
          any translation, but instead relies on the fact that HiveQL is very
          similar to SQL.

      - name: TRINO_kafka_descriptor_supplier
        default: "file"
        since: "1.19.0"
        description: >
          Which kafka descriptor strategy to use, either `file` or
          `schema-registry`. Only effective, it `KAFKA_enable` is set to
          `true`.

      - name: TRINO_kafka_table_names
        default: ""
        since: "1.11.0"
        description: >
          Comma-separated list of all tables (kafka topics) provided by the
          kafka catalog. Only effective, it `KAFKA_enable` is set to `true` and
          `TRINO_kafka_descriptor_supplier` is set to `file`.

      - name: TRINO_kafka_default_schema
        default: ""
        since: "1.16.0"
        description: >
          Default schema name for 'Kafka tables'. Only effective, it
          `KAFKA_enable` is set to `true` and `TRINO_kafka_descriptor_supplier`
          is set to `file`.

      - name: TRINO_event_listeners
        default: ""
        since: "1.17.0"
        description: >
          A comma-separated list of event listener plugins to register. There
          should be a directory with the same name in `plugins/trino/` holding
          the implementation and a configuration file `.properties` in
          `conf/trino`.

      - name: TRINO_postgresql_database
        default: ""
        since: "1.16.0"
        description: >
          the PostgreSQL database to use for connecting to the PostgreSQL. If
          not set, the value of the `POSTGRESQL_database` property is used.

      - name: TRINO_postgresql_user
        default: ""
        since: "1.16.0"
        description: >
          the PostgreSQL user to use for connecting to the PostgreSQL database.
          If not set, the value of the `POSTGRESQL_user` property is used.

      - name: TRINO_postgresql_password
        default: ""
        since: "1.16.0"
        sensitive: true
        description: >
          the PostgreSQL password to use for connecting to the PostgreSQL
          database. If not set, the value of the `POSTGRESQL_password` property
          is used.

      - name: TRINO_oracle_user
        default: ""
        since: "1.14.0"
        description: >
          the Oracle user to use for connecting to an Oracle database.

      - name: TRINO_oracle_password
        default: ""
        since: "1.14.0"
        sensitive: true
        description: >
          the Oracle password to use for connecting to an Oracle database.

      - name: TRINO_sqlserver_database
        default: ""
        since: "1.16.0"
        description: >
          the SQLServer database to use for connecting to an SQLServer
          database.

      - name: TRINO_sqlserver_user
        default: ""
        since: "1.16.0"
        description: >
          the SQLServer user to use for connecting to an SQLServer database.

      - name: TRINO_sqlserver_password
        default: ""
        since: "1.16.0"
        sensitive: true
        description: >
          the SQLServer password to use for connecting to an SQLServer
          database.

      - name: TRINO_redis_table_names
        default: ""
        since: "1.17.0"
        description: >
          list of all tables provided by the Redis catalog

      - name: TRINO_redis_stack_table_names
        default: ""
        since: "1.17.0"
        description: >
          list of all tables provided by the Redis Stack catalog

      - name: TRINO_with_iceberg_rest_catalog
        default: "false"
        since: "1.19.0"
        description: >
          enable the Iceberg REST Catalog.

      - name: TRINO_iceberg_rest_catalog_url
        default: "http://iceberg-rest-catalog:8181"
        since: "1.19.0"
        description: >
          the URL of the Iceberg REST Catalog service.

      - name: TRINO_iceberg_rest_catalog_warehouse
        default: ""
        since: "1.19.0"
        description: >
          Warehouse identifier/location for the catalog (optional). Example:
          `s3://my_bucket/warehouse_location`.

      - name: TRINO_with_duckdb_catalog
        default: "false"
        since: "1.19.0"
        description: >
          provide the DuckDB catalog; specify the path to the database file
          using the `TRINO_with_duckdb_catalog` config setting.

      - name: TRINO_with_duckdb_catalog
        default: "/data-transfer/duckdb/duckdb-demo.duckdb"
        since: "1.19.0"
        description: >
          specify the path to the DuckDB database file. Must be accessible by
          the Trino container. By default the `duckdb-demo.duckdb` is used,
          which can be provisioned by setting the `PROVISIONING_DATA_enable` to
          `true`.

      - name: TRINO_duckdb_path_to_db
        default: "false"
        since: "1.19.0"
        description: >
          provide the Faker catalog.

      - name: TRINO_with_hive_metastore_db_catalog
        default: "false"
        since: "1.19.0"
        description: >
          Map the Hive Metastore DB catalog into Trino, only valid if
          `HIVE_METASTORE_enable` is set to `true`.

      - name: TRINO_faker_default_limit
        default: "1000"
        since: "1.19.0"
        description: >
          Default number of rows in a table, can be overwriten on schema and
          table level.

      - name: TRINO_with_tpch_catalog
        default: "false"
        since: "1.16.0"
        description: >
          provide the TPCH catalog.

      - name: TRINO_tpch_column_naming
        default: "SIMPLIFIED"
        since: "1.19.0"
        description: >
          In the TPC-H specification, each column is assigned a prefix based on
          its corresponding table name, such as l_ for the lineitem table.
          `SIMPLIFIED`: the TPC-H connector simplifies column names by
          excluding these prefixes, `STANDARD`: to use the long, standard
          column names.

      - name: TRINO_with_tpcds_catalog
        default: "false"
        since: "1.16.0"
        description: >
          provide the TPCDS catalog.

      - name: TRINO_with_memory_catalog
        default: "false"
        since: "1.16.0"
        description: >
          provide the Memory catalog.

      - name: TRINO_with_jmx_catalog
        default: "false"
        since: "1.19.0"
        description: >
          provide the JMX catalog.

      - name: TRINO_jmx_dump_tables
        default: "java.lang:type=Runtime,trino.execution.scheduler:name=NodeScheduler"
        since: "1.19.0"
        description: >
          a comma separated list of Managed Beans (MBean).

      - name: TRINO_with_gsheets_catalog
        default: "false"
        since: "1.19.0"
        description: >
          provide the GSheets (Google Sheets) catalog.

      - name: TRINO_gsheets_metadata_sheet_id
        default: ""
        since: "1.19.0"
        description: >
          Sheet ID of the spreadsheet, that contains the table mapping.

      - name: TRINO_gsheets_credentials_key
        default: ""
        since: "1.19.0"
        sensitive: true
        description: >
          The base64 encoded credentials key.

      - name: TRINO_starburstdata_use_license
        default: "false"
        since: "1.16.0"
        description: >
          if true, the `starburstdata.license` file will be mapped into the
          container. Only usable if `TRINO_edition` is set to `starburstdata`.
          This enables the additional security features, more connectors, a
          cost-based query optimizer and much more.

      - name: TRINO_additional_catalogs
        default: ""
        since: "1.16.0"
        description: >
          provide a comma-separated list of additional catalog file names to be
          registered with Trino/Starbrustdata. Only provide the name of the
          catalog, without `.properties` extension and place the file into
          `./custom-conf/trino/catalog`.

      - name: TRINO_additional_plugins
        default: ""
        since: "1.17.0"
        description: >
          provide a comma-separated list of additional plugins (folder name of
          the plugin) to be registered with Trino/Starbrustdata. Place the
          plugin into `./plugins/trino/connector`. A plugin can be a connector
          or a custom UDF.

      - name: TRINO_CLI_enable
        default: "true"
        since: "1.11.0"
        description: >
          Enable Trino CLI service. Enabled by default, if `TRINO_enable` is
          set to `true`.

  - name: Trino Gateway
    id: trino-gateway
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      documentation: https://trinodb.github.io/trino-gateway/
      github: https://github.com/trinodb/trino-gateway
    description: >
      A load balancer, proxy server, and configurable routing gateway for
      multiple Trino clusters.
    enable:
      platys_init: TRINO,TRINO_GATEWAY
      example: |
        platys init --enable-services TRINO,TRINO_GATEWAY
        platys gen
    usage:
      - title: Usage
        content: |
          Navigate to <http://dataplatform:28270>.
    parameters:
      - name: TRINO_GATEWAY_enable
        default: "false"
        since: "1.19.0"
        description: >
          Enable Trino Gateway service.

      - name: TRINO_GATEWAY_volume_map_custom_config_file
        default: "false"
        since: "1.19.0"
        description: >
          Should the file `trino-gateway-config.yaml` from the `custom-conf`
          folder be used to configure Trino Gateway?

      - name: TRINO_GATEWAY_rules_engine_enabled
        default: "false"
        since: "1.19.0"
        description: >
          Enable Trino Gateway routing rule engine?

      - name: TRINO_GATEWAY_rules_type
        default: "FILE"
        since: "1.19.0"
        description: >
          if routing rule engine is enabled, are the rules processed internally
          (type `FILE`) or by an external service (type `EXTERNAL`).

      - name: TRINO_GATEWAY_rules_file
        default: "routing_rules.yml"
        since: "1.19.0"
        description: >
          if `TRINO_GATEWAY_rules_type` is set to `FILE` specify the name of
          the routing rule file, placed in folder
          `./scripts/trino-gateway/rules`.

      - name: TRINO_GATEWAY_url_path
        default: ""
        since: "1.19.0"
        description: >
          if `TRINO_GATEWAY_rules_type` is set to `EXTERNAL` specify the URL of
          the external service for routing rules processing. The service will
          be invoked using POST request.

      - name: TRINO_GATEWAY_monitor_type
        default: ""
        since: "1.19.0"
        description: >
          Strategy for performing health checks, one of `NOOP`, `INFO_API`,
          `UI_API`, `JDBC`, `JMX`, `METRICS`.

      - name: TRINO_GATEWAY_analyze_request_enabled
        default: "false"
        since: "1.19.0"
        description: >
          Set to `true` to make `trinoQueryProperties` and `trinoRequestUser`
          available.

      - name: TRINO_GATEWAY_ui_pages_disabled
        default: ""
        since: "1.19.0"
        description: >
          Comma separated list of UI pages to disable, use one or more of the
          following IDs for the corresponding page:
          `dashboard`,`cluster`,`resource-group`,`selector`,`history`,`routing-rules`.
          So if you want to disable the Routing Rules and the Cluster page,
          then specify `routing-rules,cluster`.

      - name: TRINO_GATEWAY_modules_enabled
        default: ""
        since: "1.19.0"
        description: >
          The modules (router) to enable, as a comma separted list of module
          IDs. Currently the following modules are supported:
          `query-count-based-router`.

      - name: TRINO_GATEWAY_db_migrations_enabled
        default: "true"
        since: "1.19.0"
        description: >
          Enable flyway database migrations?

      - name: TRINO_GATEWAY_query_history_enabled
        default: "true"
        since: "1.20.0"
        description: >
          Enable query history tracking in Trino Gateway?

  - name: Trino-LB (LoadBalancer)
    id: trino-lb
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
