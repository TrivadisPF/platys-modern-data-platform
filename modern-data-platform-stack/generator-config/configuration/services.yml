          you have configured the local provider by enabling
          `DATAVERSE_previewers_provider_enabled`

      - name: DATAVERSE_previewers_include
        default: ""
        since: "1.18.0"
        description: >
          A comma-separated list of previewers to install. To see which
          previewers are supported, you can execute `docker run -ti
          trivadis/dataverse-deploy-previewers:latest list` and then use what's
          listed in the `name` column. If an empty string is used, then all
          available previewers will be installed.

      - name: DATAVERSE_previewers_exclude
        default: ""
        since: "1.18.0"
        description: >
          A comma-separated list of previewers to exclude from the install.
          Only applicable it `DATAVERSE_previewers_include` is left empty.

      - name: DATAVERSE_previewers_remove_existing
        default: "false"
        since: "1.18.0"
        description: >
          Remove existing previewers before doing a deplyoment (i.e. if you
          want to run it again). If you don't remove existing previewers and
          you deploy the same ones again, there will be duplicates.

