      - name: AIRFLOW_executor
        default: "local"
        since: "1.12.0"
        description: >
          The Airflow executor to use, either `local`, `sequential` or `celery`

      - name: AIRFLOW_workers
        default: "1"
        since: "1.16.0"
        description: >
          number of Airflow Worker nodes, if `AIRFLOW_executor` is set to
