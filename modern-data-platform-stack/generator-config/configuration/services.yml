      example: |
        platys init --enable-services KAFKA_KSQLDB
        platys gen
    usage:
      - title: Running the CLI
        content: |
          ```
          docker exec -it ksqldb-cli ksql http://ksqldb-server-1:8088
          ```
    usage:
      - title: List Configuration
        content: |
          ```
          docker exec -ti ksqldb-server-1 cat /etc/ksqldb/ksqldb-server.properties
          ```
    parameters:
      - name: KSQLDB_enable
        default: "false"
        since: "1.2.0"
        description: >
          ksqlDB is streaming SQL on Kafka. If you enable it, then
          SCHEMA_REGISTRY_enable will be automatically set to `true`.

      - name: KSQLDB_edition
        default: "oss"
        since: "1.15.0"
        description: >
          the edition to use, either `oss` for the Open Source or `cp` for the
          Confluent Platform.

      - name: KSQLDB_nodes
        default: "2"
        since: "1.2.0"
        description: >
          number of ksqlDB nodes

      - name: KSQLDB_suppress_enabled
        default: "false"
        since: "1.9.0"
        description: >
          Enable the Suppress functionality which have been added with ksqldb
          0.13.0

      - name: KSQLDB_suppress_buffer_size_bytes
        default: ""
        since: "1.9.0"
        description: >
          Bound the number of bytes that the buffer can use for suppression.
          Negative size means the buffer will be unbounded. If the maximum
          capacity is exceeded, the query will be terminated.

      - name: KSQLDB_query_pull_table_scan_enabled
        default: "false"
        since: "1.12.0"
        description: >
          Config to control whether table scans are permitted when executing
          pull queries. Works with ksqlDB > 0.17.0.

      - name: KSQLDB_response_http_headers_config
        default: ""
        since: "1.12.0"
        description: >
          Use to select which HTTP headers are returned in the HTTP response
          for Confluent Platform components. Specify multiple values in a
          comma-separated string using the format `[action][header
          name]:[header value]` where `[action]` is one of the following:
          `set`, `add`, `setDate`, or `addDate`.

      - name: KSQLDB_queries_file
        default: ""
        since: "1.9.0"
        description: >
          A file that specifies a predefined set of queries for the ksqlDB
          cluster.

      - name: KSQLDB_use_embedded_connect
        default: "false"
        since: "1.13.0"
        description: >
          Enable embedded kafka connect. Place connector jars into
          `./plugins/kafka-connect` or install them from Confluent Hub using
          the `KSQLDB_connect_connectors` property. **Important:** Will only be
          effective, if `KAFKA_CONNECT_enable` is set to `false`.

      - name: KSQLDB_connect_connectors
        default: ""
        since: "1.13.0"
        description: >
          A comma separated list of components to be installed from Confluent
          Hub. Specify identifier of the form owner/component:version for the
          component in Confluent Hub.

      - name: KSQLDB_persistence_default_format_key
        default: "KAFKA"
        since: "1.15.0"
        description: >
          Sets the default value for the KEY_FORMAT property if one is not
          supplied explicitly in CREATE TABLE or CREATE STREAM statements.

      - name: KSQLDB_persistence_default_format_value
        default: ""
        since: "1.15.0"
        description: >
          Sets the default value for the VALUE_FORMAT property if one is not
          supplied explicitly in CREATE TABLE or CREATE STREAM statements.

      - name: KSQLDB_log_topic
        default: "ksql_processing_log"
        since: "1.16.0"
        description: >
          the name of the processing log Kafka topic.

