  - name: OpenTelemetry Collector
    id: otel-collector
    arch: [x86-64]
    tags: []
    dependencies: []
    links:
      website: https://opentelemetry.io/
      documentation: https://opentelemetry.io/docs/collector/
      github: https://github.com/open-telemetry/opentelemetry-collector
    description: >
      The OpenTelemetry Collector offers a vendor-agnostic implementation on
      how to receive, process and export telemetry data. In addition, it
      removes the need to run, operate and maintain multiple agents/collectors
      in order to support open-source telemetry data formats (e.g. Jaeger,
      Prometheus, etc.) sending to multiple open-source or commercial
      back-ends.
    enable:
      platys_init: OTEL_COLLECTOR
      example: |
        platys init --enable-services OTEL_COLLECTOR
        platys gen
    usage:
      - title: Usage
        content: |
          OLTP receiver is listening on Port `4317` and recives data via gRPC or HTTP using [OTLP](https://github.com/open-telemetry/opentelemetry-specification/blob/main/specification/protocol/otlp.md) format.
          
          ```
          "-javaagent:/tmp/opentelemetry-javaagent.jar -Dotel.exporter.otlp.endpoint=otel-collector:4317"    
          ```
    parameters:
      - name: OTEL_COLLECTOR_enable
        default: "false"
        since: "1.14.0"
        description: >
          Generate OTEL Collector service

      - name: OTEL_COLLECTOR_use_custom_conf
        default: "false"
        since: "1.14.0"
        description: >
          Use a `otel-collector-config.yaml` config file placed into
          `custom-conf/otel-collector` folder for configuring OTEL Collector?

