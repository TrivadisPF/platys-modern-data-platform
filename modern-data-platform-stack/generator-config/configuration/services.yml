          `postgresdb`.

      - name: N8N_postgres_password
        default: "abc123!"
        since: "1.18.0"
        sensitive: true
        description: >
          the password of the database user, if `N8N_db_type` is set to
          `postgresdb`.

      - name: N8N_mysql_dbname
        default: ""
        since: "1.18.0"
        description: >
          the name of the database, if `N8N_db_type` is set to `mysqldb`.

      - name: N8N_mysql_user
        default: ""
        since: "1.18.0"
        description: >
          the name of the database user, if `N8N_db_type` is set to `mysqldb `.

      - name: N8N_mysql_password
        default: ""
        since: "1.18.0"
        sensitive: true
        description: >
          the password of the database user, if `N8N_db_type` is set to
          `mysqldb `.

      - name: N8N_available_binary_data_modes
        default: "filesystem"
        since: "1.18.0"
        description: >
